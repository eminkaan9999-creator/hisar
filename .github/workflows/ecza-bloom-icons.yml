name: Build Kardelen Bloom app icons
on:
  push:
    branches: [fix/ecza-bloom-iphone-fullscreen-icon-20261110]
    paths:
      - 'ecza-19be12ce/icon-bloom.svg'
      - 'ecza-19be12ce/manifest.webmanifest'
      - '.github/workflows/ecza-bloom-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render all PWA and iOS icons
        run: |
          python3 -m pip install --break-system-packages cairosvg pillow
          python3 - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          root=Path('ecza-19be12ce')
          source=(root/'icon-bloom.svg').read_bytes()
          for name,size in [('icon-192.png',192),('icon-512.png',512),('icon-maskable-512.png',512),('apple-touch-icon.png',180)]:
              raw=cairosvg.svg2png(bytestring=source,output_width=size,output_height=size)
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              im.save(root/name,format='PNG',optimize=True)
              assert Image.open(root/name).size==(size,size)
              print(name,size,(root/name).stat().st_size)
          PY
      - name: Commit generated icons to feature branch
        run: |
          git add ecza-19be12ce/icon-192.png ecza-19be12ce/icon-512.png ecza-19be12ce/icon-maskable-512.png ecza-19be12ce/apple-touch-icon.png
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(ecza): replace PWA and iOS icons with Kardelen flower'
          git push origin "HEAD:${GITHUB_REF_NAME}"
