name: Kardelen live release verification
on:
  push:
    branches: [main]
    paths:
      - 'ecza-19be12ce/index.html'
      - 'ecza-19be12ce/surum.json'
      - 'ecza-19be12ce/sw.js'
      - '.github/workflows/ecza-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecza-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare live HTML, version and service worker with checked-out release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = text => crypto.createHash('sha256').update(text).digest('hex');
          const base = 'https://eminkaan9999-creator.github.io/hisar/ecza-19be12ce/';
          const names = ['index.html', 'surum.json', 'sw.js'];
          const expected = Object.fromEntries(names.map(name => [name, hash(fs.readFileSync('ecza-19be12ce/' + name))]));
          const version = JSON.parse(fs.readFileSync('ecza-19be12ce/surum.json', 'utf8')).surum;
          const attempts = [];
          (async () => {
            for (let attempt = 1; attempt <= 24; attempt++) {
              const results = await Promise.all(names.map(async name => {
                const url = new URL(name === 'index.html' ? './' : name, base);
                url.searchParams.set('release', process.env.GITHUB_SHA);
                url.searchParams.set('check', String(Date.now()));
                try {
                  const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(12000) });
                  const text = await response.text();
                  const actual = hash(text);
                  return { file: name, status: response.status, sha256: actual, matches: response.ok && actual === expected[name] };
                } catch (error) { return { file: name, matches: false, error: error.message }; }
              }));
              attempts.push({ attempt, at: new Date().toISOString(), results });
              console.log(JSON.stringify(attempts.at(-1)));
              if (results.every(r => r.matches)) {
                const report = { verified: true, version, commit: process.env.GITHUB_SHA, url: base, expected, attempts };
                fs.writeFileSync('ecza-live-report.json', JSON.stringify(report, null, 2));
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Kardelen live release verified\n\nVersion ${version}. Live HTML, version manifest and service worker match the checked-out release byte-for-byte.\n`);
                return;
              }
              if (attempt < 24) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            fs.writeFileSync('ecza-live-report.json', JSON.stringify({ verified: false, version, commit: process.env.GITHUB_SHA, url: base, expected, attempts }, null, 2));
            process.exitCode = 1;
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecza-live-release-report
          path: ecza-live-report.json
          retention-days: 7
          if-no-files-found: warn
