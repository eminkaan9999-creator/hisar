name: HİSAR experience checks
on:
  push:
    branches: [feature/hisar-experience-20261109]
  pull_request:
    paths: ['experience/**', 'scripts/experience-*', 'sw.js', '.github/workflows/experience-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit integration points
        run: |
          node <<'NODE'
          const fs=require('node:fs'),lines=fs.readFileSync('index.html','utf8').split('\n');
          for(const [a,b] of [[110,195],[400,425],[790,820],[4480,4515],[5000,5095]]){
            console.log('RANGE',a,b);
            for(let i=a-1;i<b;i++)if(lines[i]&&lines[i].length<12000)console.log(`${i+1}: ${lines[i].slice(0,1400)}`);
          }
          NODE
      - name: Existing assistant tests
        run: node iti/iti-assistant.test.cjs
