name: HİSAR experience checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'version.json', 'manifest.webmanifest', 'oyun/**', 'komuta/**', 'santiye-250888c5/**', 'experience/**', 'scripts/restore-*', 'three.min.js', '.github/workflows/experience-checks.yml']
  pull_request:
    paths: ['index.html', 'sw.js', 'version.json', 'manifest.webmanifest', 'oyun/**', 'komuta/**', 'santiye-250888c5/**', 'experience/**', 'scripts/restore-*', 'three.min.js', '.github/workflows/experience-checks.yml']
concurrency:
  group: restored-games-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate restored game modules
        run: |
          node --test experience/*.test.cjs
          node iti/iti-assistant.test.cjs
          node -e "require('./scripts/experience-integrate.cjs').check(require('fs').readFileSync('index.html','utf8'))"
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Restore both games from previously installed workers
        run: node scripts/restore-games-browser.cjs
      - name: Existing desktop and mobile game regressions
        run: node scripts/experience-browser.cjs
