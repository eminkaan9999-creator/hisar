name: HİSAR experience checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'version.json', 'manifest.webmanifest', 'oyun/**', 'komuta/**', 'santiye-250888c5/**', 'experience/model*', 'three.min.js', '.github/workflows/experience-checks.yml']
  pull_request:
    paths: ['index.html', 'sw.js', 'version.json', 'manifest.webmanifest', 'oyun/**', 'komuta/**', 'santiye-250888c5/**', 'experience/model*', 'three.min.js', '.github/workflows/experience-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate both scenarios, asset lists and the shared model reader
        run: node --test oyun/*.test.mjs santiye-250888c5/*.test.mjs experience/model.test.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play both games from briefing to handover and reopen offline
        run: |
          node santiye-250888c5/cache-tarayici.cjs
          node santiye-250888c5/tarayici.cjs
          node oyun/ufuk-uyumluluk.cjs
          node oyun/gelecek-tarayici.cjs
          node oyun/tarayici.cjs
