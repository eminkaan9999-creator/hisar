name: HİSAR verified integration finalization
on:
  push:
    branches: [feature/hisar-experience-20261109]
    paths: ['.github/workflows/experience-source.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify completed browser test job and exact tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const base='https://api.github.com/repos/eminkaan9999-creator/hisar/actions/';
            const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
            const r=await fetch(base+'jobs/129136255364',{headers});if(!r.ok)throw Error('Cannot verify test job');const job=await r.json();
            if(job.run_id!==42610171054||job.conclusion!=='success')throw Error('Browser check did not pass');
            const rr=await fetch(base+'runs/42610171054',{headers});if(!rr.ok)throw Error('Cannot verify tested commit');const run=await rr.json();
            if(run.head_sha!=='3b7c114639f128912cd166e5207492e509e0243c')throw Error('Unexpected tested source');
            console.log('Verified successful 25-unit-test and 19-browser-check job for exact source SHA.');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          git fetch origin 3b7c114639f128912cd166e5207492e509e0243c
          git diff --exit-code 3b7c114639f128912cd166e5207492e509e0243c HEAD -- . ':(exclude).github/workflows/experience-source.yml'
      - name: Apply verified deterministic integration and remove temporary inspection workflow
        run: |
          node --test experience/*.test.cjs
          node scripts/experience-integrate.cjs
          git rm .github/workflows/experience-source.yml
          git add index.html version.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: finalize tested integrated game experience v63'
          git push origin "HEAD:${GITHUB_REF_NAME}"
