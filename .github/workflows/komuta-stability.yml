name: KOMUTA controls and lifecycle
on:
  push:
    branches: [fix/komuta-controls-stability-20261111]
    paths: ['komuta/**', 'scripts/komuta-stability*', '.github/workflows/komuta-stability.yml']
permissions:
  contents: write
concurrency:
  group: komuta-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare scoped release and run lifecycle regressions
        run: |
          mkdir -p stability-reports
          python3 scripts/komuta-stability-release.py
          set -o pipefail
          node --test scripts/komuta-stability.test.cjs | tee stability-reports/unit.tap
      - name: Actual tank, Uçangöz, range and recovery in preinstalled Chrome
        env:
          KOMUTA_STABILITY: '1'
        run: |
          set -o pipefail
          node scripts/komuta-tank-only-browser.cjs | tee stability-reports/browser.log
      - name: Commit only successfully tested application output
        run: |
          test "$(git ls-remote origin refs/heads/fix/komuta-controls-stability-20261111 | cut -f1)" = "$GITHUB_SHA" || exit 0
          git add -- komuta scripts/komuta-tank-only-browser.cjs
          git diff --cached --name-only | awk '!/^komuta\// && $0 != "scripts/komuta-tank-only-browser.cjs" {bad=1} END {exit bad}'
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'komuta 1.2.1: verified pause, input and scene recovery release'
          git push origin HEAD:refs/heads/fix/komuta-controls-stability-20261111
      - name: Preserve scoped source and test evidence
        if: always()
        run: |
          mkdir -p stability-reports
          git rev-parse HEAD > stability-reports/source-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('stability-reports/scoped-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('komuta').rglob('*'):
                  if p.is_file(): z.write(p)
              for p in Path('scripts').glob('komuta-*'):
                  if p.is_file(): z.write(p)
              for p in Path('.github/workflows').glob('komuta-*'):
                  if p.is_file(): z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: komuta-stability-evidence
          path: stability-reports/
          retention-days: 7
