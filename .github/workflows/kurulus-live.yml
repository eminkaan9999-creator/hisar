name: HİSAR Kuruluş live verification
on:
  push:
    branches: [main]
    paths: ['kurulus/**', 'shared/**', '.github/workflows/kurulus-live.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kurulus-live
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare live three-game application and Turkish audio with release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const v=JSON.parse(fs.readFileSync('version.json'));if(!v.kurulus)throw Error('No Kuruluş release');
          const paths=['version.json','index.html','sw.js','manifest.webmanifest','three.min.js','santiye-250888c5/index.html','poligon/index.html','kurulus/index.html','kurulus/campaign.js','kurulus/manifest.webmanifest','shared/kurulus-core.js','shared/kurulus-runtime.js','shared/kurulus.css','shared/tank-adapter.js','shared/radio-tr.js','shared/kurulus-entry.js','assets/radio/tr/manifest.json'];
          const voice=JSON.parse(fs.readFileSync('assets/radio/tr/manifest.json'));
          if(voice.voice!=='tr-TR-AhmetNeural'||voice.rate!=='+0%'||voice.pitch!=='+0Hz'||voice.playbackRate!==1)throw Error('Unexpected Turkish voice settings');
          for(const c of Object.values(voice.clips)){if(!/^[a-z0-9-]+\.mp3$/.test(c.file))throw Error('Invalid clip');paths.push('assets/radio/tr/'+c.file);}
          const digest=x=>crypto.createHash('sha256').update(x).digest('hex');
          const local=new Map(paths.map(p=>[p,digest(fs.readFileSync(p))]));
          const base='https://eminkaan9999-creator.github.io/hisar/';
          (async()=>{let fail;
            for(let retry=0;retry<30;retry++){
              try{const results=[];
                for(let i=0;i<paths.length;i+=4)results.push(...await Promise.all(paths.slice(i,i+4).map(async p=>{
                  const r=await fetch(new URL(p+'?kurulus-release='+process.env.RELEASE_SHA+'&attempt='+retry,base),{cache:'no-store',signal:AbortSignal.timeout(15000)});
                  if(!r.ok)throw Error(p+' HTTP '+r.status);const b=Buffer.from(await r.arrayBuffer());
                  if(digest(b)!==local.get(p))throw Error('Old or different release: '+p);
                  return {path:p,bytes:b.length,sha256:digest(b)};
                })));
                const report={build:v.v,kurulus:v.kurulus,commit:process.env.RELEASE_SHA,verifiedAt:new Date().toISOString(),voice:voice.voice,playbackRate:1,files:results};
                fs.mkdirSync('release-reports',{recursive:true});fs.writeFileSync('release-reports/kurulus-live.json',JSON.stringify(report,null,2));
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Kuruluş build '+v.v+': '+results.length+' live files match the release.\n');
                console.log('KURULUS_LIVE_VERIFIED',JSON.stringify(report));return;
              }catch(e){fail=e;console.log('Verification '+(retry+1)+': '+e.message);if(retry<29)await new Promise(r=>setTimeout(r,6000));}
            }throw fail;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kurulus-live-verification
          path: release-reports/kurulus-live.json
          retention-days: 7
