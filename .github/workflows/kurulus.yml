name: HİSAR Kuruluş integration
on:
  push:
    branches: [feature/kurulus-unified-20261111]
    paths: ['shared/**', 'kurulus/**', 'scripts/kurulus-*', '.github/workflows/kurulus.yml']
permissions:
  contents: read
concurrency:
  group: kurulus-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand exact source package
        run: python3 scripts/kurulus-unpack.py
      - name: Prepare pinned rendering and verified Turkish voice assets
        run: python3 scripts/kurulus-vendor.py
      - name: Integrate three original games and run all unit checks
        run: |
          set -o pipefail
          mkdir -p kurulus-reports
          node scripts/kurulus-integrate.cjs
          node --test shared/*.test.cjs experience/*.test.cjs | tee kurulus-reports/unit-tests.tap
          node scripts/experience-integrate.cjs
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual original tank, construction and range games
        run: node scripts/kurulus-browser.cjs
      - name: Commit only successful integration
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          exact={'index.html','version.json','manifest.webmanifest','sw.js','experience/radio-missions.js','santiye-250888c5/index.html','poligon/index.html'}
          allowed_prefix=('shared/','kurulus/','assets/radio/tr/','scripts/kurulus-')
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          bad=[p for p in changed if p not in exact and not p.startswith(allowed_prefix)]
          if bad:raise SystemExit('Unexpected tracked changes: '+repr(bad))
          for p in Path('scripts').glob('kurulus-pack-*.txt'):p.unlink()
          PY
          git add index.html version.json manifest.webmanifest sw.js experience/radio-missions.js santiye-250888c5/index.html poligon/index.html shared kurulus assets/radio/tr
          git add -A -- 'scripts/kurulus-*'
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: verified Kuruluş build 69 with all original vehicles, sights, shared Uçangöz and Turkish audio'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD > kurulus-reports/integrated-commit.txt
      - name: Preserve exact tested sources and hashes
        if: always()
        run: |
          mkdir -p kurulus-reports
          git rev-parse HEAD > kurulus-reports/commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          paths=[Path(p) for p in ['index.html','three.min.js','sw.js','version.json','manifest.webmanifest','icon-192.png','icon-512.png','apple-touch-icon.png'] if Path(p).is_file()]
          for folder in ['experience','scripts','assets/radio','shared','kurulus','poligon','santiye-250888c5','iti']:
              paths.extend(p for p in Path(folder).rglob('*') if p.is_file() and p.name!='sohbetler.txt')
          with zipfile.ZipFile('kurulus-reports/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(p,str(p))
          Path('kurulus-reports/hashes.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},indent=2))
          print('Snapshot:',len(paths),'game files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kurulus-results
          path: kurulus-reports/
          retention-days: 7
