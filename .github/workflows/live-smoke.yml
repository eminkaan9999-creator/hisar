name: HİSAR published smoke check
on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json', 'sw.js', 'experience/**', '.github/workflows/live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hisar-published-smoke
  cancel-in-progress: true
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live version and exact deployed application files
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const base='https://eminkaan9999-creator.github.io/hisar/';
          const expected=JSON.parse(fs.readFileSync('version.json','utf8')).v;
          const paths=['index.html','sw.js','experience/guard.js','experience/core.js','experience/bridge.js','experience/ui.js','experience/ui.css'];
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          async function read(path,attempt){
            const response=await fetch(base+path+'?deployment='+expected+'&attempt='+attempt,{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
            if(!response.ok)throw Error(path+' HTTP '+response.status);
            return Buffer.from(await response.arrayBuffer());
          }
          (async()=>{
            let lastError;
            for(let attempt=1;attempt<=24;attempt++){
              try{
                const version=JSON.parse((await read('version.json',attempt)).toString('utf8'));
                if(version.v!==expected)throw Error('Expected version '+expected+', received '+version.v);
                const results=await Promise.all(paths.map(async path=>{
                  const remote=await read(path,attempt),local=fs.readFileSync(path);
                  if(digest(remote)!==digest(local))throw Error(path+' has not reached this release yet');
                  return {path,bytes:remote.length,sha256:digest(remote)};
                }));
                console.log('LIVE_VERIFIED',JSON.stringify({version:expected,url:base,commit:process.env.GITHUB_SHA,files:results},null,2));
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## HİSAR live verification\n\nVersion **'+expected+'** served successfully. All seven game/module/style/service-worker files match the checked-out release byte-for-byte.\n');
                return;
              }catch(e){lastError=e;console.log('Deployment propagation check '+attempt+': '+e.message);if(attempt<24)await new Promise(r=>setTimeout(r,6000));}
            }
            throw lastError||Error('Published verification failed');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
