name: HİSAR published smoke check
on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json', 'sw.js', 'experience/**', 'assets/radio/**', '.github/workflows/live-smoke.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hisar-published-smoke
  cancel-in-progress: true
jobs:
  published:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live version, game modules and Microsoft recordings
        env:
          VERIFIED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const base='https://eminkaan9999-creator.github.io/hisar/';
          const expected=JSON.parse(fs.readFileSync('version.json','utf8')).v;
          const paths=['index.html','version.json','sw.js','experience/guard.js','experience/core.js','experience/bridge.js','experience/ui.js','experience/ui.css','experience/polish.js','experience/controls.js','experience/immersive.js','experience/gameplay.js','experience/radio-missions.js','experience/radio-sound.js','experience/simple-settings.js','experience/crew-orders.js','experience/field.js','assets/radio/ack.mp3'].filter(p=>fs.existsSync(p));
          const manifestPath='assets/radio/tr/manifest.json';
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          if(fs.existsSync(manifestPath)){
            const m=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
            if(m.voice!=='tr-TR-AhmetNeural'||m.rate!=='+0%'||m.pitch!=='+0Hz'||m.playbackRate!==1)throw Error('Unexpected voice bank');
            paths.push(manifestPath);
            for(const c of Object.values(m.clips)){
              if(!/^[-a-z0-9]+\.mp3$/.test(c.file))throw Error('Invalid clip filename');
              const p='assets/radio/tr/'+c.file;
              if(digest(fs.readFileSync(p))!==c.sha256)throw Error('Local voice checksum mismatch: '+p);
              paths.push(p);
            }
          }
          async function read(path,attempt){
            const u=new URL(path,base);
            u.searchParams.set('deployment',String(expected));
            u.searchParams.set('verification',process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT+'-'+attempt);
            const response=await fetch(u,{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
            if(!response.ok)throw Error(path+' HTTP '+response.status);
            return Buffer.from(await response.arrayBuffer());
          }
          (async()=>{
            let lastError;
            const deadline=Date.now()+11*60*1000;
            for(let attempt=1;attempt<=66 && Date.now()<deadline;attempt++){
              try{
                const version=JSON.parse((await read('version.json',attempt)).toString('utf8'));
                if(version.v!==expected)throw Error('Expected version '+expected+', received '+version.v);
                const results=[];
                for(let i=0;i<paths.length;i+=4){
                  results.push(...await Promise.all(paths.slice(i,i+4).map(async path=>{
                    const remote=await read(path,attempt),local=fs.readFileSync(path);
                    if(digest(remote)!==digest(local))throw Error(path+' has not reached this release yet');
                    return {path,bytes:remote.length,sha256:digest(remote)};
                  })));
                }
                const report={version:expected,url:base,commit:process.env.VERIFIED_COMMIT,verifiedAt:new Date().toISOString(),files:results};
                fs.mkdirSync('release-reports',{recursive:true});
                fs.writeFileSync('release-reports/live-verification.json',JSON.stringify(report,null,2)+'\n');
                console.log('LIVE_VERIFIED',JSON.stringify(report,null,2));
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## HİSAR live verification\n\nVersion **'+expected+'** served successfully. **'+results.length+'** game, module, worker and voice files match the checked-out release byte-for-byte.\n');
                return;
              }catch(e){
                lastError=e;
                console.log('Deployment propagation check '+attempt+': '+e.message);
                if(attempt<66 && Date.now()<deadline)await new Promise(r=>setTimeout(r,10000));
              }
            }
            throw lastError||Error('Published verification failed');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Save live verification receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hisar-live-verification
          path: release-reports/live-verification.json
          retention-days: 7
