name: HİSAR radio and operations validation
on:
  push:
    branches: [feature/gameplay-refresh-20261110]
  pull_request:
    paths: ['experience/**', 'scripts/**', 'sw.js', 'version.json', 'index.html', 'assets/radio/**', '.github/workflows/radio-operations.yml']
permissions:
  contents: read
concurrency:
  group: radio-operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-guarded integration
        run: |
          mkdir -p radio-reports
          node scripts/radio-integrate.cjs
          node scripts/radio-fixes.cjs
      - name: Build offline synthetic Turkish male radio fallback
        run: |
          if [ ! -s assets/radio/ack.mp3 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y espeak ffmpeg
            mkdir -p assets/radio
            espeak -v tr+m3 -s 154 -w "$RUNNER_TEMP/ack.wav" 'Emredersiniz komutanım.'
            ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/ack.wav" -af 'highpass=f=280,lowpass=f=3600,acompressor=threshold=0.2:ratio=3' -ar 24000 -ac 1 -b:a 48k assets/radio/ack.mp3
          fi
          ffprobe -v error -show_entries format=duration,size -of json assets/radio/ack.mp3 > radio-reports/audio.json
      - name: All unit tests and original inline script parse
        run: |
          set -o pipefail
          node --test experience/*.test.cjs 2>&1 | tee radio-reports/unit-tests.tap
          node scripts/experience-integrate.cjs
      - name: Install original-game browser test tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Radio, six mission outcomes and mobile UI in original game
        run: node scripts/radio-browser.cjs
      - name: Previous gameplay regression in real WebGL
        run: node scripts/gameplay-browser.cjs
      - name: Commit only verified integration to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/gameplay-refresh-20261110'
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'index.html','experience/polish.js','experience/radio-missions.js','sw.js','version.json','scripts/gameplay-integrate.cjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not changed <= allowed: raise SystemExit('Unexpected changes: '+repr(changed-allowed))
          PY
          git add index.html experience/polish.js experience/radio-missions.js sw.js version.json scripts/gameplay-integrate.cjs assets/radio/ack.mp3
          if git diff --cached --quiet; then exit 0; fi
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publish verified build 65 integration on feature branch'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD > radio-reports/integrated-commit.txt
      - name: Save exact tested game source
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          out=Path('radio-reports');out.mkdir(exist_ok=True)
          files=[Path(p) for p in ['index.html','three.min.js','version.json','sw.js','manifest.webmanifest'] if Path(p).is_file()]
          for root in ['experience','scripts','iti','assets/radio']:
              files.extend(p for p in Path(root).rglob('*') if p.is_file())
          with zipfile.ZipFile(out/'game-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,str(p))
          (out/'hashes.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-operations-results
          path: |
            radio-reports/
            gameplay-reports/browser-results.json
          retention-days: 7
