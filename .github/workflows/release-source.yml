name: Release source snapshot
on:
  push:
    branches: [feature/visual-polish-after-responsive-20261109]
    paths: ['.github/workflows/release-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: hisar-release-source
          path: |
            index.html
            three.min.js
            experience/
            scripts/
            iti/
            sw.js
            version.json
            manifest.webmanifest
            *.png
            .github/workflows/
          include-hidden-files: true
          retention-days: 1
