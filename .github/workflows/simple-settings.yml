name: HİSAR simple automatic settings validation
on:
  push:
    branches: [feature/easy-clean-neural-20261110]
    paths: ['experience/**', 'scripts/**', 'assets/radio/**', '.github/workflows/simple-settings.yml']
  pull_request:
    paths: ['experience/simple-settings*', 'experience/radio-sound.js', 'experience/radio-neural*', 'scripts/simple-*', '.github/workflows/simple-settings.yml']
permissions:
  contents: read
concurrency:
  group: simple-settings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded settings and audio integration
        run: |
          mkdir -p simple-reports
          node scripts/simple-integrate.cjs
          node scripts/simple-compat.cjs
          node scripts/radio-integrate.cjs
          node scripts/gameplay-integrate.cjs
      - name: All unit tests and original inline script syntax
        run: |
          set -o pipefail
          node --test experience/*.test.cjs 2>&1 | tee simple-reports/unit-tests.tap
          node scripts/experience-integrate.cjs
      - name: Install original-game browser tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Simple UI, automatic renderer settings and mobile layouts
        run: node scripts/simple-browser.cjs
      - name: Existing gameplay and camera regressions
        run: node scripts/gameplay-browser.cjs
      - name: Existing six missions, squad radio and MP3 playback
        run: node scripts/radio-browser.cjs
      - name: Commit only verified integration to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/easy-clean-neural-20261110'
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'index.html','experience/ui.js','experience/polish.js','experience/immersive.js','sw.js','version.json','scripts/experience-browser.cjs','scripts/experience-browser-legacy.cjs','scripts/gameplay-browser.cjs','scripts/gameplay-integrate.cjs','scripts/radio-integrate.cjs','scripts/radio-browser.cjs','assets/radio/ack.mp3'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not changed <= allowed: raise SystemExit('Unexpected changes: '+repr(changed-allowed))
          PY
          git add index.html experience/ui.js experience/polish.js experience/immersive.js sw.js version.json scripts/experience-browser.cjs scripts/experience-browser-legacy.cjs scripts/gameplay-browser.cjs scripts/gameplay-integrate.cjs scripts/radio-integrate.cjs scripts/radio-browser.cjs assets/radio/ack.mp3
          if git diff --cached --quiet; then exit 0; fi
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate verified automatic graphics and natural voice build 66'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD > simple-reports/integrated-commit.txt
      - name: Preserve tested source and hashes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          out=Path('simple-reports');out.mkdir(exist_ok=True)
          files=[Path(p) for p in ['index.html','three.min.js','version.json','sw.js','manifest.webmanifest'] if Path(p).is_file()]
          for root in ['experience','scripts','iti','assets/radio']:
              files.extend(p for p in Path(root).rglob('*') if p.is_file())
          with zipfile.ZipFile(out/'game-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,str(p))
          (out/'hashes.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-settings-results
          path: |
            simple-reports/
            gameplay-reports/browser-results.json
            radio-reports/results.json
          retention-days: 7
