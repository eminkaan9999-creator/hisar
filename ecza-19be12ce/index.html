<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kardelen'in İlaç Defteri</title>
<meta name="description" content="Eczane raflarındaki ilaçlar: ne işe yarar, nasıl kullanılır, rafta nerede.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D6222E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#B91C27" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İlaç Defteri">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
/* Yerleşim: solda kırmızı zeminli, beyaz yazılı menü (telefonda soldan açılır, geniş ekranda hep durur);
   üstte aynı kırmızıda başlık çubuğu ve beyaz arama kutusu; altında açık zeminde kayan içerik.
   İlaç kartı ve raf fotoğrafı ekranın üstüne açılan katmanlar; şikâyet seçici alttan çıkan, aramalı liste.
   Renkler eczane tabelasından: "E" kırmızısı ve beyaz. Her ilaç grubunun kendi rengi kutu şeridi gibi kullanılır. */
:root {
  --bg: #F2F3F6;
  --surface: #FFFFFF;
  --surface-2: #F5F6F9;
  --ink: #17191E;
  --ink-2: #555B68;
  --ink-3: #878D9B;
  --line: #E3E6EC;
  --menu: #D6222E;            /* eczane tabelası kırmızısı: menü ve başlık çubuğu */
  --menu-ink: #FFFFFF;
  --menu-on: rgba(255, 255, 255, .2);
  --red: #D6222E;             /* ana tuşlar */
  --red-ink: #FFFFFF;
  --red-soft: #FCE8E9;
  --ok: #0E8A5F;
  --ok-soft: #DDF5EA;
  --no: #C8202B;
  --no-soft: #FCE4E5;
  --warn: #8F5600;
  --warn-soft: #FFF1D6;
  --star: #FFC83D;
  --link: #1767B8;
  --rx-yok: #1767B8;          /* reçetesiz */
  --rx-n: #5A6170;            /* reçeteli */
  --rx-y: #0E8A5F;            /* yeşil reçete */
  --rx-k: #D6222E;            /* kırmızı reçete */
  --rx-t: #D96A06;            /* turuncu reçete */
  --rx-m: #7446BA;            /* mor reçete */
  --ts: 78%;                  /* grup rengi zemini: doygunluk, açıklık; yazı açıklığı */
  --tl: 93%;
  --tc: 36%;
  --shadow: 0 1px 2px rgba(23, 25, 30, .05), 0 8px 24px rgba(23, 25, 30, .07);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 20px;
  --r-s: 13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #191C22; --surface-2: #20242C; --ink: #F1F3F7; --ink-2: #A9B0BD; --ink-3: #7B8392; --line: #2B303A;
    --menu: #B91C27; --menu-ink: #FFFFFF; --menu-on: rgba(255, 255, 255, .18);
    --red: #EF4550; --red-ink: #FFFFFF; --red-soft: #3A1619;
    --ok: #4CC98A; --ok-soft: #143524; --no: #FF6B74; --no-soft: #451B1E; --warn: #F1B24A; --warn-soft: #3C2C0D; --star: #FFC83D; --link: #6CB4F5;
    --rx-yok: #6CB4F5; --rx-n: #A9B0BD; --rx-y: #4CC98A; --rx-k: #FF6B74; --rx-t: #FFA04D; --rx-m: #B894F2;
    --ts: 42%; --tl: 20%; --tc: 80%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #191C22; --surface-2: #20242C; --ink: #F1F3F7; --ink-2: #A9B0BD; --ink-3: #7B8392; --line: #2B303A;
  --menu: #B91C27; --menu-ink: #FFFFFF; --menu-on: rgba(255, 255, 255, .18);
  --red: #EF4550; --red-ink: #FFFFFF; --red-soft: #3A1619;
  --ok: #4CC98A; --ok-soft: #143524; --no: #FF6B74; --no-soft: #451B1E; --warn: #F1B24A; --warn-soft: #3C2C0D; --star: #FFC83D; --link: #6CB4F5;
  --rx-yok: #6CB4F5; --rx-n: #A9B0BD; --rx-y: #4CC98A; --rx-k: #FF6B74; --rx-t: #FFA04D; --rx-m: #B894F2;
  --ts: 42%; --tl: 20%; --tc: 80%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--f-body);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
/* telefonun üst çubuğunun arkası: başlık çubuğuyla aynı kırmızı */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--menu); z-index: 10; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button[disabled] { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
ul { margin: 0; padding: 0; list-style: none; }
svg { flex: none; }

/* ---------- iskelet ---------- */
#app { height: 100%; display: flex; position: relative; }
.main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* sol menü: kırmızı zemin, beyaz yazı */
.menu {
  position: fixed; z-index: 50; inset: 0 auto 0 0; width: min(84vw, 320px);
  background: var(--menu); color: var(--menu-ink);
  display: flex; flex-direction: column; gap: 18px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 14px calc(env(safe-area-inset-bottom, 0px) + 16px) max(14px, env(safe-area-inset-left, 0px));
  transform: translateX(-104%); visibility: hidden;
  transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s .26s;
}
#app.menu-open .menu { transform: none; visibility: visible; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s; box-shadow: 0 0 60px rgba(0, 0, 0, .35); }
.scrim { position: fixed; inset: 0; z-index: 45; background: rgba(10, 12, 16, .52); }
.menu-head { display: flex; align-items: center; gap: 12px; padding: 2px 2px 14px 6px; border-bottom: 1px solid rgba(255, 255, 255, .28); }
.e-sign { flex: none; width: 44px; height: 44px; border-radius: 13px; background: #FFFFFF; color: #D6222E; display: grid; place-items: center; font: 800 28px/1 var(--f-display); }
.menu-ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.menu-ttl small { font-size: 13px; opacity: .88; line-height: 1.2; }
.menu-ttl b { font: 700 21px/1.1 var(--f-display); letter-spacing: -.2px; }
.mclose { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; }
.mclose svg { width: 22px; height: 22px; }
.menu-nav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.mi { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 15px; font: 600 17px/1.2 var(--f-body); color: var(--menu-ink); }
.mi svg { width: 23px; height: 23px; }
.mi.on { background: var(--menu-on); font-weight: 700; }
.mi:active { background: var(--menu-on); }
.mi.var { background: #FFFFFF; color: #C41A26; }
.menu-foot { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .28); }
.menu-foot .ver { font-size: 13px; opacity: .85; padding: 0 14px; }

/* üst çubuk: menüyle aynı kırmızı, beyaz yazı */
.top { flex: none; background: var(--menu); color: var(--menu-ink); border-radius: 0 0 22px 22px; padding-bottom: 12px; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 2; }
.bar { display: flex; align-items: center; gap: 4px; min-height: 58px; padding-top: 4px; }
.nbtn { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: inherit; }
.nbtn svg { width: 24px; height: 24px; }
.nbtn:active { background: var(--menu-on); }
.bar .nbtn:first-child { margin-left: -8px; }
.ttl { flex: 1; min-width: 0; font: 700 21px/1.12 var(--f-display); letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ttl small { display: block; font: 500 12.5px/1.25 var(--f-body); letter-spacing: 0; opacity: .88; }
.upd { flex: none; height: 40px; min-width: 40px; padding: 0 9px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--menu-on); color: var(--menu-ink); font: 700 14.5px/1 var(--f-body); }
.upd svg { width: 20px; height: 20px; }
.upd.var { background: #FFFFFF; color: #C41A26; padding: 0 13px 0 10px; }
.upd.is svg { animation: don .9s linear infinite; }
@keyframes don { to { transform: rotate(360deg); } }
.sfield { position: relative; }
.sfield input { width: 100%; height: 50px; padding: 0 46px; border-radius: 25px; border: 0; background: var(--surface); color: var(--ink); font-size: 16px; outline: none; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); }
.sfield input::placeholder { color: var(--ink-3); }
.sfield input:focus-visible { outline: 3px solid var(--star); outline-offset: 1px; }
.sfield .mag { position: absolute; left: 16px; top: 15px; width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; display: grid; }
.sfield .mag svg, .sfield svg.mag { width: 20px; height: 20px; }
.sfield .clr { position: absolute; right: 5px; top: 5px; width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--ink-2); }
.sfield .clr svg { width: 18px; height: 18px; }

main#view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 16px 30px; display: flex; flex-direction: column; gap: 20px; }
main#view > * { flex: none; }

/* ---------- ortak parçalar ---------- */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > h2 { font: 700 19px/1.2 var(--f-display); letter-spacing: -.1px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.sec > h2 small { font: 500 13.5px/1.2 var(--f-body); letter-spacing: 0; color: var(--ink-3); }
.hint { font-size: 14px; color: var(--ink-2); }
/* grup rengiyle boyanan simge kutusu */
.ti { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: hsl(var(--h, 356) var(--ts) var(--tl)); color: hsl(var(--h, 356) 64% var(--tc)); }
.ti svg { width: 24px; height: 24px; }
.page-h { display: flex; align-items: center; gap: 12px; }
.page-h p { color: var(--ink-2); font-size: 15px; line-height: 1.35; }
.page-h b { color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 8px 14px; border-radius: 21px; background: var(--surface); box-shadow: var(--shadow); font-size: 15px; font-weight: 600; line-height: 1.2; }
.chip:active { background: var(--surface-2); }
.chip .cs { font-weight: 400; color: var(--ink-3); }

/* şikâyet seçici düğmesi: açılır liste görünümünde */
.pick { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 12px 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.pick .pi { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--red-soft); color: var(--red); display: grid; place-items: center; }
.pick .pi svg { width: 24px; height: 24px; }
.pick .pt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pick b { font: 700 17.5px/1.2 var(--f-display); letter-spacing: -.1px; }
.pick .pt span { font-size: 13.5px; color: var(--ink-2); line-height: 1.25; }
.pick > svg { width: 22px; height: 22px; color: var(--ink-3); }
.pick:active { background: var(--surface-2); }

/* günün ilacı */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; width: 100%; padding: 16px; border-radius: 24px; background: linear-gradient(135deg, hsl(var(--h, 160) var(--ts) var(--tl)), hsl(calc(var(--h, 160) + 26) var(--ts) calc(var(--tl) - 5%))); }
.hero .ht { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.hero .hl { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 11px; background: var(--surface); color: hsl(var(--h, 160) 64% var(--tc)); }
.hero .hn { font: 800 24px/1.08 var(--f-display); letter-spacing: -.4px; overflow-wrap: anywhere; margin-top: 4px; }
.hero .hsub { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.hero .kes { border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, .18); }

/* kısayol ve grup kutuları */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; padding: 14px 14px 13px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.tile .ti { margin-bottom: 7px; }
.tile b { font: 700 16.5px/1.18 var(--f-display); letter-spacing: -.1px; overflow-wrap: anywhere; }
.tile > span:last-child { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.tile:active { background: var(--surface-2); }
.tile[disabled] { opacity: .45; }

/* ürün satırı: solda raftaki kutunun küçük resmi */
.rows { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.row { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; min-height: 70px; padding: 9px 10px 9px 9px; width: 100%; }
.row + .row::before { content: ""; position: absolute; left: 73px; right: 0; top: 0; height: 1px; background: var(--line); }
.row .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .nm { font-weight: 600; font-size: 16.5px; line-height: 1.2; letter-spacing: -.1px; overflow-wrap: anywhere; }
.row .sub { font-size: 13.5px; color: var(--ink-2); line-height: 1.25; overflow-wrap: anywhere; }
.row .end { display: flex; align-items: center; gap: 6px; color: var(--ink-3); }
.row .end svg { width: 18px; height: 18px; }
.row .end .rx { font-size: 11.5px; padding: 3px 7px 3px 6px; }
.row:active { background: var(--surface-2); }
.srow { grid-template-columns: 1fr auto; min-height: 62px; padding-left: 16px; }
.srow + .srow::before { left: 16px; }
.th { flex: none; display: grid; place-items: center; border-radius: 14px; background-color: var(--surface-2); background-repeat: no-repeat; overflow: hidden; }
.th.ico { background: hsl(var(--h, 160) var(--ts) var(--tl)); color: hsl(var(--h, 160) 64% var(--tc)); }
.th.ico svg { width: 46%; height: 46%; }

.rx { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 4px 9px 4px 7px; border-radius: 11px; white-space: nowrap; line-height: 1.2; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.rx::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: currentColor; }
.rx.yok { --c: var(--rx-yok); } .rx.n { --c: var(--rx-n); } .rx.y { --c: var(--rx-y); }
.rx.k { --c: var(--rx-k); } .rx.t { --c: var(--rx-t); } .rx.m { --c: var(--rx-m); }
.tag { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 11px; background: var(--surface-2); color: var(--ink-2); line-height: 1.2; }
.empty { text-align: center; color: var(--ink-2); padding: 26px 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); font-size: 15px; }
.empty b { display: block; font: 700 18px/1.2 var(--f-display); color: var(--ink); margin-bottom: 4px; }

.molblk { display: flex; flex-direction: column; gap: 6px; }
.molhd { display: flex; flex-direction: column; gap: 1px; padding: 4px 4px 0; }
.molhd b { font-weight: 700; font-size: 16px; line-height: 1.2; }
.molhd span { font-size: 13.5px; color: var(--ink-2); }

/* kutu kesiti (raftaki gerçek kutu) */
.kes { display: inline-block; overflow: hidden; border-radius: 10px; position: relative; background: var(--surface-2); flex: none; }
.kes img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; }

.cta { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 54px; border-radius: 27px; background: var(--red); color: var(--red-ink); font: 700 17.5px/1 var(--f-body); padding: 0 20px; text-align: center; }
.cta svg { width: 20px; height: 20px; }
.cta:active { filter: brightness(.93); }
.cta[disabled] { opacity: .5; }
.cta.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.linkbtn { display: inline-flex; align-items: center; min-height: 40px; color: var(--link); font-weight: 700; font-size: 15px; align-self: flex-start; text-decoration: underline; text-underline-offset: 3px; }
.ibtn { flex: none; width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.ibtn svg { width: 20px; height: 20px; }

/* ---------- katmanlar: ilaç kartı, raf fotoğrafı, şikâyet seçici ---------- */
.layer { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); animation: gir .22s ease-out; }
@keyframes gir { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.layer .inner { max-width: 760px; width: 100%; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.layer-bar { flex: none; display: flex; align-items: center; gap: 4px; min-height: 58px; padding-top: calc(env(safe-area-inset-top, 0px) + 4px); padding-bottom: 6px; background: var(--menu); color: var(--menu-ink); border-radius: 0 0 22px 22px; }
.layer-bar .nbtn:first-child { margin-left: -8px; }
.layer-bar .ttl { font-size: 18.5px; }
.layer-bar .nbtn.on { color: var(--star); }
.layer-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 16px 30px; display: flex; flex-direction: column; gap: 14px; }
.layer-body > * { flex: none; }

.pcard { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.pimg { display: grid; place-items: center; padding: 18px 16px; min-height: 132px; background: radial-gradient(120% 100% at 50% 0%, hsl(var(--h, 160) var(--ts) var(--tl)), hsl(calc(var(--h, 160) + 20) var(--ts) calc(var(--tl) - 6%))); }
.pimg .kes { border-radius: 12px; box-shadow: 0 10px 26px rgba(0, 0, 0, .2); max-width: 100%; }
.pimg .th { border-radius: 22px; box-shadow: 0 10px 26px rgba(0, 0, 0, .14); }
.pinfo { padding: 16px; display: flex; flex-direction: column; gap: 9px; }
.pinfo h2 { font: 800 27px/1.08 var(--f-display); letter-spacing: -.5px; overflow-wrap: anywhere; }
.pinfo .etk { font-size: 15.5px; color: var(--ink-2); }
.pinfo .etk b { color: var(--ink); font-weight: 700; }
.pinfo .kisa { font-weight: 700; font-size: 16px; line-height: 1.25; align-self: flex-start; padding: 8px 12px; border-radius: 13px; background: hsl(var(--h, 160) var(--ts) var(--tl)); color: hsl(var(--h, 160) 64% var(--tc)); }
.pinfo .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.kt { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 9px; }
.kth { display: flex; align-items: center; gap: 10px; }
.kth h3 { font: 700 17px/1.2 var(--f-display); letter-spacing: -.1px; }

//titck.gov.tr/storage/Archive/2021/kubKtAttachments/NetildexKT_90e48045-0460-4711-b9b1-b1771a5eba3a.pdf","dog":1},"deksametazon+siprofloksasin.kulak":{"ad":"Deksametazon + Siprofloksasin","grup":"kulak","alt":"Antibiyotik + kortizonlu kulak damlası","kisa":"Antibiyotik + kortizonlu kulak damlası","ne":"Kulak yolu iltihabında (dış kulak yolu enfeksiyonu) ve tüp takılı kulaktan gelen akıntıda enfeksiyonu ve iltihabı birlikte tedavi eder.","nasil":"Etkilenen kulağa günde 2 kez damlatılır; damlattıktan sonra kısa süre yatılır. Doz sayısını ve süreyi hekim belirler. Genellikle 7 günü geçmeyen kısa kürle kullanılır.","yan":["Kulakta kaşıntı veya rahatsızlık","Kulak ağrısı","Kulakta dolgunluk","Alerjik reaksiyon"],"dik":["Kulak zarı delik değilse ya da hekim onaylamadıysa kullanılmaz.","Kinolon veya kortizona alerjisi olanlar kullanmamalıdır.","Şişe avuç içinde ısıtılıp kullanılır (baş dönmesini önler).","Açıldıktan sonra belirtilen sürede kullanılır; gebelik ve emzirmede hekime danışılır."],"sik":["kulak-agrisi"]},"deksametazon+tobramisin.goz":{"ad":"Deksametazon + Tobramisin","grup":"goz","alt":"Antibiyotikli kortizonlu göz damlası","kisa":"Göz enfeksiyonu ve iltihabı (antibiyotik + kortizon)","ne":"Antibiyotik ve kortizon gerektiren göz iltihabı ile bakteri enfeksiyonunda, özellikle ameliyat sonrası kullanılır.","nasil":"Genellikle göze 4–6 saatte bir 1–2 damla damlatılır; ilk günlerde hekim daha sık önerebilir. Dozu ve süreyi hekim belirler.","yan":["Gözde yanma, batma","Göz kızarıklığı","Bulanık görme","Göz içi basıncı artışı","Katarakt (uzun kullanımda)"],"dik":["Gözde uçuk (herpes), virüs veya mantar enfeksiyonunda kullanılmaz.","Tobramisin veya kortizona alerjisi olanlar kullanmamalıdır.","Uzun kullanımda göz içi basıncı kontrol edilmelidir.","Kontakt lens takılıyken kullanılmaz."],"sik":["goz-enfeksiyonu"]},"deksametazon.enj":{"ad":"Deksametazon","grup":"hormon","alt":"Kortikosteroid","kisa":"Kortizonlu enjeksiyon (iltihap ve alerji)","ne":"Şiddetli alerji, astım lir. 50/500 mg tablet: günde 1 tablet. Günde en fazla 75 mg deksketoprofen ve 4 g parasetamol alınır. Hızlı etki için yemekten en az 30 dakika önce aç karnına alınabilir. Çocuklarda ve ergenlerde kullanılmaz. Dozu hekim belirler.","yan":["Bulantı, kusma","Karın ağrısı, ishal","Hazımsızlık, gaz, kabızlık","Uyku hali, baş dönmesi","Baş ağrısı"],"dik":["Aspirin ve diğer NSAİİ'lere alerjisi, mide-bağırsak ülseri veya kanaması olanlar kullanmaz.","Ağır kalp, böbrek veya karaciğer yetmezliğinde kullanılmaz.","Parasetamol içeren başka ilaçlarla alınmaz; alkol kullananlarda parasetamol günde 2000 mg'ı aşmamalıdır.","Hamileliğin son üç ayında ve emzirirken kullanılmaz.","Baş dönmesi ve uyuşukluk yapabilir; araç kullanılmaz."],"sik":["kas-agrisi","eklem-agrisi","adet-sancisi"],"kay":"https://www.ilacrehberi.com/v/dexpadu-50-mg-500-mg-film-kapli-tablet-10a7e/kt/","dog":1},"deksketoprofen+tiyokolsikosid.agiz":{"ad":"Deksketoprofen + Tiyokolşikosid","grup":"kas-eklem","alt":"Ağrı kesici + kas gevşetici","kisa":"Ağrılı kas spazmını ve ağrıyı giderir","ne":"Kireçlenme, omurga ağrıları, eklem dışı romatizma, ağrılı kas kasılmaları ve ameliyat sonrası ağrıda ağrıyı ve yangıyı azaltır, kası gevşetir.","nasil":"25 mg/4 mg tablet: günde 3 kez 1 tablet; 25 mg/8 mg tablet: 12 saatte bir 1 tablet (günde en fazla 2). Tok karnına, yeterli suyla yutulur. Tedavi 5–7 gündür, 7 ardışık günden fazla kullanılmaz. 18 yaş altında kullanılmaz. Dozu hekim belirler.","yan":["Bulantı, kusma","Karın ağrısı","İshal","Hazımsızlık","Sersemlik, uyuklama","Ciddi: kanlı veya siyah dışkı"],"dik":["Aspirin ve benzeri ağrı kesicilere alerjisi, mide-bağırsak ülseri/kanaması, kanama bozukluğu, ağır kalp, böbrek ya da karaciğer yetmezliği olanlar kullanmaz.","Hamilelikte ve emzirmede kullanılmaz.","Baş dönmesi ve uyuklama yapabilir; araç ve makine dikkatle kullanılır.","Kan sulandırıcılar, kortikosteroidler, lityum, metotreksat ve diğer ağrı kesicilerle dikkatli olunur.","Kanlı veya siyah dışkıda bırakılıp acil yardım alınır."],"sik":["kas-agrisi","eklem-agrisi"],"kay":"https://www.ilacrehberi.com/v/leodex-plus-25-mg4-mg-film-kapli-tablet-e597/kt/","dog":1},"deksketoprofen.agiz":{"ad":"Deksketoprofen","grup":"agri","alt":"NSAİİ ağrı kesici","kisa":"Hızlı etkili ağrı kesici","ne":"Eklem iltihabı hastalıkları (osteoartrit, romatoid artrit, ankilozan spondilit), akut gut artriti, bel gibi kas-iskelet ağrıları, ameliyat sonrası ve adet ağrılarında kullanılır.","nasil":"Yetişkin: her 8 saatte bir 1 tablet (25 mg), günde en fazla 3 tablet (75 mg). Tablet suyla alınır; yemekle alınırsa mide yan etkisi azalır, hızlı etki için yemekten en az 30 dakika önce alınır. Çocuk ve ergenlerde kullanılmaz. Dozu hekim belirler.","yan":["Bulantı, kusma","Üst karın ağrısı","İshal","Hazımsızlık","Mide-bağırsak kanaması (ciddi)"],"dik":["Aspirin ya da benzeri ağrı kesicilere alerjisi veya astımı olanlar kullanmamalıdır.","Mide-bağırsak ülseri ya da kanaması, ciddi kalp, böbrek veya karaciğer sorunu olanlar kullanmamalıdır.","Gebeliğin son 3 ayında ve emzirmede kullanılmaz.","Baş dönmesi yapabilir; belirtiler geçene kadar araç kullanılmaz.","Aspirin, kan sulandırıcılar, lityum ve metotreksat ile birlikte kullanımı önerilmez."],"sik":["kas-agrisi","eklem-agrisi","dis-agrisi","adet-sancisi"],"kay":"https://www.ilacrehberi.com/v/dexofen-25-mg-film-tablet-bc2e/kt/","dog":1},"dekspantenol+klorheksidin.cilt":{"ad":"Dekspantenol + Klorheksidin","grup":"cilt","alt":"Yara iyileştirici ve antiseptik","kisa":"Küçük yaraları temizler ve iyileştirir","ne":"Küçük yara, çizik ve tahrişlerde cildi onarır (dekspantenol) ve mikrop üremesini önler (klorheksidin).","nasil":"Günde 1–3 kez temizlenmiş ve kurulanmış yaraya ince tabaka sürülür. Dozu hekim belirler.","yan":["Sürülen yerde kızarıklık","Kaşıntı","Alerjik deri tepkisi"],"dik":["Göz ve kulak içine sürülmez.","Bileşenlere alerjisi olanlar kullanmamalıdır.","Derin ve geniş yaralarda kullanmadan önce hekime danışılır.","Belirtiler 1–2 hafta içinde düzelmezse hekime başvurulur."],"sik":["yara-yanik"]},"dekspantenol.agiz-ici":{"ad":"Dekspantenol","grup":"bogaz","alt":"Mukoza onarıcı pastil","kisa":"Ağız ve boğaz tahrişini yatıştıran pastil","ne":"Ağız ve boğaz mukozasındaki tahriş ve iltihapta, ses kısıklığında destekleyici olarak kullanılır.","nasil":"Pastil ağızda yavaşça eritilir, çiğnenmez. Günlük sayı için ürünün kullanma talimatına bakılır.","yan":["Nadiren alerjik reaksiyon"],"dik":["Şeker içerebilir; şeker hastaları kullanma talimatına bakar.","Şikâyet birkaç günde geçmezse hekime başvurulur."],"sik":["bogaz-agrisi","agiz-yarasi"]},"dekspantenol.enj":{"ad":"Dekspantenol","grup":"vitamin","alt":"B5 vitamini türevi","kisa":"B5 vitamini; bağırsak tembelliğinde kullanılır","ne":"Ameliyat sonrası bağırsak hareketlerinin yavaşlaması (bağırsak tembelliği) gibi durumlarda kas içine uygulanır.","nasil":"Ampul kas içine (ya da hekim uygun görürse damar içine) sağlık görevlisince uygulanır. Dozu hekim belirler.","yan":["Enjeksiyon yerinde ağrı","Deri döküntüsü, kaşıntı","Bulantı"],"dik":["Bağırsak tıkanıklığı olanlara ve hemofili hastalarına verilmez.","Dekspantenole alerjisi olanlar kullanmaz."],"sik":[]},"dekstran-70+hipromelloz.goz":{"ad":"Dekstran 70 + Hipromelloz","grup":"goz","alt":"Suni gözyaşı (kuru göz damlası)","kisa":"Kuru göz için viskoz suni gözyaşı","ne":"Gözyaşı yetersizliğinde gözü nemlendirir ve korur; kuruluk, yanma ve tahrişi azaltır.","nasil":"Gerektiğinde her göze 1–2 damla, günde birkaç kez damlatılır. Dozu hekim belirler.","yan":["Geçici bulanık görme","Gözde hafif yanma","Göz kızarıklığı","Göz kapağında yapışma"],"dik":["İçeriğine alerjisi olanlar kullanmamalıdır.","Kontakt lens takıyorsanız önce çıkarılır, damlattıktan sonra bekleyip takılır.","Görme bulanırsa araç kullanılmaz.","Başka göz ilacıyla arada en az 5 dakika beklenir."],"sik":["goz-kurulugu"]},"demir+folik-asit.agiz":{"ad":"Demir + Folik asit","grup":"vitamin","alt":"Demir ve folik asit preparatı","kisa":"Gebelikte demir ve folik asit eksikliğini giderir","ne":"Demir ve folik asit eksikliğini, özellikle gebelikte, tedavi eder ve önler.","nasil":"Genellikle günde 1 kaplı tablet, bütün yutulur. Dozu hekim belirler.","yan":["Bulantı","Kabızlık","İshal","Karın ağrısı","Dışkının koyu renk olması"],"dik":["Çiğnenmeden bütün yutulur.","Tetrasiklin, kinolon ve tiroid ilaçlarıyla aralarına en az 2 saat konur.","Çocukların ulaşamayacağı yerde saklanır."],"sik":["kansizlik","gebelik"]},"demir-iii-hidroksit-polimaltoz.agiz":{"ad":"Demir III hidroksit polimaltoz","grup":"vitamin","alt":"Demir takviyesi","kisa":"Kansızlığı (demir eksikliği) tedavi eder","ne":"Demir eksikliği ve buna bağlı kansızlığı tedavi eder, önler.","nasil":"Doz yaşa, kiloya ve eksikliğe göre değişir; yemekle birlikte veya hemen sonra alınır. Dozu hekim belirler.","yan":["Dışkıda koyulaşma","Bulantı","Kabızlık veya ishal","Mide rahatsızlığı"],"dik":["Demir yüklenmesi ve demir kullanım bozukluğunda kullanılmaz.","Dışkının koyu renkli olması normaldir.","Tetrasiklin gibi bazı ilaçlarla araları açılmalıdır."],"sik":["kansizlik"]},"demir.agiz":{"ad":"Demir (ferröz tuzları)","grup":"vitamin","alt":"Oral demir preparatı","kisa":"Demir eksikliği kansızlığını tedavi eder","ne":"Demir eksikliğine bağlı kansızlığı (anemi) tedavi eder ve önler.","nasil":"Yetişkinde genellikle günde 1 tablet veya kapsül, bir bardak suyla bütün yutulur. Dozu hekim belirler.","yan":["Bulantı","Kabızlık","İshal","Karın ağrısı","Dışkının koyu renk olması"],"dik":["Dışkının siyaha dönmesi beklenen bir durumdur.","Çiğnenmez; çay, kahve ve süt demir emilimini azaltır.","Tetrasiklin, kinolon ve tiroid ilaçlarıyla aralarına en az 2 saat konur.","Çocukların ulaşamayacağı yerde saklanır; fazla alınması çocuklarda zehirlenme yapar."],"sik":["kansizlik"]},"desloratadin+montelukast.agiz":{"ad":"Desloratadin + Montelukast","grup":"alerji","alt":"Antihistaminik + lökotrien antagonisti","kisa":"Alerjik nezle ve astım belirtilerini azaltır","ne":"Alerjik nezle ve alerjik nezleyle birlikte görüle {"ad":"Flurbiprofen + Klorheksidin","grup":"bogaz","alt":"NSAİİ + antiseptik ağız ürünü","kisa":"Ağız-boğaz ağrısı ve mikrobu azaltır","ne":"Ağız ve boğaz iltihabına bağlı ağrıyı azaltır, mikrop üremesini önler; diş eti iltihabı, ağız yarası, farenjit ve bademcik iltihabında kullanılır.","nasil":"Yetişkin: 10 ml, sulandırmadan günde 2–3 kez ağızda çalkalanır veya gargara yapılır; yutulmaz. Aralıksız 7 günden fazla kullanılmaz. 12 yaş altında kullanılmaz.","yan":["Alerjik, aşırı duyarlılık tepkileri","Ağızda iğne batması, yanma","Tat almada değişiklik","Diş ve dilde geçici renk değişikliği","Ağız içinde tahriş"],"dik":["Aspirin/NSAİİ alerjisi, bunlara bağlı astım veya mide ülseri olanlar kullanmaz.","Gebelikte kullanılmaz; emzirme kullanım süresince bırakılır veya ilaç kesilir.","12 yaş altında kullanılmaz.","Böbrek, kalp veya karaciğer yetmezliğinde dikkatli kullanılır.","Yutulmaz; göz ve kulakla temas ettirilmez."],"sik":["bogaz-agrisi","agiz-yarasi"],"kay":"https://www.ilacrehberi.com/v/klorhex-plus-gargara-f165/kt/","dog":1},"flurbiprofen.agiz":{"ad":"Flurbiprofen","grup":"kas-eklem","alt":"NSAİİ ağrı kesici","kisa":"Eklem ve kas ağrısını, iltihabı azaltır","ne":"Ağrıyı ve iltihabı azaltır. Romatizmal eklem hastalıkları ve kas-iskelet ağrılarında kullanılır.","nasil":"Yetişkin: günde 150–200 mg, 2–4 doza bölünerek, yemekle birlikte bol suyla; günde en fazla 300 mg. Dozu hekim belirler.","yan":["Mide yanması","Bulantı","Karın ağrısı","Baş dönmesi","Baş ağrısı"],"dik":["Mide-bağırsak ülseri ve kanaması olanlar kullanmamalıdır.","Aspirin ve diğer ağrı kesicilere alerjisi olanlar kullanmamalıdır.","Böbrek, kalp ve karaciğer hastalığı olanlar hekime danışmalıdır.","Gebelikte (özellikle son 3 ay) ve emzirmede hekime danışmadan kullanılmaz."],"sik":["eklem-agrisi","kas-agrisi"]},"flurbiprofen.agiz-ici":{"ad":"Flurbiprofen","grup":"bogaz","alt":"NSAİİ ağız-boğaz ürünü","kisa":"Ağız ve boğaz iltihabını, ağrıyı azaltır","ne":"Diş eti, ağız ve boğaz iltihabına bağlı ağrıyı giderir; diş tedavisi sonrasında da kullanılır.","nasil":"Gargara: yarım bardak suya 10 ml katılıp günde 2–3 kez çalkalanır, yutulmaz. 12 yaş altı kullanmaz. Sprey için KT'deki püskürtme sayısı uygulanır. Dozu hekim belirler.","yan":["Ağızda yanma, tahriş","Duyarlılık (alerji) belirtileri"],"dik":["Aspirin/NSAİİ alerjisi, bu ilaçlara bağlı astım veya mide ülseri olanlar kullanmaz.","Gebelikte yalnızca hekim yararlı bulursa; 3. trimesterde kullanılmaz; emzirmede önerilmez.","Böbrek, kalp, karaciğer yetmezliğinde dikkatli kullanılır.","Yutulmaz; paraben içerdiği için geç alerji yapabilir."],"sik":["bogaz-agrisi","agiz-yarasi"],"kay":"https://www.ilacrehberi.com/v/majezik-025-gargara-200-ml-bb71/kub/klinik-ozellikler/","dog":1},"flutikazon+salmeterol.inh":{"ad":"Flutikazon + Salmeterol","grup":"solunum","alt":"Kortizon + uzun etkili beta-2","kisa":"Astım/KOAH günlük koruyucu (kortizon + uzun etkili)","ne":"Astımda ve orta/ağır KOAH'ta belirtileri kontrol altına almak için her gün düzenli kullanılır. Kortizon (flutikazon) ve uzun etkili bronş genişletici (salmeterol) içerir. Nefes darlığı başladıktan sonra etkisizdir.","nasil":"Yetişkinde günde 2 kez 1 inhalasyon. Kullandıktan sonra ağız su ile çalkalanıp tükürülür. Hekimin önerdiğinden yüksek dozda kullanılmaz; hekim bırakmasını söyleyene kadar her gün kullanılır. Dozu hekim belirler.","yan":["Baş ağrısı","Ses kısıklığı, boğaz tahrişi","Ağız ve boğazda aft","Kas krampı, kas ve eklem ağrısı","Sinüzit","KOAH'ta pnömoni, soğuk algınlığı"],"dik":["Salmeterol, flutikazon veya laktoza alerjisi olanlar kullanmaz.","Ani atakta kullanılmaz; kurtarıcı ilaç yanda taşınır.","Şeker, tiroid, yüksek tansiyon, kalp-damar hastalığı, verem veya enfeksiyonda hekime bildirilir.","Gebelikte ve emzirmede yalnızca hekim önerisiyle kullanılır.","Beta blokerler, ketokonazol, ritonavir ve idrar söktürücülerle etkileşebilir."],"sik":["astim"],"kay":"https://www.ilacrehberi.com/v/seretide-250-mcg-25-mcg-inhaler-a22a/kt/","dog":1},"flutikazon+umeklidinyum+vilanterol.inh":{"ad":"Flutikazon furoat + Umeklidinyum + Vilanterol","grup":"solunum","alt":"Üçlü KOAH inhaleri","kisa":"KOAH için günde bir kez üçlü ilaç","ne":"Yetişkinlerde KOAH tedavisinde düzenli kullanılır. Astımda ve ani nefes darlığında kullanılmaz.","nasil":"Yetişkin: günde bir kez, her gün aynı saatte 1 inhalasyon. 18 yaş altında kullanılmaz. Kullanımdan sonra ağız çalkalanır. Dozu hekim belirler.","yan":["Ağızda ve boğazda mantar","Üst solunum yolu enfeksiyonu","Baş ağrısı","Öksürük","Boğaz ağrısı","Kabızlık"],"dik":["İçeriğine alerjisi olanlar kullanmaz.","KOAH'ta akciğer enfeksiyonu (pnömoni) riski vardır.","Kullanımdan hemen sonra ani nefes darlığı olursa bırakılıp hekime gidilir.","Beta bloker, ketokonazol, klaritromisin ve ritonavirle etkileşebilir.","Gebelikte hekim önermedikçe kullanılmaz."],"sik":["astim"],"kay":"https://titck.gov.tr/storage/kubKtAttachments/IvhAQl0MuYcfio.pdf","dog":1},"flutikazon+vilanterol.inh":{"ad":"Flutikazon + Vilanterol","grup":"solunum","alt":"Kortizon + uzun etkili beta-2","kisa":"Astımda günde tek doz koruyucu","ne":"Astımda belirtileri ve alevlenmeleri azaltmak için her gün düzenli kullanılır. Kortizon (flutikazon furoat) ve uzun etkili bronş genişletici (vilanterol) içerir. Ani nefes darlığını gidermez.","nasil":"Olağan doz günde bir kez, her gün aynı saatte 1 inhalasyondur (100/25 mcg); şiddetli astımda hekim 200/25 mcg önerebilir. 12 yaş altında önerilmez. Kullandıktan sonra ağız su ile çalkalanıp tükürülür. Dozu hekim belirler.","yan":["Baş ağrısı","Soğuk algınlığı","Ağız ve boğazda mantar enfeksiyonu","Öksürük, ses bozukluğu","Boğaz ağrısı, burun akıntısı","Eklem, sırt ağrısı, kramp"],"dik":["Süt proteini, laktoz veya etkin maddelere alerjisi olanlar kullanmaz.","Kullanımdan hemen sonra göğüs sıkışması veya nefes darlığı olursa bırakılıp acil yardım alınır.","Karaciğer, kalp, yüksek tansiyon, verem, şeker, tiroid hastalığı veya düşük potasyumda hekime danışılır.","Gebelikte ve emzirmede doktor aksini söylemedikçe kullanılmaz.","Beta blokerler (metoprolol gibi), ketokonazol, ritonavir ve diğer uzun etkili beta-agonistlerle etkileşebilir."],"sik":["astim"],"kay":"https://www.ilacrehberi.com/v/relvar-ellipta-20025-mcg-kullanma-hazr-inhalasyon-ec74/kt/","dog":1},"flutikazon-furoat.burun":{"ad":"Flutikazon furoat","grup":"burun","alt":"Kortizonlu burun spreyi","kisa":"Burun alerjisi belirtilerini günde tek dozla önler","ne":"Alerjik nezle belirtilerini (burun akıntısı, hapşırma, tıkanıklık) ve alerjik burun iltihabına bağlı göz sulanması, kaşıntısı, kızarıklığını giderir.","nasil":"Yetişkin ve 12 yaş üstü: günde 1 kez her burun deliğine 2 püskürtme; kontrol sağlanınca 1 püskürtme. 2–11 yaş: günde 1 kez her burun deliğine 1 püskürtme (2–6 yaşta yalnızca hekim önerisiyle). 2 yaş altında kullanılmaz. Dozu hekim belirler.","yan":["Burun kanaması (çok yaygın)","Burun yaraları","Baş ağrısı","Nefes darlığı"],"dik":["Etken maddeye ya da bileşenlerine alerjisi olanlar kullanmaz.","Katarakt, glokom (göz tansiyonu) öyküsü varsa hekime danışılır; bulanık görmede hekime bildirilir.","Çocuklarda uzun süreli kullanım büyümeyi yavaşlatabilir.","Araç ve makine kullanımını etkilemesi beklenmez.","Gebelik ve emzirmede hekime danışılır."],"sik":["alerji","burun-tikanikligi","burun-akintisi"],"kay":"https://www.ilacrehberi.com/v/avamys-275-mikrogram-burun-spreyi-suspansiyon-ad94/kt/","dog":1},"flutikazon-propiyonat.burun":{"ad":"Flutikazon propiyonat","grup":"burun","alt":"Kortizonlu burun spreyi","kisa":"Burun alerjisi ve tıkanıklığını önler","ne":"Yetişkinlerde ve 4 yaş üstü çocuklarda mevsimsel (saman nezlesi dahil) ve mevsimsel olmayan alerjik nezle belirtilerini (hapşırma, kaşıntı, akıntı, tıkanıklık, sinüs basıncı) tedavi eder ve önler.","nasil":"Yetişkin ve 12 yaş üstü: günde 1 kez, tercihen sabah, her burun deliğine 2 püskürtme; en fazla günlük doz her buruna 4 püskürtme. 4–11 yaş: günde 1 kez her buruna 1 püskürtme; en fazla her buruna 2 püskürtme. Dozu hekim belirler.","yan":["Burun kanaması (çok yaygın)","Burun ya da boğazda kuruluk, tahriş","Baş ağrısı","Kötü tat ve koku"],"dik":["Etken maddeye ya da yardımcı maddelere alerjisi olanlar kullanmaz.","Burun enfeksiyonu, yakın zamanda burun ameliyatı ya da böbrek üstü bezi bozukluğunda dikkatli olunur.","Gebelikte ve emzirmede hekime danışılır.","Araç ve makine kullanımını etkilemesi beklenmez.","Ritonavir kullananlar hekime danışmadan kullanmaz."],"sik":["alerji","burun-tikanikligi","burun-akintisi"],"kay":"https://www.ilacrehberi.com/v/dalman-aq-nazal-sprey-a721/kt/","dog":1},"flutikazon.inh":{"ad":"Flutikazon propiyonat","grup":"solunum","alt":"Kortizonlu solunum ilacı","kisa":"Astım ataklarını önleyen kortizon","ne":"Düzenli kullanımla astım ataklarını önler. Ani astım atağını geçirmez.","nasil":"Nebül: yetişkin ve 16 yaş üstü günde 2 kez 500–2000 mcg; 4–16 yaş günde 2 kez 1000 mcg. Her gün düzenli kullanılır, hekime sormadan kesilmez. Dozu hekim belirler.","yan":["Ağızda pamukçuk","Ses kısıklığı","Ciltte çürük","KOAH'ta akciğer enfeksiyonu"],"dik":["Flutikazona alerjisi olan kullanmaz.","Gebelik ve emzirmede yalnızca hekim gerekli görürse kullanılır.","Ritonavir ve ketokonazolle etkileşebilir.","Kullanımdan sonra hırıltı artarsa ilaç bırakılıp hekime gidilir."],"sik":["astim"],"kay":"https://titck.gov.tr/storage/kubKtAttachments/hl6G4ZEVPjOxa2.pdf","dog":1},"formoterol+tiotropium.inh":{"ad":"Formoterol + Tiotropium","grup":"solunum","alt":"Uzun etkili bronkodilatör kombinasyonu","kisa":"KOAH'ta düzenli kullanılan solunum açıcı","ne":"KOAH'ta (kronik tıkayıcı akciğer hastalığı) nefes darlığını önlemek için düzenli kullanılır. Ani nefes darlığında kurtarıcı olarak kullanılmaz.","nasil":"Yetişkin: günde bir kez, her gün aynı saatte 1 inhalasyon. 18 yaş altında kullanılmaz. Dozu hekim belirler.","yan":["Ağız kuruluğu","Baş ağrısı","Çarpıntı","Titreme"],"dik":["Atropin türevlerine (ipratropium gibi) alerjisi olan kullanmaz.","Gebelik ve emzirmede hekim önermedikçe kullanılmaz.","Baş dönmesi veya bulanık görme olursa araç kullanılmaz.","Beta bloker, MAO inhibitörü ve trisiklik antidepresanlarla etkileşir."],"sik":["astim"],"kay":"https://titck.gov.tr/storage/kubKtAttachments/F4YY8oXNTLtJhD.pdf","dog":1},"fosfomisin.agiz":{"ad":"Fosfomisin","grup":"antibiyotik","alt":"Tek dozluk idrar yolu antibiyotiği","kisa":"Tek dozla idrar yolu enfeksiyonunu tedavi eder","ne":"Kadınlarda komplike olmayan akut idrar kesesi iltihabını (sistit) tek dozla tedavi eder.","nasil":"Tek doz 3 g (1 saşe). Aç karnına (yemekten 2–3 saat önce ya da sonra), tercihen yatmadan önce ve idrar kesesi boşaltıldıktan sonra alınır. Saşe bir bardak suda çözülüp hemen tamamı içilir. 12 yaş ve altında önerilmez.","yan":["İshal","Bulantı","Hazımsızlık","Karın ağrısı","Baş ağrısı","Baş dönmesi"],"dik":["Böbrek yetmezliği (kreatinin klerensi 10 mL/dk altı) olanlar kullanmamalıdır.","Metoklopramid (bulantı ilacı) ile birlikte alınmaz.","Yemekle birlikte alınırsa emilimi gecikir.","Baş dönmesi olabileceği için araç kullanırken dikkatli olunmalıdır."],"sik":["idrar-yolu","enfeksiyon"],"kay":"https://titck.gov.tr/storage/Archive/2021/kubKtAttachments/MONUROL3GGRANLERENSAEKBTEMZ_4a4fc932-4156-4f27-97ad-cb1f2b4dfc50.pdf","dog":1},"furosemid.agiz":{"ad":"Furosemid","grup":"tansiyon","alt":"Güçlü (kıvrım) idrar söktürücü","kisa":"Güçlü idrar söktürür (ödem, tansiyon)","ne":"Kalp, karaciğer ve böbrek hastalığına ya da yanığa bağlı sıvı birikimini (ödem) giderir; yüksek tansiyonda da kullanılır.","nasil":"Yetişkin ödemde genellikle 40 mg ile başlanır, günlük tedavi dozu 40–80 mg; yüksek tansiyonda genellikle günde 40 mg. Aç karnına, çiğnemeden, bir bardak suyla alınır. Çocukta günde 1 mg/kg (en çok 40 mg). Dozu hekim belirler.","yan":["Vücutta su ve tuz kaybı","Kanda potasyum ve sodyum düşüklüğü","Tansiyon düşmesi","Kanda kreatinin ve yağ artışı"],"dik":["Sülfonamid alerjisi olanlar, idrar yapamayanlar ve emzirenler kullanmamalıdır.","Gebelikte hekim gerekli görmedikçe kullanılmaz.","Başlangıçta ve alkolle otik)","ne":"Gözün ve göz çevresinin bakteriyel enfeksiyonlarında kullanılır. Göz-kulak damlası olduğundan kulağın dış enfeksiyonunda da kullanılabilir.","nasil":"Göze genellikle günde 3–4 kez 1–2 damla damlatılır. Dozu ve süreyi hekim belirler.","yan":["Gözde geçici yanma, batma","Göz kızarıklığı","Göz kaşıntısı","Alerjik reaksiyon"],"dik":["Gentamisine veya aminoglikozid antibiyotiklere alerjisi olanlar kullanmamalıdır.","Kulak zarı delikse kulağa damlatılmaz.","Uzun kullanımda dirençli mikroplar çoğalabilir.","Gebelikte ve emzirmede hekime danışılır."],"sik":["goz-enfeksiyonu","kulak-agrisi"]},"gliklazid.agiz":{"ad":"Gliklazid","grup":"diyabet","alt":"Sülfonilüre antidiyabetik","kisa":"Tip 2 diyabette insülin salgısını artırır","ne":"Tip 2 diyabette, diyet ve egzersiz yetersiz kaldığında kan şekerini düşürür.","nasil":"Yetişkin: sabah kahvaltıyla tek dozda günde 1–4 tablet (MR 30 mg için); günde en çok 120 mg. Tablet bütün yutulur, ardından yemek yenmelidir. Dozu hekim belirler.","yan":["Düşük kan şekeri (en sık)","Deri döküntüsü, kaşıntı","Bulantı, kusma, karın ağrısı","İshal veya kabızlık","Geçici görme bozukluğu"],"dik":["Öğün atlamak, alkol ve oruç düşük şekere yol açar; yanında şeker bulundurulmalıdır.","Tip 1 diyabette ve ciddi böbrek/karaciğer yetmezliğinde kullanılmaz.","Emzirirken kullanılmaz; gebelikte önerilmez.","Mikonazol ile birlikte kullanılmaz."],"sik":["seker"],"kay":"https://medikalakademi.com.tr/wp-content/uploads/2024/08/betanorm-mr-30mg-tablet.pdf","dog":1},"glikopironyum.inh":{"ad":"Glikopironyum","grup":"solunum","alt":"Uzun etkili antikolinerjik bronkodilatör","kisa":"KOAH'ta günde bir kez solunum açıcı","ne":"KOAH'ta nefes darlığını azaltmak için düzenli kullanılır. Ani nefes darlığı krizinde kullanılmaz.","nasil":"Yetişkin: günde bir kez 1 kapsülün içeriği cihazla solunur. Kapsül yutulmaz. 18 yaş altında kullanılmaz. Dozu hekim belirler.","yan":["Ağız kuruluğu","Uykusuzluk","Burun akıntısı","Hapşırma","İshal","Kas ve kemik ağrısı"],"dik":["Glikopironyuma alerjisi olan kullanmaz.","Dar açılı glokom, idrar yapma zorluğu ve böbrek hastalığında dikkatli kullanılır.","Göz ağrısı, bulanık görme veya ani nefes darlığı olursa ilaç bırakılıp hekime gidilir.","İpratropium, tiotropium gibi benzer ilaçlarla birlikte hekime bildirilir."],"sik":["astim"],"kay":"https://titck.gov.tr/storage/kubKtAttachments/pEaSd2v1laEhOa.pdf","dog":1},"gliseril-trinitrat.agiz-ici":{"ad":"Gliseril trinitrat (nitrogliserin) sprey","grup":"tansiyon","alt":"Nitrat (kalp damarı genişletici)","kisa":"Göğüs ağrısı atağını hızla giderir","ne":"Kalp damarı daralmasına bağlı göğüs ağrısı (anjina) atağını hızla giderir.","nasil":"Atakta 1–2 doz dilin altına sıkılır, yutulmaz. 15 dakika içinde en fazla 3 doz. Ağrı geçmezse acil yardım çağrılır. Dozu hekim belirler.","yan":["Baş ağrısı","Baş dönmesi","Yüzde kızarma","Çarpıntı","Tansiyon düşmesi"],"dik":["Sertleşme ilaçları (sildenafil, tadalafil vb.) ile birlikte kesinlikle kullanılmaz.","Ağır düşük tansiyonda kullanılmaz.","Oturarak kullanılır; ani kalkınca baş dönmesi olabilir.","Sprey yanan ateşe doğru sıkılmaz."],"sik":["kalp"]},"gliseriltrinitrat.rektal":{"ad":"Gliseril trinitrat","grup":"bagirsak","alt":"Damar genişletici makat merhemi","kisa":"Makat çatlağının (fissür) ağrısını giderir","ne":"Makatta çatlak (anal fissür) nedeniyle oluşan ağrıyı azaltır ve iyileşmeyi destekler.","nasil":"Makat girişine, parmakla ince bir şerit (yaklaşık 2,5 cm) halinde 12 saatte bir sürülür. Süre ve dozu hekim belirler.","yan":["Baş ağrısı","Baş dönmesi","Tansiyon düşmesi","Makatta yanma"],"dik":["Baş ağrısı çok sık görülür.","Tansiyonu düşük olanlar ve damar genişletici ilaç kullananlar hekime danışır.","Sildenafil gibi sertleşme ilaçlarıyla birlikte kullanılmaz.","Uygularken parmak eldivenle veya sonra eller yıkanır."],"sik":[]},"gliserin.rektal":{"ad":"Gliserin","grup":"bagirsak","alt":"Kabızlık fitili","kisa":"Kabızlığı gideren fitil","ne":"Kabızlıkta dışkıyı yumuşatıp bağırsağı uyararak kısa sürede boşaltmayı sağlar.","nasil":"Yetişkin (3300 mg): gerektiğinde 1 fitil makattan uygulanır, genelde birkaç dakika ile bir saat içinde etki eder. Dozu hekim belirler.","yan":["Makatta tahriş","Karın krampı","Makatta yanma","İshal"],"dik":["Yalnızca makattan kullanılır; yutulmaz.","Karın ağrısı, bulantı veya kusması olanlar hekime danışmadan kullanmaz.","Kanama veya makatta yırtık varsa hekime danışılır.","Sürekli kullanılırsa bağırsak alışkanlığı yapabilir; uzun süre kullanılmaz."],"sik":["kabizlik"]},"glukoz+potasyum-klorur+sodyum-klorur+sodyum-sitrat.agiz":{"ad":"Glukoz + Potasyum klorür + Sodyum klorür + Sodyum sitrat (oral rehidrasyon)","grup":"bagirsak","alt":"Oral rehidrasyon tuzu","kisa":"İshalde su ve tuz kaybını yerine koyar","ne":"İshal sırasında vücuttan kaybolan su ve tuzları (elektrolit) yerine koyar.","nasil":"Bir poşet 1 litre kaynatılıp soğutulmuş suda eritilir, kuru toz alınmaz. Yetişkin: her sulu dışkıdan sonra 1 bardak. Çocuk: günde en az kilosu kadar çay bardağı. Hazırlanan karışım 24 saat içinde kullanılır.","yan":["Belirgin yan etki beklenmez","Aşırı dozda kan tuz dengesi bozulabilir"],"dik":["Böbrek ve karaciğer hastalarında, bağırsak tıkanıklığında kullanılmaz.","2 yaş altı çocuklarda, şeker hastalarında ve düşük sodyum-potasyum diyetindekilerde hekime danışılır.","24 saatte düzelme olmaz ya da su kaybı belirtisi (ağız kuruluğu, idrar azalması) görülürse hekime başvurulur.","Emziren bebeklerin emzirmesi kesilmez."],"sik":["ishal"],"kay":"https://www.ilacrehberi.com/v/ge-oral-rehydration-tozu-iki-posetlik-kutu-8df4/kt/","dog":1},"granisetron.agiz":{"ad":"Granisetron","grup":"mide","alt":"5-HT3 antagonisti, bulantı önleyici","kisa":"Kemoterapi bulantı ve kusmasını önler","ne":"Kanser ilacı (kemoterapi) veya ışın tedavisine bağlı bulantı ve kusmayı önler ve tedavi eder.","nasil":"Yetişkin: günde 1 kez 2 mg ya da günde 2 kez 1 mg; ilk doz tedaviden 1 saat önce alınır, en çok 1 hafta. Tablet çiğnenmeden bol suyla alınır. Çocuklarda önerilmez. Dozu hekim belirler.","yan":["Baş ağrısı","Kabızlık","Uykusuzluk","İshal","Karaciğer testlerinde değişiklik"],"dik":["Granisetron veya benzeri bulantı ilaçlarına alerjisi olanlar kullanmaz.","Gebelikte hekim söylemedikçe kullanılmaz; emzirirken önerilmez.","Kalp ritmi ilaçları, SSRI türü antidepresanlar ve eritromisinle etkileşebilir.","Laktoz içerir."],"sik":["bulanti"],"kay":"https://titck.gov.tr/storage/Archive/2019/kubKtAttachments/UYGUN-KT.pdf_22042d9a-cf8a-4b38-bf72-df1b2198323c.pdf","dog":1},"guaifenesin+psodoefedrin.agiz":{"ad":"Psödoefedrin + Guaifenesin","grup":"oksuruk","alt":"Burun açıcı + balgam söktürücü","kisa":"Balgamı söktürür, burnu açar","ne":"Balgamı gevşetir, burun tıkanıklığını azaltır. Balgamlı öksürük ve nezlede kullanılır.","nasil":"12 yaş üstü ve yetişkin: günde 3 kez 10 ml (2 ölçek), günde en fazla 40 ml. 5 günden uzun kullanılmaz.","yan":["Uykusuzluk, sinirlilik","Çarpıntı","Ağız kuruluğu","Baş ağrısı","Bulantı"],"dik":["12 yaşından küçüklerde kullanılmaz.","Yüksek tansiyon, kalp ve tiroid hastaları ile prostat büyümesi olanlar kullanmamalıdır.","Gebelikte kullanılmaz.","MAO inhibitörü antidepresanlarla birlikte alınmaz."],"sik":["oksuruk-balgamli","burun-tikanikligi","grip"],"kay":"https://www.ilacrehberi.com/v/sudafed-expektoran-150-ml-surup-9b79/kt/nasil-kullanilir/","dog":1},"guaifenesin+terbutalin.agiz":{"ad":"Terbutalin + Guaifenesin","grup":"solunum","alt":"Bronş genişletici + balgam söktürücü","kisa":"Bronşu açar, balgamı söktürür","ne":"Bronşları genişletir ve balgamı gevşetir. Balgamlı, hırıltılı öksürükte kullanılır.","nasil":"Yetişkin: günde 3 kez yaklaşık 10 ml. Dozu hekim belirler.","yan":["El titremesi","Çarpıntı","Baş ağrısı","Kas krampı"],"dik":["Kalp ritim sorunu, tiroid hastalığı ve şekeri olanlar hekime danışmalıdır.","Gebelik ve emzirmede hekime danışılır.","Bronş genişleticilerle birlikte kullanım hekim kontrolündedir."],"sik":["astim","oksuruk-balgamli"]},"haloperidol.agiz":{"ad":"Haloperidol","grup":"psikiyatri","alt":"Klasik antipsikotik","kisa":"Şizofreni ve ajitasyon ilacı","ne":"Şizofreni, ajitasyon (aşırı huzursuzluk, saldırganlık) ve tik bozukluklarında kullanılır.","nasil":"Yetişkinde olağan doz günde 0,5–5 mg'dır; genellikle günde 2–3 doza bölünerek alınır. Damla ölçülü şekilde alınır. Dozu hekim belirler.","yan":["Kas sertliği, titreme","Huzursuzluk","Uyku hali","Ağız kuruluğu","Kabızlık","Kilo alımı"],"dik":["Parkinson hastalığında ve ağır depresyonda kullanılmaz.","Kalp ritmi (QT) bozukluğunda ve QT uzatan ilaçlarla dikkatli kullanılır.","Bunamalı yaşlı hastalarda ölüm riskini artırır.","Alkol ve uyku hali yapan ilaçlarla birlikte alınmaz; araç kullanırken dikkat edilir."],"sik":["psikoz"]},"hidrokinon.cilt":{"ad":"Hidrokinon","grup":"cilt","alt":"Cilt açıcı (depigmentasyon)","kisa":"Cilt lekelerini açar","ne":"Derideki koyulaşmış (hiperpigmentasyon) lekelerin yavaş yavaş açılmasını sağlar.","nasil":"Günde 2 kez, sabah ve akşam, yalnızca lekeli bölgeye ince sürülür. 2 ay sonunda iyileşme yoksa bırakılıp hekime danışılır. 12 yaş ve altı için güvenliliği incelenmemiştir.","yan":["Hafif yanma","Batma","Kızarıklık","Kuruluk"],"dik":["Tedavi sırasında güneşten kaçınılır, en az 15 faktörlü koruyucu kullanılır.","Gebelikte zorunlu olmadıkça kullanılmaz.","Emzirmede hekime danışılır.","Hidrokinona alerjisi olanlar kullanmaz."],"sik":[],"kay":"https://titck.gov.tr/storage/kubKtAttachments/035862c836668.pdf","dog":1},"hidroklorotiyazid+kandesartan.agiz":{"ad":"Kandesartan + Hidroklorotiyazid","grup":"tansiyon","alt":"ARB + idrar söktürücü","kisa":"Tansiyonu düşürür (sartan + idrar söktürücü)","ne":"Tek başına kandesartanla yeterince düşmeyen yüksek tansiyonun tedavisinde kullanılır.","nasil":"Yetişkin: genellikle günde 1 kez 1 tablet, aç veya tok. Dozu hekim belirler.","yan":["Baş dönmesi","Baş ağrısı","Kanda potasyum düşüklüğü","Yorgunluk","Kanda ürik asit artışı"],"dik":["Gebelikte kullanılmaz; gebelik planlayanlar hekime haber vermelidir.","Sülfonamid (sülfa) alerjisi olanlar kullanmaz.","Ayağa kalkarken baş dönmesi olabilir; araç kullanırken dikkat edilmelidir.","Potasyum takviyesi ve lityumla birlikte hekime danışılmalıdır.","Ağır böbrek ve karaciğer hastalığında kullanılmaz."],"sik":["tansiyon"]},"hidroklorotiyazid+losartan.agiz":{"ad":"Losartan + Hidroklorotiyazid","grup":"tansiyon","alt":"ARB + idrar söktürücü","kisa":"Tansiyonu düşürür (sartan + idrar söktürücü)","ne":"Tek başına losartanla yeterince düşmeyen yüksek tansiyonun tedavisinde kullanılır.","nasil":"Yetişkin: günde 1 kez 1 tablet. Dozu hekim belirler.","yan":["Baş dönmesi","Yorgunluk","Kanda potasyum düşüklüğü","Baş ağrısı","Kanda ürik asit artışı"],"dik":["Gebelikte kullanılmaz; gebelik planlayanlar hekime haber vermelidir.","Sülfonamid (sülfa) alerjisi olanlar kullanmaz.","Ağır böbrek ve karaciğer hastalığında kullanılmaz.","Lityum ve potasyum takviyesiyle hekime danışılmalıdır.","Baş dönmesi olursa araç kullanılmaz."],"sik":["tansiyon"]},"hidroklorotiyazid+olmesartan.agiz":{"ad":"Olmesartan + Hidroklorotiyazid","grup":"tansiyon","alt":"ARB + idrar söktürücü kombinasyonu","kisa":"Yüksek tansiyonu iki etkiyle düşürür","ne":"Tek ilaçla yeterince düşmeyen yüksek tansiyonu düşürür.","nasil":"Yetişkin: günde 1 kez 1 tablet, aç ya da tok. Dozu hekim belirler.","yan":["Baş dönmesi","Baş ağrısı","Yorgunluk","Sık idrara çıkma","Kandaki potasyum, sodyum değişiklikleri","Bulantı"],"dik":["Gebelikte kullanılmaz.","Ağır böbrek ve karaciğer yetmezliğinde kullanılmaz.","Sülfonamid alerjisinde dikkatli olunur.","Düşük tansiyona bağlı baş dönmesi olabilir; araç kullanırken dikkat edilir."],"sik":["tansiyon"]},"hidroklorotiyazid+ramipril.agiz":{"ad":"Ramipril + Hidroklorotiyazid","grup":"tansiyon","alt":"ADE inhibitörü + idrar söktürücü","kisa":"Tansiyonu düşürür (ADE inhibitörü + idrar söktürücü)","ne":"Tek başına ramiprille yeterince düşmeyen yüksek tansiyonun tedavisinde kullanılır.","nasil":"Yetişkin: günde 1 kez 1 tablet, tercihen sabah. Dozu hekim belirler.","yan":["Kuru öksürük","Baş dönmesi","Baş ağrısı","Kanda potasyum düşüklüğü","Yorgunluk"],"dik":["Gebelikte kullanılmaz; gebelik planlayanlar hekime haber vermelidir.","Yüz, dil veya dudakta şişme olursa ilaç bırakılıp acil yardım istenir.","Sülfonamid (sülfa) alerjisi olanlar kullanmaz.","Potasyum takviyesi ve lityumla birlikte hekime danışılmalıdır.","Baş dönmesi olursa araç kullanılmaz."],"sik":["tansiyon"]},"hidroklorotiyazid+spironolakton.agiz":{"ad":"Spironolakton + Hidroklorotiyazid","grup":"tansiyon","alt":"İki farklı idrar söktürücü","kisa":"Ödemi atar, tansiyonu düşürür (iki idrar söktürücü)","ne":"Ödem ve yüksek tansiyon tedavisinde, potasyum kaybını dengeleyen iki idrar söktürücünün birleşimi olarak kullanılır.","nasil":"Yetişkin: günde 25–200 mg spironolakton içeren dozda, yemekle alınır. Dozu hekim belirler.","yan":["Kanda potasyum değişiklikleri","Baş dönmesi","Bulantı","Meme hassasiyeti","Adet düzensizliği"],"dik":["Ağır böbrek yetmezliği ve yüksek potasyumu olanlar kullanmaz.","Sülfonamid (sülfa) alerjisi olanlar kullanmaz.","Potasyum takviyesi ve lityumla hekime danışılmalıdır.","Baş dönmesi olursa araç kullanılmaz."],"sik":["odem","tansiyon"]},"hidroklorotiyazid+telmisartan.agiz":{"ad":"Telmisartan + Hidroklorotiyazid","grup":"tansiyon","alt":"ARB + idrar söktürücü kombinasyonu","kisa":"Yüksek tansiyonu iki etkiyle düşürür","ne":"Tek ilaçla yeterince düşmeyen yüksek tansiyonu düşürür.","nasil":"Yetişkin: günde 1 kez 1 tablet, aç ya da tok. Dozu hekim belirler.","yan":["Baş dönmesi","Düşük tansiyon","Kandaki potasyum değişiklikleri","Sık idrara çıkma","Yorgunluk","Sırt ağrısı"],"dik":["Gebelikte kullanılmaz.","Ağır böbrek ve karaciğer yetmezliğinde, safra tıkanıklığında kullanılmaz.","Sülfonamid alerjisinde dikkatli olunur.","Baş dönmesi olabilir; araç kullanırken dikkat edilir."],"sik":["tansiyon"]},"hidroklorotiyazid+valsartan.agiz":{"ad":"Valsartan + Hidroklorotiyazid","grup":"tansiyon","alt":"ARB + idrar söktürücü","kisa":"Tansiyonu düşürür (sartan + idrar söktürücü) in","grup":"kas-eklem","alt":"Antiromatizmal, sıtma ilacı","kisa":"Romatoid artrit ve lupusu kontrol eder","ne":"Romatoid artrit, diskoid ve sistemik lupus, ışığa duyarlı deri döküntüleri ile sıtmanın (malarya) baskılanması ve akut ataklarının tedavisinde kullanılır.","nasil":"Romatoid artritte atakta günde 2–3 tablet (200 mg), idamede günde 1–2 tablet; lupusta başlangıçta günde 1–2 tablet alınır. Sıtmadan korunmada 400 mg her hafta aynı gün alınır. 6 yaş altında ve 35 kg altı çocuklarda 200 mg tablet kullanılmaz. Dozu hekim belirler.","yan":["Retinopati (göz ağ tabakası hastalığı)","Bulanık görme, ışığa duyarlılık","Yaygın deri kızarıklığı, pullanma","Alerjik reaksiyon","Kas güçsüzlüğü","Psikoz, nöbet (acil)"],"dik":["4-aminokinolin grubuna alerjisi ve göz sorunu olanlar ile 6 yaş altı çocuklar kullanmaz.","Gebeler ve emzirenler kullanmadan önce hekime danışmalıdır.","Uzun tedaviden önce ve sonra en az yılda bir göz muayenesi yapılır; görme bozulursa ilaç bırakılıp hekime başvurulur.","Bulanık görme yapabilir; araç ve makine kullanırken dikkatli olunur.","Digoksin ve insülin/şeker ilaçlarıyla etkileşir."],"sik":["eklem-agrisi"],"kay":"https://www.ilacrehberi.com/v/plaquenil-200-mg-film-kapli-tablet-b4fb/kt/","dog":1},"hidroksizin.agiz":{"ad":"Hidroksizin","grup":"alerji","alt":"Antihistaminik, sakinleştirici","kisa":"Kaşıntıyı ve kaygıyı azaltır","ne":"18 yaş ve üzerinde kaygı belirtilerinde; 12 ay ve üzeri çocuk, ergen ve yetişkinde kaşıntı belirtilerinde kullanılır.","nasil":"Yetişkin kaygıda: günde toplam 50 mg, 3 doza bölünür (sabah 12,5, öğle 12,5, akşam 25 mg); ağır olguda günde 100 mg'a kadar. Kaşıntıda: geceleri 25 mg, gerekirse günde 3–4 kez 25 mg. Aç ya da tok alınabilir. Dozu hekim belirler.","yan":["Uyuklama hali","Sedasyon (aşırı uyku hali)","Baş ağrısı","Halsizlik","Ağız kuruluğu"],"dik":["Hamilelikte ve emzirirken kullanılmaz.","Kalp ritim bozukluğu (QT uzaması) ya da kalp hastalığı olanlar kullanmaz.","Tepki ve dikkati etkileyebilir; araç ve makine r. Hekime danışmadan ağrıda 5, ateşte 3 günden uzun kullanılmaz. 18 yaş altında kullanılmaz. Dozu hekim belirler.","yan":["Bulantı, kusma","Deri döküntüsü (ciddi olabilir)","Alerjik reaksiyon","Yüz ve boğaz şişmesi"],"dik":["Parasetamol, propifenazon, kafein ya da pirazolon türevlerine alerjisi olanlar kullanmamalıdır.","18 yaş altı, kan hastalığı, ağır böbrek, karaciğer veya kalp yetmezliği olanlar kullanmamalıdır.","Hamileliğin son 3 ayında kullanılmaz; emzirmede önerilmez.","Alkol kullanılmamalıdır; uyuşukluk yapabilir, araç ve makine kullanılmamalıdır.","Varfarin, diğer ağrı kesiciler ve flukloksasilin ile etkileşir."],"sik":["bas-agrisi","dis-agrisi","adet-sancisi","ates"],"kay":"https://www.ilacrehberi.com/v/parol-plus-tablet-bc39/kt/","dog":1},"kafein+parasetamol.agiz":{"ad":"Parasetamol + Kafein","grup":"agri","alt":"Ağrı kesici kombinasyonu","kisa":"Kafeinli ağrı kesici (baş ağrısı, ateş)","ne":"Hafif ve orta şiddetli baş ağrısı, migren, adet ağrısı, boğaz ağrısı, kas-iskelet ve kireçlenme ağrılarında ve ateşin düşürülmesinde kullanılır.","nasil":"12 yaş üstü ve yetişkin: 1–2 tablet, gerekirse 4 saatte bir tekrarlanır; 24 saatte en fazla 4 doz (4000 mg parasetamol). Bir bardak suyla yutulur. 12 yaş altına hekim önermedikçe verilmez. Alkol alanlarda günlük parasetamol 2 g'ı geçmez. Dozu hekim belirler.","yan":["Uyku hali","Baş ağrısı, baş dönmesi","Bulantı, kusma","Karın ağrısı, hazımsızlık","Kabızlık"],"dik":["Şiddetli karaciğer ya da böbrek yetmezliği, yüksek tansiyon veya kalp ritim bozukluğu olanlar kullanmamalıdır.","Parasetamol içeren başka ilaçlarla birlikte alınmaz.","Alkol karaciğer zararı riskini artırır; alkol alanlarda günlük parasetamol 2 g'ı geçmemelidir.","Gebelikte kafein nedeniyle önerilmez; emzirmede hekime danışılır.","Varfarin, flukloksasilin ve sakinleştirici ilaçlarla etkileşebilir."],"sik":["bas-agrisi","ates","dis-agrisi","adet-sancisi"],"kay":"https://www.ilacrehberi.com/v/vermidon-tablet-a104/kt/","dog":1},"kafur+mentol+okaliptus-ya .pdf","dog":1},"nepafenak.goz":{"ad":"Nepafenak","grup":"goz","alt":"NSAİİ göz damlası","kisa":"Göz ameliyatı sonrası ağrı ve iltihabı azaltır","ne":"Katarakt gibi göz ameliyatlarından sonra ağrı ve iltihabı azaltmak için kullanılır.","nasil":"%0,1 güçte günde 3 kez, %0,3 güçte günde 1 kez 1 damla damlatılır; kullanmadan önce şişe çalkalanır. Süreyi ve başlangıcı hekim belirler.","yan":["Gözde rahatsızlık","Göz kuruluğu","Bulanık görme","Gözde kaşıntı","Yabancı cisim hissi"],"dik":["Nepafenake, aspirine veya diğer NSAİİ ilaçlara alerjisi olanlar kullanmamalıdır.","Kanama bozukluğu olanlar ve astımlılar hekime danışmalıdır.","Gebeliğin son 3 ayında kullanılmaz.","Kontakt lens takılıyken kullanılmaz."],"sik":["goz-iltihabi"]},"netilmisin.goz":{"ad":"Netilmisin","grup":"goz","alt":"Aminoglikozid antibiyotikli göz damlası","kisa":"Netilmisinli antibiyotik göz damlası","ne":"Netilmisine duyarlı bakterilerin neden olduğu göz ve çevresindeki dış enfeksiyonların tedavisinde kullanılır.","nasil":"Her göze günde 3 kez 1–2 damla damlatılır. Çocuklarda yalnızca gerekirse ve sıkı hekim kontrolünde kullanılır. Tedavi süresini hekim belirler.","yan":["Geçici göz kızarıklığı","Hafif göz tahrişi","Göz kapağı şişliği","Kaşıntı ve kurdeşen"],"dik":["Netilmisin veya aminoglikozitlere alerjisi olanlar kullanmamalıdır.","Emzirmede kullanılmaz; gebelikte yalnızca zorunluysa hekim kontrolünde kullanılır.","Uzun süre kullanımda dirençli mikropların üremesi olabilir.","Tek dozluk kap açıldıktan sonra hemen kullanılır, artan atılır."],"sik":["goz-enfeksiyonu"],"kay":"https://titck.gov.tr/storage/Archive/2021/kubKtAttachments/NetiratekdozKT_b8cce6c6-d86e-43b7-bafa-f5433f8dc9ab.pdf","dog":1},"nifuroksazid.agiz":{"ad":"Nifuroksazid","grup":"bagirsak","alt":"Bağırsak antiseptiği","kisa":"Bakteriyel ishali tedavi eder","ne":"Ateşsiz, bakteriyel olduğu düşünülen akut ishalde bağırsak içinde etki eder. Sıvı kaybının giderilmesine ek olarak kullanılır.","nasil":"2 yaşından büyük çocuk: günde 3 kez 5 ına bağlı ağrıyı geçici olarak dindirir.","nasil":"Ağrıyan kulağa günde 2–3 kez 4 damla damlatılır. Şişe, kullanmadan önce ellerin arasında ısıtılır. Tedavi en çok 7 gün sürer; düzelme olmazsa hekime başvurulur. Dozu hekim belirler.","yan":["Kaşıntı, döküntü (yerel alerji)","Kulak kanalında kızarıklık","Ciddi alerji (şişme, kurdeşen)"],"dik":["Kulak zarı delik, ince ya da zedelenmişse kullanılmaz.","Kulak akıntısı olursa kullanım bırakılır.","Fenazon ya da lidokain alerjisi olanlar kullanmamalıdır.","G6PD eksikliği olan 3 aylıktan küçük bebeklerde dikkat gerekir.","Doping testinde yanlış pozitif sonuç verebilir."],"kay":"https://www.ilacrehberi.com/v/passear-4552-mg-1138-mg-ml-kulak-damlasi-1-adet-1-104e8/kt/","dog":1},{"ne":"D vitamini eksikliğinin tedavisi, idamesi ve önlenmesi için kullanılır.","nasil":"Günde 1 kez ağızdan. Yetişkinde önleme ve idame için günde 600–1500 IU; eksiklik tedavisinde günde 7000–10.000 IU ya da haftada 50.000 IU. Tek seferde 50.000 IU'dan fazlası önerilmez. Tedavi dozları 6–8 haftaya kadar kullanılır. Dozu hekim belirler.","yan":["İdrarla kalsiyum atılımında artış","Kanda kalsiyum yüksekliği","Kabızlık","Bulantı","Karın ağrısı","İshal"],"dik":["Kanda kalsiyum yüksekliği, D vitamini fazlalığı ya da kalsiyumlu böbrek taşı olanlar kullanmamalıdır.","D vitamini içeren başka ilaçlarla birlikte önerilmez.","Gebelikte önleme amacıyla günde 1000 IU'yu geçmemelidir.","Tiyazid grubu idrar söktürücülerle ve yüksek doz kalsiyumla hekime danışılmalıdır.","Epilepsi ilaçları ve rifampisin D vitamini etkisini azaltabilir."],"kay":"https://www.ilacrehberi.com/v/pediad-50000-iu15-ml-oral-damla-cozelti-1019a/kt/","dog":1},{"ne":"Çok güçlü bir kortizondur (kortikosteroid). Sedef (psoriazis) gibi iltihaplı ve kaşıntılı cilt hastalıklarında, saçlı deride de kullanılır.","nasil":"Genellikle günde 2 kez, etkilenen alana ince tabaka uygulanır. Kısa süre (en çok 2 hafta civarı) kullanılır; haftalık miktar sınırlıdır. Dozu hekim belirler.","yan":["Yanma ve batma","Kaşıntı","Cilt incelmesi","Kızarıklık"],"dik":["Yüze, koltuk altına ve kasıklara hekim önermedikçe sürülmez.","Uzun süre ve geniş alana kullanılmaz; cilt incelir.","Gözden uzak tutulur.","Gebelik ve emzirmede hekime danışılır.","Cilt enfeksiyonlarında kullanılmaz."]},{"ne":"Sedef ve tedavisi zor deri hastalıklarında iltihabı azaltır.","nasil":"Az miktarda, sabah ve akşam sürülür; iyileşince günde 1 kez veya daha seyrek. 2–4 haftada düzelme olmazsa hekime başvurulur. Dozu hekim belirler.","yan":["Uygulama yerinde kızarıklık","Kaşıntı","Yanma hissi","Döküntü","Alerjik temas reaksiyonu"],"dik":["12 yaş altı çocuklarda kullanılmaz.","Göze temas ettirilmez.","Gebelikte ve emzirmede hekime danışılır; en az miktarda, en kısa süre kullanılır.","Ritonavir veya itrakonazol kullananlar hekime söylemelidir.","Losyon yanıcıdır; sigara ve ateşten uzak durulur."],"kay":"https://titck.gov.tr/storage/Archive/2019/kubKtAttachments/KT.pdf_cfaf50fd-d600-4fb7-91fe-1be0cab74bf1.pdf","dog":1},{"ne":"Mide asidi salgısını azaltır; reflü ve ülser tedavisinde kullanılır.","nasil":"Yetişkin: günde 1 kez 20 mg, bütün yutulur (çiğnenmez). Dozu hekim belirler.","yan":["Baş ağrısı","İshal","Karın ağrısı","Gaz","Bulantı"],"dik":["Alerjisi olanlar kullanmaz.","Atazanavir ve ketokonazolün emilimini azaltır.","Uzun kullanımda hekim kontrolü gerekir.","Gebelik ve emzirmede kullanılmaz; hekime danışılır."]},{"ne":"Şizofreni, bipolar bozuklukta manik atak ve bazı davranış bozukluklarında kullanılır.","nasil":"Başlangıç genellikle günde 1–2 mg'dır; doz kademeli artırılır. Dozu hekim belirler.","yan":["Uyku hali","Baş dönmesi","Kilo alımı","Titreme veya kas sertliği","Baş ağrısı"],"dik":["Hekime danışmadan aniden bırakılmaz.","Uyku hali yapabilir, araç kullanırken dikkatli olunur.","Alkolle birlikte alınmaz.","Gebelik ve emzirmede hekime danışılır.","Yaşlı demans hastalarında dikkatli kullanılır."]},{"ne":"Omurga hastalıklarına ya da ameliyata bağlı ağrılı kas kasılmalarında ve sinirsel hastalıklara (MS, omurilik ve beyin hasarı vb.) bağlı artmış kas sertliğinde kullanılır.","nasil":"Ağrılı kas kasılmalarında genellikle günde 2 kez 1–2 tablet (2 mg); şiddetli ise gece yatarken 1–2 tablet ek doz. Sinirsel kas sertliğinde başlangıçta 1 tablet, günde en çok 3 kez; hekim kademeli artırır. Bir bardak suyla yutulur; çocuklarda önerilmez. Dozu hekim belirler.","yan":["Uyku hali, yorgunluk","Baş dönmesi","Ağız kuruluğu","Kas zayıflığı","Tansiyon düşmesi, bulantı"],"dik":["Ciddi karaciğer hastalığında ve fluvoksamin ya da siprofloksasin kullananlarda kullanılmaz.","Gebelikte hekim gerekli görmedikçe, emzirirken hiç kullanılmaz.","Uyuşukluk, sersemlik ve tansiyon düşüklüğü yapabilir; araç ve makine kullanılmaz, alkolden kaçınılır.","Tansiyon ilaçları, uyku ilaçları ve güçlü ağrı kesicilerle etkileşir.","Kalp hastalığında dikkatli kullanılır; 12 mg ve üzeri dozlarda karaciğer testleri izlenir."],"kay":"https://www.ilacrehberi.com/v/sirdalud-2mg-tablet-1034b/kt/","dog":1},{"ne":"Boğaz ve bademcik iltihabı, orta kulak, sinüs, bronş ve idrar yolu enfeksiyonları ile komplike olmayan belsoğukluğunda kullanılan antibiyotiktir.","nasil":"Yetişkin: günde 1 tablet (400 mg); isterseniz günlük doz 2 eşit parçaya bölünebilir. Besinlerle birlikte ya da yemekten kısa süre sonra alınır. Ağır böbrek yetmezliğinde doz azaltılır; dozu hekim belirler.","yan":["Midede dolgunluk, bulantı, kusma","Gaz, iştahsızlık","Baş dönmesi","Yumuşak dışkı, ishal","Dokunmada his kaybı"],"dik":["Sefiksime alerjisi olanlar kullanmaz.","Kolit geçirenler ve böbrek yetmezliği olanlar dikkatli kullanır.","Gebelikte ve emzirmede hekime danışılır.","Karbamazepin, probenesid ve varfarin gibi kan sulandırıcılarla etkileşir."],"kay":"https://www.ilacrehberi.com/v/suprax-400-mg-5-film-tablet-b420/kt/","dog":1},{"ne":"Astımda ve orta/ağır KOAH'ta belirtileri kontrol altına almak için kullanılır; kortizon (budesonid) ve uzun etkili bronş genişletici (formoterol) içerir. Hekim planına göre her gün ya da belirtilere göre gerektiğinde kullandırılır.","nasil":"Astımda genellikle günde 2 kez 1–2 inhalasyon; hekim günde 2 kez 4'e çıkarabilir. KOAH'ta günde 2 kez 2 inhalasyon. 24 saatte toplam 12 inhalasyondan fazla kullanılmaz. 6 yaş altında uygun değildir; sonrasında ağız çalkalanıp tükürülür. Dozu hekim belirler.","yan":["Çarpıntı, titreme","Ağızda pamukçuk","Boğaz ağrısı, öksürük","Ses boğuklaşması","Baş ağrısı","KOAH'ta akciğer enfeksiyonu"],"dik":["Etkin veya yardımcı maddeye alerjisi olanlar kullanmaz.","Şeker hastalığı, kalp, tiroid, yüksek tansiyon, akciğer enfeksiyonu veya düşük potasyumda hekime bildirilir.","Gebelikte ve emzirmede önce hekime danışılır.","Beta blokerler, digoksin, idrar söktürücüler, steroid ve teofilinle etkileşebilir.","Hekime danışmadan aniden bırakılmaz."],"kay":"https://www.ilacrehberi.com/v/symbicort-turbuhaler-16045-mcgdoz-inhalasyon-icin-a005/kt/","dog":1},{"ne":"Bakterilerin neden olduğu göz ve göz kapağı enfeksiyonlarında kullanılır.","nasil":"Enfekte göze (alt göz kapağı içine) günde 2–3 kez yaklaşık 1,5 cm şerit sürülür; ağır enfeksiyonda hekim daha sık önerebilir. Dozu hekim belirler.","yan":["Göz kapağında kaşıntı, şişme","Gözde kızarıklık","Gözde batma, yanma","Geçici bulanık görme"],"dik":["Tobramisine ve benzer antibiyotiklere alerjisi olanlar kullanmaz.","Merhem sonrası görme bulanıksa araç kullanılmaz.","Tüpün ucu göze ve ele dokundurulmaz.","Kontakt lens takılıyken kullanılmaz.","Hekimin önerdiğinden uzun kullanılmaz."]},{"ne":"Mantar enfeksiyonu ile birlikte iltihap, kızarıklık ve kaşıntı bulunan cilt hastalıklarında kullanılır.","nasil":"Etkilenen bölgeye günde 2 kez ince sürülür. Kortizon içerdiğinden hekimin söylediği süreden uzun kullanılmaz.","yan":["Yanma","Kaşıntı","Deride kızarıklık","Deride incelme (uzun kullanımda)"],"dik":["Suçiçeği, uçuk gibi viral cilt hastalıklarında kullanılmaz.","Göze sürülmez.","Yüze ve geniş alana uzun süre uygulanmaz.","Gebelik ve emzirmede hekime danışılır."]},{"ne":"Astım ve KOAH'ta ani nefes darlığı, hırıltı ve göğüs sıkışmasını hızla gideren kurtarıcı ilaçtır.","nasil":"Yetişkinde gerektiğinde 1–2 püskürtme (100–200 mcg); günde en çok 4 kez. Kullanmadan önce çalkalanır; uzun süre kullanılmadıysa ilk kullanımda boşa bir püskürtme yapılır. Dozu hekim belirler.","yan":["El titremesi","Çarpıntı","Baş ağrısı","Kas krampı","Kanda potasyum düşmesi"],"dik":["Kullanım ihtiyacı artıyorsa astım kötüleşiyor olabilir; hekime gidilir.","Kalp hastalığı, tiroid fazlalığı ve şeker hastalığında dikkatli kullanılır.","Beta bloker tansiyon ilaçları etkisini azaltır.","Basınçlı kap: ısıdan korunur, delinmez ve ateşe atılmaz."]},{"ne":"Göz yüzeyindeki damarları daraltır; toz, duman ve yorgunluğa bağlı hafif göz kızarıklığı ve tahrişini giderir.","nasil":"Her göze günde 2–3 kez 1–2 damla damlatılır. Kısa süreli kullanılır; en çok 3 gün civarı sürdürülür. Dozu hekim belirler.","yan":["Göz bebeğinde genişleme","Geçici yanma","Bulanık görme","Çarpıntı"],"dik":["Dar açılı glokomu olanlar kullanmamalıdır.","Uzun süre kullanımda kızarıklık artabilir.","Yüksek tansiyon, kalp hastalığı ve MAO inhibitörü kullananlar hekime danışmalıdır.","Küçük çocuklarda hekime danışılır.","Şikâyet sürerse hekime başvurulur."]},{"ne":"Prostat büyümesine bağlı idrar yapma güçlüğünü azaltır.","nasil":"Günde 1 kez 10 mg uzatılmış salımlı tablet, yemekten hemen sonra, bütün yutulur; ezilmez ve çiğnenmez.","yan":["Baş dönmesi","Baş ağrısı","Halsizlik","Tansiyon düşmesi"],"dik":["Ayağa kalkınca baş dönmesi yapabilir.","Ağır karaciğer yetmezliğinde kullanılmaz.","Göz ameliyatı öncesi hekime söylenmelidir.","Kalp ritim bozukluğu olanlar hekime danışmalıdır."]},{"ne":"Vücutta çinko eksikliği olduğunda eksiği tamamlar.","nasil":"Genellikle günde 1 kapsül, yemekle birlikte. Dozu hekim belirler.","yan":["Bulantı","Mide rahatsızlığı","Metalik tat"],"dik":["Aç karnına alınırsa mideyi bozabilir.","Tetrasiklin ve kinolon grubu antibiyotiklerle aralarına 2–3 saat konur.","Uzun süre yüksek doz bakır eksikliği yapabilir."]},{"ne" /* ---------- küçük parçalar ---------- */
function hue(u) { const g = G[grupOf(u)]; return g ? g.h : 160; }
const TH = V.kucuk;
// küçük resim: raftaki gerçek kutu; yoksa grubun simgesi
function kucuk(u, px) {
  px = px || 52;
  if (u.t != null && TH) {
    const s = Math.floor(u.t / TH.n), i = u.t % TH.n, c = i % TH.c, r = Math.floor(i / TH.c);
    return `<span class="th" style="width:${px}px;height:${px}px;background-image:url(img/m${s}.jpg${KV});background-position:${-c * px}px ${-r * px}px;background-size:${TH.c * px}px auto"></span>`;
  }
  return `<span class="th ico" style="width:${px}px;height:${px}px;--h:${hue(u)}">${GI[grupOf(u)] || GI.diger}</span>`;
}
function urunRow(u) {
  const m = u.mol && M[u.mol];
  const sub = m ? m.ad + (u.form ? ', ' + u.form : '') : (u.ne || KAT[u.kat] || '');
  const rx = u.rec && u.rec !== 'n' ? `<span class="rx ${u.rec}">${RX[u.rec]}</span>` : '';
  return `<button class="row" data-a="urun" data-id="${u.id}">${kucuk(u)}<span class="txt"><span class="nm">${esc(u.ad)}</span><span class="sub">${esc(sub)}</span></span><span class="end">${rx}${ic.chev}</span></button>`;
}
const rows = list => `<div class="rows">${list.map(urunRow).join('')}</div>`;
function kesEl(u, maxH, maxW) {
  if (!u.kes || !V.kesit) return '';
  const [s, x, y, w, h] = u.kes; const sh = V.kesit[s]; if (!sh) return '';
  const k = Math.min(maxH / h, maxW / w);
  return `<span class="kes" style="width:${(w * k).toFixed(1)}px;height:${(h * k).toFixed(1)}px"><img loading="lazy" decoding="async" alt="" src="img/k${s}.jpg${KV}" style="width:${(sh[0] * k).toFixed(1)}px;height:${(sh[1] * k).toFixed(1)}px;transform:translate(${(-x * k).toFixed(1)}px,${(-y * k).toFixed(1)}px)"></span>`;
}
function molBlok(id, list) {
  const m = M[id];
  return `<div class="molblk"><div class="molhd"><b>${esc(m.ad)}</b><span>${esc(m.kisa || '')}</span></div>${rows(list || molUrun[id] || [])}</div>`;
}
function yerYazi(y) { const f = F[y[0]]; return (f ? f.ad : 'Raf') + (y[5] ? `, üstten ${y[5]}. raf` : ''); }

/* ---------- arama ---------- */
const tm = (t, kt) => (kt.startsWith(t) && t.length >= 3) || (t.startsWith(kt) && (t.length === kt.length || (kt.length >= 5 ? t.length - kt.length <= 5 : EK.test(t.slice(kt.length)))));
function ara(q) {
  const nq = norm(q); if (!nq) return null;
  const qt = nq.split(' '); const fq = fon(qt[0]);
  const res = [];
  for (const u of V.urun) {
    let sc = 0;
    if (u._n.startsWith(nq)) sc = 100;
    else if (qt.every(t => u._t.some(w => w.startsWith(t)))) sc = 85;
    else if (u._n.includes(nq)) sc = 70;
    else if (u._m && (u._m.startsWith(nq) || qt.every(t => u._m.split(' ').some(w => w.startsWith(t))))) sc = 60;
    else if (qt.length === 1 && fq.length >= 3) {
      for (const w of u._f) {
        if (w.startsWith(fq)) { sc = Math.max(sc, 66); continue; }
        if (fq.length < 4) continue;
        const max = fq.length >= 7 ? 2 : 1;
        const d = Math.min(lev(fq, w, max), lev(fq, w.slice(0, fq.length), max));
        if (d <= max) sc = Math.max(sc, 52 - d * 6);
      }
    }
    if (sc) res.push([sc, u]);
  }
  res.sort((a, b) => b[0] - a[0] || byName(a[1], b[1]));
  const siks = V.sik.filter(s => s._k.some(k => k.every(kt => qt.some(t => tm(t, kt)))));
  const grups = V.grup.filter(g => grupUrun[g.id] && norm(g.ad).split(' ').some(w => qt.some(t => t.length >= 3 && w.startsWith(t))));
  return { urun: res.map(r => r[1]), exact: res.filter(r => r[0] >= 60).length, siks, grups };
}

/* ---------- ekran: Ana sayfa ve arama ---------- */
function gununIlaci() {
  const l = ilaclar.filter(u => u.kes); if (!l.length) return null;
  const d = new Date(); const n = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  return l[(n * 7919) % l.length];
}
function sikMols(id) { return Object.keys(molUrun).filter(k => (M[k].sik || []).includes(id)); }
function sikVar(id) { return sikMols(id).length > 0; }
function vAra() {
  if (S.q.trim()) return vSonuc();
  const top = S.nav[S.nav.length - 1];
  if (top && top.t === 'grup') return vGrup(top.id);
  if (top && top.t === 'sik') return vSik(top.id);
  let h = updBanner() + kurBanner();
  const nsik = V.sik.filter(s => sikVar(s.id)).length;
  h += `<button class="pick" data-a="secac"><span class="pi">${ic.nabiz}</span><span class="pt"><b>Şikâyete göre bul</b><span>${nsik} şikâyet arasından seç ya da ara</span></span>${ic.down}</button>`;
  const g = gununIlaci();
  if (g) {
    const m = M[g.mol];
    h += `<button class="hero" data-a="urun" data-id="${g.id}" style="--h:${hue(g)}"><span class="ht"><span class="hl">Günün ilacı</span><span class="hn">${esc(g.ad)}</span><span class="hsub">${esc(m.ad)}: ${esc(m.kisa)}</span></span>${kesEl(g, 104, 112)}</button>`;
  }
  const nf = Object.keys(D.fav).length;
  const kisa = [
    ['gruplar', ic.izgara, 'İlaç grupları', V.grup.filter(x => grupUrun[x.id]).length + ' grup, ' + V.urun.length + ' ürün', 212],
    ['raflar', ic.raf, 'Raflar', V.foto.length + ' dolap fotoğrafı', 168],
    ['oyun', ic.oyun, 'Oyun', D.puan ? D.puan + ' puan' : 'Soru çöz, öğren', 32],
    ['defterim', ic.defter, 'Defterim', nf ? nf + ' işaretli ilaç' : 'İşaretlediklerin, ilerlemen', 276]
  ];
  h += `<div class="tiles">${kisa.map(k => `<button class="tile" data-a="git" data-id="${k[0]}" style="--h:${k[4]}"><span class="ti">${k[1]}</span><b>${k[2]}</b><span>${k[3]}</span></button>`).join('')}</div>`;
  const son = D.son.map(id => U[id]).filter(Boolean).slice(0, 5);
  if (son.length) h += `<section class="sec"><h2>Son baktıkların</h2>${rows(son)}</section>`;
  return h;
}
function vSonuc() {
  const r = ara(S.q);
  if (!r) return '';
  let h = '';
  const sl = r.siks.filter(s => sikVar(s.id));
  if (sl.length) h += `<section class="sec"><h2>Şikâyet</h2><div class="chips">${sl.map(s => `<button class="chip" data-a="sik" data-id="${s.id}">${esc(s.ad)}</button>`).join('')}</div></section>`;
  if (r.grups.length) h += `<section class="sec"><h2>Grup</h2><div class="chips">${r.grups.map(g => `<button class="chip" data-a="grup" data-id="${g.id}">${esc(g.ad)}</button>`).join('')}</div></section>`;
  if (r.urun.length) {
    const fuzzy = r.exact === 0;
    h += `<section class="sec"><h2>${fuzzy ? 'Bunu mu demek istedin?' : 'Ürünler'} <small>${r.urun.length} sonuç</small></h2>${rows(r.urun.slice(0, 60))}</section>`;
  } else if (!sl.length && !r.grups.length) {
    h += `<div class="empty"><b>“${esc(S.q.trim())}” bulunamadı</b>Adın ilk birkaç harfini ya da etken maddeyi yazmayı dene. Raf fotoğraflarında adı okunmayan kutular listede yok.</div>`;
  }
  return h;
}
function vGrup(id) {
  const g = G[id]; const list = grupUrun[id] || [];
  let h = `<div class="page-h" style="--h:${g.h}"><span class="ti">${GI[id] || GI.diger}</span><p><b>${list.length} ürün</b> rafta</p></div>`;
  const mols = Object.keys(molUrun).filter(k => M[k].grup === id);
  if (mols.length) {
    const alts = {};
    mols.forEach(k => { const a = M[k].alt || ''; (alts[a] = alts[a] || []).push(k); });
    Object.keys(alts).sort((a, b) => a.localeCompare(b, 'tr')).forEach(a => {
      alts[a].sort((x, y) => M[x].ad.localeCompare(M[y].ad, 'tr'));

function vSik(id) {

  let h = `<div class="page-h" style="--h:356"><span class="ti">${ic.nabiz}</span><p>Bu şikâyette kullanılan, rafta bulunan <b>${mols.length} etken madde</b>. Reçeteli olanlara hekim karar verir.</p></div>`;

function secListe(q) {

});
