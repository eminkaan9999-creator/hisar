<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120e1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaan & Kardelen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="ikon-192.png">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Kaan &amp; Kardelen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Tam ekran WebGL + üstte sinematik DOM katmanı. Gün batımı altını ve gece moru, tek tema. */
:root{
  --gece:#120e1f; --panel:rgba(18,14,31,.72); --altin:#ffcf8a; --gul:#ff9fb4; --krem:#fff6ea; --sis:#cbbfdc;
  --f-serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--gece);color:var(--krem);font-family:var(--f-ui);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui *{box-sizing:border-box}
button{font-family:var(--f-ui);color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--altin);outline-offset:3px}
.tam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px));pointer-events:auto}
.perde{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.perde.kapali{opacity:1}
h1,h2{font-family:var(--f-serif);font-weight:500;margin:0;line-height:1;text-wrap:balance}
.logo{font-size:clamp(52px,14vw,96px);letter-spacing:.01em;text-shadow:0 2px 30px #0009}
.logo i{color:var(--gul);font-style:italic}
.ust-yazi{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--altin)}
.yuzler{display:flex;align-items:center;gap:0}
.yuzler img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--krem);box-shadow:0 8px 24px #0008}
.yuzler img+img{margin-left:-14px}
.btn{pointer-events:auto;font-weight:700;font-size:17px;letter-spacing:.02em;padding:14px 28px;border-radius:999px;background:linear-gradient(180deg,#ffd9a3,#f3a96b);color:#3a1d0a;box-shadow:0 10px 30px #f3a96b44;min-width:230px}
.btn.ince{background:rgba(255,255,255,.08);color:var(--krem);border:1px solid rgba(255,255,255,.22);box-shadow:none;backdrop-filter:blur(6px)}
.btn.kucuk{min-width:0;padding:10px 18px;font-size:15px}
.bolumler{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}
.bolum{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px;border-radius:16px;background:rgba(18,14,31,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.menu-ort{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,31,.65) 0%,rgba(18,14,31,.15) 32%,rgba(18,14,31,0) 50%,rgba(18,14,31,.55) 75%,rgba(18,14,31,.85) 100%);pointer-events:none}
.bolum .no{font-family:var(--f-serif);font-size:30px;color:var(--altin);width:26px}
.bolum b{display:block;font-family:var(--f-serif);font-size:23px;font-weight:600;line-height:1.05}
.bolum small{color:var(--sis);font-size:13px}
.bolum.kilit{opacity:.45}
.bolum .tik{margin-left:auto;color:var(--gul);font-size:18px}
.kart-baslik{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 190px);background:linear-gradient(transparent 55%,rgba(0,0,0,.45));gap:10px;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s}
.kart-baslik.gor{opacity:1}
.kart-baslik h2{font-size:clamp(46px,12vw,90px);text-shadow:0 4px 40px #000c}
.kart-baslik p{margin:0;font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--krem);text-shadow:0 2px 16px #000}
.hedef{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600;white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis;transition:opacity .5s}
.menu-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.14);font-size:18px;pointer-events:auto}
.ses-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.14);font-size:17px;pointer-events:auto}
.joy{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none;backdrop-filter:blur(3px)}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,246,234,.75);box-shadow:0 4px 14px #0006}
.aksiyon{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);min-width:96px;height:96px;padding:0 18px;border-radius:999px;background:radial-gradient(circle at 40% 35%,#ffd9a3,#f08f6a);color:#3a1d0a;font-weight:700;font-size:16px;pointer-events:auto;touch-action:none;box-shadow:0 10px 30px #f08f6a55;transition:transform .1s,opacity .3s}
.aksiyon:active,.aksiyon.bas{transform:scale(.94)}
.aksiyon[hidden]{display:none}
.alt-yazi{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);width:min(560px,calc(100% - 40px));text-align:center;font-family:var(--f-serif);font-size:24px;line-height:1.3;text-shadow:0 2px 16px #000;opacity:0;transition:opacity 1.2s;pointer-events:none}
.alt-yazi.gor{opacity:1}
.ritim{position:absolute;left:50%;top:46%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none}
.ritim .hedefh{position:absolute;inset:40px;border-radius:50%;border:3px solid var(--gul);box-shadow:0 0 20px var(--gul)}
.ritim .daire{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid var(--altin);transform:translate(-50%,-50%)}
.son-kart{background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:380px;width:100%}
.son-kart p{margin:0;color:var(--sis);font-size:16px;line-height:1.4}
.yukleniyor{font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--sis)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.yukleme{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 110%,#5a2f4a 0%,var(--gece) 62%);transition:opacity .8s ease}
.yukleme.bitti{opacity:0;pointer-events:none}
.yk-ic{width:min(78vw,320px);text-align:center}
.yk-baslik{font-family:var(--f-serif);font-size:clamp(30px,8vw,40px);font-weight:500;letter-spacing:.01em;margin-bottom:26px}
.yk-baslik span{color:var(--gul);font-style:italic}
.yk-cubuk{height:3px;border-radius:3px;background:rgba(255,246,234,.14);overflow:hidden}
.yk-cubuk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gul),var(--altin));transition:width .3s ease}
.yk-yazi{margin-top:14px;font-size:13px;color:var(--sis);letter-spacing:.02em}
.dk{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(620px,calc(100% - 24px));pointer-events:auto;z-index:5}
.dk-ic{position:relative;background:linear-gradient(180deg,rgba(24,18,38,.86),rgba(14,10,26,.92));border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:16px 20px 18px;backdrop-filter:blur(10px);box-shadow:0 16px 40px #0008;min-height:92px}
.dk-ad{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.dk-ad[data-kim="kaan"]{color:#9fd0ff}.dk-ad[data-kim="kardelen"]{color:var(--gul)}
.dk-metin{margin:0;font-family:var(--f-serif);font-size:22px;line-height:1.32;color:var(--krem);min-height:58px}
.dk.anlati .dk-ic{background:linear-gradient(180deg,rgba(10,8,16,.55),rgba(10,8,16,.72));border-color:rgba(255,255,255,.08)}
.dk.anlati .dk-metin{font-style:italic;text-align:center;color:#f3e7d6}
.dk-ileri{position:absolute;right:16px;bottom:10px;color:var(--altin);font-size:16px;transition:opacity .3s;animation:yanson 1.2s infinite}
@keyframes yanson{50%{transform:translateX(3px)}}
.dk-sec{display:flex;flex-direction:column;gap:8px}
.dk-sec:not(:empty){margin-top:2px}
.dk-btn{pointer-events:auto;text-align:left;font-family:var(--f-serif);font-size:20px;padding:11px 16px;border-radius:14px;background:rgba(159,208,255,.1);border:1px solid rgba(159,208,255,.35);color:var(--krem)}
.dk-btn::before{content:"› ";color:#9fd0ff}
.qte{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 60px);pointer-events:none}
.qte-btn{pointer-events:auto;animation:nabiz 1s infinite}
@keyframes nabiz{50%{transform:scale(1.06);box-shadow:0 0 40px #f3a96b99}}
.flas{position:absolute;inset:0;background:#fff;animation:flas .9s ease-out forwards;pointer-events:none}
@keyframes flas{from{opacity:.95}to{opacity:0}}
.polaroid{background:#fbf8f2;padding:10px 10px 0;border-radius:4px;box-shadow:0 18px 40px #000a;display:flex;flex-direction:column;align-items:center;margin:0}
.polaroid img{display:block;width:100%;border-radius:2px}
.polaroid span,.polaroid figcaption{font-family:var(--f-serif);font-style:italic;color:#3a2a2a;font-size:17px;padding:8px 4px 10px;text-align:center}
.katman-polaroid,.polaroid:not(.sabit){position:absolute;left:50%;top:50%;width:min(64vw,300px);transform:translate(-50%,-40%) rotate(-4deg) scale(.9);opacity:0;transition:all .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.polaroid.gor{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.album-ekran{background:rgba(10,8,18,.9);backdrop-filter:blur(8px);justify-content:flex-start;overflow:auto}
.album-ic{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(760px,100%);padding-bottom:30px}
.album-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;width:100%;margin:10px 0 16px}
.album-izgara .polaroid:nth-child(odd){transform:rotate(-1.5deg)}.album-izgara .polaroid:nth-child(even){transform:rotate(1.2deg)}
.album-izgara .bos{grid-column:1/-1;color:var(--sis)}
.menu-alt{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.menu .bolumler{gap:7px}.menu .bolum{padding:9px 14px}.menu .bolum b{font-size:21px}
.kur{position:relative;margin-top:6px;width:min(380px,100%);text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:rgba(255,246,234,.95);color:#2a1d18;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px #0007;pointer-events:auto;font-size:14px;line-height:1.35}
.kur b{grid-column:1}.kur span{grid-column:1}.kur i{font-style:normal;font-weight:700}
.kur button{grid-row:1/3;grid-column:2;align-self:center;width:32px;height:32px;border-radius:50%;background:#0001;color:#2a1d18}
.mektup p{color:var(--krem);font-family:var(--f-serif);font-size:20px;line-height:1.4}
.mektup .imza{font-style:italic;color:var(--gul)}
.telefon-ekran{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);width:min(38vw,190px);aspect-ratio:9/16;border-radius:22px;border:3px solid #15151a;box-shadow:0 0 0 2px #444,0 20px 40px #000a;pointer-events:none}
.telefon-ekran span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;letter-spacing:.1em;color:#fff;text-shadow:0 1px 4px #000}
.sinyal{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;align-items:flex-end;gap:3px;padding:8px 10px;border-radius:12px;background:var(--panel);pointer-events:none}
.sinyal i{width:6px;background:#fff3;border-radius:2px}.sinyal i.dolu{background:#9fffb0}
.vizor{position:absolute;inset:0;pointer-events:none}
.vizor i{position:absolute;width:42px;height:42px;border:2px solid #fffc}
.vizor .k1{left:8%;top:12%;border-right:0;border-bottom:0}.vizor .k2{right:8%;top:12%;border-left:0;border-bottom:0}.vizor .k3{left:8%;bottom:22%;border-right:0;border-top:0}.vizor .k4{right:8%;bottom:22%;border-left:0;border-top:0}
.netlik{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);transform:translateX(-50%);width:min(70vw,300px);height:10px;border-radius:6px;background:linear-gradient(90deg,#ff7a7a55,#ffd27a55 30%,#7dff9a 44%,#7dff9a 56%,#ffd27a55 70%,#ff7a7a55)}
.netlik span{position:absolute;top:-6px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 8px #000}
.deklansor{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);min-width:0;width:74px;height:74px;padding:0;font-size:28px;pointer-events:auto}
.vizor small{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 146px);text-align:center;color:#fff;text-shadow:0 1px 6px #000;font-size:13px;letter-spacing:.08em}
.guncel-band{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-radius:16px;background:rgba(18,14,31,.92);border:1px solid rgba(255,207,138,.35);box-shadow:0 10px 30px #0008;color:var(--krem);transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:auto;font-family:var(--f-ui)}
.guncel-band.gor{transform:none}
.guncel-band span{flex:1;display:flex;flex-direction:column;gap:2px}
.guncel-band small{color:var(--sis);font-size:12px}
.guncel-band .kapat{width:32px;height:32px;border-radius:50%;color:var(--sis);background:rgba(255,255,255,.06)}
.guncel-perde{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,8,18,.88);color:var(--krem);font-family:var(--f-ui);text-align:center}
.guncel-perde div{display:flex;flex-direction:column;gap:6px}
.guncel-perde b{font-family:var(--f-serif);font-size:30px;font-weight:500}
.guncel-perde small{color:var(--sis);font-size:13px}
.tost{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,20px);opacity:0;transition:all .35s ease;padding:10px 16px;border-radius:999px;background:rgba(18,14,31,.92);color:var(--krem);font:500 14px var(--f-ui);border:1px solid rgba(255,255,255,.12);pointer-events:none}
.tost.gor{opacity:1;transform:translate(-50%,0)}
.dm{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(92vw,380px);height:min(66vh,560px);display:flex;flex-direction:column;border-radius:30px;background:#0f0d16;border:3px solid #26222f;box-shadow:0 0 0 2px #444,0 30px 60px #000c;overflow:hidden;pointer-events:auto;font-family:var(--f-ui);animation:dmAc .35s cubic-bezier(.2,.8,.2,1)}
.dm-ust{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid #ffffff14;background:#15121f}
.dm-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-ui);color:#fff;background:linear-gradient(135deg,#f9a8c0,#b18cff);box-shadow:0 0 0 2px #15121f,0 0 0 4px #f58fb0}
.dm-ad{display:flex;flex-direction:column;line-height:1.2}.dm-ad b{font-size:15px;color:#fff}.dm-ad small{font-size:11px;color:#9a93ad}
.dm-akis{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:7px;scroll-behavior:smooth}
.dm-bal{max-width:80%;padding:9px 13px;border-radius:19px;font-size:15px;line-height:1.35;color:#fff;animation:dmGel .25s ease;word-wrap:break-word}
.dm-bal.ben{align-self:flex-end;background:linear-gradient(135deg,#6f5cff,#c04bd6);border-bottom-right-radius:6px}
.dm-bal.o{align-self:flex-start;background:#2a2635;border-bottom-left-radius:6px}
.dm-zaman{align-self:center;font-size:11px;color:#8a839c;margin:6px 0 2px}
.dm-gor{align-self:flex-end;font-size:11px;color:#8a839c;margin-top:-3px}
.dm-yaziyor{align-self:flex-start;background:#2a2635;border-radius:18px;padding:11px 14px;display:flex;gap:4px}
.dm-yaziyor i{width:7px;height:7px;border-radius:50%;background:#bdb6cf;animation:dmNokta 1s infinite}
.dm-yaziyor i:nth-child(2){animation-delay:.15s}.dm-yaziyor i:nth-child(3){animation-delay:.3s}
.dm-sec{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid #ffffff14;background:#15121f}
.dm-btn{padding:12px 14px;border-radius:14px;background:#262233;color:#fff;font:500 15px var(--f-ui);text-align:left;border:1px solid #ffffff1f}
.dm-btn:active{background:#3a3450}
@keyframes dmAc{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes dmGel{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dmNokta{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.tezahurat{position:absolute;left:0;right:0;top:15%;text-align:center;font:800 25px/1.12 Georgia,"Times New Roman",serif;color:#fff6dc;letter-spacing:.05em;text-shadow:0 0 22px rgba(255,190,90,.8),0 2px 5px rgba(0,0,0,.7);pointer-events:none;padding:0 14px;animation:tezGel .45s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .5s,transform .5s}
.tezahurat.t2{font-size:31px;top:13%}.tezahurat.t3{font-size:38px;top:11%;color:#fff1c2;text-shadow:0 0 30px rgba(255,170,60,.95),0 0 60px rgba(255,120,40,.5),0 2px 6px rgba(0,0,0,.7)}
.tezahurat.git{opacity:0;transform:scale(1.12)}
@keyframes tezGel{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

/* simülatör paneli (çay, balon, kamera, dans...) */
.sim{position:absolute;left:0;right:0;bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;pointer-events:none;background:linear-gradient(180deg,rgba(10,8,16,0),rgba(10,8,16,.78) 32%)}
.sim .baslik{font:700 13px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#ffd9a3;text-align:center}
.sim .ipucu{font:500 15px/1.35 var(--f-ui);color:#fff3e0;text-align:center;min-height:20px}
.sim .satir{display:flex;gap:10px;align-items:center;justify-content:center}
.sim .olcek{flex:1;max-width:340px}
.sim .olcek small{display:flex;justify-content:space-between;font:600 11px var(--f-ui);color:rgba(255,243,224,.75);margin-bottom:4px}
.sim .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}

.ani{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px 14px 13px;margin:12px 0}
.ani:before{content:"❤";position:absolute;left:-25px;top:13px;font-size:13px;color:#f39fb6;text-shadow:0 0 8px #f39fb6aa}
.ani .tarih{font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#ffd9a3}

.selfie .alt{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);text-align:center;color:#fff;text-shadow:0 1px 6px #000;font:500 13px var(--f-ui);letter-spacing:.04em}
.selfie .izg{position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(33.3% - 1px),rgba(255,255,255,.35) 33.3%,transparent calc(33.3% + 1px),transparent calc(66.6% - 1px),rgba(255,255,255,.35) 66.6%,transparent calc(66.6% + 1px)),linear-gradient(180deg,transparent calc(33.3% - 1px),rgba(255,255,255,.35) 33.3%,transparent calc(33.3% + 1px),transparent calc(66.6% - 1px),rgba(255,255,255,.35) 66.6%,transparent calc(66.6% + 1px))}

function gokyuzuYap(a){
  const m=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ ust:{value:renk(a.ust)}, ufuk:{value:renk(a.ufuk)}, alt:{value:renk(a.alt||a.ufuk)}, gunes:{value:a.gunesYon.clone().normalize()}, gRenk:{value:renk(a.gunesRenk||"#ffdca8")}, yildiz:{value:a.yildiz||0}, zaman:{value:0}, parlak:{value:a.parlak||1} },
    vertexShader:`varying vec3 vY; void main(){ vY=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 ust,ufuk,alt,gunes,gRenk; uniform float yildiz,zaman,parlak; varying vec3 vY;
      float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){ vec3 d=normalize(vY); float h=d.y;
        vec3 c = h>0.0 ? mix(ufuk,ust,pow(h,0.55)) : mix(ufuk,alt,pow(-h,0.4));
        float s=max(dot(d,normalize(gunes)),0.0);
        c += gRenk*pow(s,6.0)*0.55*parlak + gRenk*pow(s,60.0)*0.8*parlak + vec3(1.0,0.95,0.85)*smoothstep(0.9993,0.9997,s)*3.0*parlak;
        if(yildiz>0.0 && h>0.02){ vec2 u=vec2(atan(d.z,d.x)*80.0, h*160.0); vec2 g=floor(u); float r=h21(g); float tw=0.6+0.4*sin(zaman*2.0+r*30.0);
          float st=step(0.985,r)*smoothstep(0.45,0.0,length(fract(u)-0.5))*tw; c+=vec3(st)*yildiz*smoothstep(0.02,0.25,h); }
        gl_FragColor=vec4(c,1.0); }`
  });
  const g=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),m); g.renderOrder=-1; return g;
}

      ciz(Math.random()*S,Math.random()*S,rnd(3,9),-Math.PI/2+rnd(-.5,.5),"#"+col.getHexString(),rnd(.8,1.7)); }
    for(let i=0;i<500;i++){ x.fillStyle=`rgba(70,58,40,${rnd(.15,.35)})`; x.fillRect(Math.random()*S,Math.random()*S,rnd(1,2.5),rnd(1,2.5)); }

function yaprakDoku(tur){
  const anah="d_"+tur; if(BITKI[anah]) return BITKI[anah];
  const S=512, H=S/2; const c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d"); const R=_rng(tur.length*977+13);
  const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
  const yaprak=(cx,cy,uz,en,aci,renk,damar)=>{ x.save(); x.translate(cx,cy); x.rotate(aci); x.fillStyle=renk; x.beginPath(); x.moveTo(-uz,0); x.quadraticCurveTo(0,-en*1.15,uz,0); x.quadraticCurveTo(0,en*1.15,-uz,0); x.fill();
    if(damar){ x.strokeStyle=damar; x.lineWidth=.8; x.beginPath(); x.moveTo(-uz*.9,0); x.lineTo(uz*.85,0); x.stroke(); } x.restore(); };
  for(let q=0;q<4;q++){ const ox=(q%2)*H, oy=(q>>1)*H, cx0=ox+H/2, cy0=oy+H/2;
    x.save(); x.beginPath(); x.rect(ox+2,oy+2,H-4,H-4); x.clip();
    const icinde=()=>{ for(;;){ const a=R()*Math.PI*2, r=Math.sqrt(R())*H*.43; const px=cx0+Math.cos(a)*r, py=cy0+Math.sin(a)*r*.92; return [px,py,r/(H*.43)]; } };
    if(tur==="cam"){ // iğne tutamları: dal üzerinde ışınsal iğneler
      x.strokeStyle=hsl(25,35,22); x.lineWidth=3; x.beginPath(); x.moveTo(ox+10,cy0+R()*20-10); x.quadraticCurveTo(cx0,cy0-8,ox+H-12,cy0+R()*30-15); x.stroke();
      for(let k=0;k<34;k++){ const t=R(); const bx=ox+14+t*(H-30), by=cy0+(R()-.5)*34; const n=30;

    if(k==="michelle"){ const s=g.animations.find(x=>x.name==="SambaDance"); if(s){ const c=s.clone(); c.name="samba";
      if(q0){ const q=new THREE.Quaternion(), p=new THREE.Vector3();
        for(const t of c.tracks){ if(/Hips\.quaternion$/.test(t.name)){ const v=t.values; for(let i=0;i<v.length;i+=4){ q.fromArray(v,i).premultiply(q0); q.toArray(v,i); } }
          else if(/Hips\.position$/.test(t.name)){ const v=t.values; for(let i=0;i<v.length;i+=3){ p.fromArray(v,i).applyQuaternion(q0); p.toArray(v,i); } } }
        c.tracks=c.tracks.filter(t=>!/^(Character|Armature|Scene)\./.test(t.name)); }
      klipler.push(c); } }
    // Kardelen: temizlenmiş, güzelleştirilmiş yüz dokusu (lekesiz cilt, hafif makyaj)
    if(k==="kardelen"){ const yukleD=(ad,srgb)=>new Promise(r=>new THREE.TextureLoader().load(kok+ad,t=>{ t.flipY=false; if(srgb) t.encoding=THREE.sRGBEncoding; t.anisotropy=4; t.__kalici=true; r(t); },undefined,()=>r(null)));
      const yb=null, yn=await yukleD("kardelen_bas_n.png",false); // renk dokusu kardelenGuzellestir'de (kardelen_yuz.jpg)
      sahne.traverse(o=>{ if(o.isMesh&&o.material&&o.material.name==="AvatarHead"){ if(yb) o.material.map=yb; if(yn) o.material.normalMap=yn; o.material.needsUpdate=true; } }); }
    if(k==="kardelen") await kardelenGuzellestir(sahne);
    AVATAR[k]={sahne, olcek, kalca:kalca*olcek, klipler, onek:k==="michelle"?"mixamorig":""};
  };
  await Promise.all([...ana.map(k=>hazirla(k,10)), ...kalab.map(k=>hazirla(k,3).catch(e=>console.warn("kalabalık yüklenemedi",k,e))), sinifMaskeleriniCoz()]);
}


/* ---------- Kardelen: güzelleştirilmiş yüz dokusu, kahverengi gözler, uzun dalgalı saç (fotoğraftaki gibi) ---------- */
function _dokuYukle(ad){ return new Promise(r=>new THREE.TextureLoader().load(MODEL_KOK+ad,t=>{ t.flipY=false; t.encoding=THREE.sRGBEncoding; t.anisotropy=4; t.__kalici=true; r(t); },undefined,()=>r(null))); }
// bağlama uzayında gövde kesiti (y dilimlerinde ön/arka/yan), kollar hariç
function _govdeKesit(sahne){

  sahne.traverse(o=>{ if(!o.isSkinnedMesh) return; const n=o.material&&o.material.name; if(n!=="AvatarBody"&&n!=="outfit") return;
    const g=o.geometry, P=g.attributes.position, si=g.attributes.skinIndex, sw=g.attributes.skinWeight; const kol=o.skeleton.bones.map(b=>/(Arm|Hand)/.test(b.name));
    for(let i=0;i<P.count;i++){ let kw=0; if(kol[si.getX(i)]) kw+=sw.getX(i); if(kol[si.getY(i)]) kw+=sw.getY(i); if(kol[si.getZ(i)]) kw+=sw.getZ(i); if(kol[si.getW(i)]) kw+=sw.getW(i); if(kw>.3) continue;
      const x=P.getX(i), y=P.getY(i), z=P.getZ(i); if(Math.abs(x)>.24) continue; const j=Math.round((y-Y0)/AD); if(j<0||j>=N) continue;
      if(z>on[j]) on[j]=z; if(z<arka[j]) arka[j]=z; if(Math.abs(x)>gen[j]) gen[j]=Math.abs(x); } });
  for(let j=1;j<N;j++) if(gen[j]===0){ on[j]=on[j-1]; arka[j]=arka[j-1]; gen[j]=gen[j-1]; }

function sacUzat(sm,kesit,marj){

// Kardelen'in yüz hatlarına çok hafif dokunuş (bağlama uzayında, bir kez): gözler biraz daha açık, kaş kemeri hafif yukarı,
// dudaklar biraz dolgun, burun kanatları ve çene hattı biraz daha ince (V çizgisi). Kirpikler aynı biçimde göz kapağını izler.
function kardelenYuzSekli(sahne){

  const ss=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
  const sekil=(x,y,z)=>{ let nx=x, ny=y, nz=z; const on=ss(-.01,.03,z);
    for(const E of [GL,GR]){ // göz açıklığı: göz merkezine göre dikeyde %9, yatayda %3 açılır
      const d=Math.hypot(x-E[0],(y-E[1])/.72), w=(1-ss(.006,.021,d))*ss(E[2]-.03,E[2]-.006,z); ny+=(y-E[1])*.09*w; nx+=(x-E[0])*.03*w;

    for(let i=0;i<P.count;i++){ const q=sekil(P.getX(i),P.getY(i),P.getZ(i)); P.setXYZ(i,q[0],q[1],q[2]); } P.needsUpdate=true; o.geometry.computeBoundingSphere(); });
}
async function kardelenGuzellestir(sahne){

  let sac=null;
  sahne.traverse(o=>{ if(!o.isMesh||!o.material) return; const n=o.material.name;
    if(n==="AvatarHead"&&yuz){ o.material.map=yuz; o.material.roughness=Math.max(o.material.roughness,.6); o.material.needsUpdate=true; }
    if((n==="AvatarHead"||n==="AvatarBody")&&o.material.isMeshStandardMaterial){ o.material.emissive=new THREE.Color(.42,.2,.15); o.material.emissiveIntensity=.06; } // ışık geçiren cilt hissi: gölgeler griye değil sıcağa kaçar
    if(/Eyeball/.test(n)&&goz){ o.material.map=goz; o.material.needsUpdate=true; }
    if(/haircut/.test(n)&&o.isSkinnedMesh) sac=o; });
  if(sac){ const kesit=_govdeKesit(sahne); const ince=sacUzat(sac,kesit,.014), kalin=sacUzat(sac,kesit,.06);
    ince.userData.kalici=kalin.userData.kalici=true; sac.geometry=ince; sac.material.vertexColors=true; sac.material.needsUpdate=true; AVATAR_SAC.kardelen={ince,kalin};
    // saç dolgunluğu: aynı saç kartlarının arkasında daha düşük alfa eşikli, koyu bir alt katman; teller arası boşluklar dolu görünür

    const alt=new THREE.SkinnedMesh(sac.geometry,m2); alt.name="sacAlt"; alt.frustumCulled=false; alt.castShadow=false; alt.userData.kalici=true; sac.parent.add(alt); alt.bind(sac.skeleton,sac.bindMatrix); alt.renderOrder=-1; }
}

function kiyafetDoku(kim,plan,orijinal){

    else { const mx=Math.max(r,g,b), mn=Math.min(r,g,b), s=mx?(mx-mn)/mx:0; if(y<H*.45 && X<W*.84 && L>=.7 && s<.3) k=1; else if(b>r+.05 && L<.78 && s>.12) k=2; }
    if(k===1){ sinif[y*W+X]=1; sL+=L; sN++; } else if(k===2){ sinif[y*W+X]=2; aL+=L; aN++; } }

  const hS=plan.ust&&plan.ust!=="kamuflaj"?hex(plan.ust):null, hA=plan.alt&&plan.alt!=="kamuflaj"?hex(plan.alt):null;
  for(let y=0;y<H;y++) for(let X=0;X<W;X++){ const k=sinif[y*W+X]; if(!k) continue; const i=(y*W+X)*4;
