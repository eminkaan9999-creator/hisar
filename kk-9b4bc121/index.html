<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120e1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Kaan &amp; Kardelen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Tam ekran WebGL + üstte sinematik DOM katmanı. Gün batımı altını ve gece moru, tek tema. */
:root{
  --gece:#120e1f; --panel:rgba(18,14,31,.72); --altin:#ffcf8a; --gul:#ff9fb4; --krem:#fff6ea; --sis:#cbbfdc;
  --f-serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--gece);color:var(--krem);font-family:var(--f-ui);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui *{box-sizing:border-box}
button{font-family:var(--f-ui);color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--altin);outline-offset:3px}
.tam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px));pointer-events:auto}
.perde{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.perde.kapali{opacity:1}
h1,h2{font-family:var(--f-serif);font-weight:500;margin:0;line-height:1;text-wrap:balance}
.logo{font-size:clamp(52px,14vw,96px);letter-spacing:.01em;text-shadow:0 2px 30px #0009}
.logo i{color:var(--gul);font-style:italic}
.ust-yazi{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--altin)}
.yuzler{display:flex;align-items:center;gap:0}
.yuzler img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--krem);box-shadow:0 8px 24px #0008}
.yuzler img+img{margin-left:-14px}
.btn{pointer-events:auto;font-weight:700;font-size:17px;letter-spacing:.02em;padding:14px 28px;border-radius:999px;background:linear-gradient(180deg,#ffd9a3,#f3a96b);color:#3a1d0a;box-shadow:0 10px 30px #f3a96b44;min-width:230px}
.btn.ince{background:rgba(255,255,255,.08);color:var(--krem);border:1px solid rgba(255,255,255,.22);box-shadow:none;backdrop-filter:blur(6px)}
.btn.kucuk{min-width:0;padding:10px 18px;font-size:15px}
.bolumler{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}
.bolum{pointer-events:auto;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px;border-radius:16px;background:rgba(18,14,31,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.menu-ort{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,31,.65) 0%,rgba(18,14,31,.15) 32%,rgba(18,14,31,0) 50%,rgba(18,14,31,.55) 75%,rgba(18,14,31,.85) 100%);pointer-events:none}
.bolum .no{font-family:var(--f-serif);font-size:30px;color:var(--altin);width:26px}
.bolum b{display:block;font-family:var(--f-serif);font-size:23px;font-weight:600;line-height:1.05}
.bolum small{color:var(--sis);font-size:13px}
.bolum.kilit{opacity:.45}
.bolum .tik{margin-left:auto;color:var(--gul);font-size:18px}
.kart-baslik{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s}
.kart-baslik.gor{opacity:1}
.kart-baslik h2{font-size:clamp(56px,15vw,104px);text-shadow:0 4px 40px #000c}
.kart-baslik p{margin:0;font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--krem);text-shadow:0 2px 16px #000}
.hedef{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:600;white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis;transition:opacity .5s}
.menu-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.14);font-size:18px;pointer-events:auto}
.ses-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.14);font-size:17px;pointer-events:auto}
.joy{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none;backdrop-filter:blur(3px)}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,246,234,.75);box-shadow:0 4px 14px #0006}
.aksiyon{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);min-width:96px;height:96px;padding:0 18px;border-radius:999px;background:radial-gradient(circle at 40% 35%,#ffd9a3,#f08f6a);color:#3a1d0a;font-weight:700;font-size:16px;pointer-events:auto;touch-action:none;box-shadow:0 10px 30px #f08f6a55;transition:transform .1s,opacity .3s}
.aksiyon:active,.aksiyon.bas{transform:scale(.94)}
.aksiyon[hidden]{display:none}
.alt-yazi{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);width:min(560px,calc(100% - 40px));text-align:center;font-family:var(--f-serif);font-size:24px;line-height:1.3;text-shadow:0 2px 16px #000;opacity:0;transition:opacity 1.2s;pointer-events:none}
.alt-yazi.gor{opacity:1}
.ritim{position:absolute;left:50%;top:46%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none}
.ritim .hedefh{position:absolute;inset:40px;border-radius:50%;border:3px solid var(--gul);box-shadow:0 0 20px var(--gul)}
.ritim .daire{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid var(--altin);transform:translate(-50%,-50%)}
.son-kart{background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:380px;width:100%}
.son-kart p{margin:0;color:var(--sis);font-size:16px;line-height:1.4}
.yukleniyor{font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--sis)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const Ses={
  ac:null, ana:null, calisiyor:false, akorZaman:0, akorNo:0, notaZaman:0, notaNo:0, deniz:null, ruzgar:null, ton:"sicak",
  baslat(){
    if(this.ac) { if(this.ac.state==="suspended") this.ac.resume(); return; }
    try{
      const A=this.ac=new (window.AudioContext||window.webkitAudioContext)();
      this.ana=A.createGain(); this.ana.gain.value=kayit.ses?.55:0; this.ana.connect(A.destination);
      // yankı
      const uz=A.sampleRate*2.6, buf=A.createBuffer(2,uz,A.sampleRate);
      for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<uz;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/uz,2.4); }
      this.yanki=A.createConvolver(); this.yanki.buffer=buf; const yg=A.createGain(); yg.gain.value=.55; this.yanki.connect(yg); yg.connect(this.ana);
      this.kuru=A.createGain(); this.kuru.gain.value=.6; this.kuru.connect(this.ana);
      this.calisiyor=true;
    }catch(e){}
  },
  sesAc(acik){ kayit.ses=acik; kaydet(); if(this.ana) this.ana.gain.setTargetAtTime(acik?.55:0,this.ac.currentTime,.3); },
  nota(f,zaman,sure,hacim,tip="sine",yankiOran=1){
    const A=this.ac; const o=A.createOscillator(), g=A.createGain(), o2=A.createOscillator();
    o.type=tip; o.frequency.value=f; o2.type="sine"; o2.frequency.value=f*2.001;
    const g2=A.createGain(); g2.gain.value=.18; o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(this.kuru); if(yankiOran>0){ const y=A.createGain(); y.gain.value=yankiOran; g.connect(y); y.connect(this.yanki); }
    g.gain.setValueAtTime(0,zaman); g.gain.linearRampToValueAtTime(hacim,zaman+.015); g.gain.exponentialRampToValueAtTime(.0001,zaman+sure);
    o.start(zaman); o2.start(zaman); o.stop(zaman+sure+.05); o2.stop(zaman+sure+.05);
  },
  ped(frekanslar,zaman,sure){
    const A=this.ac;
    for(const f of frekanslar){ const o=A.createOscillator(), g=A.createGain(), fl=A.createBiquadFilter();
      o.type="triangle"; o.frequency.value=f; o.detune.value=rnd(-6,6); fl.type="lowpass"; fl.frequency.value=900;
      o.connect(fl); fl.connect(g); g.connect(this.yanki); g.connect(this.kuru);
      g.gain.setValueAtTime(0,zaman); g.gain.linearRampToValueAtTime(.022,zaman+1.4); g.gain.linearRampToValueAtTime(.0001,zaman+sure);
      o.start(zaman); o.stop(zaman+sure+.1); }
  },
  // akorlar: Fmaj7 Em7 Dm7 Cmaj7 / gece: Am F C G
  AKOR:{
    sicak:[[174.6,220,261.6,329.6],[164.8,196,246.9,293.7],[146.8,174.6,220,261.6],[130.8,164.8,196,246.9]],
    gece:[[110,220,261.6,329.6],[87.3,174.6,220,261.6],[130.8,196,261.6,329.6],[98,196,246.9,293.7]]
  },
  guncelle(){
    if(!this.calisiyor) return;
    const A=this.ac, n=A.currentTime, ak=this.AKOR[this.ton];
    const akorSure=4.8;
    if(n>=this.akorZaman-.1){
      const t=Math.max(n,this.akorZaman); const a=ak[this.akorNo%ak.length];
      this.ped(a.map(f=>f/2),t,akorSure+1);
      this.nota(a[0]/2,t,3.5,.12,"sine",.6);
      this.akorZaman=t+akorSure; this.akorNo++; this.notaZaman=t; this.notaNo=0; this.suanki=a;
    }
    const aralik=akorSure/8;
    while(this.suanki && this.notaZaman<n+.2 && this.notaNo<8){
      const desen=[0,1,2,3,2,1,3,2]; const f=this.suanki[desen[this.notaNo]]*2*(this.notaNo===3?2:1);
      if(Math.random()>.12) this.nota(f,this.notaZaman+rnd(0,.02),2.2,.05+Math.random()*.025,"sine",1);
      this.notaZaman+=aralik; this.notaNo++;
    }
  },
  denizBaslat(){
    if(!this.ac||this.deniz) return;
    const A=this.ac, uz=A.sampleRate*2, buf=A.createBuffer(1,uz,A.sampleRate), d=buf.getChannelData(0);
    let son=0; for(let i=0;i<uz;i++){ son=(son+.02*(Math.random()*2-1))/1.02; d[i]=son*3.5; }
    const s=A.createBufferSource(); s.buffer=buf; s.loop=true; const f=A.createBiquadFilter(); f.type="lowpass"; f.frequency.value=600;
    const g=A.createGain(); g.gain.value=0; const lfo=A.createOscillator(), lg=A.createGain(); lfo.frequency.value=.12; lg.gain.value=.18; lfo.connect(lg); lg.connect(g.gain);
    s.connect(f); f.connect(g); g.connect(this.ana); s.start(); lfo.start(); g.gain.setTargetAtTime(.22,A.currentTime,2);
    this.deniz={s,g,lfo};
  },
  denizDurdur(){ if(this.deniz){ const d=this.deniz; d.g.gain.setTargetAtTime(0,this.ac.currentTime,.8); setTimeout(()=>{ try{d.s.stop();d.lfo.stop();}catch(e){} },3000); this.deniz=null; } },
  efekt(t){
    if(!this.ac) return; const n=this.ac.currentTime;
    if(t==="parilti"){ [1046.5,1318.5,1568,2093].forEach((f,i)=>this.nota(f,n+i*.07,1.2,.05,"sine",1)); }
    else if(t==="buyuk"){ [523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>this.nota(f,n+i*.12,2.5,.06,"triangle",1)); }
    else if(t==="vuru"){ this.nota(784,n,.6,.06,"sine",1); }
    else if(t==="ates"){ const A=this.ac,o=A.createOscillator(),g=A.createGain(); o.type="sawtooth"; o.frequency.setValueAtTime(90,n); o.frequency.linearRampToValueAtTime(60,n+.3); g.gain.setValueAtTime(.05,n); g.gain.exponentialRampToValueAtTime(.0001,n+.35); o.connect(g); g.connect(this.kuru); o.start(n); o.stop(n+.4); }
    else if(t==="havai"){ const A=this.ac,uz=A.sampleRate*.6,b=A.createBuffer(1,uz,A.sampleRate),d=b.getChannelData(0); for(let i=0;i<uz;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/uz,3); const s=A.createBufferSource(); s.buffer=b; const g=A.createGain(); g.gain.value=.25; s.connect(g); g.connect(this.yanki); g.connect(this.kuru); s.start(n); }
  }
};

function klavyeVek(){ const t=Girdi.tus; let x=(t.KeyD||t.ArrowRight?1:0)-(t.KeyA||t.ArrowLeft?1:0), y=(t.KeyS||t.ArrowDown?1:0)-(t.KeyW||t.ArrowUp?1:0); const L=Math.hypot(x,y); return L? {x:x/L,y:y/L}:{x:0,y:0}; }

function joystickEkle(){
  const j=el(`<div class="joy" aria-label="Yürü"><i></i></div>`), top=j.firstElementChild; let id=null, cx0=0, cy0=0;
  const R=52;
  const hareket=e=>{ let dx=e.clientX-cx0, dy=e.clientY-cy0; const L=Math.hypot(dx,dy); if(L>R){dx*=R/L;dy*=R/L;} top.style.transform=`translate(${dx}px,${dy}px)`; joyVec={x:dx/R,y:dy/R}; };
  j.addEventListener("pointerdown",e=>{ e.preventDefault(); id=e.pointerId; j.setPointerCapture(id); const r=j.getBoundingClientRect(); cx0=r.left+r.width/2; cy0=r.top+r.height/2; hareket(e); });
  j.addEventListener("pointermove",e=>{ if(e.pointerId===id) hareket(e); });
  const bit=()=>{ id=null; top.style.transform=""; joyVec={x:0,y:0}; };
  j.addEventListener("pointerup",bit); j.addEventListener("pointercancel",bit); j.addEventListener("lostpointercapture",bit);
  katman.appendChild(j);
}
function aksiyonEkle(){
  const b=el(`<button class="aksiyon" hidden></button>`);
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); b.setPointerCapture(e.pointerId); if(!Girdi.aksiyon) Girdi.aksiyonBas=true; Girdi.aksiyon=true; b.classList.add("bas"); });
  const bit=()=>{ Girdi.aksiyon=false; b.classList.remove("bas"); };

  b.addEventListener("contextmenu",e=>e.preventDefault());

}

let scene=null, bolum=null, zaman=0;
function sahneKur(ayar){
  if(scene){ scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); } }); }
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(renk(ayar.sis),ayar.sisYakin||40,ayar.sisUzak||260);
  const gok=gokyuzuYap(ayar); scene.add(gok); scene.userData.gok=gok;
  const hemi=new THREE.HemisphereLight(renk(ayar.ust),renk(ayar.zemin||"#6b5a4a"),ayar.hemi||.65); scene.add(hemi);
  const gun=new THREE.DirectionalLight(renk(ayar.isik||"#ffd2a1"),ayar.isikGuc||2.2);
  const isikYon=(ayar.isikYon||ayar.gunesYon).clone().normalize();
  gun.position.copy(isikYon.clone().multiplyScalar(60)); gun.castShadow=true;
  gun.shadow.mapSize.set(1024,1024); const sc=gun.shadow.camera; sc.left=-22; sc.right=22; sc.top=22; sc.bottom=-22; sc.near=1; sc.far=160; gun.shadow.bias=-.0006; gun.shadow.normalBias=.02;
  scene.add(gun); scene.add(gun.target); scene.userData.gun=gun; scene.userData.gunesYon=isikYon;
  const dolgu=new THREE.DirectionalLight(renk(ayar.dolguRenk||"#ffe6d0"),ayar.dolgu||.9); dolgu.position.set(-isikYon.x*40,25,-isikYon.z*40+20); scene.add(dolgu); scene.userData.dolgu=dolgu;
  return scene;
}
function gokyuzuYap(a){
  const m=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ ust:{value:renk(a.ust)}, ufuk:{value:renk(a.ufuk)}, alt:{value:renk(a.alt||a.ufuk)}, gunes:{value:a.gunesYon.clone().normalize()}, gRenk:{value:renk(a.gunesRenk||"#ffdca8")}, yildiz:{value:a.yildiz||0}, zaman:{value:0}, parlak:{value:a.parlak||1} },
    vertexShader:`varying vec3 vY; void main(){ vY=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 ust,ufuk,alt,gunes,gRenk; uniform float yildiz,zaman,parlak; varying vec3 vY;
      float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){ vec3 d=normalize(vY); float h=d.y;
        vec3 c = h>0.0 ? mix(ufuk,ust,pow(h,0.55)) : mix(ufuk,alt,pow(-h,0.4));
        float s=max(dot(d,normalize(gunes)),0.0);
        c += gRenk*pow(s,6.0)*0.55*parlak + gRenk*pow(s,60.0)*0.8*parlak + vec3(1.0,0.95,0.85)*smoothstep(0.9993,0.9997,s)*3.0*parlak;
        if(yildiz>0.0 && h>0.02){ vec2 u=vec2(atan(d.z,d.x)*80.0, h*160.0); vec2 g=floor(u); float r=h21(g); float tw=0.6+0.4*sin(zaman*2.0+r*30.0);
          float st=step(0.985,r)*smoothstep(0.45,0.0,length(fract(u)-0.5))*tw; c+=vec3(st)*yildiz*smoothstep(0.02,0.25,h); }
        gl_FragColor=vec4(c,1.0); }`
  });
  const g=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),m); g.renderOrder=-1; return g;
}
let parlakDoku=null;
function parlakDokuAl(){
  if(parlakDoku) return parlakDoku;

  const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,"rgba(255,255,255,1)"); g.addColorStop(.25,"rgba(255,255,255,.55)"); g.addColorStop(1,"rgba(255,255,255,0)");

  const kolS=kol(-1), kolD=kol(1);

function animasyon(c,dt){
  const u=c.userData; u.faz+=dt*(3+u.hiz*3.2);
  const w=Math.min(1,u.hiz/1.6);
  const s=Math.sin(u.faz);
  if(u.otur>0){
    const o=u.otur;
    u.bacS.rotation.x=lerp(u.bacS.rotation.x,-1.45*o,.2); u.bacD.rotation.x=lerp(u.bacD.rotation.x,-1.45*o,.2);
    u.govde.position.y=lerp(u.govde.position.y,(u.kim==="kaan"?.92:.86)-.48*o,.2);
    u.bacS.position.y=u.bacD.position.y=u.govde.position.y;
    u.kolS.rotation.x=lerp(u.kolS.rotation.x,-.5*o,.2); u.kolD.rotation.x=lerp(u.kolD.rotation.x,-.5*o,.2);
    return;
  }
  const by=u.kim==="kaan"?.92:.86;
  u.govde.position.y=by+Math.abs(Math.cos(u.faz))*.03*w; u.bacS.position.y=u.bacD.position.y=by;
  u.bacS.rotation.x=s*.6*w; u.bacD.rotation.x=-s*.6*w;
  u.kolS.rotation.x=-s*.45*w; u.kolD.rotation.x=s*.45*w;
  u.kolS.rotation.z=0; u.kolD.rotation.z=0;
  // el ele: kaan sağ kol, kardelen sol kol
  if(u.elele>0){ const k=u.kim==="kaan"?u.kolD:u.kolS, y=u.kim==="kaan"?1:-1; k.rotation.x=-.12+s*.08*w; k.rotation.z=y*.38*u.elele; }
  if(u.salla>0){ const k=u.kolD; k.rotation.z=2.6+Math.sin(zaman*8)*.25; k.rotation.x=0; }
  if(u.dans>0){ u.kolS.rotation.z=-1.2; u.kolD.rotation.z=1.2; u.kolS.rotation.x=u.kolD.rotation.x=-.4+Math.sin(zaman*3)*.15; u.govde.position.y=by+Math.abs(Math.sin(zaman*3))*.04; }
  { let bk=u.bak||0; bk=Math.atan2(Math.sin(bk),Math.cos(bk)); bk=clamp(bk,-1.1,1.1); u.kafa.rotation.y=lerp(u.kafa.rotation.y,bk,.05); }
  if(u.etek) u.etek.rotation.y=Math.sin(u.faz*.5)*.05*w;
}

const Kamera={hedef:new THREE.Vector3(), poz:new THREE.Vector3(), mesafe:7, yukseklik:3.2, aci:0, sinema:null};
function kameraGuncelle(dt){
  const K=Kamera;
  if(K.sinema){ K.sinema(dt); return; }
  const ist=new THREE.Vector3(K.hedef.x+Math.sin(K.aci)*K.mesafe, K.hedef.y+K.yukseklik, K.hedef.z+Math.cos(K.aci)*K.mesafe);
  K.poz.lerp(ist,1-Math.pow(.02,dt)); camera.position.copy(K.poz);
  camera.lookAt(K.hedef.x,K.hedef.y+1,K.hedef.z);
}
function yuru(c,dt,sinir,hiz=2.3){
  const v=girdiVek(); const u=c.userData;
  const a=Kamera.aci; const ileri=new THREE.Vector3(-Math.sin(a),0,-Math.cos(a)), sag=new THREE.Vector3(Math.cos(a),0,-Math.sin(a));
  const yon=sag.multiplyScalar(v.x).add(ileri.multiplyScalar(-v.y));
  const L=yon.length();
  if(L>.08){ const hz=hiz*Math.min(1,L); c.position.addScaledVector(yon.normalize(),hz*dt); const hedefAci=Math.atan2(yon.x,yon.z); let fark=hedefAci-c.rotation.y; fark=Math.atan2(Math.sin(fark),Math.cos(fark)); c.rotation.y+=fark*Math.min(1,dt*10); u.hiz=lerp(u.hiz,hz,.2); }
  else u.hiz=lerp(u.hiz,0,.25);
  if(sinir) sinir(c.position);
}
function eleleTakip(o,p,dt){
  const sag=new THREE.Vector3(Math.cos(o.rotation.y),0,-Math.sin(o.rotation.y));
  const hedefP=o.position.clone().addScaledVector(sag,o.userData.kim==="kaan"?.52:-.52);
  p.position.lerp(hedefP,1-Math.pow(.001,dt));
  let fark=o.rotation.y-p.rotation.y; fark=Math.atan2(Math.sin(fark),Math.cos(fark)); p.rotation.y+=fark*Math.min(1,dt*8);
  p.userData.hiz=o.userData.hiz; p.userData.faz=o.userData.faz+Math.PI;
  p.userData.elele=o.userData.elele=lerp(o.userData.elele,1,.08);
}
function yuzYuze(a,b){ a.rotation.y=Math.atan2(b.position.x-a.position.x,b.position.z-a.position.z); b.rotation.y=Math.atan2(a.position.x-b.position.x,a.position.z-b.position.z); }

    if(bolum&&bolum.temizle) bolum.temizle();
    await Patara.kur(); bolum={ guncelle:dt=>{ Patara.t+=0; const p=Patara; p.guncelleArka(dt); } };
    Patara.kaan.position.set(8.6,0,4.3); Patara.kar.position.set(9.4,0,4.3); Patara.kaan.rotation.y=Patara.kar.rotation.y=Math.PI;
    Patara.kaan.userData.otur=Patara.kar.userData.otur=1; Patara.kaan.userData.elele=Patara.kar.userData.elele=1;
    Patara.kar.userData.kafa.rotation.z=-.28;
    let s=0; Kamera.sinema=dt=>{ s+=dt; const a=.8+Math.sin(s*.05)*.3; camera.position.set(9+Math.sin(a)*6.5,1.8,4+Math.cos(a)*6.5); camera.lookAt(9,1.4,-4); };
    katmanTemizle(); hedefEl=null;
    const g=Math.floor((Date.now()-BASLANGIC)/864e5);
    const acik=n=>n===1||kayit.bitti[n-1];
    katman.appendChild(el(`<div class="menu-ort"></div>`));
    const d=el(`<div class="tam" style="justify-content:space-between">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4vh">
        <div class="yuzler"><img src="${YUZ.kaan}" alt="Kaan"><img src="${YUZ.kardelen}" alt="Kardelen"></div>
        <h1 class="logo">Kaan <i>&amp;</i> Kardelen</h1>
        <span class="ust-yazi" style="color:var(--krem);text-shadow:0 1px 10px #000c">${g.toLocaleString("tr-TR")} gündür beraber</span>
      </div>
      <div class="bolumler">
        ${BOLUMLER.map(B=>`<button class="bolum ${acik(B.no)?"":"kilit"}" data-no="${B.no}"><span class="no">${B.no}</span><span><b>${B.ad}</b><small>${acik(B.no)?B.alt:"Önceki bölümü bitir"}</small></span>${kayit.bitti[B.no]?'<span class="tik">❤</span>':""}</button>`).join("")}
        ${kayit.bitti[3]?`<button class="bolum" data-no="final"><span class="no">✦</span><span><b>Final</b><small>İkiniz</small></span></button>`:""}
        <button class="btn ince kucuk" id="ses" style="align-self:center;margin-top:4px">${kayit.ses?"♪ Müzik açık":"✕ Müzik kapalı"}</button>
      </div>
    </div>`);
    katman.appendChild(d);
    d.querySelectorAll(".bolum").forEach(b=>b.onclick=()=>{ Ses.baslat(); const n=b.dataset.no; if(n==="final") return gecis(()=>Final.ac()); const B=BOLUMLER[+n-1]; if(acik(B.no)) bolumAc(B); });
    d.querySelector("#ses").onclick=e=>{ Ses.baslat(); Ses.sesAc(!kayit.ses); e.target.textContent=kayit.ses?"♪ Müzik açık":"✕ Müzik kapalı"; };
  }
};
Patara.guncelleArka=function(dt){
  this.t+=dt; const t=this.t;
  const p=this.deniz.geometry.attributes.position, b=this.dTaban;
  for(let i=0;i<p.count;i++){ const x=b[i*3], z=b[i*3+2]; p.setY(i,Math.sin(x*.18+t*1.1)*.12+Math.sin(z*.35+t*1.6)*.1+Math.sin((x+z)*.6+t*2.3)*.04); }
  p.needsUpdate=true; this.deniz.geometry.computeVertexNormals();
  this.kopuk.position.z=.4+Math.sin(t*.8)*.45;
  this.fenerIsik.intensity=1.5;
  animasyon(this.kaan,dt); animasyon(this.kar,dt);
};

/* ================= FİNAL ================= */
const Final={
  async ac(){
    if(bolum&&bolum.temizle) bolum.temizle();
    await Sato.kur(); Sato.satoYandi=true; Sato.fenerler.forEach(f=>f.userData.yandi=true);
    const K=Sato.kaan, D=Sato.kar; K.position.set(-.3,0,-32); D.position.set(.3,0,-32); yuzYuze(K,D);
    let s=0;
    bolum={ guncelle:dt=>{ Sato.t+=0; Sato.durum="son"; Sato.guncelle(dt); s+=dt; if(Math.random()<dt*2.2) Sato.havaiFisek(); D.userData.kafa.rotation.z=-.22; } , temizle:()=>{} };
    Kamera.sinema=dt=>{ const a=s*.08; camera.position.set(Math.sin(a)*9,3+Math.sin(s*.1),-32+Math.cos(a)*9); camera.lookAt(0,1.4,-32); };
    katmanTemizle(); hedefEl=null; ustDugmeler();
    const g=Math.floor((Date.now()-BASLANGIC)/864e5);
    const d=el(`<div class="tam" style="justify-content:flex-end"><div class="son-kart">
      <div class="yuzler"><img src="${YUZ.kaan}" alt="Kaan"><img src="${YUZ.kardelen}" alt="Kardelen"></div>
      <h2 style="font-size:44px">Kaan <span style="color:var(--gul)">&amp;</span> Kardelen</h2>
      <p>2 Ağustos 2021'den beri<br><b style="color:var(--altin);font-size:22px">${g.toLocaleString("tr-TR")} gün</b></p>
      <button class="btn ince kucuk" id="menu">Bölümlere dön</button>
    </div></div>`);
    katman.appendChild(d); d.querySelector("#menu").onclick=()=>gecis(()=>Menu.ac());
  }
};

/* ================= DÖNGÜ ================= */
let onceki=0;
function dongu(t){
  const dt=Math.min(.05,(t-(onceki||t))/1000); onceki=t; zaman+=dt;
  if(bolum&&bolum.guncelle) bolum.guncelle(dt);
  if(scene){ const g=scene.userData.gok; if(g){ g.position.copy(camera.position); g.material.uniforms.zaman.value=zaman; }
    const gun=scene.userData.gun; if(gun){ gun.target.position.copy(Kamera.hedef); gun.position.copy(Kamera.hedef).addScaledVector(scene.userData.gunesYon,60); } }
  kameraGuncelle(dt);
  Ses.guncelle();
  Girdi.aksiyonBas=false;
  if(scene) renderer.render(scene,camera);
  requestAnimationFrame(dongu);
}
(async()=>{ await Menu.ac(); PERDE.classList.remove("kapali"); requestAnimationFrame(dongu); })();
window.__oyun3d={Patara,Kapadokya,Sato,Menu,Final,bolumAc,Girdi,kayit,Kamera,camera};
})();
</script>
