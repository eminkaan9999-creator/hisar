<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Kaan &amp; Kardelen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Oyun: tam ekran canvas + üstte DOM menüler ve dokunmatik tuşlar. Gece moru + gün batımı turuncusu, tek tema. */
:root{
  --gece:#1a1530; --panel:#251d42; --cizgi:#3f3466; --gunes:#ffb04a; --gul:#ff7d9c; --krem:#fff4e4; --sis:#b9acd9;
  --f:"Baloo 2", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--gece);color:var(--krem);font-family:var(--f);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font-family:var(--f);color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gunes);outline-offset:2px}

/* menü panelleri */
.ekran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));text-align:center;pointer-events:none}
.ekran>*{pointer-events:auto}
.logo{font-size:clamp(46px,13vw,84px);font-weight:800;line-height:.95;letter-spacing:-.01em;text-shadow:0 4px 0 #0006;margin:0}
.logo span{color:var(--gul)}
.alt{color:var(--sis);font-size:17px;margin:0;max-width:30ch;line-height:1.3}
.btn{background:var(--gunes);color:#3a1d00;font-weight:800;font-size:21px;padding:12px 26px;border-radius:18px;box-shadow:0 6px 0 #b8671a;min-width:240px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8671a}
.btn.ikinci{background:var(--panel);color:var(--krem);box-shadow:0 6px 0 #120e24;border:2px solid var(--cizgi)}
.btn.kucuk{min-width:0;font-size:17px;padding:9px 18px}
.kart{background:var(--panel);border:2px solid var(--cizgi);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:360px;width:100%;box-shadow:0 12px 30px #0008}
.kart h2{margin:0;font-size:30px;line-height:1}
.kart p{margin:0;color:var(--sis);font-size:17px;line-height:1.3}
.secim{display:flex;gap:16px}
.secim button{background:var(--panel);border:3px solid var(--cizgi);border-radius:20px;padding:12px 14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:20px;font-weight:700}
.secim button:active,.secim button.sec{border-color:var(--gul)}
.secim img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--krem)}
.kalpler{font-size:30px;letter-spacing:4px}

/* HUD */
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.rozet{background:#0008;border-radius:14px;padding:4px 12px;font-weight:700;font-size:18px;white-space:nowrap}
.kapat{background:#0008;width:42px;height:42px;border-radius:14px;font-size:20px;font-weight:800}

/* dokunmatik tuşlar */
.tuslar{position:absolute;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.grup{display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.tus{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;font-size:26px;font-weight:800;color:#fff;display:grid;place-items:center;touch-action:none;backdrop-filter:blur(2px)}
.tus.bas{background:#ffffff55}
.tus.buyuk{width:84px;height:84px;font-size:30px;background:#ff7d9c55;border-color:#ff7d9c99}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;pointer-events:none}
.dpad .tus{width:58px;height:58px;border-radius:16px;font-size:22px}
.tus.kt{width:52px;height:52px;font-size:21px}
.grup.sik{gap:6px}
.etiket{font-size:12px;color:#fff;opacity:.8;text-align:center;font-weight:700;pointer-events:none}
.sehirpanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);background:var(--panel);border:2px solid var(--gunes);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px #0009;max-width:calc(100% - 32px)}
.sehirpanel b{font-size:20px;display:block;line-height:1.05}
.sehirpanel small{color:var(--sis);font-size:14px}
.ipucu{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:#000a;border-radius:14px;padding:8px 14px;font-size:16px;max-width:calc(100% - 40px);text-align:center;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function seeded(s){ return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

/* ================= SES ================= */
let AC=null;
function sfx(t){
  if(!kayit.ses) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    const n=AC.currentTime;
    const P={jump:[520,780,.12,"square",.05], kalp:[880,1320,.14,"triangle",.08], vur:[200,80,.25,"sawtooth",.06], gol:[523,1046,.4,"triangle",.09], kazan:[660,1320,.6,"triangle",.09], tik:[700,700,.05,"square",.03]}[t]||[440,440,.1,"sine",.05];
    o.type=P[3]; o.frequency.setValueAtTime(P[0],n); o.frequency.exponentialRampToValueAtTime(P[1],n+P[2]);
    g.gain.setValueAtTime(P[4],n); g.gain.exponentialRampToValueAtTime(.0001,n+P[2]);
    o.start(n); o.stop(n+P[2]+.02);
  }catch(e){}
}

/* ================= GİRDİ ================= */
const P1={l:0,r:0,u:0,d:0,j:0,jp:0,a:0,ap:0}, P2={l:0,r:0,j:0,jp:0};
let ikiKisi=false;
const TUSMAP1={ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r",ArrowUp:"u",KeyW:"u",ArrowDown:"d",KeyS:"d",Space:"j",Enter:"a"};
addEventListener("keydown",e=>{
  if(e.repeat) return;
  let hedef=P1, k;
  if(ikiKisi){
    const m1={KeyA:"l",KeyD:"r",KeyW:"j",Space:"j"}, m2={ArrowLeft:"l",ArrowRight:"r",ArrowUp:"j",Enter:"j"};
    if(m2[e.code]){hedef=P2;k=m2[e.code];} else k=m1[e.code];
  } else { k=TUSMAP1[e.code]; if(e.code==="ArrowUp"||e.code==="KeyW"){ P1.u=1; k="j"; } }
  if(!k) return;
  e.preventDefault(); hedef[k]=1; if(k==="j") hedef.jp=1; if(k==="a") hedef.ap=1;
  if(S&&S.tik&&(k==="j"||k==="a")) S.tik();
});
addEventListener("keyup",e=>{
  if(ikiKisi){
    const m1={KeyA:"l",KeyD:"r",KeyW:"j",Space:"j"}, m2={ArrowLeft:"l",ArrowRight:"r",ArrowUp:"j",Enter:"j"};
    if(m2[e.code]) P2[m2[e.code]]=0; else if(m1[e.code]) P1[m1[e.code]]=0;
  } else { const k=TUSMAP1[e.code]; if(k) P1[k]=0; if(e.code==="ArrowUp"||e.code==="KeyW"){P1.u=0;P1.j=0;} }
});
function sifirla(){ for(const o of [P1,P2]) for(const k in o) o[k]=0; }
// canvas'a dokunma (tek tuşlu oyunlar)
cv.addEventListener("pointerdown",e=>{ if(S&&S.tik){ e.preventDefault(); S.tik(e); } if(S&&S.dokun) S.dokun(e,"down"); });
cv.addEventListener("pointermove",e=>{ if(S&&S.dokun) S.dokun(e,"move"); });
cv.addEventListener("pointerup",e=>{ if(S&&S.dokun) S.dokun(e,"up"); });
function ekranaDunya(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*DPR/sc, y:(e.clientY-r.top)*DPR/sc}; }

/* ================= UI YARDIMCI ================= */
const el=h=>{const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild;};
function temizUI(){ UI.innerHTML=""; }
function tus(etiket,hedef,k,sinif=""){
  const b=el(`<button class="tus ${sinif}" aria-label="${k}">${etiket}</button>`);
  const bas=e=>{ e.preventDefault(); b.setPointerCapture&&b.setPointerCapture(e.pointerId); hedef[k]=1; if(k==="j") hedef.jp=1; if(k==="a") hedef.ap=1; b.classList.add("bas"); };
  const birak=()=>{ hedef[k]=0; b.classList.remove("bas"); };
  b.addEventListener("pointerdown",bas); b.addEventListener("pointerup",birak); b.addEventListener("pointercancel",birak); b.addEventListener("lostpointercapture",birak);
  b.addEventListener("contextmenu",e=>e.preventDefault());
  return b;
}
function hud(sol, kapatFn){
  const h=el(`<div class="hud"><span class="rozet" id="hudsol">${sol}</span>${kapatFn?'<button class="kapat" aria-label="Haritaya dön">✕</button>':""}</div>`);
  if(kapatFn) h.querySelector(".kapat").onclick=kapatFn;
  UI.appendChild(h); return h;
}
function hudYaz(t){ const h=document.getElementById("hudsol"); if(h) h.innerHTML=t; }
function ipucu(t,sure=3500){ const d=el(`<div class="ipucu">${t}</div>`); UI.appendChild(d); setTimeout(()=>{d.style.opacity=0;},sure); setTimeout(()=>d.remove(),sure+600); }
function kontrolPlatform(){
  const w=el(`<div class="tuslar"><div class="grup"></div><div class="grup"></div></div>`);
  const [a,b]=w.children; a.append(tus("◀",P1,"l"),tus("▶",P1,"r")); b.append(tus("⤒",P1,"j","buyuk"));
  UI.appendChild(w);
}

/* ================= KARAKTER ÇİZİMİ ================= */
function karakterCiz(x,y,kim,o={}){
  const s=o.s||1, yon=o.yon||1, t=o.t||0, havada=o.havada, yuru=o.yuru;
  cx.save(); cx.translate(x,y); cx.scale(s,s);
  // gölge
  if(!havada && !o.golgesiz){ cx.fillStyle="#0004"; cx.beginPath(); cx.ellipse(0,1,11,3,0,0,7); cx.fill(); }
  const sal=yuru? Math.sin(t*14)*4 : 0;
  const kaan=kim==="kaan";
  // bacaklar
  cx.strokeStyle=kaan?"#22263a":"#f0c4a8"; cx.lineWidth=5; cx.lineCap="round";
  cx.beginPath(); cx.moveTo(-4,-12); cx.lineTo(-4-sal*.6,havada?-3:0); cx.moveTo(4,-12); cx.lineTo(4+sal*.6,havada?-5:0); cx.stroke();
  // ayakkabı
  cx.fillStyle=kaan?"#f2f2f2":"#ffffff"; cx.beginPath(); cx.ellipse(-4-sal*.6+yon*1.5,havada?-2:-1,4,2.4,0,0,7); cx.ellipse(4+sal*.6+yon*1.5,havada?-4:-1,4,2.4,0,0,7); cx.fill();
  // gövde
  if(kaan){ cx.fillStyle="#1f2b45"; rr(-10,-30,20,20,6); cx.fill(); cx.fillStyle="#2f3f63"; cx.fillRect(-1,-30,2,18); }
  else { cx.fillStyle="#ff9fc0"; cx.beginPath(); cx.moveTo(-8,-30); cx.lineTo(8,-30); cx.lineTo(13,-11); cx.lineTo(-13,-11); cx.closePath(); cx.fill(); cx.fillStyle="#ffc4d8"; cx.fillRect(-8,-30,16,4); }
  // kollar
  cx.strokeStyle=kaan?"#1f2b45":"#f0c4a8"; cx.lineWidth=4.5;
  const kol=havada?-10:sal;
  cx.beginPath(); cx.moveTo(-9,-27); cx.lineTo(-13,-17+kol*.5); cx.moveTo(9,-27); cx.lineTo(13,-17-kol*.5); cx.stroke();
  if(o.elSalla){ cx.beginPath(); cx.moveTo(9,-27); cx.lineTo(16,-40+Math.sin(t*10)*3); cx.stroke(); }
  // saç (arkada)
  if(!kaan){ cx.fillStyle="#3b2418"; cx.beginPath(); cx.ellipse(0,-42,19,21,0,0,7); cx.fill(); cx.fillRect(-19,-44,38,22); }
  // kafa: yüz fotoğrafı
  const R=17;
  cx.save(); cx.beginPath(); cx.arc(0,-46,R,0,7); cx.closePath(); cx.clip();
  const img=FACE[kim];
  if(img.complete && img.naturalWidth){ cx.save(); if(yon<0){ cx.scale(-1,1); } cx.drawImage(img,-R,-46-R,R*2,R*2); cx.restore(); }
  else { cx.fillStyle="#f0c4a8"; cx.fill(); }
  cx.restore();
  cx.strokeStyle="#fff"; cx.lineWidth=2.5; cx.beginPath(); cx.arc(0,-46,R,0,7); cx.stroke();
  cx.restore();
}
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
function kalpCiz(x,y,r,renk="#ff4f7b"){
  cx.fillStyle=renk; cx.beginPath();
  cx.moveTo(x,y+r*.9);
  cx.bezierCurveTo(x-r*1.6,y-r*.2, x-r*.6,y-r*1.4, x,y-r*.45);
  cx.bezierCurveTo(x+r*.6,y-r*1.4, x+r*1.6,y-r*.2, x,y+r*.9);
  cx.fill();
}
function emoji(e,x,y,size){ cx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText(e,x,y); }
function yazi(t,x,y,size,renk="#fff",hiza="center",kalin=800){ cx.font=`${kalin} ${size}px "Baloo 2", ui-rounded, sans-serif`; cx.textAlign=hiza; cx.textBaseline="middle"; cx.fillStyle=renk; cx.fillText(t,x,y); }

/* parçacıklar */
let parca=[];
function patlat(x,y,n,renkler,hiz=160){ for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), v=rnd(hiz*.3,hiz); parca.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,o:1,r:rnd(2,4.5),c:renkler[i%renkler.length],kalp:Math.random()<.3}); } }
function parcaGuncelle(dt){ parca=parca.filter(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.o-=dt*.9; return p.o>0; }); }
function parcaCiz(){ for(const p of parca){ cx.globalAlpha=Math.max(0,p.o); if(p.kalp) kalpCiz(p.x,p.y,p.r*1.6,p.c); else { cx.fillStyle=p.c; cx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);} } cx.globalAlpha=1; }

/* ================= SAHNE YÖNETİMİ ================= */
function git(sahne,...arg){
  if(S&&S.cik) S.cik();
  temizUI(); sifirla(); parca=[]; ikiKisi=false;
  S=sahne; S.min=S.min||{w:400,h:640};
  S.gir&&S.gir(...arg);
}
function dongu(t){
  const dt=Math.min(.033,(t-(T0||t))/1000); T0=t;
  sc=Math.min(cv.width/S.min.w, cv.height/S.min.h); VW=cv.width/sc; VH=cv.height/sc;
  cx.setTransform(sc,0,0,sc,0,0);
  if(S){ S.guncelle&&S.guncelle(dt); S.ciz&&S.ciz(dt); }
  P1.jp=0; P1.ap=0; P2.jp=0;
  requestAnimationFrame(dongu);
}

function bitisPaneli(kazandi, baslik, metin, tekrarFn, sehirId){
  if(kazandi && sehirId){ const yeni=!kayit.kalp[sehirId]; kayit.kalp[sehirId]=1; kaydet(); if(yeni) metin+=`<br><b style="color:var(--gul)">+1 kalp ❤️</b>`; }
  if(kazandi) sfx("kazan");
  const toplam=Object.keys(kayit.kalp).length;
  const p=el(`<div class="ekran" style="background:#0007"><div class="kart">
    <div style="font-size:46px">${kazandi?"🎉":"💫"}</div>
    <h2>${baslik}</h2><p>${metin}</p>
    ${kazandi&&sehirId?`<div class="kalpler">${"❤️".repeat(toplam)}${"🤍".repeat(Math.max(0,5-toplam))}</div>`:""}
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:6px">
      ${kazandi&&sehirId?`<button class="btn" id="b1">Haritaya dön</button><button class="btn ikinci kucuk" id="b2">Bir daha oyna</button>`:`<button class="btn" id="b2">${kazandi?"Bir daha oyna":"Tekrar dene"}</button><button class="btn ikinci kucuk" id="b1">${sehirId?"Haritaya dön":"Ana menü"}</button>`}
    </div></div></div>`);
  UI.appendChild(p);
  p.querySelector("#b1").onclick=()=> sehirId? git(Harita) : git(Baslik);
  p.querySelector("#b2").onclick=tekrarFn;
}

const Baslik={
  gir(){
    this.t=0;
    const g=Math.floor((Date.now()-BASLANGIC)/864e5);
    const e=el(`<div class="ekran">
      <div style="height:min(28vh,200px)"></div>
      <h1 class="logo">Kaan<br><span>&amp;</span> Kardelen</h1>
      <p class="alt">${g.toLocaleString("tr-TR")} gündür beraber. Şimdi sıra oyunda.</p>
      <button class="btn" id="macera">Maceraya başla</button>
      <button class="btn ikinci" id="ikili">Birlikte oyna · 2 kişi</button>
      ${karakter?`<button class="btn ikinci kucuk" id="degis">Karakter değiştir (${AD[karakter]})</button>`:""}
      <button class="btn ikinci kucuk" id="ses">${kayit.ses?"🔊 Ses açık":"🔇 Ses kapalı"}</button>
    </div>`);
    UI.appendChild(e);
    e.querySelector("#macera").onclick=()=>{ sfx("tik"); karakter? git(Harita) : git(Secim); };
    const dg=e.querySelector("#degis"); if(dg) dg.onclick=()=>{ sfx("tik"); git(Secim); };
    e.querySelector("#ikili").onclick=()=>{ sfx("tik"); git(Ikili); };
    e.querySelector("#ses").onclick=ev=>{ kayit.ses=!kayit.ses; kaydet(); ev.target.textContent=kayit.ses?"🔊 Ses açık":"🔇 Ses kapalı"; sfx("tik"); };
  },
  guncelle(dt){ this.t+=dt; parcaGuncelle(dt); if(Math.random()<dt*1.2) patlat(rnd(0,VW),rnd(VH*.1,VH*.4),14,["#ffb04a","#ff7d9c","#fff4e4","#9fd8ff"],120); },
  ciz(){
    gokyuzu(this.t);
    parcaCiz();
    const zy=VH*.27;
    // tepe
    cx.fillStyle="#2b2350"; cx.beginPath(); cx.ellipse(VW/2,zy+60,VW*.7,70,0,Math.PI,0); cx.fill();
    const z1=Math.abs(Math.sin(this.t*3))*22, z2=Math.abs(Math.sin(this.t*3+1.2))*22;
    karakterCiz(VW/2-52,zy+20-z1,"kaan",{s:2.2,havada:z1>2,yon:1});
    karakterCiz(VW/2+52,zy+20-z2,"kardelen",{s:2.2,havada:z2>2,yon:-1});
    kalpCiz(VW/2,zy-120+Math.sin(this.t*4)*4,16+Math.sin(this.t*8)*2);
  }
};
function gokyuzu(t,ust="#1a1530",alt="#4a2c5e"){
  const g=cx.createLinearGradient(0,0,0,VH); g.addColorStop(0,ust); g.addColorStop(1,alt); cx.fillStyle=g; cx.fillRect(0,0,VW,VH);
  cx.fillStyle="#fff";
  for(let i=0;i<60;i++){ const x=(i*97.3)%VW, y=(i*53.7)%(VH*.7); cx.globalAlpha=.3+.3*Math.sin(t*2+i); cx.fillRect(x,y,1.6,1.6); }
  cx.globalAlpha=1;
}

/* ================= HARİTA (yukarıdan bakış) ================= */
const TS=32, MW=46, MH=28;
const SEHIRLER=[
  {id:"eskisehir", ad:"Eskişehir", oyun:"Masal Şatosu", ikon:"🏰", x:9, y:11, sahne:()=>Sato},
  {id:"ankara", ad:"Ankara", oyun:"Şampiyonluk Gecesi", ikon:"🏟️", x:17, y:11, sahne:()=>Penalti},
  {id:"nevsehir", ad:"Nevşehir", oyun:"Balon Turu", ikon:"🎈", x:23, y:16, sahne:()=>Balon},
  {id:"antalya", ad:"Antalya", oyun:"Patara Koşusu", ikon:"🏖️", x:12, y:22, sahne:()=>Kosu},
  {id:"sirnak", ad:"Şırnak", oyun:"Uzak Mesafe", ikon:"⛰️", x:39, y:17, sahne:()=>Mesafe},
];
const EV={id:"ev", ad:"Bizim Ev", ikon:"🏡", x:21, y:6};
let HARITA=null;
function haritaKur(){
  const r=seeded(2082021), m=[];
  for(let y=0;y<MH;y++){ m.push([]); for(let x=0;x<MW;x++){
    const kiyi=1.6+Math.sin(x*.5)*.8+Math.sin(x*1.3+y)*.4;
    let t="g";
    if(y<kiyi+ (x>34?0.5:0) || y>MH-1-kiyi-(x<26?1.2:0) || x<1.5+Math.sin(y*.7)*.6 || x>MW-2) t="w";
    else if(x>29 && r()<.30) t="m";
    else if(r()<.07) t="t";
    else if(r()<.03 && x<29) t="m";
    m[y].push(t);
  }}
  const yol=(a,b)=>{ let x=a.x,y=a.y; while(x!==b.x){ m[y][x]="r"; x+=Math.sign(b.x-x);} while(y!==b.y){ m[y][x]="r"; y+=Math.sign(b.y-y);} m[y][x]="r"; };
  const S_=Object.fromEntries(SEHIRLER.map(s=>[s.id,s]));
  yol(S_.eskisehir,S_.ankara); yol(S_.ankara,EV); yol(S_.ankara,S_.nevsehir); yol(S_.eskisehir,S_.antalya); yol(S_.nevsehir,S_.sirnak);
  for(const s of [...SEHIRLER,EV]) for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const t=m[s.y+dy][s.x+dx]; if(t!=="r") m[s.y+dy][s.x+dx]="g"; }
  return m;
}
const Harita={
  min:{w:400,h:600},
  gir(){
    HARITA=HARITA||haritaKur();
    this.t=0;
    if(!this.px){ this.px=17*TS+16; this.py=12*TS+24; }
    this.yon=1; this.yuru=false; this.yakin=null; this.sonYakin=undefined;
    const top=Object.keys(kayit.kalp).length;
    hud(`❤️ ${top} / 5`, null);
    const h=UI.querySelector(".hud"); const m=el(`<button class="kapat" aria-label="Menü">☰</button>`); m.onclick=()=>git(Baslik); h.appendChild(m);
    const w=el(`<div class="tuslar"><div class="dpad"></div><div class="grup" style="flex-direction:column;align-items:center;gap:4px"></div></div>`);
    const d=w.querySelector(".dpad");
    const bos=()=>el(`<span></span>`);
    d.append(bos(),tus("▲",P1,"u"),bos(),tus("◀",P1,"l"),bos(),tus("▶",P1,"r"),bos(),tus("▼",P1,"d"),bos());
    w.children[1].append(tus("Gir",P1,"a","buyuk"));
    UI.appendChild(w);
    if(top===0) ipucu(`Şehirlere yürü, her birinde bir oyun var. ${AD[DIGER[karakter]]} Bizim Ev'de seni bekliyor.`,5000);
    else if(top===5) ipucu(`5 kalp tamam! Bizim Ev'e git ❤️`,5000);
  },
  gecilmez(x,y){ const tx=Math.floor(x/TS), ty=Math.floor(y/TS); const t=HARITA[ty]&&HARITA[ty][tx]; return !t||t==="w"||t==="m"; },
  guncelle(dt){
    this.t+=dt;
    let ax=(P1.r?1:0)-(P1.l?1:0), ay=(P1.d?1:0)-(P1.u?1:0);
    const L=Math.hypot(ax,ay)||1; const v=150;
    const nx=this.px+ax/L*v*dt, ny=this.py+ay/L*v*dt;
    if(!this.gecilmez(nx,this.py-4)&&!this.gecilmez(nx,this.py+6)) this.px=nx;
    if(!this.gecilmez(this.px,ny-4)&&!this.gecilmez(this.px,ny+6)) this.py=ny;
    if(ax) this.yon=ax>0?1:-1;
    this.yuru=!!(ax||ay);
    // yakın şehir
    let y=null;
    for(const s of [...SEHIRLER,EV]){ if(Math.hypot(s.x*TS+16-this.px,s.y*TS+16-this.py)<46) y=s; }
    if(y!==this.sonYakin){ this.sonYakin=y; this.panel(y); }
    if(y && P1.ap) this.gir2(y);
  },
  panel(s){
    const eski=UI.querySelector(".sehirpanel"); if(eski) eski.remove();
    if(!s) return;
    const ev=s===EV, top=Object.keys(kayit.kalp).length;
    const alt= ev ? (top>=5? `${AD[DIGER[karakter]]} seni bekliyor` : `Önce 5 kalbi topla (${top}/5)`) : (s.oyun + (kayit.kalp[s.id]?" · ❤️ alındı":""));
    const p=el(`<div class="sehirpanel"><span style="font-size:34px">${s.ikon}</span><div><b>${s.ad}</b><small>${alt}</small></div>${(!ev||top>=5)?'<button class="btn kucuk" style="min-width:0">Gir</button>':""}</div>`);
    const b=p.querySelector("button"); if(b) b.onclick=()=>this.gir2(s);
    UI.appendChild(p);
  },
  gir2(s){
    if(s===EV){ if(Object.keys(kayit.kalp).length>=5){ sfx("kazan"); git(Final); } else sfx("vur"); return; }
    sfx("tik"); git(s.sahne(), s.id);
  },
  ciz(){
    const kx=clamp(this.px-VW/2,0,MW*TS-VW), ky=clamp(this.py-VH*.45,0,MH*TS-VH);
    cx.fillStyle="#2c6fa8"; cx.fillRect(0,0,VW,VH);
    cx.save(); cx.translate(-Math.round(kx),-Math.round(ky));
    const x0=Math.max(0,Math.floor(kx/TS)), x1=Math.min(MW,Math.ceil((kx+VW)/TS)+1), y0=Math.max(0,Math.floor(ky/TS)), y1=Math.min(MH,Math.ceil((ky+VH)/TS)+1);
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
      const t=HARITA[y][x], X=x*TS, Y=y*TS;
      if(t==="w"){ cx.fillStyle=(x+y)%2?"#2c6fa8":"#2a69a0"; cx.fillRect(X,Y,TS,TS); cx.fillStyle="#ffffff22"; cx.fillRect(X+((this.t*20+y*7)%TS),Y+10,8,2); continue; }
      cx.fillStyle=(x+y)%2?"#7cc06a":"#75b964"; cx.fillRect(X,Y,TS,TS);
      if(t==="r"){ cx.fillStyle="#e7cf98"; cx.fillRect(X+4,Y+4,TS-8,TS-8);
        const k=(dx,dy)=>HARITA[y+dy]&&HARITA[y+dy][x+dx]==="r";
        if(k(1,0)) cx.fillRect(X+TS-4,Y+4,4,TS-8); if(k(-1,0)) cx.fillRect(X,Y+4,4,TS-8); if(k(0,1)) cx.fillRect(X+4,Y+TS-4,TS-8,4); if(k(0,-1)) cx.fillRect(X+4,Y,TS-8,4); }
      else if(t==="t"){ cx.fillStyle="#5a3a22"; cx.fillRect(X+14,Y+18,4,10); cx.fillStyle="#3f8f45"; cx.beginPath(); cx.arc(X+16,Y+14,10,0,7); cx.fill(); }
      else if(t==="m"){ cx.fillStyle="#8a7d6e"; cx.beginPath(); cx.moveTo(X+2,Y+TS); cx.lineTo(X+16,Y+3); cx.lineTo(X+30,Y+TS); cx.fill(); cx.fillStyle="#f3efe8"; cx.beginPath(); cx.moveTo(X+11,Y+10); cx.lineTo(X+16,Y+3); cx.lineTo(X+21,Y+10); cx.fill(); }
    }
    // şehirler
    for(const s of [...SEHIRLER,EV]){
      const X=s.x*TS+16, Y=s.y*TS+16;
      cx.fillStyle="#0003"; cx.beginPath(); cx.ellipse(X,Y+14,22,7,0,0,7); cx.fill();
      emoji(s.ikon,X,Y-2+Math.sin(this.t*2+s.x)*1.5,36);
      cx.font=`800 13px "Baloo 2", sans-serif`; const w=cx.measureText(s.ad).width+16;
      cx.fillStyle="#1a1530dd"; rr(X-w/2,Y+20,w,20,10); cx.fill();
      yazi(s.ad,X,Y+31,13,"#fff4e4");
      if(kayit.kalp[s.id]) kalpCiz(X+20,Y-22,7);
    }
    // bekleyen partner
    const part=DIGER[karakter];
    karakterCiz(EV.x*TS+44,EV.y*TS+30,part,{s:.75,yon:-1,elSalla:true,t:this.t});
    karakterCiz(this.px,this.py+12,karakter,{s:.75,yon:this.yon,yuru:this.yuru,t:this.t});
    cx.restore();
  }
};

/* ================= PLATFORM MOTORU ================= */
const T=32, G=1900, JV=650, HIZ=190;
function seviyeYap(satirlar){
  const L={g:satirlar.map(r=>r.split("")), w:satirlar[0].length, h:satirlar.length, kalpler:[], dikenler:[], cp:[], spawn:{}, hedef:null, plaka:[], kapi:{}, door:null};
  L.g.forEach((r,y)=>r.forEach((c,x)=>{
    const X=x*T, Y=y*T;
    if(c==="h"){ L.kalpler.push({x:X+16,y:Y+16,al:false}); r[x]="."; }
    else if(c==="^"){ L.dikenler.push({x:X,y:Y+18,w:T,h:14}); }
    else if(c==="C"){ L.cp.push({x:X+16,y:Y+T,ok:false}); r[x]="."; }
    else if(c==="P"||c==="K"||c==="L"){ L.spawn[c]={x:X+16,y:Y+T}; r[x]="."; }
    else if(c==="G"){ L.hedef={x:X+16,y:Y+T}; r[x]="."; }
    else if(c==="a"||c==="b"){ L.plaka.push({x:X,y:Y+T-6,w:T,h:6,k:c}); r[x]="."; }
    else if(c==="A"||c==="B"){ (L.kapi[c]=L.kapi[c]||[]).push({x,y}); }
    else if(c==="D"){ if(!L.door) L.door={x:X,y:Y,w:T*1,h:T}; else { L.door.h=Math.max(L.door.h,Y+T-L.door.y); } r[x]="."; }
  }));
  L.acik={A:false,B:false};
  return L;
}
function kati(L,tx,ty){
  const c=L.g[ty]&&L.g[ty][tx];
  if(c===undefined) return ty>=0;
  if(c==="#") return true;
  if((c==="A"||c==="B") && !L.acik[c]) return true;
  return false;
}

function satoSeviye(){
  const r=seeded(1902), W=12, H=50, g=[];
  for(let y=0;y<H;y++) g.push(("#"+".".repeat(W-2)+"#").split(""));
  for(let x=0;x<W;x++) g[H-1][x]="#";
  g[H-2][3]="P";
  let c=6, sayac=0;
  for(let y=H-4;y>=5;y-=3){
    c=clamp(c+(r()<.5?-1:1)*(3+Math.floor(r()*2)),2,9);
    const tas=r()<.25;
    for(let x=c-2;x<=c+1;x++) if(x>0&&x<W-1) g[y][x]=tas?"#":"=";
    sayac++;
    if(r()<.55) g[y-1][c]="h";
    if(sayac%4===0) g[y-1][c-1]="C";
    if(tas && r()<.5 && c+2<W-1){ g[y-1][c+1]="^"; }
    if(r()<.35){ const o= c>5? c-5 : c+4; if(o>1&&o<W-2){ g[y][o]="="; g[y][o+1]="="; g[y-1][o]="h"; } }

  g[3][7]="G"; g[3][4]="h";

}
