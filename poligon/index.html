<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#22251a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poligon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>*,*::before,*::after{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>HK33 & MPT-76 Poligonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: tek ekran simülatör — üstte görev ve ayar şeritleri, ortada nişan sahnesi, altta başparmak kontrolleri */
:root{
  --bg:#14160f; --panel:#22251a; --panel2:#2c3022; --line:#3d4230;
  --fg:#ebe7d6; --muted:#a6a38c; --accent:#ef7d2d; --ok:#a3c86b; --warn:#e8c25a; --bad:#e0584f;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.app{height:100%;display:flex;flex-direction:column;}
.wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
header{display:flex;align-items:center;gap:10px;padding-block:8px 6px;background:var(--panel);border-bottom:1px solid var(--line);}
h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;margin:0;text-transform:uppercase;line-height:1;}
h1 span{color:var(--accent);}
.spacer{flex:1;}
.iconbtn.new{background:var(--accent);color:#1b1206;border-color:var(--accent);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.6}}
.iconbtn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12px;padding:5px 9px;cursor:pointer;}
.settings{display:flex;flex-direction:column;gap:6px;padding-block:7px;background:var(--panel);border-bottom:1px solid var(--line);}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg button{background:transparent;color:var(--muted);border:0;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;padding:4px 9px;cursor:pointer;}
.seg button+button{border-left:1px solid var(--line);}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);}
.field{display:flex;align-items:center;gap:5px;}
.field .lbl{font-size:9.5px;}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-family:var(--display);font-weight:700;font-size:15px;padding:3px 6px;cursor:pointer;}
select#selMode{color:var(--accent);}
.locked{opacity:.4;pointer-events:none;}
.info{color:var(--muted);font-size:11px;letter-spacing:.02em;line-height:1.45;}
.info b{color:var(--fg);font-weight:600;}
@media (max-width:440px){.info .mech{display:none;}.settings{gap:5px;padding-block:6px;}}
.stage{position:relative;flex:1;min-height:0;touch-action:none;background:#000;overflow:hidden;}
canvas#view{display:block;width:100%;height:100%;cursor:crosshair;}
.hud{position:absolute;pointer-events:none;font-variant-numeric:tabular-nums;}
.hud.tl{top:8px;left:max(8px,env(safe-area-inset-left,0px));}
.hud.tr{top:8px;right:max(8px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.chip{background:rgba(20,22,15,.84);border:1px solid var(--line);border-radius:6px;padding:5px 8px;line-height:1.35;}
.ammo{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;}
.ammo small{font-size:14px;color:var(--muted);font-weight:700;}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.sel{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.06em;}
.sel.e{color:var(--ok);} .sel.t{color:var(--fg);} .sel.s{color:var(--bad);}
.small{font-size:11.5px;}
#card{width:96px;height:96px;display:block;border-radius:4px;}
.windchip{display:flex;align-items:center;gap:6px;max-width:150px;}
#windc{width:40px;height:40px;flex:none;}
.breath{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:10px;width:min(170px,40%);pointer-events:none;background:rgba(20,22,15,.84);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;}
#brTxt{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;line-height:1.1;color:var(--fg);}
.bbar{position:relative;height:8px;border-radius:4px;overflow:hidden;background:linear-gradient(90deg,#4a4d3d 0 33.3%,#6e7656 33.3% 41.7%,var(--ok) 41.7% 75%,var(--bad) 75% 100%);opacity:.9;}
.bbar i{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;background:var(--fg);box-shadow:0 0 0 1px #000;}
.bscale{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);}
.bar{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);}
.fig{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:10px;pointer-events:none;background:rgba(217,211,187,.93);border:1px solid var(--line);border-radius:8px;padding:4px 6px 5px;}
.fig canvas{display:block;width:150px;height:105px;}
.fig .lbl{color:#3a3f2a;text-align:center;font-weight:600;max-width:150px;line-height:1.35;letter-spacing:.06em;}
.toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg);text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;width:min(90%,420px);}
.toast.show{opacity:1;}
.runbox{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;background:rgba(20,22,15,.86);border:1px solid var(--line);border-radius:10px;padding:10px 16px;}
.runbox .big2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;}
.hint{position:absolute;left:50%;top:70%;transform:translateX(-50%);font-size:11px;color:var(--fg);background:rgba(20,22,15,.78);padding:4px 9px;border-radius:5px;pointer-events:none;transition:opacity .4s;text-align:center;width:max-content;max-width:86%;}
.controls{display:grid;grid-template-columns:1fr 1.8fr 1fr;gap:8px;padding-block:9px max(9px,env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);}
.ctl{touch-action:none;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.05em;text-transform:uppercase;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.05;}
.ctl small{font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.04em;color:var(--muted);text-transform:none;}
.ctl.fire{background:var(--accent);color:#1b1206;border-color:var(--accent);font-size:22px;}
.ctl.fire small{color:#3d230b;}
.ctl.active{outline:2px solid var(--fg);outline-offset:-2px;}
.ctl:focus-visible,.seg button:focus-visible,.iconbtn:focus-visible,select:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,11,7,.74);padding:12px;}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(380px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.04em;text-wrap:balance;line-height:1.05;}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
.big{font-family:var(--display);font-weight:800;font-size:52px;line-height:.9;color:var(--accent);}
.big small{font-size:20px;color:var(--muted);}
.rows{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:12px;}
.rows span:nth-child(odd){color:var(--muted);}
.rows span:nth-child(even){text-align:right;}
.note{font-size:12px;color:var(--fg);line-height:1.5;}
.note p{margin:0;color:var(--muted);}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;}
.btns{display:flex;gap:8px;}
.btns button{flex:1;}
.primary{background:var(--accent);color:#1b1206;border:0;border-radius:8px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:11px;cursor:pointer;}
.secondary{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:10px;cursor:pointer;}
.quiz{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;max-height:42%;overflow:auto;background:rgba(20,22,15,.92);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;}
.qtxt{font-size:12.5px;line-height:1.5;}
.qtxt b{color:var(--accent);font-weight:600;}
.qbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:5px;}
.qbtns button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em;padding:6px 5px;cursor:pointer;}
.qbtns button.go{background:var(--accent);color:#1b1206;border-color:var(--accent);}
.stage.quiz-on .breath,.stage.quiz-on .fig,.stage.quiz-on .hint,.stage.quiz-on .windchip{display:none;}
.stage.quiz-on #card{width:72px;height:72px;}
.stage.quiz-on .hud.tl{display:none;}
@media (max-width:440px){ h1{font-size:17px;} .seg button{font-size:14px;padding:4px 7px;} select{font-size:14px;} .ctl{font-size:15px;} .ctl.fire{font-size:20px;} .fig canvas{width:112px;height:78px;} .fig .lbl{max-width:112px;font-size:9px;} }
@media (prefers-reduced-motion:reduce){ .toast,.hint{transition:none;} }
</style>
</head>
<body>


<div class="app">
  <header class="wrap">
    <h1>HK33 <span>&amp;</span> MPT-76 Poligonu</h1>
    <div class="spacer"></div>
    <button class="iconbtn" id="upd" title="Güncellemeyi denetle">Güncelle</button>
    <button class="iconbtn" id="sound" aria-pressed="true">Ses: Açık</button>
  </header>
  <div class="settings wrap">
    <div class="row">
      <label class="field"><span class="lbl">Görev</span>
        <select id="selMode">
          <option value="serbest">Serbest atış</option>
          <option value="hata">Nişan hataları istasyonu</option>
          <option value="ogretim">1 · Öğretim atışı</option>
          <option value="sifirlama">2 · Test ve sıfırlama</option>
          <option value="guc">3 · Güç kazandırma</option>
          <option value="dayan">3 · Dayanıklılık</option>
        </select></label>
      <label class="field"><span class="lbl">Tüfek</span>
        <select id="selRifle"><option value="hk33">HK33</option><option value="mpt76">MPT-76</option><option value="mpt55">MPT-55</option><option value="g3">G-3</option><option value="ak">Kaleşnikof</option></select></label>
    </div>
    <div class="row">
      <label class="field" id="fTarget"><span class="lbl">Hedef</span>
        <select id="selTarget">
          <option value="bas">Baş</option><option value="gogus">Göğüs</option><option value="diz">Diz</option><option value="boy">Boy</option>
          <option value="halka">Halkalı kart</option><option value="kagit">25 m kâğıdı</option>
        </select></label>
      <label class="field" id="fDist"><span class="lbl">Mesafe</span>
        <select id="selDist"><option value="20" hidden>20 m</option><option value="25">25 m</option><option value="130" hidden>130 m</option><option value="100">100 m</option><option value="200">200 m</option><option value="300">300 m</option><option value="400">400 m</option></select></label>
      <label class="field" id="fGez"><span class="lbl">Gez</span>
        <select id="selGez"><option value="100">100 m</option><option value="200">200 m</option><option value="300">300 m</option><option value="400">400 m</option></select></label>
    </div>
    <div class="row">
      <div class="seg" id="segPos" role="group" aria-label="Duruş">
        <button data-v="stand" aria-pressed="false">Ayakta</button><button data-v="kneel" aria-pressed="false">Diz</button><button data-v="prone" aria-pressed="true">Yatarak</button>
      </div>
      <div class="seg" id="segSup" role="group" aria-label="Destek">
        <button data-v="free" aria-pressed="true">Desteksiz</button><button data-v="rest" aria-pressed="false">Destekli</button>
      </div>
      <div class="seg" id="segSight" role="group" aria-label="Nişangâh">
        <button data-v="iron" aria-pressed="true">Gez-Arpacık</button><button data-v="optic" aria-pressed="false">Dürbün 4×</button>
      </div>
    </div>
    <div class="info" id="info"></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="view" aria-label="Nişan görüntüsü"></canvas>
    <div class="hud tl">
      <div class="chip">
        <div class="lbl">Fişek</div>
        <div class="ammo" id="ammo">30<small>/30</small></div>
        <div class="sel t" id="selHud">T · Tek atış</div>
        <div class="lbl" style="margin-top:4px" id="taskLbl">Serbest</div>
        <div class="small" id="score">0/10 · 0 puan</div>
        <div class="small" id="timer" hidden></div>
        <div class="small" id="pulse">Nabız 72</div>
      </div>
    </div>
    <div class="hud tr">
      <canvas id="card" width="224" height="224" aria-label="Hedef kartı"></canvas>
      <div class="chip windchip"><canvas id="windc" width="80" height="80" aria-label="Rüzgâr yönü"></canvas><div class="small" id="wind">Rüzgâr yok</div></div>
    </div>
    <div class="breath" hidden>
      <div id="brTxt">Nefes alıyor</div>
      <div class="bbar"><i id="brMark" hidden></i></div>
      <div class="bscale"><span>0</span><span>4</span><span>5</span><span>9</span><span>12 sn</span></div>
      <div class="lbl" style="margin-top:2px">Tetik</div>
      <div class="bar"><i id="trBar"></i></div>
    </div>
    <div class="fig"><canvas id="fig" width="300" height="210" aria-label="Atıcının duruşu"></canvas><div class="lbl" id="figLbl">Yatarak</div></div>
    <div class="hint" id="hint">Sürükle: nişan al · ATEŞ: vur</div>
    <div class="runbox" id="runbox" hidden><div class="lbl" id="runLbl">Koşu</div><div class="big2" id="runVal">0:00</div></div>
    <div class="quiz" id="quiz" hidden><div class="lbl" id="qLbl"></div><div class="qtxt" id="qTxt"></div><div class="qbtns" id="qBtns"></div></div>
    <div class="toast" id="toast"></div>
    <div class="modal" id="modal" hidden>
      <div class="sheet">
        <div class="eyebrow" id="mEye"></div>
        <h2 id="mTitle"></h2>
        <div class="big" id="mScore"></div>
        <div class="rows" id="mRows"></div>
        <div class="note" id="mNote"></div>
        <div class="btns" id="mBtns"></div>
      </div>
    </div>
  </div>

  <div class="controls wrap">
    <button class="ctl" id="btnSel">Mandal<small>E · T · S</small></button>
    <button class="ctl fire" id="btnFire">Ateş<small>tetik</small></button>
    <button class="ctl" id="btnReload">Şarjör<small>değiştir</small></button>
  </div>
</div>

<script>
(()=>{
// ---------- Veri ----------
const RIFLES={
  hk33:{name:'HK33',cal:'5.56×45 mm',mag:30,magTxt:"30'luk",mech:'makaralı gecikmeli geri tepme',rpm:750,disp:0.28,kick:2.6,recov:9,
        drop:{25:0,100:0,200:0.35,300:1.0,400:2.1},wind:0.035,hole:0.0057,iron:'hk',tone:1500,magStyle:'curve',guard:.24},
  mpt76:{name:'MPT-76',cal:'7.62×51 mm',mag:20,magTxt:"20'lik",mech:'gaz pistonlu, döner kilitli',rpm:650,disp:0.2,kick:5.2,recov:6,
        drop:{25:0,100:0,200:0.5,300:1.27,400:2.4},wind:0.03,hole:0.0078,iron:'mpt',tone:900,magStyle:'short',guard:.27},
  mpt55:{name:'MPT-55',cal:'5.56×45 mm',mag:30,magTxt:"30'luk",mech:'gaz pistonlu, döner kilitli',rpm:700,disp:0.26,kick:2.5,recov:9.5,
        drop:{25:0,100:0,200:0.35,300:1.0,400:2.1},wind:0.035,hole:0.0057,iron:'mpt',tone:1550,magStyle:'curve',guard:.25},
  g3:{name:'G-3',cal:'7.62×51 mm',mag:20,magTxt:"20'lik",mech:'makaralı gecikmeli geri tepme',rpm:600,disp:0.24,kick:5.6,recov:6,
        drop:{25:0,100:0,200:0.5,300:1.27,400:2.4},wind:0.03,hole:0.0078,iron:'hk',tone:950,magStyle:'straight',guard:.27},
  ak:{name:'Kaleşnikof',cal:'7.62×39 mm',mag:30,magTxt:"30'luk",mech:'gaz pistonlu, döner kilitli',rpm:600,disp:0.45,kick:3.6,recov:7.5,
        drop:{25:0,100:0,200:0.95,300:2.35,400:4.4},wind:0.05,hole:0.0078,iron:'ak',tone:1100,magStyle:'ak',guard:.22,wood:1}
};
function dropAt(R,D){const ks=[100,200,300,400];if(D<=100)return 0;for(let i=1;i<ks.length;i++)if(D<=ks[i]){const a=ks[i-1],b=ks[i];return R.drop[a]+(R.drop[b]-R.drop[a])*(D-a)/(b-a);}return R.drop[400];}
const QERR={dogru:'Doğru nişan',acisal:'Açısal hata',paralel:'Paralel hata',yan:'Tüfeği yan tutma',nokta:'Yanlış nişan noktası'};
const DIRS=[['sağa',1,0],['sola',-1,0],['yukarı',0,-1],['aşağı',0,1]];
const POS={stand:{sway:1.8,rec:1.15,eye:1.5,br:.75,name:'Ayakta'},kneel:{sway:.95,rec:.9,eye:1.0,br:.85,name:'Diz çökerek'},prone:{sway:.4,rec:.7,eye:.35,br:1,name:'Yatarak'}};
const SEL={E:{t:'E · Emniyet',c:'e'},T:{t:'T · Tek atış',c:'t'},S:{t:'S · Seri atış',c:'s'}};
const TG={
  bas:{name:'Baş hedefi',size:'45×32 cm',aim:19,h:32},
  gogus:{name:'Göğüs hedefi',size:'45×50 cm',aim:18,h:50},
  diz:{name:'Diz hedefi',size:'45×76 cm',aim:34,h:76},
  boy:{name:'Boy hedefi',size:'45×150 cm',aim:95,h:150},
  halka:{name:'Halkalı kart',size:'80×80 cm'},
  kagit:{name:'25 m hedef kâğıdı',size:'20×26 cm'}
};
const TASKS={
  serbest:{name:'Serbest atış',short:'Serbest',shots:10},
  hata:{name:'Nişan hataları istasyonu',short:'Nişan hataları',target:'gogus',pos:'prone',sup:'rest',shots:0,
    desc:"10 nişan resmi göreceksin. Her birinde doğru nişan mı, yoksa açısal hata, paralel hata, tüfeği yan tutma ya da yanlış nişan noktası mı olduğunu bul. Her cevaptan sonra merminin nereye gideceği açıklanır.",
    tip:'Önce arpacığın gezin tam ortasında olup olmadığına, sonra arpacık ucunun hedefin neresinde durduğuna bak.'},
  ogretim:{name:'1 · Öğretim atışı',short:'Öğretim',target:'kagit',pos:'prone',sup:'rest',shots:3,
    desc:"25 m'den, yatarak destekli, hedef kâğıdına tek tek 3 atım. Vuruşların kâğıttaki yeri önemli değil; önemli olan 3 cm'lik bir daire içinde toplanmaları. Başaramazsan 3 atımlık kontrol atışı gelir.",
    tip:'Beyaz kareye nişan al, arpacığı gezin tam ortasında tut.'},

(function buildSil(){
  const cols=['#7f8a5a','#8b6f56','#cfc8b1','#5e5c7a','#6f7b4b'];
  let seed=7;const sr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(const k in SILS){
    const s=SILS[k],A=TG[k].aim,p=new Path2D();
    p.moveTo(s.body[0][0],s.body[0][1]+A);for(let i=1;i<s.body.length;i++)p.lineTo(s.body[i][0],s.body[i][1]+A);p.closePath();
    const y=s.head[0]+A,r=s.head[1],R=r+2;
    p.moveTo(r,y);p.arc(0,y,r,0,Math.PI*2);
    p.moveTo(-R,y);p.arc(0,y,R,Math.PI,Math.PI*2);p.lineTo(R+1,y+1);p.lineTo(-R-1,y+1);p.closePath();
    PATHS[k]=p;
    const bl=[],n=Math.round(14+TG[k].h/5);
    for(let i=0;i<n;i++)bl.push({x:(sr()*2-1)*24,y:-sr()*TG[k].h+A,rx:5+sr()*8,ry:4+sr()*7,a:sr()*3,c:cols[i%cols.length]});
    CAMO[k]=bl;
  }
})();

  return lx>=-.10&&lx<=.10&&ly>=-.14&&ly<=.12;
}

  if(type==='halka'){const r=Math.hypot(lx,ly);return r<.3?10-Math.floor(r/.03):0;}
  if(type==='kagit')return 0;

}

function group(shots){
  const pts=shots.map(s=>({x:s.mx*100,y:s.my*100}));
  if(!pts.length)return{d:0,c:{x:0,y:0}};
  if(pts.length===1)return{d:0,c:pts[0]};
  const inside=(c,r)=>pts.every(p=>Math.hypot(p.x-c.x,p.y-c.y)<=r+1e-6);
  let best={r:Infinity,c:pts[0]};
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const c={x:(pts[i].x+pts[j].x)/2,y:(pts[i].y+pts[j].y)/2},r=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)/2;
    if(r<best.r&&inside(c,r))best={r,c};
    for(let k=j+1;k<pts.length;k++){
      const a=pts[i],b=pts[j],q=pts[k],d=2*(a.x*(b.y-q.y)+b.x*(q.y-a.y)+q.x*(a.y-b.y));if(Math.abs(d)<1e-9)continue;
      const ux=((a.x*a.x+a.y*a.y)*(b.y-q.y)+(b.x*b.x+b.y*b.y)*(q.y-a.y)+(q.x*q.x+q.y*q.y)*(a.y-b.y))/d;
      const uy=((a.x*a.x+a.y*a.y)*(q.x-b.x)+(b.x*b.x+b.y*b.y)*(a.x-q.x)+(q.x*q.x+q.y*q.y)*(b.x-a.x))/d;
      const cc={x:ux,y:uy},rr=Math.hypot(a.x-ux,a.y-uy);if(rr<best.r&&inside(cc,rr))best={r:rr,c:cc};
    }
  }
  return{d:best.r*2,c:best.c};
}

  if(ti<0)for(let i=0;i<7;i++)S.puffs.push({x:ix,y:iy,vx:(rnd()-.5)*0.6,vy:-rnd()*0.8,t:0});
  const P=POS[S.pos],sr=S.sup==='rest'?.85:1;
  S.recY-=R.kick*(.8+rnd()*.4)*P.rec*sr;S.recX+=(rnd()-.5)*R.kick*.6*P.rec*sr;FIG.kick=1;
  S.post=1;S.flash=1;boom();$('hint').style.opacity=0;
  if(t0.type==='kagit')toast(ti>=0?'Kâğıtta':'Kâğıt dışı',700);
  else toast(ti>=0?(S.mode==='serbest'?sc+' puan':'Vuruş'):'Iska',800);
  drawCard();afterShot();
}
function afterShot(){
  const n=S.shots.length;
  if(S.mode==='serbest'){if(n>=10)finish();}
  else if(S.mode==='ogretim'){if(n>=3)phaseOgretim();}
  else if(S.mode==='sifirlama'){if(n>=3)phaseSifir();}
  else if(n>=2)finish();
}
function pauseFire(){S.trig.down=false;S.trig.p=0;}
function phaseOgretim(){
  pauseFire();const g=group(S.shots);
  if(S.phase===0&&g.d>3){
    S.done=true;
    setTimeout(()=>modal({eye:'Öğretim atışı',title:'Grup 3 cm\'yi aştı',big:g.d.toFixed(1)+'<small> cm</small>',notes:analyze(S.shots),
      buttons:[{label:'Kontrol atışı · 3 atım',primary:true,fn:()=>{S.prev=S.prev.concat(S.shots.map(s=>({...s,old:1})));S.shots=[];S.phase=1;S.done=false;$('modal').hidden=true;drawCard();}}]}),700);
  }else finish();
}
function phaseSifir(){
  pauseFire();const g=group(S.shots);
  if(S.phase===0){
    if(g.d<=3){
      const cx=g.c.x,cy=g.c.y;S.zeroErr.x-=cx*10/S.dist;S.zeroErr.y-=cy*10/S.dist;
      S.done=true;
      setTimeout(()=>modal({eye:'Test ve sıfırlama',title:'Grup uygun, nişangâh düzeltildi',big:g.d.toFixed(1)+'<small> cm grup</small>',
        intro:`Grubun merkezi nişan noktasının ${Math.abs(cx).toFixed(1)} cm ${cx>0?'sağında':'solunda'}, ${Math.abs(cy).toFixed(1)} cm ${cy>0?'altında':'üstünde'}. Nişangâh vuruşları ${Math.abs(cx).toFixed(1)} cm ${cx>0?'sola':'sağa'} ve ${Math.abs(cy).toFixed(1)} cm ${cy>0?'yukarı':'aşağı'} taşıyacak şekilde ayarlandı.`,
        notes:['Şimdi aynı nişan noktasına 3 kontrol atışı yap. Vuruşlar beyaz karenin çevresinde toplanmalı.'],
        buttons:[{label:'Kontrol atışı · 3 atım',primary:true,fn:()=>{S.prev=S.prev.concat(S.shots.map(s=>({...s,old:1})));S.shots=[];S.phase=1;S.done=false;$('modal').hidden=true;drawCard();}}]}),700);
    }else{
      S.attempt++;S.done=true;
      if(S.attempt>=3){finish();return;}
      setTimeout(()=>modal({eye:'Test ve sıfırlama',title:'Grup dağınık, düzeltme yapılmadı',big:g.d.toFixed(1)+'<small> cm</small>',
        intro:'Vuruşlar 3 cm\'lik daireye sığmadığı için sıfırlama değeri hesaplanamaz. Hataları düzeltip 3 atımı tekrarla.',notes:analyze(S.shots),
        buttons:[{label:'Tekrar 3 atım',primary:true,fn:()=>{S.prev=S.prev.concat(S.shots.map(s=>({...s,old:1})));S.shots=[];S.done=false;$('modal').hidden=true;drawCard();}}]}),700);
    }
  }else finish();
}
function finish(reason){
  if(S.done&&!reason)return;
  S.done=true;pauseFire();
  setTimeout(()=>showResult(reason),reason?300:700);
}

// ---------- Analiz ----------
function analyze(shots){
  const D=S.dist,n=shots.length,out=[],R=RIFLES[S.rifle];
  if(!n)return['Hiç atış yapılmadı.'];
  const nh=shots.filter(s=>!s.held).length;
  const badCut=shots.filter(s=>s.held&&!s.pause).length;
  const early=shots.filter(s=>s.held&&s.ht<4).length;
  const late=shots.filter(s=>s.held&&s.ht>9).length;
  const jerk=shots.filter(s=>s.jerk>.15).length;
  const ang=shots.filter(s=>s.mis>.22).length,cn=shots.filter(s=>Math.abs(s.cant)>3).length;
  if(ang)out.push(`${ang} atışta arpacık gezin ortasında değildi (açısal hata). Arpacığın gez içinde 1 mm kayması 200 m'de yaklaşık 35 cm sapma yapar; kaynağı her atışta aynı yere yap ve arpacığı ortalamadan tetiği düşürme.`);
  if(cn)out.push(`${cn} atışta tüfek yan tutuldu; mermi yatırılan tarafa ve biraz aşağı sapar. Arpacık hedefi dik olarak bölmeli.`);
  if(n>=3){
    const xs=shots.map(s=>s.mx*1000/D),ys=shots.map(s=>s.my*1000/D);
    const m=a=>a.reduce((p,v)=>p+v,0)/a.length,sd=a=>{const k=m(a);return Math.sqrt(a.reduce((p,v)=>p+(v-k)*(v-k),0)/a.length);};
    const sdx=sd(xs),sdy=sd(ys),mx=m(xs),my=m(ys);
    const big=Math.max(sdx,sdy)>(D<100?.35:.45);
    if(big){
      if(sdy>1.7*sdx)out.push('Vuruşlar dikey dağılmış. Namlu inip kalkarken ateş ediyorsun; arpacık sabitken vur.');
      else if(sdx>1.7*sdy)out.push('Vuruşlar yatay dağılmış. Bu genelde tetiğe yandan baskıdan ya da ani tetikten olur.');
      else out.push('Vuruşlar gelişigüzel dağılmış. Gözünü hedefe değil arpacığa odakla, kaslarını gevşet.');
    }else if(Math.hypot(mx,my)>(D<100?.6:.5)&&S.mode!=='sifirlama'){
      out.push(`Grup nişan noktasının ${Math.round(Math.abs(mx)*D/10)} cm ${mx>0?'sağında':'solunda'}, ${Math.round(Math.abs(my)*D/10)} cm ${my>0?'altında':'üstünde'} toplandı. Nişan noktasını, gezi, rüzgârı ve sıfırlamayı kontrol et.`);
    }
  }
  const dcg=D>=100?Math.round((dropAt(R,D)-dropAt(R,S.gez))*D/10):0;
  if(Math.abs(dcg)>=3){const dc=dcg;out.push(`Gez ${S.gez} m'de, hedef ${D} m'de. Mermi yaklaşık ${Math.abs(dc)} cm ${dc>0?'alçak':'yüksek'} vurur; gezi mesafeye bağla.`);}
  const we=windEff(S.wind.h);
  if(D>=200&&we&&S.wind.s>=2)out.push(`Rüzgâr saat ${S.wind.h} yönünden (${we===1?'tam':'yarım'} tesirli) mermiyi ${windSign(S.wind.h)<0?'sola':'sağa'} itiyor; ${windSign(S.wind.h)<0?'sağa':'sola'} pay ver.`);
  if(!out.length)out.push('Temiz atış: nişan ve gez-arpacık hizası uyumlu.');
  return out.slice(0,5);
}

// ---------- Sonuç ----------
function band(p){return p>=90?'Çok iyi':p>=70?'İyi':p>=50?'Orta':'Yetersiz';}

      rows:[['Grup çapı',g.d.toFixed(1)+' cm'],['Kâğıtta vuruş',S.shots.filter(s=>s.ti>=0).length+'/3'],['Şart','3 atım 3 cm\'lik daire içinde']],
      notes:ok?['Vuruşlar 3 cm içinde toplandı. Sıradaki görev: test ve sıfırlama.'].concat(analyze(S.shots).filter(x=>!x.startsWith('Temiz'))).slice(0,3):analyze(S.shots).concat(['Nişancılık istasyonlarına dönüp nefes ve tetik çalış, sonra görevi tekrarla.']).slice(0,4),
      buttons:[again,close]});
  }else if(S.mode==='sifirlama'){
    if(S.phase===0){
      modal({eye:'Test ve sıfırlama',title:'Sıfırlama yapılamadı',intro:'Üç denemede de grup 3 cm\'yi aştı.',notes:analyze(S.shots),buttons:[again,close]});return;
    }

    else if(g.d<=3){title='Son düzeltme uygulandı';intro=`Kontrol grubu sıkı ama merkezi ${off.toFixed(1)} cm kaçık. Bu düzeltme de nişangâha işlendi ve görev tamamlandı.`;S.zeroErr.x-=g.c.x*10/S.dist;S.zeroErr.y-=g.c.y*10/S.dist;}
    else{title='Kontrol grubu dağınık';intro=`Kontrol grubu ${g.d.toFixed(1)} cm, düzeltme doğrulanamadı.`;}
    modal({eye:'Test ve sıfırlama',title,big:g.d.toFixed(1)+'<small> cm grup</small>',intro,
      rows:[['Kontrol grubu',g.d.toFixed(1)+' cm'],['Merkez kaçıklığı',off.toFixed(1)+' cm'],['Şart','grup ≤ 3 cm, merkezde']],notes:analyze(S.shots),buttons:[again,close]});
  }else{
    const hits=S.shots.filter(s=>s.ti>=0).length,used=TASKS[S.mode].time-(S.timeLeft||0);

    if(S.mode==='dayan'){const a=S.shots.filter(s=>s.ti===0).length,b=S.shots.filter(s=>s.ti===1).length;rows.push(['Sol / sağ hedef',a+' / '+b]);rows.push(['Koşu süresi',fmt(S.runRt||0)]);}
    modal({eye:TASKS[S.mode].name+(reason?' · süre doldu':''),title:ok?'Görev yaptı':'Görev yapamadı',big:hits+'<small> vuruş</small>',
      intro:reason?'"Ateş kes!" Süre doldu.':'',rows,notes:analyze(S.shots),buttons:[again,close]});
  }
}

// ---------- Döngü ----------
const holdF=h=>h<1?.8:h<4?.5:h<5?.32:h<=9?.2:.2+(h-9)*.5;
let last=performance.now(),t=0,hudT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  const R=RIFLES[S.rifle],P=POS[S.pos],B=S.br,G=S.trig;
  // koşu / süre
  if(S.run){
    S.run.t+=dt;if(S.run.type==='sprint')S.timeLeft-=dt;
    if(S.run.t>=S.run.dur){if(S.run.type==='km')S.runRt=S.run.rt;S.run=null;S.tShoot=now;toast('Yat! Ateş serbest',1000);}
  }else if(S.timeLeft!=null&&S.started&&!S.done){
    S.timeLeft-=dt;if(S.timeLeft<=0){S.timeLeft=0;toast('Ateş kes!',1500);finish('time');}
  }
  // nabız
  const hr=S.run?S.hr0:72+(S.hr0-72)*Math.exp(-(now-S.tShoot)/1000/35);S.hr=hr;
  const hrF=1+(hr-72)/70;
  // nefes
  const T=clamp(4.5*72/hr,1.8,4.5);B.T=T;
  if(B.holding)B.held+=dt;else{B.phase=(B.phase+dt)%T;B.since+=dt;}
  const A=0;
  const u=B.phase/T;B.u=u;B.seg=u<1/3?'in':u<2/3?'out':'pause';
  let target;
  if(B.holding)target=B.off;
  else if(u<1/3)target=-A*(1-Math.cos(Math.PI*u*3))/2;
  else if(u<2/3)target=-A*(1+Math.cos(Math.PI*(u-1/3)*3))/2;
  else target=0;
  S.brY+=(target-S.brY)*Math.min(1,dt*10);
  // salınım
  let f=P.sway*(S.sup==='rest'?.45:1)*hrF*.35;
  S.post=Math.max(0,S.post-dt*1.4);f*=1+S.post*.6;
  S.amp+=(1.8*f-S.amp)*Math.min(1,dt*3);
  swX=S.amp*(Math.sin(t*.9+phase[0])*.55+Math.sin(t*2.3+phase[1])*.3+Math.sin(t*5.3+phase[2])*.15);
  swY=S.amp*(Math.sin(t*.7+phase[3])*.5+Math.sin(t*1.9+phase[4])*.3+Math.sin(t*4.7+phase[5])*.2);
  const bp=60/hr,ph=(t%bp)/0.09;swY+=Math.exp(-ph*ph)*.07*Math.max(0,(hr-72)/60);
  const d=Math.exp(-R.recov*dt);S.recX*=d;S.recY*=d;
  // nişan hataları: kaynak (arpacık-gez hizası) ve yan tutma kayar
  if(S.mode==='hata'){swX=swY=0;S.brY=0;S.recX=S.recY=0;S.mis.x=S.mis.y=0;S.cant=0;}
  else{
    const ms=(S.sight==='optic'?.6:1)*(S.pos==='stand'?1:S.pos==='kneel'?.8:.6)*(S.sup==='rest'?.8:1)*(1+(hr-72)/150)*(1+S.post*.5);
    const sq=Math.sqrt(dt);
    S.mis.x+=-S.mis.x*1.5*dt+gauss()*sq*.08*ms;S.mis.y+=-S.mis.y*1.5*dt+gauss()*sq*.08*ms;
    S.cant=clamp(S.cant-S.cant*.8*dt+gauss()*sq*.012*(S.pos==='stand'?1.3:1)*(S.sup==='rest'?.7:1),-.15,.15);
  }
  // şarjör
  if(S.reload>0){S.reload-=dt;if(S.reload<=0){S.reload=0;S.ammo=R.mag;toast('Hazır',600);}}
  // tetik
  if(G.down&&canShoot()&&S.reload<=0){
    if(G.p<1){G.p+=dt/G.need;if(G.p>=1){G.p=1;breakShot();}}
    else if(S.sel==='S'&&now-S.lastShot>=60000/R.rpm)breakShot();
  }
  S.flash=Math.max(0,S.flash-dt*8);
  S.puffs=S.puffs.filter(p=>(p.t+=dt)<0.9);
  render();drawFig(dt,t);
  if(now-hudT>80){hudT=now;hud();}
  requestAnimationFrame(frame);
}

function hud(){
  const R=RIFLES[S.rifle],B=S.br,T=TASKS[S.mode];
  $('ammo').innerHTML=(S.reload>0?'··':S.ammo)+'<small>/'+R.mag+'</small>';
  const sh=$('selHud');sh.textContent=SEL[S.sel].t;sh.className='sel '+SEL[S.sel].c;
  $('taskLbl').textContent=T.short+(S.mode==='sifirlama'||S.mode==='ogretim'?(S.phase?' · kontrol':' · 1. aşama'):'');
  const n=S.shots.length,ls=S.shots[n-1];
  let sc;
  if(S.targets[0].type==='kagit'){const g=group(S.shots);sc=`Atış ${n}/3`+(n>=2?` · grup ${g.d.toFixed(1)} cm`:'');}
  else if(S.mode==='serbest'){const tot=S.shots.reduce((a,s)=>a+s.sc,0);sc=`${n}/10 · ${tot} puan`+(ls?` · son ${ls.ti>=0?ls.sc:'ıska'}`:'');}
  else if(S.mode==='hata')sc=S.quiz?`${S.quiz.score} doğru`:'Başlamadı';
  else sc=`Atış ${n}/${T.shots} · ${S.shots.filter(s=>s.ti>=0).length} vuruş`;
  $('score').textContent=sc;
  const tm=$('timer');tm.hidden=S.timeLeft==null;if(S.timeLeft!=null){tm.textContent='Süre '+fmt(S.timeLeft);tm.style.color=S.timeLeft<15?'var(--bad)':'';}
  const p=$('pulse');p.textContent='Nabız '+Math.round(S.hr);p.style.color=S.hr>130?'var(--bad)':S.hr>100?'var(--warn)':'';
  // nefes
  const bt=$('brTxt'),mk=$('brMark');
  if(B.holding){
    mk.hidden=false;mk.style.left=(Math.min(B.held,12)/12*100)+'%';
    const h=B.held;
    if(h<4){bt.textContent=`Nefes kesildi · ${h.toFixed(1)} sn`;bt.style.color='var(--muted)';}
    else if(h<5){bt.textContent=`${h.toFixed(1)} sn · tetik boşluğunu al`;bt.style.color='var(--fg)';}
    else if(h<=9){bt.textContent=`${h.toFixed(1)} sn · tetiği düşür`;bt.style.color='var(--ok)';}
    else{bt.textContent=`${h.toFixed(1)} sn · yeniden nefes al`;bt.style.color='var(--bad)';}
  }else{
    mk.hidden=true;
    if(B.seg==='pause'){bt.textContent='Doğal boşluk: şimdi kes';bt.style.color='var(--ok)';}
    else{bt.textContent=B.seg==='in'?'Nefes alıyor':'Nefes veriyor';bt.style.color='var(--fg)';}
  }
  $('trBar').style.transform=`scaleX(${S.trig.down?Math.min(1,S.trig.p):0})`;
  // koşu kutusu
  const rb=$('runbox');
  if(S.run){rb.hidden=false;
    if(S.run.type==='km'){$('runLbl').textContent='1 km koşu';$('runVal').textContent=fmt(S.run.rt*Math.min(1,S.run.t/S.run.dur));}
    else{$('runLbl').textContent='50 m sıçrama';$('runVal').textContent=S.run.t<S.run.dur/2?'25 m':'50 m';}
  }else rb.hidden=true;
}

// ---------- Çizim ----------
function render(){
  if(!W)resize();
  const D=S.dist,P=POS[S.pos];
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const p=pxm();
  const camX=S.aimX+swX+S.recX,camY=S.aimY+swY+S.brY+S.recY;
  const sh=S.flash*4;ctx.translate((rnd()-.5)*sh,(rnd()-.5)*sh);
  const CY=VCY(),X=x=>W/2+(x-camX)*p,Y=y=>CY+(y-camY)*p;
  const m=v=>v*1000/D;
  const gr=groundOf(S.targets[0].type);
  const hy=Y(m(gr-P.eye));
  let g=ctx.createLinearGradient(0,hy-H,0,hy);g.addColorStop(0,'#7fa3c4');g.addColorStop(1,'#d9e2dd');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,Math.max(0,hy+20));
  g=ctx.createLinearGradient(0,hy,0,hy+H);g.addColorStop(0,'#8c9468');g.addColorStop(1,'#5f6a3c');
  ctx.fillStyle=g;ctx.fillRect(-20,hy,W+40,H+40);
  ctx.fillStyle='#4d5a3a';ctx.beginPath();ctx.moveTo(-20,hy);
  const step=Math.max(4,p*1.2);
  for(let sx=-20;sx<W+20;sx+=step){const wx=Math.floor((sx-W/2)/p+camX);const h=trees[((wx%220)+220)%220]*p*1.6;ctx.lineTo(sx,hy-h);}
  ctx.lineTo(W+20,hy);ctx.fill();
  const gy=Y(m(gr)),by=Y(m(gr-Math.max(2.2,gr+1)));
  ctx.fillStyle='#8a7350';ctx.beginPath();ctx.moveTo(X(m(-45)),gy);ctx.bezierCurveTo(X(m(-30)),by,X(m(30)),by,X(m(45)),gy);ctx.fill();
  ctx.fillStyle='rgba(60,45,25,.25)';ctx.fillRect(X(m(-45)),gy-2,m(90)*p,3);
  const pm=m(1)*p,t0=S.targets[0].type;
  if(S.targets.length===1)[-4,4].forEach(o=>drawTarget(ctx,X(m(o)),Y(0),pm,t0,[],{}));
  S.targets.forEach((tg,i)=>drawTarget(ctx,X(m(tg.x)),Y(0),pm,tg.type,holesFor(i,false),{main:true}));
  // mesafe levhası
  const lx=X(m(S.targets.length>1?1.3:(t0==='kagit'?.3:.6))),lw=m(t0==='kagit'?.18:.5)*p,ly=gy-lw*1.6;
  ctx.fillStyle='#3a3f2a';ctx.fillRect(lx+lw*.45,ly,Math.max(1,lw*.08),gy-ly);
  ctx.fillStyle='#f2d24a';ctx.fillRect(lx,ly-lw*.5,lw,lw*.5);
  if(lw>14){ctx.fillStyle='#1b1c16';ctx.font=`800 ${lw*.3}px "Saira Condensed","Arial Narrow",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(D+' m',lx+lw/2,ly-lw*.24);}
  const nowm=performance.now();S.marks=S.marks.filter(k=>nowm-k.t<1800);
  S.marks.forEach(k=>{const a=1-(nowm-k.t)/1800,x=X(k.x),y=Y(k.y),r=7;ctx.strokeStyle=`rgba(224,88,79,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();});
  S.puffs.forEach(q=>{const a=1-q.t/.9;ctx.fillStyle=`rgba(150,125,90,${a*.7})`;ctx.beginPath();ctx.arc(X(q.x+q.vx*q.t*3),Y(q.y+q.vy*q.t*3),(2+q.t*10)*(p/6),0,Math.PI*2);ctx.fill();});
  ctx.setTransform(dpr,0,0,dpr,0,0);

function drawIron(type,o={x:0,y:0},cant=0){

  const Q=S.quiz;if(Q.i>=10){quizEnd();return;}
  const keys=Object.keys(QERR),k=keys[Math.floor(rnd()*keys.length)],d=DIRS[Math.floor(rnd()*4)];
  const q={k,d,ox:0,oy:0,cant:0,ax:0,ay:0},Rr=Math.min(W,VH())*.44,p=pxm();
  if(k==='acisal'){q.ox=d[1]*Rr*.13;q.oy=d[2]*Rr*.13;}
  else if(k==='paralel'){q.ax=d[1]*1.35;q.ay=d[2]*1.7;}
  else if(k==='yan'){q.cant=(rnd()<.5?-1:1)*(.14+rnd()*.06);}
  else if(k==='nokta'){q.up=rnd()<.5;q.ay=q.up?-1.3:.75;}
  S.aimX=q.ax-q.ox/p;S.aimY=q.ay-q.oy/p;
  Q.q=q;Q.ans=false;qPanel();
}
function explain(q){
  const dn=q.d[0];
  if(q.k==='dogru')return 'Arpacık gezin tam ortasında, ucu göğüs hedefinin ortasında. Mermi nişan noktasına gider.';
  if(q.k==='acisal')return `Arpacık gezin içinde ${dn} kaymış. Namlu da o yöne bakar: mermi <b>${dn}</b> sapar ve sapma mesafeyle büyür. 1 mm'lik kayma 200 m'de yaklaşık 35 cm eder.`;
  if(q.k==='paralel')return `Gez ve arpacık doğru hizalı, ama nişan hattı hedefin ${dn==='sağa'?'sağına':dn==='sola'?'soluna':dn==='yukarı'?'üstüne':'altına'} kaymış. Mermi nişan hattının gösterdiği yere gider; sapma kayma kadardır, açısal hata gibi mesafeyle büyümez.`;
  if(q.k==='yan')return `Tüfek ${q.cant>0?'sağa':'sola'} yatırılmış; arpacık hedefi dik olarak bölmüyor. Mermi <b>${q.cant>0?'sağa':'sola'}</b> ve biraz aşağı sapar.`;
  return `Gez-arpacık hizası doğru, ama nişan noktası yanlış: arpacık ucu ${q.up?'kaskın üstünde':'hedefin alt kenarında'}. Bu mesafede göğüs hedefinin ortasına nişan alınır.`;
}
function qPanel(){
  const Q=S.quiz,q=Q.q,bx=$('qBtns');bx.innerHTML='';
  $('qLbl').textContent=`Nişan resmi ${Q.i+1}/10 · ${Q.score} doğru`;
  if(!Q.ans){
    $('qTxt').textContent='Bu nişan resminde ne var? (200 m, göğüs hedefi)';
    Object.keys(QERR).forEach(k=>{const b=document.createElement('button');b.textContent=QERR[k];b.addEventListener('click',()=>{Q.ans=true;Q.pick=k;if(k===q.k)Q.score++;qPanel();click(k===q.k?1800:400,.06,.2);});bx.appendChild(b);});
  }else{
    const ok=Q.pick===q.k;
    $('qTxt').innerHTML=(ok?'<b>Doğru.</b> ':`<b>Yanlış.</b> Bu bir ${QERR[q.k].toLowerCase()}. `)+explain(q);
    const b=document.createElement('button');b.className='go';b.textContent=Q.i>=9?'Sonucu gör':'Sonraki';b.addEventListener('click',()=>{Q.i++;nextQ();});bx.appendChild(b);
  }
}
function quizEnd(){
  const sc=S.quiz.score*10;$('quiz').hidden=true;
  modal({eye:'Nişan hataları istasyonu',title:band(sc),big:S.quiz.score+'<small>/10</small>',
    notes:['Açısal hata: arpacık gezin ortasında değil; sapma mesafeyle büyür.','Paralel hata: hiza doğru ama nişan hattı kaymış; sapma kayma kadardır.','Yan tutma: mermi yatırılan tarafa ve aşağı sapar.','Atış sırasında da arpacık gezde kayar ve tüfek yan yatar; arpacık ortadayken ve dikken tetiği düşür.'],
    buttons:[{label:'Tekrar',primary:true,fn:()=>{$('modal').hidden=true;quizStart();}},{label:'Serbest atış',fn:()=>{S.mode='serbest';setup();}}]});
}

resize();setup();
requestAnimationFrame(frame);
})();
</script>

<script>
// barındırılan PWA: servis çalışanı ve version.json ile sürüm denetimi
(()=>{
const VER=1,btn=document.getElementById('upd');
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
let newer=0;
async function check(){if(!/^https?:/.test(location.protocol))return;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(+j.v>VER){newer=+j.v;btn.classList.add('new');btn.textContent='Yeni sürüm '+j.v;btn.title=j.not||'';}}catch(e){}}
btn.addEventListener('click',async()=>{
  btn.textContent='Yükleniyor…';
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('poligon-')).map(k=>caches.delete(k)));}catch(e){}
  try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update();}catch(e){}
  location.reload();
});
check();setInterval(check,10*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
})();
</script>
