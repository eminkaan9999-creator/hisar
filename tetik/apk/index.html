/* ---------------------------------------------------------------- Akıllı saat
   Android uygulaması: atış sonucu, seri özeti ve Başla/Dur düğmeleri telefon bildirimi olarak gider; saat telefonun
   bildirimlerini gösteriyorsa (Wear OS, Galaxy Watch, Huawei, Xiaomi, Amazfit, Garmin…) titrer ve yazar.
   iPhone'da bildirimler Apple Watch'a yalnız telefon kilitliyken düşer: Apple Watch için ayrı saat uygulaması gerekir. */
function saatVar(){ return APK&&!IOS_APP&&typeof window.HisarNative.saat==="function"; }
function saatDesc(){ return !saatVar()?(IOS_APP?"Apple Watch için saat uygulaması gerekir":"Android uygulamasında"):S.saat?"Açık · bildirimle":"Kapalı"; }
function saatGonder(o,force){ if(!(force||S.saat)||!saatVar()) return false; try{ window.HisarNative.saat(JSON.stringify(o)); return true; }catch(e){ return false; } }
const saatIyi=sc=>sc>=(S.sesEsik||85);
function saatAtis(r,q){
  if(!S.saat||!S.saatAtis||source==="phone"||!r||!r.active) return;     // telefon silahtaysa titreşim ölçümü bozar
  const d=r.sess.drill; if(SPEED.has(d)||d==="par"||d==="surpriz") return;  // hızlı alıştırmada atış başına bildirim yok
  const iyi=saatIyi(q.sc), ne=!iyi&&q.c&&q.c.length&&CAUSES[q.c[0]]?CAUSES[q.c[0]].ad:"";
  saatGonder({t:"atis",iyi,baslik:`${Math.round(q.sc)} · ${iyi?"İyi atış":ne||"Kötü atış"}`,metin:`${DRM[d]?DRM[d].ad:""} · ${q.n}. atış`,komut:S.saatKomut?"dur":""});
}
function saatOzet(s){
  if(!S.saat||!S.saatOzet||isDemoSess(s)) return;
  const v=validShots(s); if(!v.length) return;
  const ort=Math.round(v.reduce((a,q)=>a+q.sc,0)/v.length), iyi=v.filter(q=>saatIyi(q.sc)).length, say={};
  v.forEach(q=>{ if(q.sc<85&&q.c&&q.c[0]&&CAUSES[q.c[0]]) say[q.c[0]]=(say[q.c[0]]||0)+1; });
  const en=Object.entries(say).sort((a,b)=>b[1]-a[1])[0];
  saatGonder({t:"ozet",iyi:saatIyi(ort),baslik:`Seri bitti · ortalama ${ort}`,metin:`${v.length} atış · ${iyi} iyi${en?" · en sık: "+CAUSES[en[0]].ad.toLocaleLowerCase("tr"):""}`,komut:S.saatKomut?"basla":""});
}
function saatHazir(id){ if(!S.saat||!S.saatKomut||!DRM[id]) return; saatGonder({t:"hazir",baslik:`Hazır · ${DRM[id].ad}`,metin:"Saatten Başla'ya basınca seri başlar.",komut:"basla"}); }
// saatteki Başla / Dur (bildirim düğmesi) → yerel katman → burası
window.__hisarSaat=cmd=>{
  if(!S.saat||!S.saatKomut) return;
  if(cmd==="dur"){ if(cur.run&&cur.run.active) stopRun(false); return; }
  if(cmd!=="basla"||mesgul()) return;
  if(curView==="oturum"&&cur.sess&&!pages.length) startRun();
  else { openDrill(cur.sess?cur.sess.drill:"serbest"); setTimeout(()=>{ if(!(cur.run&&cur.run.active)) startRun(); },1200); }
};
// Android 13+: bildirim izni (saate gönderme açılınca bir kez sorulur)

  if(!saatVar()){ cb(false); return; }
  if(typeof window.HisarNative.saatIzin!=="function"){ cb(true); return; }
  window.__hisarSaatIzin=ok=>{ window.__hisarSaatIzin=null; cb(!!ok); };
  try{ window.HisarNative.saatIzin(); }catch(e){ cb(false); }
}

  });
}

/* ---------------------------------------------------------------- Sensörü bul (AirPods'taki gibi)
   Sensörde GPS yok. Bağlıyken ve bağlantı koptuğu an telefonun konumu "son görüldüğü yer" olarak kaydedilir (yalnız bu
   telefonda). Yakındayken (Bluetooth menzili) sinyal gücüyle sıcak-soğuk gösterilir; sensör istenirse bulunana kadar öter. */
let konumBekle=null;
window.__hisarKonum=r=>{ const f=konumBekle; konumBekle=null; if(f) f(r||{hata:"konum"}); };
// telefonun konumu: uygulamada yerel (HisarNative.konum), tarayıcıda Geolocation. Sonuç {lat,lon,acc} ya da {hata}
function konumAl(cb){
  const done=r=>{ try{ cb(r); }catch(e){} };
  if(APK&&typeof window.HisarNative.konum!=="function"){ done({hata:"surum"}); return; }   // eski uygulama: konum köprüsü yok
  if(APK&&window.HisarNative&&typeof window.HisarNative.konum==="function"){
    if(konumBekle){ const prev=konumBekle; konumBekle=r=>{ prev(r); done(r); }; return; }
    const mine=r=>done(r); konumBekle=mine;
    setTimeout(()=>{ if(konumBekle===mine){ konumBekle=null; done({hata:"zaman"}); } },25000);
    try{ window.HisarNative.konum(); }catch(e){ konumBekle=null; done({hata:"yok"}); }
    return; }
  if(!navigator.geolocation){ done({hata:"yok"}); return; }
  try{ navigator.geolocation.getCurrentPosition(p=>done({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),
    e=>done({hata:e&&e.code===1?"izin":"konum"}),{enableHighAccuracy:true,timeout:20000,maximumAge:15000}); }catch(e){ done({hata:"yok"}); }
}
// son görüldüğü yeri kaydet: bağlanınca, bağlıyken 2 dakikada bir, bağlantı koptuğu an
function sonYerAl(ev){
  if(!S.yerKaydet||source!=="sensor") return;
  const t=now(); if(sonYerAl.busy&&t-sonYerAl.busy<25000) return;
  if(ev!=="elle"&&t<(sonYerAl.dur||0)) return;            // olmadıysa ara ver (izin verilmediyse yalnız kullanıcı isteyince yeniden sorulur)
  sonYerAl.busy=t;
  konumAl(r=>{ sonYerAl.busy=0;
    if(r&&isFinite(r.lat)&&isFinite(r.lon)){ sonYerAl.dur=0; sonYerAl.hata="";
      S.sonYer={lat:+(+r.lat).toFixed(6),lon:+(+r.lon).toFixed(6),acc:Math.max(0,Math.round(+r.acc||0)),t:Date.now(),ev}; saveMeta(); }
    else { const h=sonYerAl.hata=r&&r.hata||"konum"; sonYerAl.dur=now()+(h==="izin"?1e12:["kapali","yok","surum"].includes(h)?300000:120000); }
    if(setPage==="bul") bulYer(); });
}
const BUL={rs:[],sound:0,until:0,me:null,meT:0,z:17,zUser:false};
function rssiTxt(r){ return r==null?"–":r>-55?"çok yakın (1–2 m)":r>-65?"yakın (yaklaşık 2–5 m)":r>-75?"orta (yaklaşık 5–10 m)":r>-85?"uzak (yaklaşık 10–20 m)":"çok uzak (20 m ve ötesi)"; }
function rssiLv(r){ return r==null?0:r>-55?5:r>-65?4:r>-75?3:r>-85?2:1; }
// yaklaşıyor mu: son 2 saniyenin ortalaması ile önceki 4 saniyenin ortalaması (3 dB'den küçük fark "aynı")
function rssiYon(){ const a=BUL.rs, t=now(), av=x=>x.reduce((s,v)=>s+v[1],0)/x.length;
  const s2=a.filter(v=>t-v[0]<=2200), s1=a.filter(v=>t-v[0]>2200&&t-v[0]<=6500); if(s2.length<2||s1.length<2) return 0;
  const d=av(s2)-av(s1); return d>=3?1:d<=-3?-1:0; }
const YON8=["kuzeyde","kuzeydoğuda","doğuda","güneydoğuda","güneyde","güneybatıda","batıda","kuzeybatıda"];
function uzaklik(a,b){ const R=6371000, f1=a.lat*RAD, f2=b.lat*RAD, df=(b.lat-a.lat)*RAD, dl=(b.lon-a.lon)*RAD;
  const h=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2, d=2*R*Math.asin(Math.min(1,Math.sqrt(h)));
  const y=Math.sin(dl)*Math.cos(f2), x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl); let br=Math.atan2(y,x)*DEG; if(br<0) br+=360;
  return {d,br,yon:YON8[Math.round(br/45)%8]}; }
const mTxt=m=>m<1000?Math.round(m)+" m":fx(m/1000,1)+" km";
function haritaUrl(y){ const q=encodeURIComponent("HİSAR sensörü");
  return IS_IOS?`https://maps.apple.com/?ll=${y.lat},${y.lon}&q=${q}`:`https://www.google.com/maps/search/?api=1&query=${y.lat},${y.lon}`; }
// OpenStreetMap karoları: noktayı ortaya alan 3×3 karo, üstünde sensör (turkuaz) ve telefon (mavi). İnternet yoksa yalnız yazı.
const mercKaro=(a,n)=>[(a.lon+180)/360*n,(1-Math.log(Math.tan(a.lat*RAD)+1/Math.cos(a.lat*RAD))/Math.PI)/2*n];   // karo birimi
const HMX=150, HMY=105;                                  // haritada görünen alan: ortadan ± piksel (250 px yükseklik)
// sensör ve telefon birlikte görünsün diye yakınlık (kullanıcı kendisi yakınlaştırmadıysa)
function fitZoom(y,me){ for(let z=18;z>13;z--){ const n=2**z, p=mercKaro(y,n), q=mercKaro(me,n);
  if(Math.abs(q[0]-p[0])*256<HMX&&Math.abs(q[1]-p[1])*256<HMY) return z; } return 13; }
function haritaHtml(y,me){
  const z=BUL.z, n=2**z, lat=y.lat*RAD, [xf,yf]=mercKaro(y,n);
  const tx=Math.floor(xf), ty=Math.floor(yf), mpp=156543.03*Math.cos(lat)/n;
  let h=`<div class="harita" id="bulHarita" role="img" aria-label="Son görüldüğü yerin haritası"><div class="hk">`;
  for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const X=((tx+i)%n+n)%n, Y=ty+j; if(Y<0||Y>=n) continue;
    h+=`<img alt="" draggable="false" loading="lazy" src="https://tile.openstreetmap.org/${z}/${X}/${Y}.png" style="left:calc(50% + ${((tx+i-xf)*256).toFixed(1)}px);top:calc(50% + ${((ty+j-yf)*256).toFixed(1)}px)">`; }
  h+=`</div>`;
  const ar=y.acc?Math.min(140,y.acc/mpp):0; if(ar>6) h+=`<i class="hdo" style="width:${(2*ar).toFixed(0)}px;height:${(2*ar).toFixed(0)}px"></i>`;
  h+=`<i class="hsn" title="Sensörün son görüldüğü yer"></i>`;
  if(me){ const q=mercKaro(me,n), mx=(q[0]-xf)*256, my=(q[1]-yf)*256;
    if(Math.abs(mx)<HMX&&Math.abs(my)<HMY) h+=`<i class="hme" style="left:calc(50% + ${mx.toFixed(1)}px);top:calc(50% + ${my.toFixed(1)}px)" title="Sen buradasın"></i>`; }
  h+=`<div class="hz"><button data-z="1" aria-label="Yakınlaştır">+</button><button data-z="-1" aria-label="Uzaklaştır">−</button></div>`;
  h+=`<p class="hn" hidden>Harita için internet gerekir. Konum aşağıda yazıyor.</p><a class="hcp" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></div>`;
  return h;
}
const EV_T={baglandi:"bağlandığında",bagli:"bağlıyken",koptu:"bağlantı koptuğunda",elle:"elle kaydedildi"};
function bulYerHtml(){
  const y=S.sonYer;
  if(!S.yerKaydet) return `<p class="note">Son görüldüğü yer kaydı kapalı.</p>`;
  if(!y){ const e=sonYerAl.hata; return `<p class="note">${e==="izin"?"Konum izni verilmedi. Telefonun ayarlarından HİSAR TETİK için konum iznini aç, sonra aşağıdan yeniden dene.":e==="kapali"?"Telefonun konum servisi kapalı. Ayarlar'dan konumu aç, sonra aşağıdan yeniden dene.":e==="zaman"||e==="konum"?"Konum şu an alınamadı (kapalı yerde GPS zayıf olabilir). Açık havada aşağıdan yeniden dene.":e==="yok"?"Bu telefonda konum alınamıyor.":e==="surum"?(IOS_APP?"Konum için uygulamanın yeni sürümü gerekiyor: yeni IPA'yı Sideloadly ile kur.":"Konum için uygulamanın yeni sürümü gerekiyor: Ayarlar'daki güncellemeden yeni APK'yı kur."):"Henüz kayıtlı yer yok. Sensör bağlıyken telefonun konumu kaydedilir."}</p>`; }
  const me=BUL.me, u=me?uzaklik(me,y):null;
  return `<p class="an-s">Son görülme: <b>${esc(ago(Date.now()-y.t))}</b> · ${esc(EV_T[y.ev]||"")}${y.acc?` · ±${y.acc} m`:""}</p>
    ${u?`<p class="an-s" id="bulUzak">Buradan <b>≈ ${esc(mTxt(u.d))}</b>${u.d>=15?`, <b>${esc(u.yon)}</b>`:", çok yakınında"}.</p>`:""}
    ${haritaHtml(y,me)}
    <div class="btn-row"><button class="btn primary" id="bulAc">Haritalar'da aç</button></div>
    <p class="note">Konum: ${esc(fx(Math.abs(y.lat),5))}° ${y.lat>=0?"K":"G"} · ${esc(fx(Math.abs(y.lon),5))}° ${y.lon>=0?"D":"B"}</p>`;
}
function bulCanliHtml(){
  const on=source==="sensor"&&ble.st==="bagli", r=on?ble.rssi:null, lv=rssiLv(r), yon=rssiYon();
  if(source!=="sensor") return `<p class="note">Veri kaynağı şu an ${esc(srcName(source))}. Sensörü bulmak için önce Sensör sekmesinden sensöre geç.</p>`;
  if(!on) return `<div class="bul-sin" aria-live="polite"><div class="bars">${[1,2,3,4,5].map(i=>`<i style="height:${8+i*6}px"></i>`).join("")}</div><div><b>Menzil dışında ya da kapalı</b><small>Sensör yakına gelince (10–30 m) uygulama kendiliğinden bağlanır.</small></div></div>`;
  return `<div class="bul-sin" aria-live="polite"><div class="bars">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?"on":""}" style="height:${8+i*6}px"></i>`).join("")}</div>
    <div><b>${esc(rssiTxt(r))}</b><small>${r==null?"sinyal ölçülüyor…":r+" dBm"}${yon>0?" · ▲ yaklaşıyorsun":yon<0?" · ▼ uzaklaşıyorsun":""}</small></div></div>`;
}
function bulBody(){
  const on=sensorCanBeep(), sure=BUL.until>now();
  return `<div class="pg"><div class="card"><div class="ch"><h2>Yakında mı?</h2>${infoBtn("bul")}</div><div id="bulCanli">${bulCanliHtml()}</div>
      <button class="btn ${sure?"danger":"primary"}" id="bulCal" ${on||sure?"":"disabled"}>${sure?"Buldum, sustur":"Bulana kadar öttür"}</button>
      <p class="note" id="bulCalN">${sure?"Sensör ötüyor ve ışığı yanıp sönüyor.":on?"Sensör sen durdurana kadar (en çok 3 dakika) öter ve ışığı yanıp söner.":"Öttürmek için sensör bağlı olmalı."}</p></div>
    <div class="card"><div class="ch"><h2>Son görüldüğü yer</h2></div><div id="bulYer" class="view" style="gap:10px">${bulYerHtml()}</div>
      <label class="toggle">Son yeri kaydet<input type="checkbox" id="bulKayit" ${S.yerKaydet?"checked":""}></label>
      <p class="note">Sensörde GPS yok: bağlıyken ve bağlantı koptuğu an telefonun konumu kaydedilir. Konum yalnız bu telefonda saklanır, hiçbir yere gönderilmez.</p>
      <button class="btn" id="bulSimdi" ${S.yerKaydet?"":"disabled"}>Şimdiki yerimi kaydet</button></div></div>`;
}
function bindBul(root){
  const cal=root.querySelector("#bulCal"); if(cal) cal.onclick=()=>{ if(BUL.until>now()) bulDur(true); else bulBasla(); };
  root.querySelector("#bulKayit").onchange=e=>{ S.yerKaydet=e.target.checked; saveMeta(); if(S.yerKaydet) sonYerAl("elle"); refreshPage(); };
  root.querySelector("#bulSimdi").onclick=()=>{ sonYerAl.busy=0; sonYerAl("elle"); toast("Konum alınıyor…"); };
  bindBulYer(root);
}
function bindBulYer(root){
  const ac=root.querySelector("#bulAc"); if(ac) ac.onclick=()=>{ if(S.sonYer) openExternal(haritaUrl(S.sonYer)); };
  root.querySelectorAll("#bulHarita [data-z]").forEach(b=>b.onclick=()=>{ BUL.z=clamp(BUL.z+(+b.dataset.z),13,19); BUL.zUser=true; bulYer(); });
  const imgs=root.querySelectorAll("#bulHarita img"); let bad=0;
  imgs.forEach(im=>im.onerror=()=>{ im.remove(); if(++bad>=imgs.length){ const n=root.querySelector("#bulHarita .hn"); if(n) n.hidden=false; } });
}
function bulYer(){ const el=$("bulYer"); if(!el) return; el.innerHTML=bulYerHtml(); bindBulYer(el); }
function openBul(){
  BUL.rs=[]; BUL.me=null; BUL.z=17; BUL.zUser=false;
  pushPage({set:"bul",back:"",title:"Sensörü bul",render:bulBody,bind:bindBul,onPop:()=>{ bulDur(false); }});
  if(S.sonYer) konumAl(r=>{ if(r&&isFinite(r.lat)){ BUL.me={lat:+r.lat,lon:+r.lon}; BUL.meT=now(); if(!BUL.zUser&&S.sonYer) BUL.z=fitZoom(S.sonYer,BUL.me); if(setPage==="bul") bulYer(); } });
}
function bulBasla(){ if(!sensorCanBeep()){ toast("Sensör bağlı değil."); return; } BUL.until=now()+180000; BUL.sound=0; bulTik(); if(setPage==="bul") refreshPage(); }
function bulDur(ui){ const was=BUL.until>now(); BUL.until=0; if(ui&&was) toast("Tamam, sensör sustu."); if(ui&&setPage==="bul") refreshPage(); }
// her saniye: bulma sayfası açıksa sinyal; öttürme açıksa 3 saniyede bir "Sensörü bul" komutu; bağlıyken 2 dakikada bir konum
function bulTik(){
  const t=now();
  if(source==="sensor"&&ble.st==="bagli"&&S.yerKaydet&&(!S.sonYer||Date.now()-S.sonYer.t>120000)) sonYerAl("bagli");
  if(BUL.until){ if(t>BUL.until){ BUL.until=0; if(setPage==="bul"){ toast("Sensör 3 dakika öttü, durduruldu."); refreshPage(); } }
    else if(sensorCanBeep()&&t-BUL.sound>=2900){ BUL.sound=t; bleCmd([0x03]); } }
  if(setPage!=="bul") return;
  if(source==="sensor"&&ble.st==="bagli"&&ble.rssi!=null){ BUL.rs.push([t,ble.rssi]); while(BUL.rs.length&&t-BUL.rs[0][0]>8000) BUL.rs.shift(); }
  const c=$("bulCanli"); if(c){ const h=bulCanliHtml(); if(c._h!==h){ c._h=h; c.innerHTML=h; } }
  const b=$("bulCal"); if(b){ const on=sensorCanBeep()||BUL.until>t; if(b.disabled===on) b.disabled=!on; }
}

/* ---------------------------------------------------------------- sensör yazılımı: telefondan güncelleme (Bluetooth) */
// Sensör yazılımı 2 ve sonrası, yeni sürümü Bluetooth ile alır (iki bölümlü OTA, CRC ve resim doğrulamalı).
const ota={on:false,st:"",size:0,sent:0,acked:0,t0:0,err:"",waiters:[],rewind:null,fail:null,abort:false,info:null,infoT:0};
const OTA_ERR={2:"eksik veri",3:"dosya doğrulanamadı (CRC)",4:"yazılım sensörde doğrulanamadı",5:"dosya sensöre sığmıyor",6:"sensör belleğine yazılamadı",7:"güncelleme başlamadı"};
let fwKey="";
function crc32(u8){ const T=crc32.T||(crc32.T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})());
  let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function fwBase(){ return HOSTED&&!APK?"":HOSTED_URL; }
async function otaInfo(force){
  if(ota.info&&!force&&now()-ota.infoT<10*60*1000) return ota.info;
  const r=await fetch(fwBase()+"firmware/ota.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("güncelleme bilgisi alınamadı");
  ota.info=await r.json(); ota.infoT=now(); return ota.info;
}
// Bekleme: koşul sağlanınca true; süre dolunca msg varsa hata, yoksa false. Bağlantı ve "Vazgeç" gibi çerçevesiz değişiklikler için 200 ms'de bir de bakılır.
function otaWait(pred,ms,msg){ return new Promise((res,rej)=>{
  if(pred()){ res(true); return; }
  const w={pred,res}; w.end=()=>{ clearTimeout(w.t); clearInterval(w.i); ota.waiters=ota.waiters.filter(x=>x!==w); };
  w.t=setTimeout(()=>{ w.end(); if(msg) rej(new Error(msg)); else res(false); },ms);
  w.i=setInterval(()=>{ if(pred()){ w.end(); res(true); } },200);
  ota.waiters.push(w); }); }
function otaKick(){ for(const w of ota.waiters.slice()) if(w.pred()){ w.end(); w.res(true); } }
function otaFailAll(e){ ota.fail=e; otaKick(); }
function onOtaFrame(kind,code,val){
  ota.last={kind,code,val};
  if(kind===1){ ota.ready=true; ota.acked=0; ota.rewind=null; }
  else if(kind===2) ota.acked=Math.max(ota.acked,val);
  else if(kind===3) ota.done=true;
  // 1: sıra dışı parça geldi, 2: eksik var (yoklamaya yanıt). İkisinde de val sensörün beklediği yer; öncesi sensörde, onay sayılır.
  else if(kind===4&&(code===1||code===2)){ ota.rewind=val; ota.acked=Math.max(ota.acked,val); }
  else if(kind===4) otaFailAll(Object.assign(new Error(OTA_ERR[code]||("sensör hatası "+code)),{kod:code}));
  else if(kind===5) ota.iptal=true;
  otaKick(); renderFwCard();
}
function otaSend(bytes,resp){
  const c=ble.wchr; if(!c||ble.st!=="bagli") return Promise.reject(new Error("bağlantı koptu"));
  const v=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  return resp?(c.writeValueWithResponse?c.writeValueWithResponse(v):c.writeValue(v)):(c.writeValueWithoutResponse?c.writeValueWithoutResponse(v):c.writeValue(v));
}
// güncelleme sürerken uygulama kendini yenilemez, ekran kararmaz
function mesgul(){ return !!(cur.run&&cur.run.active)||ota.on; }
function otaUyanik(on){ try{
  if(on){ if(navigator.wakeLock&&(!ota.wake||ota.wake.released)) navigator.wakeLock.request("screen").then(w=>{ if(ota.on&&(!ota.wake||ota.wake.released)) ota.wake=w; else w.release(); }).catch(()=>{}); }
  else if(ota.wake){ const w=ota.wake; ota.wake=null; w.release(); }
}catch(e){} }
const OTA_DENEME=3;
// Yeniden denenir: bağlantı ve zaman aşımı hataları (kodsuz), eksik veri (2), CRC (3), belleğe yazma (6), başlamadı (7).
// Dosya sığmıyor (5) ve yazılım sensörde doğrulanamadı (4) kesin hatadır.
function otaTekrar(e){ return !e||!e.kod||[2,3,6,7].includes(e.kod); }
// Bir deneme: başlat, parçaları gönder, doğrulat. Onay gecikirse sensöre nerede kaldığı sorulur (0x12: eksikse kaldığı yeri
// söyler, hepsi geldiyse doğrular); yanıt da gelmezse son onaylanan yerden yeniden gönderilir. Sensör yazılımı 2 ve sonrasıyla çalışır.
async function otaAktar(img,info){
  Object.assign(ota,{st:"hazirla",sent:0,acked:0,rewind:null,fail:null,ready:false,done:false,sonda:false}); renderFwCard();
  const kes=()=>!!ota.fail||ota.abort||ble.st!=="bagli";
  const bak=()=>{ if(ota.abort) throw new Error("vazgeçildi"); if(ota.fail) throw ota.fail; if(ble.st!=="bagli") throw new Error("bağlantı koptu"); };
  ota.iptal=false; await otaSend([0x13],true); await otaWait(()=>ota.iptal||ota.abort||ble.st!=="bagli",3000,null); ota.fail=null; bak();   // önceki denemenin yoldaki yanıtları boşalsın
  await otaSend([0x10,...u32le(img.length),...u32le(info.crc32>>>0)],true);
  await otaWait(()=>ota.ready||kes(),30000,"sensör güncellemeye hazırlanamadı"); bak();
  ota.st="yukle"; ota.t0=now(); renderFwCard();
  // yoldaki veri sensörün 48 parçalık sırasını taşırmasın; onay 2048 baytta bir geldiği için pencere en az 4 KB
  const CH=Math.min(240,(ble.mtu||23)-3-5), WIN=Math.min(6144,Math.max(4096+CH,30*CH));
  let off=0, n=0, seen=0, prog=now();
  for(;;){
    if(ota.done) return;
    bak();
    if(ota.acked>seen){ seen=ota.acked; prog=now(); }
    if(ota.rewind!=null){ off=Math.min(ota.rewind,img.length); ota.rewind=null; if(ota.st!=="yukle"){ ota.st="yukle"; renderFwCard(); } }
    if(off<ota.acked) off=ota.acked;
    if(ota.acked>=img.length&&ota.st!=="dogrula"){   // hepsi sensörde: doğrulasın
      ota.st="dogrula"; ota.sonda=true; renderFwCard(); await otaSend([0x12],true);
      await otaWait(()=>ota.done||ota.rewind!=null||kes(),30000,"sensör yazılımı doğrulayamadı"); continue; }
    if(off<img.length&&off-ota.acked<WIN){
      const len=Math.min(CH,img.length-off), pkt=new Uint8Array(5+len); pkt[0]=0x11; pkt.set(u32le(off),1); pkt.set(img.subarray(off,off+len),5);
      await otaSend(pkt,false); off+=len; ota.sent=Math.max(ota.sent,off); if(++n%16===0) renderFwCard(); continue; }
    if(await otaWait(()=>ota.acked>seen||ota.rewind!=null||ota.done||kes(),1500,null)) continue;
    // onay gelmedi: sensöre nerede kaldığını sor
    if(now()-Math.max(prog,ota.uyan||0)>20000) throw new Error("sensör yanıt vermiyor");
    ota.yokla=(ota.yokla||0)+1; if(off>=img.length) ota.sonda=true;
    await otaSend([0x12],true);
    if(!await otaWait(()=>ota.rewind!=null||ota.acked>seen||ota.done||kes(),off>=img.length?15000:5000,null)) off=ota.acked;   // yanıt da yok: son onaydan yeniden gönder
  }
}
async function otaRun(){
  if(ota.on) return;
  if(!(source==="sensor"&&ble.st==="bagli"&&ble.kind==="hisar"&&ble.v2&&ble.fw>=2)){ toast("Önce sensöre bağlan (sensör yazılımı 2 ve sonrası)."); return; }
  if(cur.run&&cur.run.active){ toast("Önce süren oturumu bitir."); return; }
  Object.assign(ota,{on:true,st:"indir",err:"",sent:0,acked:0,size:0,rewind:null,fail:null,abort:false,ready:false,done:false,t0:now(),deneme:1,uyan:0,yokla:0,kopuk:false,sonda:false});
  fwKey=""; otaUyanik(true); renderFwCard();
  try{
    const info=await otaInfo(true);
    const r=await fetch(fwBase()+"firmware/"+info.file+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("yazılım dosyası indirilemedi");
    const img=new Uint8Array(await r.arrayBuffer());
    if(img.length!==info.size||crc32(img)!==(info.crc32>>>0)) throw new Error("indirilen dosya bozuk, tekrar dene");
    if(img[0]!==0xE9) throw new Error("geçersiz yazılım dosyası");
    ota.size=img.length;
    for(let k=1;;k++){
      ota.deneme=k;
      try{ await otaAktar(img,info); break; }
      catch(e){
        if(ota.abort) throw new Error("vazgeçildi");
        const kopuk=ble.st!=="bagli", t=now();
        if(!kopuk&&(!otaTekrar(e)||k>=OTA_DENEME)) throw e;
        if(!kopuk){ try{ await otaSend([0x13],true); }catch(_){} }
        ota.kopuk=kopuk; ota.err=e&&e.message||String(e);
        ota.st=kopuk&&(ota.sonda||k>=OTA_DENEME||!otaTekrar(e))?"yeniden":"tekrar"; renderFwCard();
        // koptuysa yeniden bağlanıp sürümünü bildirmesi beklenir: yeni sürümle açıldıysa güncelleme aslında tamamlanmıştır
        await otaWait(()=>ota.abort||(source==="sensor"&&ble.st==="bagli"&&(!kopuk||(ble.connAt>=t-1000&&(ble.statT||0)>=ble.connAt))),45000,"sensör yeniden bağlanmadı");
        if(ota.abort) throw new Error("vazgeçildi");
        if(kopuk&&ble.fw>=info.fw) break;
        if(k>=OTA_DENEME||!otaTekrar(e)) throw e;
      }
    }
    ota.st="bitti"; ota.sent=ota.size; renderFwCard(); toast("Sensör yazılımı güncellendi; sensör yeniden başlıyor.");
    otaInfo(true).then(()=>{fwKey="";renderFwCard();}).catch(()=>{});
  }catch(e){
    ota.st="hata"; ota.err=e&&e.message||String(e);
    try{ if(ble.wchr&&ble.st==="bagli") await otaSend([0x13],true); }catch(_){}
    renderFwCard();
  }finally{ ota.on=false; ota.abort=false; fwKey=""; otaUyanik(false); setTimeout(renderFwCard,50); if(pendingReload&&!(cur.run&&cur.run.active)) setTimeout(doUpdate,4000); }
}
function renderFwCard(){
  const el=$("sbFw"); if(!el) return;
  const on=source==="sensor"&&ble.st==="bagli"&&ble.kind==="hisar";
  const info=ota.info, latest=info?info.fw:null;
  if(ota.on||ota.st==="bitti"||ota.st==="hata"){
    const pct=ota.size?Math.floor(ota.sent/ota.size*100):0;
    const sp=ota.st==="yukle"&&ota.sent>4096?fx(ota.sent/1024/((now()-ota.t0)/1000),1)+" KB/sn":"";
    const ilk=x=>{ x=String(x||""); return x.charAt(0).toLocaleUpperCase("tr-TR")+x.slice(1); }, dn=ota.deneme>1?` · deneme ${ota.deneme}/${OTA_DENEME}`:"";
    const msg={indir:"Yeni yazılım indiriliyor…",hazirla:"Sensör hazırlanıyor…"+dn,yukle:`Yükleniyor: %${pct}${sp?" · "+sp:""}${dn}`,dogrula:"Sensör yazılımı doğruluyor…",
      tekrar:`${esc(ilk(ota.err))}. ${ota.kopuk?"Sensör yeniden bağlanınca baştan denenecek":"Baştan deneniyor"} (deneme ${Math.min(ota.deneme+1,OTA_DENEME)}/${OTA_DENEME})…`,
      yeniden:"Sensör yeniden bağlanıyor; bağlanınca yazılım sürümüne bakılacak…",
      bitti:"Tamam. Sensör yeni yazılımla yeniden başlıyor; uygulama kendiliğinden bağlanacak.",
      hata:"Güncelleme yapılamadı: "+esc(ota.err)+". Sensördeki eski yazılım çalışmaya devam ediyor. Tekrar deneyebilir ya da sensörü USB-C kabloyla bilgisayara takıp yükleyebilirsin."}[ota.st]||"";
    const mode=ota.on?"run":"end";
    // Düğmeler bir kez çizilir; ilerlemede yalnız yazı ve çubuk güncellenir (dokunuş kaçmasın)
    if(el.dataset.mode!==mode){ el.dataset.mode=mode; fwKey="";
      el.innerHTML=`<h2>Sensör yazılımı</h2><p id="otaMsg"></p>`+(ota.on?`<div class="meter"><span>İlerleme</span><div class="bar"><div class="fill" id="otaFill"></div></div><span class="val" id="otaVal"></span></div>
        <p class="note">Ekran bu sırada kendiliğinden kapanmaz. Sensörü kapatma, uygulamadan çıkma. Bağlantı koparsa uygulama kendisi yeniden dener; sensördeki eski yazılım çalışmaya devam eder.</p><button class="btn" id="otaStop">Vazgeç</button>`:`<button class="btn" id="otaOk">Tamam</button>`);
      const b1=$("otaStop"); if(b1) b1.onclick=()=>{ota.abort=true;otaKick();b1.disabled=true;b1.textContent="Vazgeçiliyor…";};
      const b2=$("otaOk"); if(b2) b2.onclick=()=>{ota.st="";fwKey="";renderFwCard();}; }
    const m=$("otaMsg"); m.innerHTML=msg; m.className=ota.st==="hata"?"badt":ota.st==="bitti"?"okt":"";
    const tam=ota.st==="dogrula"||ota.st==="yeniden", w=ota.st==="yukle"||ota.st==="tekrar"?pct:tam?100:2;
    if($("otaFill")){ $("otaFill").style.width=w+"%"; $("otaVal").textContent="%"+(tam?100:pct); }
    return;
  }
  if(el.dataset.mode!=="info"){ el.dataset.mode="info"; fwKey=""; }
  const key=["fw",on,ble.fw,ble.v2,latest].join("|"); if(key===fwKey) return; fwKey=key;
  let body;
  if(on&&ble.v2&&ble.fw>=2&&latest!=null&&latest>ble.fw)
    body=`<p>Sensörde <b style="color:var(--fg)">sürüm ${ble.fw}</b> var, <b style="color:var(--fg)">sürüm ${latest}</b> hazır.${info&&info.not?" "+esc(info.not):""}</p>
      <button class="btn primary" id="otaGo">Telefondan güncelle</button><p class="note">Yaklaşık 1–2 dakika sürer. Sensörün pili %30'un üstünde olsun ya da şarja tak.</p>`;
  else if(on&&ble.v2&&ble.fw>=2)
    body=`<p>Sensörde sürüm ${ble.fw} var${latest!=null?` · <span class="okt">güncel</span>`:""}. Yeni sürüm çıkınca buradan telefonla yüklenir; bilgisayar gerekmez.</p>`;
  else if(on)
    body=`<p>Sensördeki yazılım (sürüm ${ble.fw||1}) telefondan güncellemeyi desteklemiyor. Bir kez bilgisayardan yükle; sonraki güncellemeler telefondan olur.</p>`;
  else body=`<p>Sensör bağlıyken yeni sürüm varsa buradan telefonla yüklenir. İlk yükleme bir kez bilgisayardan yapılır.</p>`;
  const upToDate=on&&ble.v2&&ble.fw>=2&&!(latest!=null&&latest>ble.fw);
  el.innerHTML=`<h2>Sensör yazılımı</h2>${body}${upToDate?"":`
    <a class="btn ghost" href="${YUKLE_URL}" target="_blank" rel="noopener">Bilgisayardan yükle (USB-C)</a>`}`;
  const g=$("otaGo"); if(g) g.onclick=()=>askSheet("Sensör yazılımını güncelle",`Sensöre sürüm ${latest} yüklenecek. Yaklaşık 1–2 dakika sürer; ekran açık kalır. Bu sırada sensörü kapatma ve uygulamadan çıkma. Bağlantı koparsa uygulama kendisi yeniden dener; olmazsa sensördeki eski yazılım çalışmaya devam eder.`,"Güncelle",otaRun);
}
function askSheet(title,html,okTxt,onOk,onCancel){
  let done=false;
  openSheet(title,`<p>${html}</p><div class="btn-row"><button class="btn primary" id="askOk">${esc(okTxt)}</button><button class="btn" data-close>Vazgeç</button></div>`,
    body=>{ body.querySelector("#askOk").onclick=()=>{done=true;closeSheet();onOk();}; }, ()=>{ if(!done&&onCancel) onCancel(); });
}

/* --- Montaj ve kalibrasyon */

  <circle r="56" fill="#1e1e1e" stroke="#4a4a4a"/><g clip-path="url(#lvClip)"><g id="lvG"><rect x="-90" y="0" width="180" height="90" fill="rgba(34,211,197,.16)"/><line x1="-90" x2="90" y1="0" y2="0" stroke="#d93a3f" stroke-width="2"/></g></g>
  <path d="M-30 0h18M12 0h18M0-6v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle r="3" fill="#fff"/></svg>`;

  <div class="card"><div class="ch"><h2>Yön</h2>${infoBtn("yon")}</div>

    <button class="btn primary" id="wAxis" ${live?"":"disabled"}>Yön testi</button>

function bindMontaj(root){
  const ms=montajSrc(), m=S.mount[ms];
  bindSeg(root,"mjSrc",v=>{mjSrc=v;renderSettings();});
  $("wAxis").onclick=wizardAxis; $("wCal").onclick=wizardCal;
  bindSeg(root,"sAxis",v=>{m.axis=v;m.B=null;m.U=null;applyCfg();saveMeta();renderSettings();});
  bindSeg(root,"sYon",v=>{ setYon(v); renderSettings(); });
  bindSeg(root,"sYer",v=>{ m.yer=v; applyCfg(); saveMeta(); });
  $("sInvX").onchange=e=>{m.invX=e.target.checked;applyCfg();saveMeta();};
  $("sInvY").onchange=e=>{m.invY=e.target.checked;applyCfg();saveMeta();};
  lvT=0; updateMontajLive();
}
let lvT=0;
function updateMontajLive(){
  const g=$("lvG"); if(!g) return; const t=now(); if(t-lvT<70) return; lvT=t;
  const ms=montajSrc(), live=source===ms&&sourceReady()&&proc.aSlow;
  const set=(id,txt,cls)=>{const e=$(id);if(e){e.textContent=txt;e.className="num"+(cls?" "+cls:"");}};
  if(!live){ set("lvCant","–"); set("lvPitch","–"); g.setAttribute("transform",""); }
  else{
    const m=mountFor(ms), up=norm(proc.aSlow), Bn=norm(m.B);
    let pitch=Math.asin(clamp(dot(Bn,up),-1,1))*DEG; if(m.invY) pitch=-pitch;
    const Uref=S.mount[ms].U||proc.zeroUp||(proc.aSlow?proc.snapUp(norm(proc.aSlow)):null); let cant=null;
    if(Uref){ const pr=v=>{const d=dot(v,Bn);return norm([v[0]-d*Bn[0],v[1]-d*Bn[1],v[2]-d*Bn[2]]);}; const u1=pr(Uref),u2=pr(up); const R=cross(Bn,u1);
      cant=-Math.atan2(dot(u2,R),dot(u2,u1))*DEG; if(m.invX) cant=-cant; }
    const ac=cant==null?0:Math.abs(cant);
    set("lvCant",cant==null?"–":sgn(cant,1)+"°",cant==null?"":ac<1?"okt":ac<2.5?"warnt":"badt");
    set("lvPitch",sgn(pitch,1)+"°");
    g.setAttribute("transform",`rotate(${(-(cant||0)).toFixed(2)}) translate(0 ${clamp(pitch*2,-50,50).toFixed(1)})`);
  }
  const b=proc.bias; set("clBias",b&&source===ms?b.map(v=>fx(v,2)).join(" / ")+" °/sn":"–");
  set("clLast",source===ms&&proc.lastCal>0?ago(now()-proc.lastCal):"henüz yok");
  const sd=Math.sqrt(Math.max(...proc.ev)); set("clNoise",source===ms&&sourceReady()?fx(sd,2)+" °/sn"+(sd<0.3?" · durgun":""):"–");
  set("clTemp",ms==="sensor"&&source==="sensor"&&ble.temp!=null?ble.temp+" °C":"–");
}

/* --- sihirbazlar: kalibrasyon, yön testi, eşik öğrenme */
let wiz=null, learn=null;
function needData(){ if(!sourceReady()){toast(source==="sensor"?"Sensör bağlı değil. Önce sensöre bağlan.":"Veri gelmiyor. Önce bir veri kaynağı seç.");return false;} return true; }
function wizardCal(){
  if(source==="demo"||!needData()) return;
  let samples=[], t0=null, done=false;
  openSheet("Kalibrasyon",`<p>Sensörü (ya da sensör takılı silahı) masaya koy ve <b>3 saniye</b> dokunma. Jiroskobun sıfır noktası ölçülür.</p><div class="big" id="calT" style="text-align:center">3</div><p class="note" id="calMsg">Ölçülüyor…</p><button class="btn" data-close>Kapat</button>`,()=>{
    wiz={onSample(){ if(done) return; const w=proc.rawOm; if(t0==null)t0=now(); samples.push(w.slice()); const left=3-(now()-t0)/1000; if($("calT"))$("calT").textContent=Math.max(0,Math.ceil(left));
      if(left<=0){ done=true; const n=samples.length; const mean=[0,1,2].map(i=>samples.reduce((a,s)=>a+s[i],0)/n); const sd=Math.max(...[0,1,2].map(i=>Math.sqrt(samples.reduce((a,s)=>a+(s[i]-mean[i])**2,0)/n)));
        if(sd>0.6){ $("calMsg").textContent="Sensör kıpırdadı. Masaya koyup tekrar dene."; $("calMsg").style.color="var(--bad)"; return; }
        proc.bias=mean.slice(); proc.bias0=mean.slice(); S.bias[biasKey()]=mean.map(v=>+v.toFixed(3)); saveMeta();
        $("calT").textContent="✓"; $("calMsg").textContent="Tamam. Sapma: "+mean.map(v=>fx(v,2)).join(" / ")+" °/sn"; $("calMsg").style.color="var(--good)"; } }};
  },()=>{wiz=null;});
}
function wizardAxis(){
  if(source==="demo"||!needData()) return;
  const m=S.mount[source]; let phase=0, U=null, rot=[0,0,0], best=null, stillT=null, y0=0;
  const html=`<p id="axMsg"></p><div class="big" id="axBig" style="text-align:center">1/3</div><div class="meter"><span>İlerleme</span><div class="bar"><div class="fill" id="axFill"></div></div></div><button class="btn" data-close>Kapat</button>`;
  const set=(t,big,p)=>{if($("axMsg"))$("axMsg").innerHTML=t;if($("axBig"))$("axBig").textContent=big;if($("axFill"))$("axFill").style.width=(p*100)+"%";};
  openSheet("Yön testi",html,()=>{
    set("Silahı <b>nişan alır gibi düz</b> tut ve kıpırdatma.","1/3",0);
    wiz={onSample(){
      if(phase===0){ if(proc.gmag<3){ if(stillT==null)stillT=now(); set("Silahı <b>nişan alır gibi düz</b> tut ve kıpırdatma.","1/3",Math.min(1,(now()-stillT)/1200)); if(now()-stillT>1200){U=norm(proc.aSlow);rot=[0,0,0];best=null;phase=1;} } else stillT=null; }
      else if(phase===1){ const w=proc.w||[0,0,0]; const dt=0.005; // örnek başına yaklaşık
        const dtr=(proc._lt?Math.min((proc.lastT-proc._lt)/1000,0.05):0.005); proc._lt=proc.lastT;
        for(let i=0;i<3;i++) rot[i]+=w[i]*dtr; const mag=vlen(rot); if(!best||mag>vlen(best)) best=rot.slice();
        set("Şimdi namluyu yavaşça <b>yukarı kaldır</b> (10–20 derece), sonra indir.","2/3",Math.min(1,mag/10));
        if(vlen(best)>10&&mag<vlen(best)*0.5){ const R=norm(best); let B=cross(U,R); if(vlen(B)<0.3){set("Hareket anlaşılamadı. Namluyu düz yukarı kaldır; tekrar deneniyor.","2/3",0);rot=[0,0,0];best=null;return;} B=norm(B);
          m.B=B.map(v=>+v.toFixed(4)); m.U=U.map(v=>+v.toFixed(4)); m.invY=false; m.invX=false; applyCfg(); y0=proc.yaw; rot=[0,0,0]; best=null; phase=2; } }
      else if(phase===2){ const dy=proc.yaw-y0; set("Son olarak namluyu yavaşça <b>sağa çevir</b> (10–20 derece).","3/3",Math.min(1,Math.abs(dy)/8));
        if(Math.abs(dy)>8){ m.invX=dy<0; m.at=Date.now(); m.onay=m.at; applyCfg(); saveMeta(); phase=3; set("✓ Tamam. Sensörün yönü kaydedildi. Artık sağ = sağ, yukarı = yukarı.","✓",1); setTimeout(()=>{closeSheet();renderSettings();},1400);} }
    }};
  },()=>{wiz=null;delete proc._lt;});
}
/* --- sensör testi: 5 sn masada durgun ölçüm (veri hızı, ivmeölçer, jiroskop) + bağlantı, pil, IMU, mikrofon; sorun yoksa kalibrasyon */
function wizardSensor(){
  if(source==="demo"){ toast("Deneme modunda test edilecek sensör yok. Önce sensöre bağlan."); return; }
  if(!needData()) return;
  const T=[],A=[],W=[]; let t0=null, done=false; const prevRaw=proc.onRaw;
  const hook=(t,acc,om,dj,snd)=>{ if(prevRaw) prevRaw(t,acc,om,dj,snd); if(done) return; if(t0==null) t0=now();
    T.push(t); A.push(acc.slice()); W.push(om.slice()); const el=(now()-t0)/1000; if($("stT")) $("stT").textContent=Math.max(0,Math.ceil(5-el));
    if(el>=5){ done=true; unhook(); report(); } };
  const unhook=()=>{ if(proc.onRaw===hook) proc.onRaw=prevRaw; };
  openSheet("Sensör testi",`<p>Sensörü (ya da sensör takılı silahı) <b>masaya koy</b> ve 5 saniye dokunma.</p><div class="big" id="stT" style="text-align:center">5</div><div id="stOut"></div><button class="btn" data-close>Kapat</button>`,
    ()=>{ proc.onRaw=hook; }, ()=>{ done=true; unhook(); });
  function report(){
    const out=$("stOut"); if(!out) return; if($("stT")) $("stT").textContent="";

function wizardThr(){
  if(!needData()) return;
  const vals=[]; const t0=now(); let peaks=[]; let lastPeak=-1e9;
  openSheet("Eşiği öğren",`<p>10 saniye içinde silah boşken <b>3 kez kuru tetik</b> yap (gerçek atışta 3 atış). Aralarda silahı nişanda sabit tut.</p><div class="big" id="lrT" style="text-align:center">10</div><p class="note" id="lrMsg">Tetik bekleniyor… (0/3)</p><button class="btn" data-close>Kapat</button>`,()=>{
    if(source==="demo"&&sim){ [1200,2900,4600].forEach(d=>setTimeout(()=>{if(learn&&sim)sim.fire(now());},d)); }
    learn={feed(t,j){ const e=now()-t0; vals.push(j); if(j>0.15&&t-lastPeak>300){ peaks.push(j); lastPeak=t; if($("lrMsg"))$("lrMsg").textContent=`Tetik algılandı (${Math.min(3,peaks.length)}/3)`; } else if(peaks.length&&t-lastPeak<300&&j>peaks[peaks.length-1]) peaks[peaks.length-1]=j;
      if($("lrT"))$("lrT").textContent=Math.max(0,Math.ceil(10-e/1000));
      if(e>10000||peaks.length>=3&&t-lastPeak>400){ const done=learn; learn=null; finish(); } }};
    function finish(){ const sorted=vals.slice().sort((a,b)=>a-b); const noise=sorted[Math.floor(sorted.length*0.95)]||0.05; const top=peaks.slice().sort((a,b)=>b-a).slice(0,3);
      const msg=$("lrMsg"); if(!msg) return;
      if(top.length<2){msg.textContent="Yeterli tetik algılanmadı. Daha net bir kuru tetik yapıp tekrar dene.";msg.style.color="var(--bad)";return;}
      const thr=+clamp(Math.max(noise*3,0.5*Math.min(...top),0.12),0.1,15).toFixed(2); (S.thr[source]||S.thr.demo)[S.mode]=thr; applyCfg(); saveMeta();
      $("lrT").textContent="✓"; msg.textContent=`Tamam. Yeni eşik ${fx(thr,2)} g (gürültü ${fx(noise,2)} g, tetik ${top.map(v=>fx(v,2)).join(" / ")} g).`; msg.style.color="var(--good)"; }
  },()=>{learn=null;renderSettings();});
}

try{ const g=+localStorage.getItem("tetikGuncellendi"); if(g&&g<=VER){ localStorage.removeItem("tetikGuncellendi"); setTimeout(()=>toast(`Uygulama kendiliğinden güncellendi (sürüm ${VER}).`,4500),1800); } }catch(e){}
if(!sessions.length) sessions.push(makeSample());
showView("alistirma");
selectSource("sensor",false);                       // açılışta sensör beklenir; Deneme ve Telefon: Sensör sekmesi › Sensörsüz
if(!navigator.bluetooth) setStatus(noBtText(),true);
initPlatform();
if(removedDemo) setTimeout(()=>toast(`${removedDemo} deneme oturumu geçmişten kaldırıldı; deneme oturumları artık kaydedilmiyor.`),2000);
setTimeout(openFromHash,400);
requestAnimationFrame(loop);
if(sensorPaired()&&S.autoConnect&&canAutoConnect()){
  ble.autoPending=true; setStatus(`Sensör aranıyor: <b>${esc(S.lastSensor)}</b>…`); updateSrcCard();
  setTimeout(()=>{ autoConnect(false).then(ok=>{ ble.autoPending=false; if(!ok&&source==="sensor"&&!ble.dev) setStatus(sensorIdleText()); refreshChip(); }); },400);
}
window.addEventListener("resize",()=>{if(curView==="oturum")renderSub();});
})();
</script>
