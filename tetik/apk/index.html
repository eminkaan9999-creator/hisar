<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e0f">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<style>:root{color-scheme:dark}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="bridge.js"></script>
</head>
<body>
<title>Hisar Tetik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Düzen MantisX uygulamasından esinlenir: alt sekmeler (Alıştırma, Analiz, Sensör, Ayarlar), bölümlü listeler,
   kırmızı seçili düğmeler, koyu gri zemin. Tek (karanlık) tema. */
:root{
  --bg:#252525; --bar:#303030; --hdr:#525252; --btn:#383838; --btn2:#414141; --line:#3a3a3a; --line2:#4a4a4a;
  --fg:#ffffff; --fg2:#e4e4e4; --muted:#a1a1a1; --dim:#7c7c7c;
  --red:#b62126; --red2:#d93a3f; --green:#2fb54a; --blue:#3b8ff0;
  --hold:#3b8ff0; --trig:#f5c518; --recoil:#d93a3f; --good:#4cc26b; --warn:#f2b33d; --bad:#e5484d;
  --panel:#2e2e2e; --panel2:#383838; --accent:#22d3c5; --accent-dim:#0f5e58;
  --acc:#22d3c5; --acc2:#1bb3a7; --acc-ink:#04201d; --acc-soft:rgba(34,211,197,.16);   /* menü ve düğme rengi: turkuaz */
  --logo:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view{display:flex;flex-direction:column}
.pad{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
/* alt sekmeler */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:1px solid #1c1c1c;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.nav button svg{width:27px;height:27px}
.nav button[aria-selected="true"]{color:var(--acc)}
/* sayfa başlığı */
.ph{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;min-height:52px;background:var(--bar);position:sticky;top:0;z-index:5}
.ph h1{margin:0;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .bk{background:none;border:0;color:var(--fg);height:52px;display:flex;align-items:center;justify-content:center;font-size:15px;gap:2px}
.ph .bk svg{width:22px;height:22px}
.ph .bk.t{justify-content:flex-start;padding-left:10px;width:auto}
.ph .rt{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding-right:10px}
#v-sayfa .ph{grid-template-columns:auto minmax(0,1fr) minmax(40px,auto)}
#v-sayfa .ph .bk{min-width:48px;padding:0 10px 0 12px;justify-content:flex-start;gap:6px;font-size:16px;white-space:nowrap}
#v-oturum .ph{grid-template-columns:1fr auto 1fr}
#v-oturum .ph .bk{justify-self:start;width:52px}
#v-oturum .ph .rt .bk{width:40px}
#sessConn{white-space:nowrap;font-size:12px;cursor:pointer}
@media (max-width:380px){#v-oturum .ph .logo{font-size:16px;gap:5px}#v-oturum .ph .logo svg{width:20px;height:20px}.mx-seg.mode button svg{display:none}.mx-seg.mode button{font-size:12px}}
#sessConn .dot{margin-right:5px}
.logo{display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--logo);font-weight:700;letter-spacing:.12em;font-size:19px}
.logo svg{width:24px;height:24px;color:var(--acc)}
/* bölüm başlığı ve listeler */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hdr);color:var(--fg);padding:11px max(12px,env(safe-area-inset-left,0px));font-size:15px;text-transform:uppercase;letter-spacing:.01em;min-height:46px}
.sec .ed{background:none;border:0;color:var(--fg);padding:4px;display:grid;place-items:center}
.sec .ed svg{width:20px;height:20px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:72px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);text-align:left;font-size:17px}
.li .ln{min-width:0}
.li .ln small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.li .st{display:grid;grid-auto-flow:column;gap:12px;text-align:center;font-size:12px;color:var(--fg2)}
.li .st b{display:block;font-size:13px;font-weight:600;color:var(--fg)}
.li .st span{font-weight:600}
.li .th{width:52px;height:52px;border-radius:6px;background:#1b1b1b;display:grid;place-items:center;overflow:hidden}
.li .th svg{width:46px;height:46px}
.li .chk{width:24px;height:24px;accent-color:var(--acc)}
.li .badge{font-size:11px;color:var(--muted);text-align:right}
.li .badge b{display:block;color:var(--good);font-size:13px}
.li.off{opacity:.45}
.li .sw{display:flex;align-items:center;gap:8px}
/* MantisX ayar düzeni */
.mx{display:flex;flex-direction:column;gap:6px;padding:16px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.mx-l{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--fg2);margin-top:12px;min-height:26px}
.mx-l:first-child{margin-top:0}
.mx-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.mx-seg button{background:var(--btn);border:0;border-radius:2px;color:#8f8f8f;min-height:50px;padding:6px 4px;font-size:13px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.mx-seg button svg{flex:none}
.mx-seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.mx-seg.big button{min-height:52px}
.mx-seg.big button svg{width:96px;height:36px}
.mx-seg.hand button svg{width:26px;height:30px}
.mx-seg.mode button svg{width:24px;height:24px}
.mx-seg.mt button svg{width:34px;height:26px}
.mx-seg.four{gap:8px}
.mx-btn{background:var(--btn2);border:0;border-radius:2px;color:#e8e8e8;min-height:50px;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;width:100%}
.mx-btn.red{background:var(--acc);color:var(--acc-ink)}
.i-red{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--acc);background:none;color:var(--acc);font:600 14px/1 Georgia,serif;font-style:italic;display:inline-grid;place-items:center;padding:0;flex:none}
.prof{display:grid;grid-template-columns:44px minmax(0,1fr) 48px;align-items:center;gap:12px;padding:14px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
.prof .pl{width:44px;height:44px;color:var(--acc)}
.prof .pn{font-size:16.5px}
.prof .pe{background:none;border:0;padding:0;color:var(--acc);font-size:12px;display:block}
.prof .pd{width:46px;height:42px;background:var(--btn2);border:0;border-radius:2px;color:#fff;display:grid;place-items:center}
.sl{display:flex;flex-direction:column;padding:0 max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px))}
.sl button{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line2);color:var(--fg);padding:14px 4px;font-size:16px;text-transform:uppercase;text-align:left;letter-spacing:.01em}
.sl button svg{width:22px;height:22px;flex:none}
.sl button small{margin-left:auto;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;text-align:right;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* genel öğeler (ayar sayfaları) */
.pg{display:flex;flex-direction:column;gap:12px;padding:14px max(14px,env(safe-area-inset-right,0px)) 22px max(14px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2,.sheet h2{margin:0;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.note{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-size:21px;font-weight:500}
.big{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--btn2);border-radius:2px;padding:13px 10px;font-weight:500;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;text-align:center;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.stop{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line2)}
.btn.danger{color:var(--bad);background:none;border:1px solid #5a2226}
.btn.sm{padding:8px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 140px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{background:var(--btn);border:0;border-radius:2px;padding:10px 4px;font-size:13px;color:#9a9a9a;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.meter .bar{flex:1;height:6px;border-radius:3px;background:#1d1d1d;position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--good)}
.meter .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--acc)}
.meter .val{font-family:var(--mono);min-width:56px;text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.fl{font-size:13px;color:var(--muted)}
.field input[type=range]{width:100%;accent-color:var(--acc)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;padding:4px 0}
.toggle input{width:22px;height:22px;accent-color:var(--acc);flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=number],input[type=text],textarea{background:#1d1d1d;border:1px solid var(--line2);border-radius:2px;padding:10px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:var(--btn);border-radius:2px;padding:8px 10px;min-width:0}
.kv .num{font-size:17px}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv3>div{background:var(--btn);border-radius:2px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.kv3 .num{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv3 .note{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.dev .dn{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--dim)}
.dot.ok{background:var(--good);box-shadow:0 0 0 3px rgba(76,194,107,.18)}
.dot.wait{background:var(--warn);animation:blink 1s steps(2,start) infinite}
.dot.bad{background:var(--bad)}
@keyframes blink{50%{opacity:.25}}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:13px;margin-right:6px;vertical-align:-1px}
.sig i{width:4px;background:var(--line2);border-radius:1px}
.sig i.on{background:var(--good)}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status b{color:var(--fg);font-weight:600}
.status.err{color:var(--bad)}
.link-row{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:13px;padding:2px 0;white-space:nowrap}
.banner{padding:9px 14px;font-size:13px;border-bottom:1px solid}
.banner.wait{color:var(--warn);border-color:#5a4719;background:rgba(242,179,61,.08)}
.banner.ok{color:var(--good);border-color:#1f5a3a;background:rgba(76,194,107,.08)}
details.card>summary{cursor:pointer;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";color:var(--acc)}
details.card[open]>summary::after{content:"–"}
details.sub>summary{cursor:pointer;color:var(--acc);font-size:13px;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
.level-wrap{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:center}
.level-wrap svg{width:116px;height:116px;display:block}
.okt{color:var(--good)} .warnt{color:var(--warn)} .badt{color:var(--bad)}
.st-row{padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:14px}
.info{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--acc);background:none;color:var(--acc);font:600 13px/1 Georgia,serif;font-style:italic;display:inline-grid;place-items:center;padding:0;flex:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.m{font-family:var(--mono)}
.sc-g{color:var(--good)}.sc-m{color:var(--warn)}.sc-b{color:var(--bad)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid #5a4719;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;white-space:nowrap;display:inline-block}
.tag.demo{color:var(--warn)}
.tag.rec{color:var(--bad);border-color:#5a2226}
.tag.safe{color:var(--blue);border-color:#1f3d63}
.demo-note{color:var(--warn)}
.share-prev{width:100%;border-radius:4px;border:1px solid var(--line);display:block}
/* oturum ekranı */
.s-tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#242424;border-bottom:1px solid #1c1c1c}
.s-tabs button{background:none;border:0;height:46px;display:grid;place-items:center;color:#bdbdbd;position:relative}
.s-tabs button svg{width:26px;height:26px}
.s-tabs button[aria-pressed="true"]{color:#fff}
.s-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;background:var(--acc)}
.s-body{flex:1;display:flex;flex-direction:column;padding:10px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));gap:10px}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;min-height:52px}
.shots{text-align:right;text-transform:uppercase;font-size:17px;line-height:1.15}
.shots b{display:block;font-size:26px;font-weight:400}
.pre{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-top:-30px}
.pre h2{margin:0 0 4px;font-size:21px;font-weight:400}
.pre .ins{align-self:stretch;text-align:left;font-size:15.5px;color:#f0f0f0;display:flex;flex-direction:column;gap:12px}
.pre .ins p{margin:0}
.wk{display:grid;grid-auto-flow:column;gap:16px;align-items:end;font-size:13px;color:var(--fg2);margin-top:8px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:2px}
.wk b{font-weight:600}
.wk svg{width:16px;height:16px;color:var(--acc)}
.sq{display:flex;gap:10px;justify-content:center}
.sq button{width:66px;height:62px;background:#3a3a3a;border:1px solid #4a4a4a;border-radius:3px;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;text-transform:uppercase;padding:4px 2px;overflow:hidden;white-space:nowrap}
.sq button svg{width:28px;height:28px}
.wpn{color:var(--muted);text-transform:uppercase;font-size:15px;letter-spacing:.04em}
.go{width:104px;height:104px;border-radius:50%;border:4px solid var(--green);background:#1d1d1d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;text-transform:uppercase;margin-top:4px}
.go svg{width:34px;height:34px}
.go:disabled{opacity:.5}
.ring-wrap{position:relative;width:100%;max-width:380px;margin:0 auto;aspect-ratio:1}
.ring-wrap canvas{width:100%;height:100%;display:block}
.pc-h{font-size:12.5px;text-transform:uppercase;color:var(--fg2);margin-top:4px}
/* hedef görünümü: atışın sonucu ve nedeni */
.hd{display:flex;flex-direction:column;gap:10px}
.hd-son{display:flex;align-items:center;gap:14px}
.hd-skor{display:flex;flex-direction:column;align-items:center;min-width:78px}
.hd-skor b{font-family:var(--logo);font-size:46px;line-height:1;font-weight:700;color:var(--fg)}
.hd-skor small{font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.hd-skor.good b{color:var(--good)} .hd-skor.mid b{color:var(--warn)} .hd-skor.bad b{color:var(--bad)}
.hd-ne{display:flex;flex-direction:column;gap:3px;min-width:0}
.hd-ne b{font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.hd-ne span{font-size:14.5px;color:var(--fg2);line-height:1.4;text-wrap:pretty}
.hd-kart{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:4px;padding:12px 14px;color:var(--fg);font:inherit}
.hd-kart .hd-k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hd-kart b{font-size:18px;font-weight:600;line-height:1.25}
.hd-kart span{font-size:14px;color:var(--fg2);line-height:1.45;text-wrap:pretty}
.hd-kart i{font-style:normal;color:var(--acc);font-size:14px;font-weight:600;margin-top:3px}
.hd-kart.iki{border-left-color:var(--warn);padding:9px 14px} .hd-kart.iki b{font-size:15px}
.hd-kart.temiz{border-left-color:var(--good)}
.hd-lej{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;font-size:12.5px;color:var(--muted);margin:0}
.hd-lej i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.hd-in{animation:hdIn .45s ease-out both;animation-delay:.6s}
@keyframes hdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hd-in{animation:none}}
.pc{display:flex;flex-direction:column;gap:4px}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const NF={}; const nf=d=>NF[d]||(NF[d]=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d}));
const fx=(v,d=1)=>nf(d).format(v);
const sec=(ms,d=2)=>fx(ms/1000,d)+" sn";

/* ---------------------------------------------------------------- ayarlar ve kayıt */
const KEY="hisarTetik.v2";
const DEF={hand:"R",weapon:"pistol",weaponName:"",mode:"kuru",diff:"normal",unit:"deg",dist:25,sound:"bip",sensorBeep:true,
  par:2.0,ritim:1.5,ritimShots:20,dayanik:30,autoShot:true,lastSource:"demo",autoConnect:true,lastSensor:"",visualCue:true,rawRec:false,mic:"yardimci",

  mount:{sensor:{axis:"+y",B:null,invX:false,invY:false,yon:"ileri",yer:"alt"},phone:{axis:"+y",B:null,invX:false,invY:false,yon:"ileri",yer:"alt"}},

  profiles:[{id:"p1",ad:"Atıcı"}],prof:"p1",groups:[],weapons:[],hiddenDrills:[],mainDrills:null,

const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
function saveMeta(){lsSet(KEY+".meta",JSON.stringify({v:2,settings:S,ids:sessions.filter(s=>!s.sample).map(s=>s.id)}));}
// Deneme (sanal atıcı) oturumları gerçek ilerlemeyi bozmasın: geçmişe, istatistiğe, depoya girmez.
const isDemoSess=s=>!!s&&s.src==="demo"&&!s.sample;
function saveSession(s){
  if(s.sample||isDemoSess(s)) return true;
  const put=()=>lsSet(KEY+".s."+s.id,JSON.stringify(s));
  let ok=put();
  while(!ok&&pruneTraces(s)) ok=put();
  if(!ok&&s.shots.some(x=>x.tz)){ s.shots.forEach(x=>delete x.tz); ok=put(); }
  if(!ok&&now()-(saveSession.uy||-1e9)>30000){ saveSession.uy=now(); toast("Depolama dolu: oturum kaydedilemiyor! Ayarlar › Gelişmiş Ayarlar › Veriler'den dışa aktar, sonra eski oturumları sil.",9000); }
  saveMeta(); return ok;
}
function pruneTraces(keep){
  for(let i=sessions.length-1;i>=0;i--){const s=sessions[i]; if(s===keep||s.sample) continue;
    if(s.shots.some(x=>x.tz)){ s.shots.forEach(x=>delete x.tz); lsSet(KEY+".s."+s.id,JSON.stringify(s)); toast("Depolama doldu: en eski oturumların izleri silindi, skorlar duruyor."); return true; } }
  return false;
}
function deleteSession(id){sessions=sessions.filter(s=>s.id!==id);lsDel(KEY+".s."+id);saveMeta();}
function loadAll(){
  let meta=null; try{meta=JSON.parse(lsGet(KEY+".meta")||"null");}catch(e){}
  if(meta){ merge(S,meta.settings||{}); if(S.weaponName&&SILAH_ESKI[S.weaponName]) S.weaponName=SILAH_ESKI[S.weaponName]; for(const id of (meta.ids||[])){ try{const s=JSON.parse(lsGet(KEY+".s."+id)); if(s&&Array.isArray(s.shots)) sessions.push(s);}catch(e){} } }
  else migrateV1();
  // önceki sürümlerde kaydedilmiş deneme oturumları: gerçek veriye karışmasın diye kaldırılır
  const demo=sessions.filter(isDemoSess);
  if(demo.length){ for(const s of demo) lsDel(KEY+".s."+s.id); sessions=sessions.filter(s=>!isDemoSess(s)); saveMeta(); removedDemo=demo.length; }
  sessions.sort((a,b)=>b.date-a.date);
}

/* ---------------------------------------------------------------- iz kodlama (10 ms ızgara, -1000..+600 ms) */
const TR0=-1000, TR1=600, TRS=10, TRN=(TR1-TR0)/TRS+1;
function encTrace(xy){const a=new Int16Array(TRN*2);for(let i=0;i<a.length;i++)a[i]=clamp(Math.round((xy[i]||0)*1000),-32767,32767);const u=new Uint8Array(a.buffer);let s="";for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function decTrace(b){if(!b)return null;try{const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);const a=new Int16Array(u.buffer);const o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]/1000;return o;}catch(e){return null;}}

/* ---------------------------------------------------------------- vektör */
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vlen=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=vlen(a)||1;return[a[0]/l,a[1]/l,a[2]/l];};
const AX={"+x":[1,0,0],"-x":[-1,0,0],"+y":[0,1,0],"-y":[0,-1,0]};

/* ---------------------------------------------------------------- skor ölçeği ve birimler */
const DIFF={kolay:1.6,normal:1,zor:0.65};

const SPEED=new Set(["zamanlayici","kiyas20","kilif","karar","sarjor","ritim","rehine","zamankiyas","par"]);
const holdW=s=>SPEED.has(s.drill)?0:0.15;   // 19. sürüme kadar 0,3: nişanın doğal titremesi skoru gereğinden çok düşürüyordu
const scaleFor=(weapon,diff)=>(weapon==="pistol"?0.30:0.18)*(DIFF[diff]||1);
function ang(deg,d){ // açı, seçili birimde
  const a=Math.abs(deg)<1e-9?0:deg;
  if(S.unit==="moa") return fx(a*60,d==null?1:d)+" MOA";

}

/* ---------------------------------------------------------------- hata kütüphanesi */

 bilek_yukari:{ad:"Bileği yukarı kaldırma",ozet:"Tetik düşerken bileğin yukarı bükülüyor, namlunun ucu kalkıyor. Atış yukarı gider.",

 avucla_itme:{ad:"Avuçla öne itme",ozet:"Avucunun alt kısmı kabzayı öne itiyor; namlu yukarı ve elinin olduğu tarafa kalkıyor.",

const MAP_PISTOL={12:["bilek_yukari","geri_tepme"],1:["avucla_itme","geri_tepme"],2:["avucla_itme","basparmak"],3:["basparmak","az_parmak"],4:["siki_tutus","az_parmak"],5:["siki_tutus","bilek_asagi"],6:["bilek_asagi","ileri_itme"],7:["tokatlama","bilek_asagi"],8:["tokatlama","tum_el"],9:["fazla_parmak","tokatlama"],10:["geri_tepme","fazla_parmak"],11:["geri_tepme","bilek_yukari"]};
// tüfek: tabanca şemasından uyarlanmıştır
const MAP_RIFLE={12:["geri_tepme","yanak"],1:["geri_tepme","siki_tutus"],2:["siki_tutus","az_parmak"],3:["az_parmak","siki_tutus"],4:["siki_tutus","tokatlama"],5:["tokatlama","ileri_itme"],6:["ileri_itme","tokatlama"],7:["tokatlama","ileri_itme"],8:["tokatlama","fazla_parmak"],9:["fazla_parmak","tokatlama"],10:["fazla_parmak","geri_tepme"],11:["geri_tepme","yanak"]};
function hourOf(dx,dy){let a=Math.atan2(dx,dy)*DEG;if(a<0)a+=360;const h=Math.round(a/30)%12;return h===0?12:h;}
const effHand=s=>{const h=s.hand||"R";return s.handMode==="weak"?(h==="R"?"L":"R"):h;};
// Tetik penceresindeki (son 150 ms) hareket, aynı sürede nişan titremesinin yaptığı tipik hareketin (q.wv) belirgin üstünde mi?
// Değilse hareketin yönü rastgele titremeden gelir: saat yönüne göre tetik hatası söylenmez, puan kaybı tutuş titremesindendir.
// Hızlı alıştırmalarda (önceki saniye çekiş/geçişle hareketli) ve eski kayıtlarda (wv yok) yön her zaman kullanılır.
const TRIG_SNR=1.75;

function diagnose(q,s){
  const out=[]; const scale=scaleFor(s.weapon,s.diff);
  if(q.sc<85){ if(trigClear(q,s)){let h=q.h;if(effHand(s)==="L")h=(12-h)%12||12;const pair=(s.weapon==="rifle"?MAP_RIFLE:MAP_PISTOL)[h];if(pair){out.push(pair[0]);if(q.sc<70)out.push(pair[1]);}} else out.push("gezinme"); }

  // yatıklık olağandır, o yüzden eşik 6°. 25°'den büyük yatıklık kanting değil, sensörün farklı takılmasıdır (mountChecks uyarır).
  const ca=Math.abs(q.ca||0); if(ca>=(s.yt===false?6:2.5)&&ca<=25) out.push("kanting");
  if(!SPEED.has(s.drill)&&q.ho>0.55*scale&&q.ho>q.tr) out.push("gezinme");
  if(s.mode==="kuru"&&q.po!=null&&q.po>Math.max(0.35,3*q.tr)) out.push("takip");
  return [...new Set(out)].slice(0,3);
}
function verdict(sc){return sc>=85?["HARİKA ATIŞ","good"]:sc>=70?["İYİ ATIŞ","mid"]:sc>=50?["GELİŞTİRİLMELİ","bad"]:["ZAYIF ATIŞ","bad"];}

  this.zeroUp=null;this.zeroR=null;this.bias=this.bias0?this.bias0.slice():[0,0,0];this.gP=null;
  this.em=[0,0,0];this.ev=[1,1,1];this.stillSince=null;this.lastCal=-1e9;
  this.jerk=0;this.gmag=0;this.cant=0;this.base=[0,0];this.live=[0,0];
  this.lastShot=-1e9;this.pending=[];this.armed=false;this.samples=0;this.lastData=-1e9;this.rawOm=[0,0,0];this.up=[0,0,1];
  this.gaps=[];

// B: namlunun yataydaki izdüşümü, R: yatay sağ eksen, U: namluya dik "yukarı" (namlu ile düşey düzlemde).
// Hedef aşağıda ya da yukarıdayken (namlu eğik) sağ-sol kayma U çevresindeki dönmedir; dünyanın düşeyi çevresindeki
// dönme kullanılsaydı sağ-sol hata eğimin kosinüsü kadar küçük ölçülürdü (30°'de %13, 45°'de %29). Namlu düzken U = yukarı.
Proc.prototype.frame=function(up){const Bv=this.cfg.B||[0,1,0];const bu=dot(Bv,up);let B=[Bv[0]-bu*up[0],Bv[1]-bu*up[1],Bv[2]-bu*up[2]];if(vlen(B)<0.2)B=[up[1],up[2],up[0]];B=norm(B);

Proc.prototype.zero=function(){if(this.aSlow){this.zeroUp=norm(this.aSlow);this.zeroR=this.frame(this.zeroUp).R;}this.base=[this.yaw,this.pitch];};
// Oturum başı: kanting sıfırı yön testinden (cfg.U) ya da ilk atışta montaj yerine göre "dik" eksenden alınır (Sıfırla gerekmez)
Proc.prototype.startRef=function(){ this.base=[this.yaw,this.pitch]; this.mountWarn=false;
  if(this.cfg.U){ this.zeroUp=norm(this.cfg.U); this.zeroR=this.frame(this.zeroUp).R; } else { this.zeroUp=null; this.zeroR=null; } };
Proc.prototype.snapUp=function(up){
  const B=norm(this.cfg.B||[0,1,0]), ax=[[1,0,0],[0,1,0],[0,0,1]].filter(a=>Math.abs(dot(a,B))<0.7);

  const d=dot(fam,up); if(Math.abs(d)>=0.7) return fam.map(v=>v*Math.sign(d));

Proc.prototype.feed=function(t,acc,om,devJerk,snd){

  const dt=this.lastT==null?0:Math.min((t-this.lastT)/1000,0.05); this.lastT=t; this.samples++; this.lastData=now();
  if(!this.aFast){this.aFast=acc.slice();this.aSlow=acc.slice();}
  const kF=dt>0?1-Math.exp(-dt/0.05):1;
  const j=Math.hypot(acc[0]-this.aFast[0],acc[1]-this.aFast[1],acc[2]-this.aFast[2]);
  for(let i=0;i<3;i++)this.aFast[i]+=kF*(acc[i]-this.aFast[i]);
  this.impCh=devJerk!=null; this.jerk=this.impCh?devJerk:j;   // darbe: HİSAR sensörünün 1 kHz darbe kanalı; j el hareketiyle de büyür
  const am=vlen(acc);
  if(Math.abs(am-1)<0.25){const kS=dt>0?1-Math.exp(-dt/0.5):1;for(let i=0;i<3;i++)this.aSlow[i]+=kS*(acc[i]-this.aSlow[i]);}

  const sat=(Math.max(Math.abs(acc[0]),Math.abs(acc[1]),Math.abs(acc[2]))>=15.5?1:0)|(Math.max(Math.abs(om[0]),Math.abs(om[1]),Math.abs(om[2]))>=1950?2:0);

};
// ses: gürültü tabanını izler (aşağı hızlı, yukarı ~1 sn'de). Tık = tabanın belirgin üstünde VE ani yükselen ses;
// sürekli gürültü (konuşma, müzik, rüzgâr) tık sayılmaz, taban ona uyar.
Proc.prototype.sound=function(t,snd){
  if(snd==null) return false;
  this.sT=t; this.sDb=snd;
  if(this.sBg==null){ this.sBg=snd; this.sP1=snd; this.sP2=snd; }
  const prev=Math.max(this.sP1,this.sP2);
  const click=snd>=this.sBg+this.cfg.clickDb&&snd>=this.cfg.clickMin&&snd-prev>=this.cfg.clickRise;

  const d=snd-this.sBg; this.sBg+=d<0?d*0.2:d*0.006;

// atış: darbe eşiği aşılırsa. Mikrofon açıksa (kuru tetik / CO2): tık sesiyle gelen zayıf darbe de atıştır (Yardımcı);
// Sıkı kipte sesi olmayan darbe atış sayılmaz (üst üste 3 kez olursa mikrofon duymuyor sayılır, Sıkı kip kapanır).
Proc.prototype.detect=function(t,snd){
  this.sound(t,snd);
  if(!this.armed&&!this.testArm){ this.cand=null; return; }
  const thr=this.cfg.thr, j=this.jerk, free=t-this.lastShot>this.cfg.lockout&&!(this.quietUntil>t&&this.jerk<6*this.cfg.thr);   // bip çalarken zilin titreşimi yok sayılır; tepme gibi çok güçlü darbe (seri gerçek atış) yine sayılır
  // bu ölçümde ses yoksa (eski yazılım, mikrofon arızası, sensör bip çalıyor) yalnız darbe: bekleyen güçlü aday atıştır
  const mic=this.micOn&&snd!=null;

};
Proc.prototype.fire=function(t,peak,how){ this.lastShot=t;

Proc.prototype.markShot=function(t){t=t==null?(this.lastT||0):t;if(t-this.lastShot>150){this.pending.push(t);this.lastShot=t;}};
Proc.prototype.gap=function(t0,t1){this.gaps.push([t0,t1]);while(this.gaps.length>30)this.gaps.shift();if(this.onGap)this.onGap(t0,t1);};

  const aim=an?[ax/an,ay/an]:p150;
  let trig=0; for(let i=i150;i<=i0;i++){const s=b[i];trig=Math.max(trig,Math.hypot(s[1]-p150[0],s[2]-p150[1]));}
  let hx=0,hy=0,hn=0; for(const s of b){if(s[0]>=st-1000&&s[0]<st-150){hx+=(s[1]-aim[0])**2;hy+=(s[2]-aim[1])**2;hn++;}}
  hx=hn?Math.sqrt(hx/hn):0; hy=hn?Math.sqrt(hy/hn):0;
  let post=0,rise=0,fall=0,peakD=0,peakT=st,pg=0;
  for(const s of b){ if(s[0]>st&&s[0]<=st+600){const d=Math.hypot(s[1]-p0[0],s[2]-p0[1]);if(s[0]<=st+150)post=Math.max(post,d);if(s[0]<=st+400){rise=Math.max(rise,s[2]-p0[1]);fall=Math.max(fall,p0[1]-s[2]);}if(d>peakD){peakD=d;peakT=s[0];}}
    if(s[0]>=st-10&&s[0]<=st+40)pg=Math.max(pg,s[5]); }

  let cs=0,cn=0,sat=0; for(const s of b){if(s[0]>=st-300&&s[0]<=st){cs+=s[3];cn++;} if(s[0]>=st-10&&s[0]<=st+300) sat|=s[6]||0;}
  const gap=this.gaps.some(g=>g[1]>st-1000&&g[0]<st+600);

  // atıştan hemen önce silahın duruşu (yerçekiminin sensöre göre yönü)
  let lHold=0,l150=0,lPost=0,ux=0,uy=0,uz=0;
  for(const s of b){ const d=s[0]-st, l=s[7]||0; if(d>=-600&&d<=-180){ if(l>lHold) lHold=l; } else if(d>=-150&&d<=-30){ if(l>l150) l150=l; ux+=s[8]; uy+=s[9]; uz+=s[10]; } else if(d>=60&&d<=350&&l>lPost) lPost=l; }
  const up=ux||uy||uz?norm([ux,uy,uz]):null;
  // titreme ölçüsü (wv): tetikten önceki tutuşta nişanın 150 ms'de tipik (RMS) yer değiştirmesi. Tetik penceresi de 150 ms;
  // oradaki hareket bunun belirgin üstünde değilse yönü titremeden gelir, tetik hatası sayılmaz (bkz. trigClear)
  let wv=0,wn=0; for(let i=Math.max(0,this.idxBefore(st-850));i<b.length&&b[i][0]<=st-250;i++){ if(b[i][0]<st-850) continue;
    const j=this.idxBefore(b[i][0]-150), dt=b[i][0]-b[j][0]; if(dt<140||dt>165) continue; wv+=(b[i][1]-b[j][1])**2+(b[i][2]-b[j][2])**2; wn++; }
  wv=wn>=10?Math.sqrt(wv/wn):null;
  const xy=new Float32Array(TRN*2); let k=0;
  for(let g=0;g<TRN;g++){const tg=st+TR0+g*TRS;while(k<b.length-2&&b[k+1][0]<tg)k++;const s0=b[k],s1=b[Math.min(k+1,b.length-1)];const u=s1[0]>s0[0]?clamp((tg-s0[0])/(s1[0]-s0[0]),0,1):0;xy[g*2]=s0[1]+(s1[1]-s0[1])*u-aim[0];xy[g*2+1]=s0[2]+(s1[2]-s0[2])*u-aim[1];}
  let elev=null; if(this.aSlow&&this.cfg&&this.cfg.B){ elev=Math.asin(clamp(dot(norm(this.cfg.B),norm(this.aSlow)),-1,1))*DEG; }   // namlunun yatayla açısı
  if(this.onShot)this.onShot({st,trig,hold:Math.hypot(hx,hy),hx,hy,dx:p0[0]-p150[0],dy:p0[1]-p150[1],wv,cant:cn?cs/cn:0,post,rise,fall,peakD,pg,rec,xy,sat,gap,elev,lHold,l150,lPost,up,impCh:!!this.impCh});
};

/* ---------------------------------------------------------------- sanal atıcı (deneme modu) */
function Sim(seed){let s=(seed||Math.floor(Math.random()*1e9))>>>0;this.rnd=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};
  this.g=()=>{let u=0;while(!u)u=this.rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*this.rnd());};
  this.x=0;this.y=0;this.vx=0;this.vy=0;this.t=null;this.px=0;this.py=0;this.ev=null;this.draw=null;
  this.bias=[0.35,-0.22,0.18];this.recoil=0.15;this.spike=2.6;this.cant=0.4;this.start=null;this.skill=0.62;}
Sim.prototype.fire=function(t){if(this.ev)return false;const good=this.rnd()<this.skill;const mag=good?0.004+this.rnd()*0.022:0.045+this.rnd()*0.3;
  const hrs=[6,6,7,8,5,4,1,12,9,3,2,11,10];const h=hrs[Math.floor(this.rnd()*hrs.length)]+this.g()*0.25;const a=h*30*RAD;
  this.ev={t0:t+160,dx:Math.sin(a)*mag,dy:Math.cos(a)*mag,post:this.rnd()<0.1?0.5+this.rnd()*0.4:0};return true;};
Sim.prototype.drawAt=function(t){this.draw={t0:t+180+this.rnd()*120};};
Sim.prototype.step=function(t){
  if(this.start==null)this.start=t;
  const dt=this.t==null?0.005:Math.max(0.001,Math.min((t-this.t)/1000,0.05)); this.t=t;
  const held=clamp((t-this.start-1600)/800,0,1);
  const th=2.2,sig=0.07*held;
  this.vx+=(-th*this.vx)*dt+sig*Math.sqrt(dt)*this.g()*6; this.vy+=(-th*this.vy)*dt+sig*Math.sqrt(dt)*this.g()*6;
  this.x+=this.vx*dt*0.5-this.x*0.8*dt; this.y+=this.vy*dt*0.5-this.y*0.8*dt;
  let ox=0,oy=0,spike=0; const e=this.ev;
  if(e){const r=t-(e.t0-150);
    if(r>=0&&r<150){const u=r/150,uu=u*u*(3-2*u);ox=e.dx*uu;oy=e.dy*uu;}
    else if(r>=150){ox=e.dx;oy=e.dy;const q=r-150;spike=q<25?this.spike*(1-q/25):0;
      oy+=q<360?this.recoil*Math.sin(Math.min(q,140)/140*Math.PI/2)*Math.exp(-Math.max(0,q-140)/90):0;
      if(e.post&&q<150){ox+=e.post*(q/150)*0.5;oy-=e.post*(q/150);}
      if(r>700){this.ev=null;this.x+=e.dx;this.y+=e.dy;ox=0;oy=0;}}}
  if(this.draw){const q=t-this.draw.t0;if(q>=0&&q<900){const u=q/900;oy+=-25*Math.sin(Math.PI*u)*(1-u);ox+=8*Math.sin(Math.PI*u);}else if(q>=900)this.draw=null;}
  const X=this.x+ox,Y=this.y+oy;
  const yr=(X-this.px)/dt,pr=(Y-this.py)/dt; this.px=X;this.py=Y;
  const c=this.cant*RAD;
  const acc=[Math.sin(c)+this.g()*0.004+spike*0.35,spike*0.9+this.g()*0.004,Math.cos(c)+this.g()*0.004+spike*0.25];
  const om=[pr+this.bias[0]+this.g()*0.05,this.bias[1]+this.g()*0.05,-yr+this.bias[2]+this.g()*0.05];
  return {acc,om,jerk:spike};
};

function streamPacket(seq,k,tn,fn){

function sigHtml(r){const lv=r==null?0:r>-60?4:r>-70?3:r>-80?2:r>-90?1:0;return `<span class="sig" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<lv?"on":""}" style="height:${4+i*3}px"></i>`).join("")}</span>`;}
function sigText(r){return r==null?"–":r>-60?"çok iyi":r>-70?"iyi":r>-80?"orta":"zayıf";}
function updateLinkUi(){
  const row=$("srcLink");
  if(row){ if(source==="sensor"||source==="phone"){ row.hidden=false;
      let txt="";
      if(source==="sensor"){ const lp=lossPct();
        txt=ble.st==="bagli"?`${ble.rssi!=null?sigHtml(ble.rssi)+ble.rssi+" dBm · ":""}${ble.bat!=null?"pil %"+ble.bat+(ble.chg?" ⚡":"")+" · ":""}${lp!=null?"kayıp %"+fx(lp,1):"bağlı"}`
          :ble.st==="yeniden"?"Yeniden bağlanıyor…":ble.st==="baglaniyor"?"Bağlanıyor…":ble.st==="secim"?"Sensör seçiliyor…":"Bağlı değil"; }
      $("srcLinkTxt").innerHTML=txt; $("srcSet").textContent=source==="phone"?"Montaj ve kalibrasyon ›":"Sensör ayarları ›"; }
    else row.hidden=true; }
  const b=$("linkBanner");
  if(b){ const down=source==="sensor"&&ble.dev&&!ble.manual&&ble.everConnected&&(ble.st==="yeniden"||ble.st==="baglaniyor");
    if(down){ b.hidden=false; b.className="banner wait"; b.textContent="Sensör bağlantısı koptu, yeniden bağlanılıyor…"+(ble.v2?" Ölçümler kaybolmayacak.":""); b._until=0; }
    else if(!(b._until&&now()<b._until)) b.hidden=true; }
  const md=$("md-baglanti"); if(md) md.textContent=menuDesc("baglanti");
  updateRootSensor();
  if(setPage==="baglanti"||sensorView()) updateSensorPage();
}

function later(r,ms,fn){const id=setTimeout(()=>{r.timers.delete(id);if(cur.run===r&&r.active)fn();},ms);r.timers.add(id);return id;}
function cue(r,type){
  const t=now(); r.cueT=t; r.cueType=type; cueSound(type);
  if(raw.on&&raw.sess===r.sess) raw.cues.push([Math.round(t-raw.t0),type]);
  if(type==="ates"||type==="dur") flash(type==="ates"?"ATEŞ":"DUR",type==="ates"?"go":"no");
  else if(S.visualCue&&type==="go") flash(r.drill.id==="kilif"?"ÇEK":"ATEŞ","go",r.drill.id==="ritim"?260:520);
  else if(S.visualCue&&type==="par") flash("PAR","par",600);
  else if(S.visualCue&&type==="end") flash("BİTTİ","end",900);
  if(source==="demo"&&S.autoShot&&r.drill.demoCue) r.drill.demoCue(r,type,t);
  renderPanel();
}
function demoFire(delay){ if(source!=="demo"||!S.autoShot||!sim) return; const r=cur.run; later(r,delay,()=>sim.fire(now())); }
function demoPeriodic(r,first){ later(r,first==null?rand(1800,2600):first,function f(){ if(sim) sim.fire(now()); later(r,rand(2600,4200),f); }); }
function flash(txt,cls,ms){const f=$("flash");f.textContent=txt;f.className="flash "+cls;f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>{f.hidden=true;},ms||650);}

const RAW_MAX=360000, RAW_CH=8192;              // en çok 30 dk (200 ölçüm/sn)
const raw={on:false,full:false,t0:0,n:0,chunks:[],sess:null,cues:[],gaps:[],info:null};
function rawStart(r){
  Object.assign(raw,{on:true,full:false,t0:r.t0,n:0,chunks:[],sess:r.sess,cues:[],gaps:[],
    info:{src:source,sensor:source==="sensor"&&ble.dev?ble.dev.name||"":"",fw:source==="sensor"?ble.fw:null,mic:micState(),thr:proc.cfg.thr,lockout:proc.cfg.lockout,
      mount:{B:proc.cfg.B,invX:proc.cfg.invX,invY:proc.cfg.invY},bias:proc.bias?proc.bias.map(v=>+v.toFixed(3)):null,mtu:ble.mtu||null}});
}
function rawStop(){ raw.on=false; }
function rawHas(s){ return !!(s&&raw.sess===s&&raw.n>0); }
proc.onRaw=(t,acc,om,dj,snd)=>{
  if(!raw.on) return;
  if(raw.n>=RAW_MAX){ if(!raw.full){ raw.full=true; toast("Ham kayıt 30 dakikada durdu; oturum sürüyor."); } return; }
  const ci=(raw.n/RAW_CH)|0, k=raw.n%RAW_CH; let c=raw.chunks[ci];
  if(!c){ c={t:new Float64Array(RAW_CH),v:new Int16Array(RAW_CH*8)}; raw.chunks[ci]=c; }
  const q=(x,m)=>{x=Math.round(x*m);return x>32767?32767:x<-32767?-32767:x;};
  c.t[k]=t-raw.t0; const v=c.v,o=k*8;
  v[o]=q(acc[0],1000); v[o+1]=q(acc[1],1000); v[o+2]=q(acc[2],1000);
  v[o+3]=q(om[0],10); v[o+4]=q(om[1],10); v[o+5]=q(om[2],10);
  v[o+6]=q(dj||0,100); v[o+7]=snd==null?-1:q(snd,10);
  raw.n++;
};
proc.onGap=(t0,t1)=>{ if(raw.on) raw.gaps.push([Math.round(t0-raw.t0),Math.round(t1-raw.t0)]); };
function rawCsv(s,actual){
  const last=raw.n?raw.chunks[((raw.n-1)/RAW_CH)|0].t[(raw.n-1)%RAW_CH]:0;
  const meta=Object.assign({app:"hisar-tetik",ver:VER,bicim:1,tarih:new Date(s.date).toISOString(),alistirma:s.drill,atisTipi:s.mode,silah:s.weapon,silahAdi:s.weaponName||"",el:s.hand,elKipi:s.handMode,
    zorluk:s.diff,olcum:raw.n,sureMs:Math.round(last),doldu:raw.full,algilanan:s.shots.length,gercek:actual==null?null:actual,not:s.notes||""},raw.info,
    {atislar:s.shots.map(q=>({n:q.n,at:q.at,sc:q.sc,h:q.h,tr:q.tr,ho:q.ho,x:q.x})),sinyaller:raw.cues,bosluklar:raw.gaps});
  const out=["# HISAR TETIK ham kayit (bicim 1). Birimler: t ms, ivme mg, jiroskop 0,1 derece/sn, darbe 0,01 g, ses 0,1 dB (-1 = yok)",
    "# "+JSON.stringify(meta),"t_ms,ax_mg,ay_mg,az_mg,gx_01dps,gy_01dps,gz_01dps,darbe_001g,ses_01db"];
  let rows=[];
  for(let i=0;i<raw.n;i++){ const c=raw.chunks[(i/RAW_CH)|0], k=i%RAW_CH, v=c.v, o=k*8;
    rows.push((Math.round(c.t[k]*10)/10)+","+v[o]+","+v[o+1]+","+v[o+2]+","+v[o+3]+","+v[o+4]+","+v[o+5]+","+v[o+6]+","+v[o+7]);
    if(rows.length>=20000){ out.push(rows.join("\n")); rows=[]; } }
  if(rows.length) out.push(rows.join("\n"));
  return out.join("\n")+"\n";
}
function rawName(s){ const d=new Date(s.date); const p=n=>String(n).padStart(2,"0");
  return `hisar-ham-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${s.drill}.csv`; }

function startRun(){

  if(source==="sensor"||source==="phone"){ const mm=S.mount[source]; s.yt=!!(mm&&mm.B); } else delete s.yt;   // yön testi yapılmış mı (kanting sıfırı güvenilir mi)

  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(w=>{r.wake=w;}).catch(()=>{}); }catch(e){}
  saatGonder({t:"temizle"});

function stopRun(auto){
  const r=cur.run; if(!r||!r.active) return;
  r.active=false; r.accept=true; r.stopT=proc.lastT; proc.armed=false;   // durdurmadan önce atılıp ölçümü süren atışlar da sayılır

function finishRun(r,auto){

// Nişan yokken (silah yerden kaldırılırken, nişan hattına getirilirken, kılıfa sokulurken…) oluşan sarsıntı atış sayılmaz:
// tetik düşmeden hemen önce namlu hâlâ hızla dönüyorsa ya da son yarım saniyede çok yer değiştirdiyse bu atış değil, silahın
// hareketidir. Nişan alırken namlu saniyede birkaç derece oynar; kaldırırken saniyede yüz derece. Hızlı alıştırmalarda (çekiş,
// zamanlayıcı) atış hareketin hemen ardından gelebilir: orada yalnız son 0,15 saniyeye bakılır. Önceki atışın tepmesinden
// toparlanırken (0,8 sn) bakılmaz.
// Kuru tetikte tetik düştükten sonra atıcı nişanda kalır; sarsıntının hemen ardından silah çok dönüyorsa (şarjör çıkarma,
// sürgü çekme, silahı indirme) bu atış değildir. Gerçek atışta tepme yüzünden bu kontrol yapılmaz.
// Sınırlar bilerek geniş: nişan alırken namlu saniyede birkaç derece oynar; burada saniyede 90°, yarım saniyede 12°,
// atıştan sonra 20° aranır. Üst üste 3 sarsıntı atılırsa o seride süzgeç kapanır (hiç atış sayılmaması olmasın).
// Ayarlar › Gelişmiş › Atış algılama'dan tamamen kapatılabilir.
const NISAN_YOK_T={hareket:"Silah nişana getirilirken oluşan sarsıntı atış sayılmadı.",sonra:"Sarsıntının hemen ardından silah çok hareket etti (şarjör, sürgü ya da indirme): atış sayılmadı.",sarsinti:"Silah sabit değilken (elde sallanırken, sarsılırken) oluşan darbe atış sayılmadı.",duz:"Silah nişan duruşunda değilken (aşağı ya da yana yatık: şarjör, sürgü, masaya koyma) oluşan darbe atış sayılmadı."};
// Tetik ancak nişanda düşer: darbeden önce silah sabittir (dönme ve doğrusal ivme küçük), son atışlarla aynı duruştadır. Elde sallama,
// sarsma, kaydırma, çevirme bu sınırları geçemez. gev: tetik düşmesine benzeyen 3 darbe üst üste atılınca sınırlar %60 genişler;
// süzgeç kendiliğinden hiç kapanmaz. ref: son atışların nişan duruşu (nisanRef). Kuru tetikte önceki atıştan sonra da bakılır.
function nisanYok(m,s,prevT,gev,ref){
  if(S.sarsintiSuz===false) return "";
  const xy=m.xy; if(!xy||xy.length<TRN*2) return "";
  const canli=s.mode!=="kuru";
  if(canli&&prevT!=null&&m.st-prevT<800) return "";            // gerçek/CO2: önceki atışın tepmesinden toparlanırken bakılmaz
  const g=t=>Math.round((t-TR0)/TRS), k=gev?1.6:1, pg=m.pg||0;
  const hiz=(t0,t1)=>{ let mx=0; for(let i=g(t0)+3;i<=g(t1);i++){ const v=Math.hypot(xy[i*2]-xy[(i-3)*2],xy[i*2+1]-xy[(i-3)*2+1])/(3*TRS/1000); if(v>mx) mx=v; } return mx; };
  // ipucu: hedefin 3 katı dışına düşen darbede duruş sınırı 35°'den 15°'ye iner (tek başına atış silmez)
  const uzak=Math.hypot(xy[g(-10)*2],xy[g(-10)*2+1])>3*10.4*scaleFor(s.weapon,s.diff)/4, lh=m.lHold||0;
  if(ref&&m.up&&dot(m.up,ref)<Math.cos((uzak?15:35)*k*RAD)) return "duz";
  if(SPEED.has(s.drill)) return hiz(-150,-40)>150*k?"hareket":!m.impCh&&(m.l150||0)>1.5*k?"sarsinti":"";
  const a=g(-500), b=g(-60), yer=Math.hypot(xy[b*2]-xy[a*2],xy[b*2+1]-xy[a*2+1]);
  if(hiz(-400,-60)>90*k||yer>12*k) return "hareket";
  // tutuş (-600..-180 ms, tetik hareketinden önce): doğrusal ivme + dönme hızı (RMS) birlikte. Nişanda ≤1,3; elde sallama ≥1,8
  let s2=0,n=0; for(let i=g(-600)+3;i<=g(-180);i++){ const v=Math.hypot(xy[i*2]-xy[(i-3)*2],xy[i*2+1]-xy[(i-3)*2+1])/(3*TRS/1000); s2+=v*v; n++; }
  const tut=lh/(canli?0.8:0.35)+Math.sqrt(s2/n)/(canli?80:40);
  if(tut>1.55*(gev?1.1:1)||(!m.impCh&&pg<2*lh)) return "sarsinti";
  if(s.mode==="kuru"){ const z=g(-10); let mx=0; for(let i=g(60);i<=g(350);i++){ const d=Math.hypot(xy[i*2]-xy[z*2],xy[i*2+1]-xy[z*2+1]); if(d>mx) mx=d; }
    if(mx>20*k||(!m.impCh&&(m.lPost||0)>0.5*k)) return "sonra"; }   // telefon/WitMotion: darbeden sonra sallanma sürüyor
  return "";
}
// nişan duruşu: kabul edilen son 6 atıştan en az ikisinin 15° içinde buluştuğu yerçekimi yönü; yoksa denetlenmez (yön testine bağlı değil)
function nisanRef(r){ const u=r.ups||[]; let best=null,bn=1; for(const a of u){ const n=u.filter(b=>dot(a,b)>0.966).length; if(n>bn){bn=n;best=a;} } return best; }
proc.onShot=m=>{
  const r=cur.run; if(LZ.sifir&&!(r&&r.active)){ lzSifirAtis(m); return; }          // lazer sıfırlama atışı
  if(!r||(!r.active&&!(r.accept&&m.st<=r.stopT))) return;
  if(!r.active&&r.drill.limit&&r.drill.limit()&&validShots(r.sess).length>=r.drill.limit()) return;   // atış sınırı dolduktan sonrakiler sayılmaz
  const s=r.sess; const scale=scaleFor(s.weapon,s.diff);
  const score=clamp(100*Math.exp(-(m.trig+holdW(s)*m.hold)/scale),0,100);
  const prevT=r.shotT[r.shotT.length-1];
  const ref=nisanRef(r), yok=nisanYok(m,s,prevT,r.st.gevsek,ref);
  if(yok){ r.st.nisanYok=(r.st.nisanYok||0)+1; r.st.yokNe=yok;
    if(!r.st.gevsek&&!nisanYok(m,s,prevT,true,ref)) r.st.yokArka=(r.st.yokArka||0)+1;   // yalnız tetik düşmesine benzeyen darbe sayılır
    if(!(r.st.yokArka>=3)){ if(now()-(nisanYok.t||0)>8000){ nisanYok.t=now(); toast(NISAN_YOK_T[yok],5000); } return; }
    r.st.gevsek=true; r.ups=[]; toast("Tetik düşmesine benzeyen 3 darbe üst üste sayılmadı; bu seride süzgeç gevşetildi. Gerçek atışlar yine sayılmazsa Ayarlar › Gelişmiş › Atış algılama'dan kapat.",8000); }
  r.st.yokArka=0; if(m.up){ (r.ups=r.ups||[]).push(m.up); if(r.ups.length>6) r.ups.shift(); }
  const q={n:s.shots.length+1,at:Math.round(m.st-r.t0),sc:Math.round(score*10)/10,tr:+m.trig.toFixed(4),ho:+m.hold.toFixed(4),hx:+m.hx.toFixed(4),hy:+m.hy.toFixed(4),
    dx:+m.dx.toFixed(4),dy:+m.dy.toFixed(4),wv:m.wv==null?null:+m.wv.toFixed(4),h:hourOf(m.dx,m.dy),ca:+m.cant.toFixed(2),po:+m.post.toFixed(3),ri:+m.rise.toFixed(3),pg:+m.pg.toFixed(2),rc:m.rec==null?null:Math.round(m.rec),c:[],x:{},tz:encTrace(m.xy)};
  if(s.lzR) q.lz=lzAtis(s,m,q);                                   // lazer hedef: atışın kağıtta gerçek yeri
  if(prevT!=null) q.x.split=Math.round(m.st-prevT);
  if(m.gap) q.x.gap=1;
  if(m.sat) q.x.sat=m.sat;
  r.shotT.push(m.st);
  q.c=diagnose(q,s);
  mountChecks(r,m,q);
  if(r.eng.onShot) r.eng.onShot(r,q,m.st);
  s.shots.push(q); cur.sel=s.shots.length-1;
  const [vt,vc]=verdict(q.sc); setFeedback(q.c.length&&q.sc<85?CAUSES[q.c[0]].ad:vt,vc);
  shotSound(q); sensorShotBeep(r,q,m); sensorSonuc(q); saatAtis(r,q); lastFlash=now();
  if(s.shots.length===1&&!sessions.includes(s)&&!isDemoSess(s)) sessions.unshift(s);
  saveSession(s);
  renderSession();
  const lim=r.drill.limit?r.drill.limit():null;
  if(r.active&&lim&&validShots(s).length>=lim) stopRun(true);
};

// Montaj denetimleri: yön testinden sonra sensör farklı takıldıysa (çok büyük yatıklık) ya da gerçek atışta / CO2'de
// namlu atış sonrası aşağı kalkıyor ölçülüyorsa (yön ters ayarlı) bir kez uyarır; oturum "yön şüpheli" işaretlenir.
function mountChecks(r,m,q){
  const s=r.sess; if(s.src!=="sensor"&&s.src!=="phone") return;
  if(Math.abs(m.cant)>25&&!r.mountMsg){ r.mountMsg=true; proc.mountWarn=true; s.yonSupheli=1;
    toast(`Sensör yön testindeki gibi takılı değil (yaklaşık ${Math.round(Math.abs(m.cant))}° farklı). Oturum bitince Sensör sekmesi › Yön testi'ni yap.`,9000); }
  if((s.mode==="gercek"||s.mode==="co2")&&m.peakD>=1.5){ const f=r.flip||(r.flip={n:0,dn:0}); f.n++; if(m.fall>=1&&m.fall>2*m.rise) f.dn++;
    if(!r.flipMsg&&f.dn>=2&&f.dn>=0.6*f.n){ r.flipMsg=true; s.yonSupheli=1;
      toast("Atış sonrası namlu aşağı kalkıyor ölçüldü: sensörün yönü ters ayarlı olabilir, yukarı-aşağı yönler yanlış çıkar. Oturum bitince Yön testi'ni yap.",9000); } }
}

  const x=c.getContext("2d"); x.setTransform(d,0,0,d,0,0); const {cx,cy,rw,black}=hdGeo(w,h,rifle);
  x.save(); x.shadowColor="rgba(0,0,0,.5)"; x.shadowBlur=12; x.shadowOffsetY=3; x.fillStyle="#efe9dc"; hdRect(x,4,4,w-8,h-8,5); x.fill(); x.restore();

  x.fillStyle="#1d1d1d"; x.beginPath(); x.arc(cx,cy,black,0,Math.PI*2); x.fill();

    x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke(); }

function hdDelik(x,X,Y,rh,siyah,al){ x.save(); x.globalAlpha=al;

  x.fillStyle=siyah?"#8d887d":"#c3bba9"; x.beginPath(); x.arc(X,Y,rh+1.4,0,Math.PI*2); x.fill();
  x.fillStyle=siyah?"#e8e2d5":"#202020"; x.beginPath(); x.arc(X,Y,rh,0,Math.PI*2); x.fill(); x.restore(); }
function hdOk(x,a,b,c,d,col,lw){ const ang=Math.atan2(d-b,c-a), L=Math.max(7,lw*3.2);

// grup: atış deliklerinin en uzak iki noktası arası (grup çapı) ve ortası
function hdGrup(v){ const ps=v.map(q=>hdShot(q).p); let d=0,a=null,b=null;

function drawHedef(){

function hedefMetin(s,v,q,run,rev,yeni){

  if(!q) return `<p class="note" style="text-align:center">Nişan al ve tetiğe bas. Atışın hedefte delik olarak görünecek.</p>`;
  const rw=hdRing(s), kart=(id,ids,iki,say)=>`<button class="hd-kart${iki?" iki":""}" data-cause="${id}" data-list="${ids.join(",")}"><span class="hd-k">${iki?"Ya da":"Neden"}${say?` · ${say} atışta`:""}</span><b>${esc(CAUSES[id].ad)}</b>${iki?"":`<span>${esc(CAUSES[id].ozet)}</span>`}<i>Nasıl düzeltilir ›</i></button>`;
  if(rev){ const avg=avgOf(v), [vt,vc]=verdict(avg), iyi=v.filter(x=>x.sc>=(S.sesEsik||85)).length, cc=causeCounts(v).filter(x=>CAUSES[x[0]]).slice(0,2), ids=cc.map(x=>x[0]);
    let grup=""; if(v.length>=2){ const dm=s.dist||S.dist||25, g=hdGrup(v), cm=g.d*RAD*dm*100, k=x=>x<10?fx(x,1):Math.round(x); grup=` Grup çapı ≈ ${k(cm)} cm (${fx(dm,dm%1?1:0)} m'de).`;
      if(v.length>=3){ const r=Math.hypot(g.m[0],g.m[1]); grup+=r/rw<0.35?" Grup merkezi tam ortada.":` Grup merkezi merkezin ${HD_YER[Math.round(((Math.atan2(g.m[0],g.m[1])*DEG+360)%360)/45)%8]}, ≈ ${k(r*RAD*dm*100)} cm.`; } }
    const lv=s.lzR?v.filter(x=>x.lz&&x.lz.gor):[], lzp=lv.reduce((a,x)=>a+x.lz.halka,0), lzt=s.lzR?` Lazer ${lv.length}/${v.length} atışta görüldü${lv.length?`: toplam ${lzp} puan, atış başına ${fx(lzp/lv.length,1)}`:""}.`:"";
    return `<div class="hd"><div class="hd-son"><div class="hd-skor ${vc}"><b>${fx(Math.floor(avg),0)}</b><small>Ortalama</small></div><div class="hd-ne"><b>${esc(vt.replace("ATIŞ","OTURUM"))}</b><span>${v.length} atış, ${iyi} tanesi ${S.sesEsik||85} ve üzeri.${grup}${lzt}</span></div></div>
      ${ids.map((id,i)=>kart(id,ids,i>0,cc[i][1])).join("")}</div>`; }
  const [vt,vc]=verdict(q.sc), yon=hdYon(hdShot(q).p,rw), ids=(q.c||[]).filter(k=>CAUSES[k]), sw=silahBul(s.weaponName), lz=s.lzR&&q.lz;
  const ilk=run&&q.n===1&&sw&&sw.tetik==="da_sa"?`<p class="note" style="margin:0">${esc(sw.ad)}: ilk atış çift hareketlidir, tetik ağır ve uzundur. Tetiğe sürekli ve düz bas.</p>`:"";

  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Atış skorları"><line x1="${pl}" x2="${pl}" y1="${pt}" y2="${H-pb}" stroke="#fff" stroke-width="2"/>`;
  for(const val of [0,20,40,60,80,100]) g+=`<text x="${pl-8}" y="${Y(val)+5}" fill="#fff" font-size="13" text-anchor="end">${val}</text>`;
  if(v.length){const a=avgOf(v);g+=`<line x1="${pl+6}" x2="${W-pr}" y1="${Y(a)}" y2="${Y(a)}" stroke="#fff" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    g+=`<polyline fill="none" stroke="#fff" stroke-width="1.6" points="${sh.map((q,i)=>X(i)+","+Y(q.sc)).join(" ")}"/>`;}
  sh.forEach((q,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(q.sc)}" r="${i===cur.sel?6:4}" fill="${i===cur.sel?"#fff":"#1e1e1e"}" stroke="#22d3c5" stroke-width="2" data-i="${i}" style="cursor:pointer"/>`;});
  g+=`</svg>`; $("scoreChart").innerHTML=sh.length?g:`<p class="note">Henüz atış yok.</p>`;
  $("scoreChart").querySelectorAll("circle[data-i]").forEach(c=>c.onclick=()=>{cur.sel=+c.dataset.i;renderGrafik();});
  if(!sh.length){$("barChart").innerHTML="";$("grafikCauses").innerHTML="";return;}
  const mxv=Math.max(0.05,...sh.map(q=>Math.max(q.tr,q.ho)));
  const nice=[0.05,0.1,0.15,0.2,0.3,0.5,0.75,1,1.5,2,3,5,10]; const top=nice.find(n=>n>=mxv*1.05)||mxv;
  const BW=340,BH=230,mid=BH/2,bl=34,br=12; const bw=Math.min(36,(BW-bl-br)/sh.length*0.9); const step=(BW-bl-br)/Math.max(1,sh.length);
  const yv=val=>val/top*(mid-12);
  let b=`<svg viewBox="0 0 ${BW} ${BH}" width="100%" role="img" aria-label="Atış başına tetik ve nişan hareketi"><line x1="${bl}" x2="${bl}" y1="8" y2="${BH-8}" stroke="#fff" stroke-width="2"/>`;
  const ku=S.unit==="moa"?60:S.unit==="mil"?17.7778:1; for(const f of [1/3,2/3,1]){ const t=top*f; b+=`<text x="${bl-6}" y="${mid-yv(t)+4}" fill="#fff" font-size="11" text-anchor="end">${fx(t*ku,t*ku<1?2:1)}</text><text x="${bl-6}" y="${mid+yv(t)+4}" fill="#fff" font-size="11" text-anchor="end">${fx(t*ku,t*ku<1?2:1)}</text>`; }
  sh.forEach((q,i)=>{ const x0=bl+i*step+(step-bw)/2; const ht=yv(q.tr), hh=yv(q.ho), sel=i===cur.sel;
    b+=`<g data-i="${i}" style="cursor:pointer"><rect x="${x0}" y="${mid-ht}" width="${bw}" height="${Math.max(1,ht)}" fill="#f5c518" stroke="${sel?"#fff":"#fff8"}" stroke-width="${sel?2:1}"/><rect x="${x0}" y="${mid}" width="${bw}" height="${Math.max(1,hh)}" fill="#3b8ff0" stroke="${sel?"#fff":"#fff8"}" stroke-width="${sel?2:1}"/></g>`; });
  b+=`<line x1="${bl}" x2="${BW-br}" y1="${mid}" y2="${mid}" stroke="#fff" stroke-width="1"/></svg><p class="note">Yukarı: tetik çekme hareketi · aşağı: nişan hattı gezinmesi (${esc(S.unit==="deg"?"derece":S.unit==="moa"?"MOA":"milyem")}).</p>`;
  $("barChart").innerHTML=b; $("barChart").querySelectorAll("g[data-i]").forEach(g2=>g2.onclick=()=>{cur.sel=+g2.dataset.i;renderGrafik();});

function drawTrace(q,prog){
  const c=$("trace"); if(!c.offsetParent) return; const [x,w,h]=fitCanvas(c); const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6;
  x.clearRect(0,0,w,h); x.fillStyle="#2a2a2a"; x.fillRect(0,0,w,h);
  const xy=q?decTrace(q.tz):null;
  let ext=0.06; if(xy){for(let g=0;g<TRN;g++){if(TR0+g*TRS<=0){ext=Math.max(ext,Math.abs(xy[g*2]),Math.abs(xy[g*2+1]));}}}
  const nice=[0.01,0.02,0.025,0.05,0.1,0.2,0.25,0.5,1,2];
  const ring=nice.find(v=>v*5>=ext*1.15)||2; const sc=R/(ring*6); drawTrace.ring=ring;
  x.strokeStyle="rgba(217,58,63,.45)"; x.lineWidth=1; for(let i=1;i<=6;i++){x.beginPath();x.arc(cx,cy,ring*i*sc,0,Math.PI*2);x.stroke();}
  x.strokeStyle="rgba(255,255,255,.35)"; x.beginPath(); x.moveTo(0,cy); x.lineTo(w,cy); x.moveTo(cx,0); x.lineTo(cx,h); x.stroke();
  if(!q) return;
  if(!xy){x.fillStyle="#bbb";x.textAlign="center";x.font="13px "+getComputedStyle(document.body).getPropertyValue("--body");x.fillText("Bu atışın izi kayıtlı değil.",cx,cy-10);return;}
  const ang0=Math.atan2(q.dx,q.dy); if(q.sc<85&&trigClear(q,cur.sess||{})){x.fillStyle="rgba(217,58,63,.32)";x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,R,ang0-Math.PI/2-0.32,ang0-Math.PI/2+0.32);x.closePath();x.fill();}
  const lim=Math.floor((TRN-1)*prog);
  x.lineWidth=3; x.lineCap="round"; x.lineJoin="round";
  for(let g=1;g<=lim;g++){const t=TR0+g*TRS; x.strokeStyle=t<-150?"#3b8ff0":t<=0?"#f5c518":"#d93a3f"; x.beginPath(); x.moveTo(cx+xy[(g-1)*2]*sc,cy-xy[(g-1)*2+1]*sc); x.lineTo(cx+xy[g*2]*sc,cy-xy[g*2+1]*sc); x.stroke();}
  const gs=-TR0/TRS; if(lim>=gs){const px=cx+xy[gs*2]*sc,py=cy-xy[gs*2+1]*sc;x.strokeStyle="#fff";x.lineWidth=2.5;x.beginPath();x.moveTo(px-6,py-6);x.lineTo(px+6,py+6);x.moveTo(px+6,py-6);x.lineTo(px-6,py+6);x.stroke();}
}

function extraCols(s){const d=s.drill;

  if(d==="par") return [["Par",q=>q.x.parOk==null?"–":(q.x.parOk?"✓ ":"✗ ")+sec(q.x.react)]];
  if(d==="ritim") return [["Ritim",q=>q.x.offset!=null?(q.x.offset>=0?"+":"")+sec(q.x.offset):"–"]];
  if(d==="karar") return [["Karar",q=>({dogru:"✓ doğru",hata:"✗ hata",erken:"✗ komutsuz"})[q.x.karar]||"–"]];
  if(d==="sarjor") return [["Değiştirme",q=>q.x.change!=null?sec(q.x.change):"–"]];
  if(d==="rehine") return [["Rehine",q=>({kurtardi:"✓ kurtarıldı",gec:"✗ geç",skor:"✗ skor düşük"})[q.x.rehine]||"–"],["Süre",q=>q.x.react!=null?sec(q.x.react):"–"]];
  if(d==="zamankiyas") return [["Süre",q=>q.x.react!=null?sec(q.x.react):"–"]];
  if(d==="geritepme"||s.mode!=="kuru") return [["Tepme",q=>q.pg!=null?(q.x&&q.x.sat&1?"≥":"")+fx(q.pg,1)+" g":"–"],["Kalkış",q=>q.ri!=null?ang(q.ri):"–"],["Toparlanma",q=>q.rc!=null?sec(q.rc):">0,6 sn"]];
  return [];}
const TROPHY_S=`<svg viewBox="0 0 24 24" fill="#22d3c5" aria-label="en iyi atış"><path d="M7 3h10v3h3v2a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.4 12H8a4 4 0 0 1-4-4V6h3z"/></svg>`;

    body=>{const ta=body.querySelector("#noteTa");ta.oninput=()=>{s.notes=ta.value;if(s.shots.length)saveSession(s);};setTimeout(()=>ta.focus(),50);},()=>{ if(curView==="oturum"&&cur.sub==="ozet") renderOzet(); }); }
function summaryLines(s){
  const v=validShots(s); const d=s.drill; const out=[]; const avg=avgOf(v);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  if(d==="degerlendirme"){const lv=avg>=90?"Usta":avg>=80?"Uzman":avg>=70?"Nişancı":avg>=55?"Gelişen":"Başlangıç";out.push(["Seviye",lv],["Ortalama skor",fx(avg,1)]);}
  else if(d==="dayaniklilik"){ if(v.length>=20){const f=mean(v.slice(0,10).map(q=>q.sc)),l=mean(v.slice(-10).map(q=>q.sc));out.push(["Yorgunluk etkisi",(l-f>=0?"+":"")+fx(l-f,1)+" puan"],["İlk 10 / son 10",fx(f,1)+" / "+fx(l,1)]);}
    else out.push(["Ortalama skor",v.length?fx(avg,1):"–"],["Yorgunluk etkisi","en az 20 atış gerekir"]);}
  else if(d==="zamanlayici"){const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Ort. ilk atış",r.length?sec(mean(r)):"–"],["En iyi",r.length?sec(Math.min(...r)):"–"],["Kaçan tur",String(s.extra.miss||0)]);}
  else if(d==="par"){const n=v.filter(q=>q.x.parOk!=null);const ok=n.filter(q=>q.x.parOk).length;out.push(["Par içinde",n.length?`${ok}/${n.length} (%${Math.round(ok/n.length*100)})`:"–"],["Par süresi",fx(s.par||S.par,1)+" sn"]);}
  else if(d==="kiyas20"){const eff=v.filter(q=>q.sc>=70).length;out.push(["Etkili atış",String(eff)],["Toplam atış",String(v.length)],["Ortalama skor",fx(avg,1)]);}
  else if(d==="zamankiyas"){const r=v.map(q=>q.x.react).filter(x=>x!=null);const tot=r.length?Math.max(...r):null;out.push(["Toplam süre",tot==null?"–":sec(tot)],["Atış başına",tot==null||!v.length?"–":sec(tot/v.length)],["Ortalama skor",fx(avg,1)]);}
  else if(d==="surpriz"){const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Ort. tepki",r.length?sec(mean(r)):"–"],["Ortalama skor",fx(avg,1)],["Kaçan tur",String(s.extra.miss||0)]);}
  else if(d==="rehine"){const ok=v.filter(q=>q.x.rehine==="kurtardi").length;const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Kurtarılan",`${ok}/${s.extra.rounds||v.length}`],["Ort. süre",r.length?sec(mean(r)):"–"],["Kaçan tur",String(s.extra.miss||0)]);}
  else if(d==="ritim"){const o=v.map(q=>q.x.offset).filter(x=>x!=null);out.push(["Ort. ritim sapması",o.length?sec(mean(o.map(Math.abs))):"–"]);}
  else if(d==="kilif"){const r=v.map(q=>q.x.react).filter(x=>x!=null),m=v.map(q=>q.x.move).filter(x=>x!=null);out.push(["Ort. ilk atış",r.length?sec(mean(r)):"–"],["Ort. hareket başlama",m.length?sec(mean(m)):"–"]);}
  else if(d==="karar"){const ok=(s.extra.ok||0),bad=(s.extra.bad||0),miss=(s.extra.miss||0);const tot=ok+bad+miss;const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Doğruluk",tot?"%"+Math.round(ok/tot*100):"–"],["Hata / kaçan",bad+" / "+miss],["Ort. tepki",r.length?sec(mean(r)):"–"]);}
  else if(d==="sarjor"){const c=v.map(q=>q.x.change).filter(x=>x!=null);out.push(["Ort. değiştirme",c.length?sec(mean(c)):"–"],["En iyi",c.length?sec(Math.min(...c)):"–"]);}
  else if(d==="geritepme"){const g=v.map(q=>q.pg).filter(x=>x!=null),ri=v.map(q=>q.ri).filter(x=>x!=null),rc=v.map(q=>q.rc).filter(x=>x!=null);out.push(["Ort. tepme",g.length?fx(mean(g),1)+" g":"–"],["Ort. namlu kalkışı",ri.length?ang(mean(ri)):"–"],["Ort. toparlanma",rc.length?sec(mean(rc)):"–"]);}
  else out.push(["Ortalama skor",v.length?fx(avg,1):"–"],["Atış",String(v.length)]);
  return out;
}

function canvasToPdf(c){
  const jpg=c.toDataURL("image/jpeg",0.9); const bin=atob(jpg.split(",")[1]); const img=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) img[i]=bin.charCodeAt(i);

  const enc=t=>new TextEncoder().encode(t); const parts=[]; let len=0; const offs=[];
  const add=b=>{parts.push(b);len+=b.length;};
  add(enc("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
  const content=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  const objs=[`<< /Type /Catalog /Pages 2 0 R >>`,`<< /Type /Pages /Kids [3 0 R] /Count 1 >>`,
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`,null,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`];
  for(let i=0;i<5;i++){ offs.push(len); add(enc(`${i+1} 0 obj\n`));
    if(i===3){ add(enc(`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`)); add(img); add(enc("\nendstream")); }
    else add(enc(objs[i]));
    add(enc("\nendobj\n")); }
  const xref=len; let t=`xref\n0 6\n0000000000 65535 f \n`; for(const o of offs) t+=String(o).padStart(10,"0")+" 00000 n \n";
  t+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`; add(enc(t));
  return new Blob(parts,{type:"application/pdf"});
}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(b);});
function reportName(s,ext){const d=new Date(s.date);const p=n=>String(n).padStart(2,"0");return `hisar-tetik-${s.drill}-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`;}
async function shareBlob(blob,name,mime){
  if(APK&&window.HisarNative&&window.HisarNative.shareFile){ try{ window.HisarNative.shareFile(name,mime,await blobToB64(blob)); return "paylasildi"; }catch(e){} }
  try{ const f=new File([blob],name,{type:mime}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"HİSAR TETİK oturum raporu"}); return "paylasildi"; } }
  catch(e){ if(e&&e.name==="AbortError") return "vazgecildi"; }
  try{ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500); return "indirildi"; }catch(e){ return "hata"; }
}
async function shareSession(s,kind){ if(!s) return "hata"; const c=await buildReport(s);
  if(kind==="pdf") return shareBlob(canvasToPdf(c),reportName(s,"pdf"),"application/pdf");
  const b=await new Promise(r=>c.toBlob(r,"image/png")); return shareBlob(b,reportName(s,"png"),"image/png"); }
function openShare(s){
  if(!s||!validShots(s).length){ toast("Paylaşılacak atış yok."); return; }
  let png=null,pdf=null,url=null;
  openSheet("Oturum raporu",`<img class="share-prev" id="shPrev" alt="Rapor önizlemesi" hidden><p class="note" id="shMsg">Rapor hazırlanıyor…</p>
    <div class="btn-row"><button class="btn primary" id="shPng" disabled>Görsel olarak paylaş</button><button class="btn" id="shPdf" disabled>PDF olarak paylaş</button></div>
    <p class="note">WhatsApp, e-posta ya da galeriye kaydetmek için paylaş menüsünü kullan.</p>${rawHas(s)?`<div class="btn-row"><button class="btn" id="shRaw">Ham veri (CSV)</button></div>`:""}`,
    async body=>{
      const rw=body.querySelector("#shRaw"); if(rw) rw.onclick=()=>openRawExport(s);
      try{ const c=await buildReport(s); png=await new Promise(r=>c.toBlob(r,"image/png")); pdf=canvasToPdf(c); url=URL.createObjectURL(png);
        const im=body.querySelector("#shPrev"); if(im){im.src=url;im.hidden=false;} const m=body.querySelector("#shMsg"); if(m) m.textContent=`${validShots(s).length} atış · ${fx(avgOf(validShots(s)),1)} ortalama`;
        const b1=body.querySelector("#shPng"), b2=body.querySelector("#shPdf"); if(!b1) return; b1.disabled=false; b2.disabled=false;
        const done=r=>{ if(r==="indirildi") toast("Rapor indirildi."); else if(r==="hata") toast("Paylaşılamadı."); };
        b1.onclick=async()=>done(await shareBlob(png,reportName(s,"png"),"image/png"));
        b2.onclick=async()=>done(await shareBlob(pdf,reportName(s,"pdf"),"application/pdf"));
      }catch(e){ const m=body.querySelector("#shMsg"); if(m) m.textContent="Rapor hazırlanamadı: "+(e&&e.message||e); }
    },()=>{ if(url) setTimeout(()=>URL.revokeObjectURL(url),1000); });
}

const RANGES=[["1G",1],["7G",7],["2H",14],["1A",30],["3A",91],["6A",182],["12A",365],["HEPSİ",0]];

/* --- ANALİZ grafikleri. Her kart: başlık, tek cümlelik açıklama (sayılarla), grafik. Çizgi 2 px, nokta r=4, ızgara ince ve düz;

function trendSvg(pts){

  AN.ring={cnt,dirN};
  const shareOf=(v,k)=>v.length?v.filter(q=>(q.c||[]).includes(k)).length/v.length:0;
  const allQ=all.map(x=>x.q), A=cmp.a.flatMap(validShots), B=cmp.b.flatMap(validShots);
  const top=causeCounts(allQ).slice(0,3).map(([k])=>({k,sh:shareOf(allQ,k),a:shareOf(A,k),b:B.length>=5?shareOf(B,k):null}));

  else{ txt=`Atışlarının ${pctT(bad/all.length*100)} 85'in altında.`;
    if(top.length) txt+=` En sık hata: <b>${esc(CAUSES[top[0].k].ad.replace(/\s*\(.*\)\s*$/,""))}</b> (atışların ${pctT(top[0].sh*100,true)}).`;

  const trend=t=>{ if(t.b==null) return ""; const d=(t.a-t.b)*100; return Math.abs(d)<3?"aynı":d<0?"▼ azalıyor":"▲ artıyor"; };
  const list=top.length?`<div class="an-top">${top.map((t,i)=>`<button data-cause="${t.k}"><span class="rk">${i+1}</span><span>${esc(CAUSES[t.k].ad)}<small>atışların ${pctT(t.sh*100,true)}</small></span><span class="tr">${trend(t)} ›</span></button>`).join("")}</div>`:"";
  return anCard("anFaults","Hata haritası","an_hata",txt,all.length?`<div class="an-c an-ring" data-an="ring">${ringSvg(cnt,bad,all.length)}</div><p class="an-cap" id="anRingCap">Dilim: hatalı atışların kaydığı yön (12 yukarı, 3 sağ). Dokun: sayısı.</p>${list}`:"");

  for(const [h,t] of [[12,"12"],[3,"3"],[6,"6"],[9,"9"]]){ const a=(h*30-90)*RAD; g+=`<text x="${(C+(R+13)*Math.cos(a)).toFixed(1)}" y="${(C+(R+13)*Math.sin(a)+4).toFixed(1)}" fill="${AN_COL.txt}" font-size="11" text-anchor="middle">${t}</text>`; }
  g+=`<text x="${C}" y="${C+2}" fill="${AN_COL.fg}" font-size="26" font-weight="600" text-anchor="middle">%${Math.round(bad/Math.max(1,n)*100)}</text><text x="${C}" y="${C+20}" fill="${AN_COL.txt}" font-size="11" text-anchor="middle">85 altı</text>`;

function anGroup(ss,cmp){
  const all=shotsOf(ss).slice(-250).map(x=>x.q).filter(q=>q.dx!=null&&q.dy!=null);
  const med=a=>{ const o=a.slice().sort((x,y)=>x-y), m=o.length>>1; return o.length%2?o[m]:(o[m-1]+o[m])/2; };
  const stat=v=>{ if(v.length<5) return null; const mx=med(v.map(q=>q.dx)), my=med(v.map(q=>q.dy));
    const ds=v.map(q=>Math.hypot(q.dx-mx,q.dy-my)).sort((a,b)=>a-b); return {mx,my,r50:ds[Math.floor((ds.length-1)/2)]}; };
  const G=stat(all); AN.group={pts:all,G};
  if(!G) return anCard("anGroup","Atış grubu","an_grup",all.length?`Atış grubu için en az 5 atış gerekiyor (şu an ${all.length}).`:"Bu dönemde atış yok.","");
  let txt=`Atışlarının yarısı <b>${esc(ang(2*G.r50))}</b> çaplı bir dairede (${fx(S.dist,0)} m'de ${esc(atDist(2*G.r50))}).`;
  const GA=stat(cmp.a.flatMap(validShots).filter(q=>q.dx!=null).slice(-250)), GB=stat(cmp.b.flatMap(validShots).filter(q=>q.dx!=null)); if(GA&&GB&&GB.r50>0){ const p=pctChg(GA.r50,GB.r50); txt+=Math.abs(p)<8?` Grup ${cmp.lbl} göre aynı.`:` Grup ${cmp.lbl} göre %${Math.round(Math.abs(p))} daha ${p<0?"sıkı":"geniş"}.`; }
  const off=Math.hypot(G.mx,G.my); if(off>0.75*G.r50&&off>0.02) txt+=` Grubun merkezi <b>saat ${hourOf(G.mx,G.my)}</b> yönünde: tetik çekerken namlu hep o yöne kayıyor.`;
  return anCard("anGroup","Atış grubu","an_grup",txt,`<div class="an-c" data-an="group">${groupSvg(all,G)}</div>
    <div class="an-key"><span><i style="background:${AN_COL.good}"></i>85 ve üstü</span><span><i style="background:${AN_COL.warn}"></i>70–85</span><span><i style="background:${AN_COL.bad}"></i>70 altı</span><span><i class="ring"></i>atışların yarısı</span></div><p class="an-cap" id="anGrpCap">Son ${all.length} atış. Noktaya dokun: skoru ve kayma yönü.</p>`);
}
function groupSvg(v,G){
  const C=150, R=128;
  const ext=v.map(q=>Math.max(Math.abs(q.dx),Math.abs(q.dy))).sort((a,b)=>a-b);
  const mxe=Math.max(0.05,ext[Math.floor((ext.length-1)*0.95)]||0,Math.abs(G.mx)+G.r50,Math.abs(G.my)+G.r50)*1.12;
  AN.groupScale={C,R,mxe};
  const px=dx=>C+clamp(dx/mxe,-1.06,1.06)*R, py=dy=>C-clamp(dy/mxe,-1.06,1.06)*R;
  let g=`<svg viewBox="0 0 300 300" role="img" aria-label="Atış grubu: tetik anındaki kaymalar">`;
  for(const f of [1/3,2/3,1]) g+=`<circle cx="${C}" cy="${C}" r="${(R*f).toFixed(1)}" fill="none" stroke="${AN_COL.grid}"/>`;
  g+=`<line x1="${C-R}" x2="${C+R}" y1="${C}" y2="${C}" stroke="${AN_COL.grid}"/><line x1="${C}" x2="${C}" y1="${C-R}" y2="${C+R}" stroke="${AN_COL.grid}"/>`;
  g+=`<text x="${C+R*0.72}" y="${C-R*0.72-4}" fill="${AN_COL.txt}" font-size="10" text-anchor="middle">${esc(ang(mxe))}</text>`;
  const gr=Math.max(3,G.r50/mxe*R);
  for(const q of v){ const col=q.sc>=85?AN_COL.good:q.sc>=70?AN_COL.warn:AN_COL.bad; g+=`<circle cx="${px(q.dx).toFixed(1)}" cy="${py(q.dy).toFixed(1)}" r="4" fill="${col}" fill-opacity=".8" stroke="${AN_COL.bg}" stroke-width="1"/>`; }
  g+=`<circle cx="${px(G.mx).toFixed(1)}" cy="${py(G.my).toFixed(1)}" r="${gr.toFixed(1)}" fill="rgba(34,211,197,.12)" stroke="${AN_COL.bg}" stroke-width="5"/><circle cx="${px(G.mx).toFixed(1)}" cy="${py(G.my).toFixed(1)}" r="${gr.toFixed(1)}" fill="none" stroke="${AN_COL.sc}" stroke-width="2"/>`;
  g+=`<path d="M${(px(G.mx)-5).toFixed(1)},${py(G.my).toFixed(1)}h10M${px(G.mx).toFixed(1)},${(py(G.my)-5).toFixed(1)}v10" stroke="${AN_COL.sc}" stroke-width="2" stroke-linecap="round"/>`;
  g+=`<circle class="an-sel" r="7" fill="none" stroke="#fff" stroke-width="2" visibility="hidden"/>`;
  return g+`</svg>`;
}

function bindAnalysis(root){
  root.querySelectorAll("[data-cause]").forEach(b=>b.onclick=()=>openCause(b.dataset.cause));
  const svgPt=(svg,e)=>{ const r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return [(e.clientX-r.left)/r.width*vb.width,(e.clientY-r.top)/r.height*vb.height,r]; };
  const tr=root.querySelector('[data-an="trend"]');
  if(tr&&AN.trend&&AN.trend.length){ const svg=tr.querySelector("svg"), tip=tr.querySelector(".an-tip"), ln=svg.querySelector(".an-x"), pts=AN.trend, n=pts.length;
    const {X0,X1,W}=AN.trendGeom;
    const show=e=>{ const [x,,r]=svgPt(svg,e); const i=n<2?0:clamp(Math.round((x-X0)/(X1-X0)*(n-1)),0,n-1); const p=pts[i]; const xi=n<2?(X0+X1)/2:X0+(X1-X0)*i/(n-1);
      ln.setAttribute("x1",xi); ln.setAttribute("x2",xi); ln.setAttribute("visibility","visible");
      tip.innerHTML=`${esc(p.wk?dShort(p.d)+" haftası":dShort(p.d))} · ${p.n} atış<br><i style="background:${AN_COL.sc}"></i><b>${fx(p.sc,1)}</b> skor<br><i style="background:${AN_COL.tr}"></i><b>${p.tr==null?"–":esc(ang(p.tr))}</b> tetik<br><i style="background:${AN_COL.ho}"></i><b>${p.ho==null?"–":esc(ang(p.ho))}</b> nişan gezinmesi`;
      tip.hidden=false; const px=xi/W*r.width; tip.style.left=Math.round(px>r.width/2?px-tip.offsetWidth-8:px+8)+"px"; tip.style.top="18px"; };
    const hide=()=>{ tip.hidden=true; ln.setAttribute("visibility","hidden"); };
    tr.addEventListener("pointerdown",show); tr.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"||e.buttons) show(e); }); tr.addEventListener("pointerleave",hide); }
  const rg=root.querySelector('[data-an="ring"]');
  if(rg&&AN.ring){ const cap=$("anRingCap"); rg.querySelectorAll("[data-h]").forEach(p=>{ const f=()=>{ const h=+p.dataset.h, c=AN.ring.cnt[h]; rg.querySelectorAll("[data-h]").forEach(o=>o.setAttribute("stroke",o===p?"#fff":"none")); p.setAttribute("stroke-width","2");
      if(cap) cap.textContent=c?`Saat ${h} yönü: ${c} hatalı atış (%${Math.round(c/Math.max(1,AN.ring.dirN)*100)})`:`Saat ${h} yönüne kayan hatalı atış yok.`; };
      p.addEventListener("pointerdown",f); p.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse") f(); }); }); }
  const gp=root.querySelector('[data-an="group"]');
  if(gp&&AN.group&&AN.groupScale){ const svg=gp.querySelector("svg"), sel=svg.querySelector(".an-sel"), cap=$("anGrpCap"), {C,R,mxe}=AN.groupScale, v=AN.group.pts;
    const pick=e=>{ const [x,y]=svgPt(svg,e); let bi=-1,bd=1e9; v.forEach((q,i)=>{ const qx=C+clamp(q.dx/mxe,-1.06,1.06)*R, qy=C-clamp(q.dy/mxe,-1.06,1.06)*R, d=(qx-x)**2+(qy-y)**2; if(d<bd){bd=d;bi=i;} });
      if(bi<0||bd>30*30) return; const q=v[bi]; sel.setAttribute("cx",C+clamp(q.dx/mxe,-1.06,1.06)*R); sel.setAttribute("cy",C-clamp(q.dy/mxe,-1.06,1.06)*R); sel.setAttribute("visibility","visible");
      if(cap) cap.textContent=`Skor ${fx(q.sc,1)} · kayma ${ang(Math.hypot(q.dx,q.dy))} ${dirWord(q.dx,q.dy)}`; };
    gp.addEventListener("pointerdown",pick); gp.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"||e.buttons) pick(e); }); }
}

const LESSONS=[
 {ad:"HİSAR TETİK Tanıtımı",html:`<h3>Kuru tetik güvenliği</h3><ol><li><b>Silahı boşalt ve kontrol et.</b> Şarjörü çıkar; fişek yatağını gözle ve parmakla kontrol et.</li><li><b>Mühimmatı başka odaya koy.</b> Antrenman alanında hiç fişek olmasın.</li><li><b>Güvenli bir yöne nişan al.</b> Arkasında kimsenin olamayacağı, mermiyi durdurabilecek bir duvar seç.</li><li><b>Bitirince yüksek sesle "antrenman bitti" de.</b> Silahı doldurduktan sonra artık kuru tetik yapma.</li></ol>
  <h3>Sensörü takma</h3><ul><li><b>Raya (önerilen):</b> sensörü ray adaptörüne ya da kızağa bir kez yapıştır (ekran dışa baksın, USB-C açıkta kalsın). Tabancada namlunun altındaki, tetik korkuluğunun önündeki fener/lazer rayına; tüfekte alt ya da üst raya tak. Montaj yeri: alt ray ALT, üst ray ÜST.</li><li><b>Şarjör tabanına:</b> rayı olmayan silahta kızağı şarjör tabanındaki plakaya "tık" sesine kadar sür (Montaj yeri: ALT).</li><li><b>Bantla:</b> sensörü silahın altına, uzun kenarı namluya paralel gelecek şekilde koy; ince ve sert bantla (elektrik bandı) sıkıca sar. Köpüklü bant darbeyi yutar, atış kaçabilir. Ekranın aşağı ya da yukarı bakması fark etmez.</li><li>Sensörü her taktığında <b>yön testi</b> yap; yerini değiştirdiysen <b>eşiği öğren</b>'i de yap (tetiğin "tık"ı raya ve şarjöre farklı ulaşır). Başla'ya basınca uygulama hatırlatır.</li></ul>
  <h3>İlk ayar</h3><ol><li><b>Ayarlar:</b> silahını (tabanca ya da tüfek), atış elini ve atış tipini (kuru tetik ya da gerçek atış) seç.</li><li><b>Sensör testi:</b> Sensör sekmesi › Sensör testi. Sensörü masaya koy, 5 saniye dokunma. Bütün satırlar ✓ olmalı; test kalibrasyonu da yapar.</li><li><b>Yön testi:</b> sensörü taktıktan sonra (Başla'ya basınca sorulur ya da Sensör sekmesi › Yön testi). Silahı düz tut, namluyu 10–20° kaldırıp indir, sonra sağa çevir. Böylece sağ = sağ, yukarı = yukarı olur.</li><li><b>Atış eşiği:</b> Sensör sekmesi › Eşiği öğren. 3 kez kuru tetik yap; uygulama tetiğin sarsıntısına göre eşiği ayarlar.</li><li><b>Kontrol:</b> tetiği çekerken namluyu bilerek aşağı bastır; uygulama saat 6 civarını göstermeli.</li></ol>
  <h3>Oturum ekranı</h3><ul><li><b>Skor halkası:</b> ortadaki sayı son atışın skoru, oturum bitince ortalaması. Kırmızı dilimler hatalı atışların kaymasının saat yönünde nereye toplandığını gösterir (12 yukarı, 3 sağ).</li><li><b>Grafik:</b> üstte her atışın skoru. Altta sarı çubuk tetik çekme hareketi, mavi çubuk atıştan önceki nişan gezinmesi.</li><li><b>İz:</b> namlunun hareket izi. Mavi: atıştan önceki 1 saniye, sarı: tetik anı (son 0,15 saniye), kırmızı: atıştan sonrası, ✕: tetiğin kırıldığı an. Oynat düğmesi izi yavaşça gösterir.</li><li><b>Özet:</b> her atışın skoru ve zamanı, ortalama skor ve toplam süre.</li><li><b>Olası nedenler:</b> dokununca hatanın açıklaması, nasıl düzeltileceği ve önerilen alıştırma açılır.</li></ul>
  <h3>Skoru okuma</h3><ul><li><b>Skor (0–100):</b> tetik çekilirken namlunun ne kadar oynadığına ve atıştan önceki saniyede nişanın ne kadar dolaştığına göre. 85 ve üstü harika, 70–85 iyi, 50–70 geliştirilmeli, 50 altı zayıf.</li><li><b>Nişanın sallanması:</b> tetik düşerken namlunun oynaması elin doğal titremesi kadar küçükse uygulama tetik hatası uydurmaz; puan, nişan sabit durmadığı için düşmüştür.</li><li><b>Yana yatırma (kanting):</b> silahın atış anında yana yatık olması; 2,5 dereceden fazlası hata sayılır.</li><li><b>Gerçek atışta:</b> namlu kalkışı (tepme) ve toparlanma süresi de ölçülür.</li></ul>
  <h3>Sesler</h3><ul><li><b>Sensör:</b> açılınca kısa bir ezgi, bağlanınca iki ince bip çalar. Her atıştan sonra iyi atışta iki ince, kötü atışta kalın bip çalar (Sensör sekmesi › Sensör sesleri; hızlı alıştırmalarda çalmaz).</li><li><b>Telefon:</b> sensör bağlanınca karşılama sözünü söyler; atış sonrası sesi ve sözü Ayarlar › Sesli geri bildirim'den seçilir.</li><li><b>Sensörü kapatma:</b> sol yandaki güç düğmesine ya da sağ yandaki düğmeye 2 saniye bas.</li></ul>

 {ad:"Temel Nişancılık",th:thumb("TEMEL"),html:`<h3>Duruş</h3><p>Ayaklar omuz genişliğinde, ağırlık hafif öne. Duruşu, gözünü kapatıp açtığında nişan hedefte kalacak şekilde kur (doğal nişan noktası).</p><h3>Tutuş</h3><p>Kabzayı yüksekten kavra; atış eli ve destek eli boşluk bırakmadan birleşsin. Tutuş basıncı atış boyunca değişmesin.</p><h3>Nişan alma</h3><p>Gözün arpacığa odaklansın; gez ve hedef hafif bulanık görünür. Arpacığın üst kenarı gezin üst kenarıyla aynı hizada ve ortada olmalı.</p><h3>Nefes</h3><p>Nefesini rahatça ver ve doğal duraklamada (1–2 saniye) tetiği kır.</p><h3>Tetik kontrolü</h3><ul><li><b>Boşluğu al:</b> tetiğin serbest hareketini al, dirence gel.</li><li><b>Baskıyı artır:</b> kırılana kadar baskıyı yavaş ve sürekli artır; arpacık kıpırdamamalı.</li><li><b>Sürpriz kırılma:</b> tetiğin ne zaman kırılacağını bilmezsen vücudun tepmeyi öngöremez.</li><li><b>Takip ve kurtulma:</b> kırıldıktan sonra nişanı bir saniye tut, tetiği sadece "tık" sesine kadar bırak.</li></ul>`},
 {ad:"İleri Nişancılık",th:thumb("İLERİ"),causes:true,html:`<h3>Haftalık program</h3><ul><li><b>Pazartesi:</b> Serbest Antrenman, 20 dikkatli atış.</li><li><b>Salı:</b> Ritmik Antrenman (tetiği tokatlamayı kırar).</li><li><b>Çarşamba:</b> Atış Zamanlayıcısı ve Par Ölçer.</li><li><b>Perşembe:</b> Sadece Atış Eli ve Sadece Destek Eli, 10'ar atış.</li><li><b>Cuma:</b> Karar Tatbikatları ve Kılıf Çekiş Analizi.</li><li><b>Cumartesi:</b> Dayanıklılık.</li><li><b>Pazar:</b> Değerlendirme Testi.</li></ul><p>Her gün 10–20 dakika yeterli. Yorulunca bırak.</p>
