function emptySvg(msg){return `<svg viewBox="0 0 300 220" width="100%"><g fill="none" stroke="#555">${[100,80,60,40,20].map(r=>`<circle cx="150" cy="110" r="${r}"/>`).join("")}</g><text x="150" y="106" fill="#ddd" font-size="12.5" text-anchor="middle">${esc(msg)}</text><text x="150" y="124" fill="#ddd" font-size="12.5" text-anchor="middle">Alıştırma yapmaya devam et.</text></svg>`;}
function radarSvg(shots){
  if(shots.length<3) return emptySvg("Bu grafik için en az 3 atış gerekiyor.");
  const cnt=Array(8).fill(0), sum=Array(8).fill(0), n=Array(8).fill(0);
  for(const q of shots){let a=Math.atan2(q.dx,q.dy)*DEG;if(a<0)a+=360;const k=Math.round(a/45)%8;n[k]++;sum[k]+=q.sc;if(q.sc<85)cnt[k]++;}
  const mx=Math.max(1,...cnt); const C=150,CY=135,Rr=104;
  let g=`<svg viewBox="0 0 300 270" width="100%" role="img" aria-label="Yönlere göre hata dağılımı">`;
  for(let ring=1;ring<=8;ring++){g+=`<polygon points="${[...Array(8)].map((_,k)=>{const a=(k*45-90)*RAD;return (C+Rr*ring/8*Math.cos(a))+","+(CY+Rr*ring/8*Math.sin(a));}).join(" ")}" fill="none" stroke="#5a5a5a"/>`;}
  for(let k=0;k<8;k++){const a=(k*45-90)*RAD;g+=`<line x1="${C}" y1="${CY}" x2="${C+Rr*Math.cos(a)}" y2="${CY+Rr*Math.sin(a)}" stroke="#5a5a5a"/><text x="${C+(Rr+16)*Math.cos(a)}" y="${CY+(Rr+14)*Math.sin(a)+4}" fill="#ddd" font-size="10.5" text-anchor="middle">${n[k]?fx(sum[k]/n[k],0):"–"}</text>`;}
  g+=`<polygon points="${cnt.map((c,k)=>{const a=(k*45-90)*RAD;const r=Rr*Math.max(0.03,c/mx);return (C+r*Math.cos(a))+","+(CY+r*Math.sin(a));}).join(" ")}" fill="rgba(182,33,38,.75)" stroke="#b62126" stroke-width="1.5"/></svg>`;
  return g;
}
function pieSvg(shots){
  const all=causeCounts(shots); if(!all.length) return emptySvg(shots.length?"Hata görülmedi: bütün atışlar 85 ve üzeri.":"Henüz atış yok.");
  const cols=["#b62126","#c62f2a","#d63c2e","#e04a32","#e85b36","#f06c3b","#f47d41","#f78e48"]; const N=all.reduce((a,c)=>a+c[1],0);
  const top=all.length>7?all.slice(0,6):all, rest=all.slice(top.length);
  const segs=top.map(([k,v],i)=>({k,v,col:cols[i]})); if(rest.length){const v=rest.reduce((a,c)=>a+c[1],0);segs.push({k:null,v,col:"#8a5a5a"});}
  let a0=-Math.PI/2, g=`<svg viewBox="0 0 300 230" width="100%" role="img" aria-label="En sık hatalar">`;
  const lbl=[];
  segs.forEach(s=>{const a1=a0+s.v/N*Math.PI*2;const large=a1-a0>Math.PI?1:0;const p=(r,a)=>(150+r*Math.cos(a))+","+(115+r*Math.sin(a));
    g+=segs.length===1?`<circle cx="150" cy="115" r="105" fill="${s.col}"/>`:`<path d="M150,115 L${p(105,a0)} A105,105 0 ${large} 1 ${p(105,a1)}Z" fill="${s.col}" stroke="#252525" stroke-width="1"/>`;
    const am=(a0+a1)/2; if(s.v/N>=0.06) lbl.push(`<text x="${150+64*Math.cos(am)}" y="${115+64*Math.sin(am)}" fill="#fff" font-size="9.5" text-anchor="middle">%${Math.round(s.v/N*100)}</text><text x="${150+64*Math.cos(am)}" y="${115+64*Math.sin(am)+11}" fill="#fff" font-size="8" text-anchor="middle">${esc((s.k?CAUSES[s.k].ad:"Diğer").toLocaleUpperCase("tr-TR").slice(0,18))}</text>`);
    a0=a1;});
  g+=lbl.join("")+`</svg>`;
  return g+`<div class="bars">`+segs.map(s=>s.k?`<button class="bar-row" data-cause="${s.k}"><span><i style="display:inline-block;width:10px;height:10px;background:${s.col};margin-right:6px"></i>${esc(CAUSES[s.k].ad)}</span><span>%${Math.round(s.v/N*100)}</span></button>`:`<div class="bar-row"><span><i style="display:inline-block;width:10px;height:10px;background:${s.col};margin-right:6px"></i>Diğer (${rest.length} neden)</span><span>%${Math.round(s.v/N*100)}</span></div>`).join("")+`</div>`;
}
function groupSvg(shots){
  if(shots.length<50) return emptySvg("Bu grafik için 50 veya daha fazla atış gerekiyor.");
  const mx=Math.max(0.05,...shots.map(q=>Math.max(Math.abs(q.dx),Math.abs(q.dy))))*1.1; const C=150,CY=115,R=105;
  let g=`<svg viewBox="0 0 300 230" width="100%" role="img" aria-label="Tetik anındaki kaymalar">`;
  for(let i=1;i<=5;i++) g+=`<circle cx="${C}" cy="${CY}" r="${R*i/5}" fill="none" stroke="#555"/>`;
  for(const q of shots){g+=`<circle cx="${C+q.dx/mx*R}" cy="${CY-q.dy/mx*R}" r="3" fill="${q.sc>=85?"#4cc26b":q.sc>=70?"#f2b33d":"#d93a3f"}" fill-opacity=".85"/>`;}
  return g+`</svg><p class="note">Her nokta tetik anında namlunun kayması. Dış halka ${esc(ang(mx))}.</p>`;
}
function histSvg(shots){
  if(!shots.length) return emptySvg("Henüz atış yok.");
  const bins=Array(13).fill(0); shots.forEach(q=>{bins[q.sc<40?0:Math.min(12,Math.floor((q.sc-40)/5))]++;}); const mx=Math.max(1,...bins);
  const W=300,H=230,pl=34,pb=40,bw=(W-pl-8)/13;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Skor dağılımı"><line x1="${pl}" x2="${pl}" y1="10" y2="${H-pb}" stroke="#777"/><line x1="${pl}" x2="${W-6}" y1="${H-pb}" y2="${H-pb}" stroke="#777"/>`;
  bins.forEach((b,i)=>{const h=b/mx*(H-pb-24);const x=pl+4+i*bw;g+=`<rect x="${x}" y="${H-pb-h}" width="${bw*0.62}" height="${h}" fill="#b62126"/>${b?`<text x="${x+bw*0.31}" y="${H-pb-h-4}" fill="#ddd" font-size="9" text-anchor="middle">${b}</text>`:""}<text x="${x+bw*0.31}" y="${H-pb+13}" fill="#ccc" font-size="8.5" text-anchor="middle">${40+i*5}</text>`;});
  g+=`<text x="${(W+pl)/2}" y="${H-12}" fill="#ddd" font-size="11" text-anchor="middle">Skor</text><text x="12" y="${(H-pb)/2}" fill="#ddd" font-size="11" text-anchor="middle" transform="rotate(-90 12 ${(H-pb)/2})">Atış Sayısı</text></svg>`;
  return g;
}

  mik:["Mikrofon desteği","Sensörün mikrofonu kuru tetikte ve CO2'de tetiğin tık sesini de dinler. Yardımcı (önerilen): sarsıntı eşiği aşmasa da tık sesiyle aynı anda gelen darbe atış sayılır. Sıkı: sesi olmayan sarsıntılar (silaha çarpma, tutuş değiştirme) atış sayılmaz; mikrofon tık sesini duymazsa Sıkı kip kendiliğinden kapanır. Gerçek atışta ve sensör bip çalarken mikrofon kullanılmaz."],

  yon:["Yön testi","Montaj yönü ve yerini uygulamanın kendisi ölçer: dediği gibi silahı kaldırır ve yana çevirirsin. Sensörü başka silaha ya da farklı yöne taktığında tekrarla."],
  canli:["Canlı kontrol","Silahı nişan alır gibi düz tut: kanting 0° civarında olmalı. Sağa yatırınca kanting + yönde, namluyu kaldırınca namlu açısı + yönde artmalı. Ters gidiyorsa Ayarlar'daki Montaj Yönü'nü değiştir ya da yön testini yap."],
  kal:["Kalibrasyon","Jiroskobun durağan sapması ölçülür. Silah 1,5 saniye kıpırdamadan durunca kendiliğinden yeniden ölçülür; sıcaklıkla değişen sapma böyle takip edilir. Elle yapmak için sensörü masaya koyup düğmeye bas."],

  diger:["Sensörsüz","Deneme modu sanal bir atıcıyla çalışır, oturumları kaydedilmez. Telefonun sensörü telefonun kendi hareket ölçerini kullanır; yalnız kuru tetik içindir, telefonu gerçek atışta silaha takma. Sensörü unut: uygulama açılışta artık bu sensörü beklemez."],
  ham:["Ham kayıt","Atış algılamayı silahına göre ayarlamak için. Açıkken her oturumda ivme, jiroskop, darbe ve ses ölçümleri bellekte tutulur; oturum bitince oturum ekranının sağ üstündeki paylaş düğmesinden Ham veri ile CSV dosyası olarak paylaşılır. Sadece son oturumun kaydı tutulur, en çok 30 dakika."],
  veri:["Veriler","Atışların sadece bu telefonda saklanır. Telefon değiştirirken dışa aktar (JSON), yeni telefonda içe aktar. CSV dosyası atışları tablo olarak verir (Excel)."],
  program:["Eğitim programı","Antrenman günlerini ve günlük atış hedefini seç. Geçmiş'teki Antrenman Serisi yalnız bu günleri sayar; günlük hedef çizgisi de buradan gelir."],
  ses:["Sesli geri bildirim","Her atıştan sonra: Bip (sınırın üstünde iki notalı tatlı ses, altında kalın vızıltı), skorun sesli okunması ya da skor ve hatanın nedeni. Gözün nişandan ayrılmadan sonucu duyarsın."]

const infoBtn=k=>`<button class="i-red" data-info="${k}" aria-label="${esc(INFO[k][0])}: açıklama">i</button>`;
function bindInfo(root){ root.querySelectorAll("[data-info]").forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const it=INFO[b.dataset.info]; if(it) openSheet(it[0],`<p>${esc(it[1])}</p><button class="btn" data-close>Tamam</button>`); }); }
const SOUND_T={kapali:"Kapalı",bip:"Bip",skor:"Skoru söyle",tam:"Skor ve neden"};
const DAYS=[[1,"Pzt"],[2,"Sal"],[3,"Çar"],[4,"Per"],[5,"Cum"],[6,"Cmt"],[0,"Paz"]];
function planDesc(){ const d=S.plan.days||[]; return (d.length?d.length+" gün":"Her gün")+" · "+(S.plan.goal||50)+" atış"; }
const SET_T={gelismis:"Gelişmiş Ayarlar",baglanti:"Sensör",montaj:"Kalibrasyon ve yön testi",algilama:"Atış algılama",gorunum:"Görünüm",veri:"Veriler",uygulama:"Uygulama",
  program:"Eğitim Programı",ses:"Sesli Geri Bildirim",silah:"Silahını Seç",profil:"Profil"};
const SET_PARENT={baglanti:"gelismis",montaj:"gelismis",algilama:"gelismis",gorunum:"gelismis",veri:"gelismis",uygulama:"gelismis"};
const WRAP=new Set(["baglanti","montaj","algilama","gorunum","veri","uygulama"]);
function openSetPage(p){ pushPage({set:p,back:"",title:p==="algilama"?MODE_A[S.mode]:SET_T[p],render:()=>WRAP.has(p)?`<div class="pg">${PAGES[p][0]()}</div>`:PAGES[p][0](),bind:root=>PAGES[p][1](root)}); }
function openSettings(p){ showView("ayarlar"); if(p==="alistirma") p=null; if(!p||!SET_T[p]) return; if(SET_PARENT[p]) openSetPage(SET_PARENT[p]); openSetPage(p); }
function srcName(x){return {demo:"Deneme",phone:"Telefon",sensor:"Sensör"}[x]||x;}
function curThr(){return (S.thr[source]||S.thr.demo)[S.mode];}
function montajSrc(){return mjSrc||(source==="phone"?"phone":"sensor");}
function ago(ms){ms=Math.max(0,ms);return ms<60000?Math.round(ms/1000)+" sn önce":ms<3600000?Math.round(ms/60000)+" dk önce":Math.round(ms/3600000)+" sa önce";}
function menuDesc(p){
  switch(p){
    case "baglanti": return source==="sensor"&&ble.st==="bagli"?`Bağlı${ble.bat!=null?" · pil %"+ble.bat:""}${ble.fw?" · yazılım "+ble.fw:""}`:source==="sensor"&&(ble.st==="yeniden"||ble.st==="baglaniyor")?"Bağlanıyor…":source==="demo"?"Deneme modu":source==="phone"?"Telefon sensörü":"Bağlı değil";
    case "montaj": { const m=S.mount[montajSrc()]; return m.B?"Yön testi yapıldı":"Yön testi yapılmadı"; }
    case "algilama": return `${MODE_T[S.mode]} · eşik ${fx(curThr(),2)} g`;
    case "gorunum": return `${{deg:"Derece",moa:"MOA",mil:"Milyem"}[S.unit]} · ${S.dist} m`;
    case "veri": { const r=sessions.filter(x=>!x.sample); return `${r.length} oturum`; }
    case "uygulama": return `Sürüm ${VER}${updAvail?" · yeni sürüm var":""}`;
  }
  return "";
}
function renderSettings(){
  const top=pages[pages.length-1];
  if(top){ if(top.set) refreshPage(); return; }
  if(curView!=="ayarlar") return;
  const root=$("v-ayarlar"); detTest=null;
  root.innerHTML=pgRoot(); bindRoot(root); bindInfo(root);
}
const PAGES={gelismis:[pgGelismis,bindGelismis],baglanti:[pgBaglanti,bindBaglanti],montaj:[pgMontaj,bindMontaj],algilama:[pgAlgilama,bindAlgilama],
  gorunum:[pgGorunum,bindGorunum],veri:[pgVeri,bindVeri],uygulama:[pgUygulama,bindUygulama],program:[pgProgram,bindProgram],ses:[pgSes,bindSes],silah:[pgSilah,bindSilah],profil:[pgProfil,bindProfil]};
/* --- Ayarlar ana sayfası: MantisX'teki gibi tek sayfa */
function pgRoot(){
  const mt=S.mount[montajSrc()]; const wl=S.weaponName?S.weaponName:(S.weapon==="pistol"?"Tabanca":"Tüfek");
  return `<div class="mx">
    <div class="mx-l"><span>${esc(wl)}</span></div>
    ${mxSeg("sWeapon",[["pistol","",IC_PISTOL],["rifle","",IC_RIFLE]],S.weapon,"big")}
    <button class="mx-btn" id="sPick" style="margin-top:14px">Silahını seç</button>
    <div class="mx-l"><span>${S.hand==="R"?"Sağ El":"Sol El"}</span></div>
    ${mxSeg("sHand",[["L","Sol",HAND_IC("L")],["R","Sağ",HAND_IC("R")]],S.hand,"hand")}
    <div class="mx-l"><span>${esc(MODE_A[S.mode])}</span>${infoBtn("tip")}</div>
    ${mxSeg("sMode",[["gercek","Gerçek atış",MODE_IC.gercek],["kuru","Kuru tetik",MODE_IC.kuru],["more",S.mode==="co2"?"CO2":"Daha fazla",S.mode==="co2"?MODE_IC.co2:""]],S.mode==="co2"?"more":S.mode,"mode")}
    <div class="mx-l"><span>Montaj Yönü</span>${infoBtn("myon")}</div>
    ${mxSeg("sYon",[["ileri","İleri",IC_MFWD],["arka","Arka",IC_MBACK]],mt.yon||"ileri","mt")}
    <div class="mx-l"><span>Montaj Yeri</span>${infoBtn("myer")}</div>
    ${mxSeg("sYer",[["alt","Alt"],["ust","Üst"],["sag","Sağ"],["sol","Sol"]],mt.yer||"alt","four")}
  </div>
  <div class="prof"><span class="pl">${LOGO_SVG}</span><div style="min-width:0"><div class="pn" id="profName">${esc(curProf().ad)}</div><button class="pe" id="profEdit">Profilini düzenle</button></div><button class="pd" id="profPick" aria-label="Atıcı değiştir"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M5 8h14l-7 9z"/></svg></button></div>
  <div class="sl">
    <button id="rtProgram">${IC_BELL}Eğitim programı<small>${esc(planDesc())}</small></button>
    <button id="rtSes">${IC_SPK}Sesli geri bildirim<small>${esc(SOUND_T[S.sound]||"")}</small></button>
    <button id="rtAdv">${IC_SLD}Gelişmiş ayarlar<small id="md-baglanti">${esc(menuDesc("baglanti"))}</small></button>
  </div>`;
}
function bindRoot(root){
  bindSeg(root,"sWeapon",v=>{ if(S.weapon!==v){ S.weapon=v; if(S.weaponName&&!(S.weapons||[]).some(w=>w.ad===S.weaponName&&w.tip===v)) S.weaponName=""; } saveMeta(); renderSettings(); });
  bindSeg(root,"sHand",v=>{S.hand=v;saveMeta();renderSettings();});
  bindSeg(root,"sMode",v=>{ if(v==="more"){ openModeList(); return; } setMode(v); renderSettings(); });
  bindSeg(root,"sYon",v=>{ setYon(v); renderSettings(); });
  bindSeg(root,"sYer",v=>{ const m=S.mount[montajSrc()]; m.yer=v; applyCfg(); saveMeta(); });
  $("sPick").onclick=()=>openSetPage("silah");
  $("profEdit").onclick=()=>openSetPage("profil");
  $("profPick").onclick=()=>openProfPick();
  $("rtProgram").onclick=()=>openSetPage("program");
  $("rtSes").onclick=()=>openSetPage("ses");
  $("rtAdv").onclick=()=>openSetPage("gelismis");
}
function setMode(v){ S.mode=v; applyCfg(); saveMeta(); if(v!=="kuru"&&source==="phone") toast("Telefonu gerçek atışta silaha takma; tepme telefona zarar verir."); }
// montaj yönü: yön testi yapıldıysa ölçülen namlu ekseni ters çevrilir; yoksa uzun eksenin yönü değişir
function setYon(v){ const m=S.mount[montajSrc()]; if((m.yon||"ileri")!==v&&m.B) m.B=m.B.map(x=>+(-x).toFixed(4)); m.yon=v; applyCfg(); saveMeta(); }
function updateRootSensor(){ const md=$("md-baglanti"); if(md) md.textContent=menuDesc("baglanti"); }
/* --- atış tipleri (Daha fazla): her tipin algılama ayarı ⚙ ile */
function openModeList(){
  pushPage({back:"",title:MODE_A[S.mode],render:()=>`<div class="sec" style="justify-content:center;background:#303030;font-size:13px;border-bottom:2px solid var(--blue)">Atış tipleri</div>`+["gercek","kuru","co2"].map(k=>{
      const thr=(S.thr[source]||S.thr.demo)[k], lk=(S.lockout&&S.lockout[k])||(k==="kuru"?450:150);
      return `<div class="li" style="grid-template-columns:minmax(0,1fr) auto;padding-left:0;${S.mode===k?"box-shadow:inset 4px 0 0 var(--red2)":""}"><button class="ln" data-mode="${k}" style="background:none;border:0;color:var(--fg);text-align:left;font-size:17px;padding:4px 0 4px 18px"><span>${esc({gercek:"Gerçek Atış (Evrensel)",kuru:"Kuru Tetik (Evrensel)",co2:"CO2 Geri Tepme"}[k])}</span>
        <small style="display:flex;gap:8px;margin-top:6px"><span style="background:#3a3a3a;padding:2px 6px">${MODE_IC[k].replace('<svg ','<svg width="14" height="14" ')} ${fx(thr,2)} g</span><span style="background:#3a3a3a;padding:2px 6px">⏱ ${fx(lk/1000,2)}</span></small></button>
        <button class="pd" data-gear="${k}" aria-label="${esc(MODE_T[k])} algılama ayarları" style="width:44px;height:44px;background:#3a3a3a;border:0;color:#fff;display:grid;place-items:center">${IC_GEAR}</button></div>`; }).join(""),
    bind:b=>{ b.querySelectorAll("[data-mode]").forEach(x=>x.onclick=()=>{ setMode(x.dataset.mode); popPage(); });
      b.querySelectorAll("[data-gear]").forEach(x=>x.onclick=()=>{ setMode(x.dataset.gear); openSetPage("algilama"); }); }});
}
/* --- alıştırma ayarları (oturum ekranındaki DRILL düğmesi) */
function openDrillSettings(id){
  const d=DRM[id]; const ds=()=>{ S.dset=S.dset||{}; return S.dset[id]=Object.assign({},S.dset[id]||{}); };
  const num=(lab,key,mn,mx,st)=>`<div class="field"><label for="ds_${key}">${lab}</label><input type="number" id="ds_${key}" min="${mn}" max="${mx}" step="${st}" value="${S[key]}" inputmode="decimal"></div>`;
  pushPage({back:"",title:"Alıştırma ayarları",noNav:true,render:()=>{ const v=dsetOf(id); let h="";
      if(["serbest","safespace","atiseli","destekeli"].includes(id)) h+=`<div class="field"><span class="fl">Atış sayısı (dolunca oturum biter)</span>${segHtml("dsShots",[["0","Sınırsız"],["10","10"],["20","20"],["30","30"]],String(v.shots||0))}</div>`;
      if(id==="zamankiyas") h+=`<div class="field"><span class="fl">Atış sayısı</span>${segHtml("dsShots",[["5","5"],["10","10"],["15","15"],["20","20"]],String(v.shots))}</div>`;
      if(id==="surpriz") h+=`<div class="field"><span class="fl">Tur sayısı</span>${segHtml("dsRounds",[["5","5"],["10","10"],["15","15"],["20","20"]],String(v.rounds))}</div>`;
      if(id==="rehine") h+=`<div class="field"><span class="fl">Zorluk</span>${segHtml("dsZor",Object.entries(REHINE).map(([k,L])=>[k,`${L.ad} · ${fx(L.t/1000,0)} sn · ${L.sc}`]),v.zorluk)}</div><div class="field"><span class="fl">Tur sayısı</span>${segHtml("dsRounds",[["5","5"],["10","10"],["15","15"]],String(v.rounds))}</div>`;
      if(id==="par") h+=num("Par süresi (sn)","par",0.5,10,0.1);
      if(id==="ritim") h+=`<div class="two">${num("Ritim aralığı (sn)","ritim",0.6,5,0.1)}${num("Atış sayısı","ritimShots",5,100,1)}</div>`;
      if(id==="dayaniklilik") h+=`<div class="field"><span class="fl">Atış sayısı</span>${segHtml("dsDay",[["20","20"],["30","30"],["50","50"],["100","100"]],String(S.dayanik))}</div>`;
      if(id==="degerlendirme") h+=`<p class="note">10 atış; ayar gerekmez.</p>`;
      if(!h) h=`<p class="note">Bu alıştırmanın ayarı yok.</p>`;
      if(source==="demo") h+=`<label class="toggle">Deneme modunda otomatik atış<input type="checkbox" id="dsAuto" ${S.autoShot?"checked":""}></label>`;
      return `<div class="pg"><h2 style="margin:0;font-size:18px;font-weight:400">${esc(d.ad)}</h2>${h}<button class="btn" id="dsReset">Varsayılana dön</button></div>`; },
    bind:b=>{
      bindSeg(b,"dsShots",x=>{ds().shots=+x;saveMeta();}); bindSeg(b,"dsRounds",x=>{ds().rounds=+x;saveMeta();}); bindSeg(b,"dsZor",x=>{ds().zorluk=x;saveMeta();});
      bindSeg(b,"dsDay",x=>{S.dayanik=+x;saveMeta();});
      const nb=(key,mn,mx)=>{const e=b.querySelector("#ds_"+key); if(e) e.onchange=()=>{let v=parseFloat(String(e.value).replace(",","."));if(!isFinite(v))v=DEF[key];v=clamp(v,mn,mx);S[key]=v;e.value=v;saveMeta();};};
      nb("par",0.5,10); nb("ritim",0.6,5); nb("ritimShots",5,100);
      const au=b.querySelector("#dsAuto"); if(au) au.onchange=e=>{S.autoShot=e.target.checked;saveMeta();};
      b.querySelector("#dsReset").onclick=()=>{ if(S.dset) delete S.dset[id]; if(id==="par") S.par=DEF.par; if(id==="ritim"){S.ritim=DEF.ritim;S.ritimShots=DEF.ritimShots;} if(id==="dayaniklilik") S.dayanik=DEF.dayanik; saveMeta(); refreshPage(); };
    }});
}

/* --- Eğitim programı */
function pgProgram(){ const d=new Set(S.plan.days||[]); const t0=dayNo(); const wd=new Date(t0*864e5).getUTCDay(); const mon=t0-((wd+6)%7);
  const done=new Set(sessions.filter(s=>!s.sample&&whoOf(s)===S.prof).map(s=>dayNo(s.date)));
  const week=DAYS.map(([w,t],i)=>{ const n=mon+i; const sch=!d.size||d.has(w); return `<div style="text-align:center;font-size:12px;color:${sch?"var(--fg)":"var(--dim)"}">${t}<div style="font-size:18px;margin-top:2px">${done.has(n)?"✓":n<=t0&&sch?"·":""}</div></div>`; }).join("");
  return `<div class="pg"><div class="ch"><span>Antrenman günleri</span>${infoBtn("program")}</div>
    <div class="mx-seg" id="pDays" style="gap:6px">${DAYS.map(([w,t])=>`<button data-v="${w}" aria-pressed="${d.has(w)}" style="min-height:44px;font-size:12px">${t}</button>`).join("")}</div>
    <p class="note">Hiç gün seçmezsen her gün sayılır.</p>
    <div class="ch" style="margin-top:6px"><span>Günlük atış hedefi</span></div>
    ${segHtml("pGoal",[["20","20"],["50","50"],["100","100"],["200","200"]],String(S.plan.goal||50))}
    <div class="card" style="margin-top:8px"><h2>Bu hafta</h2><div style="display:grid;grid-template-columns:repeat(7,1fr)">${week}</div></div></div>`; }
function bindProgram(root){
  root.querySelectorAll("#pDays button").forEach(b=>b.onclick=()=>{ const set=new Set(S.plan.days||[]); const w=+b.dataset.v; if(set.has(w)) set.delete(w); else set.add(w); S.plan=Object.assign({},S.plan,{days:[...set]}); saveMeta(); refreshPage(); });
  bindSeg(root,"pGoal",v=>{ S.plan=Object.assign({},S.plan,{goal:+v}); saveMeta(); });
}

function profStats(pid,drill,days){ const t=Date.now()-(days||0)*864e5; const ss=sessions.filter(s=>!s.sample&&!s.safe&&whoOf(s)===pid&&(!drill||s.drill===drill)&&(!days||s.date>=t)); const v=ss.flatMap(validShots); return {n:v.length,avg:v.length?avgOf(v):null,s:ss.length}; }

  if($("dvOffNow")) $("dvOffNow").onclick=()=>askSheet("Sensörü kapat","Sensör kapanacak. Açmak için yan güç düğmesine bas.","Kapat",()=>{ if(bleCmd([0x05])){ setTimeout(()=>sensorDisconnect(),400); } });
}
/* ---------------------------------------------------------------- sensör yazılımı: telefondan güncelleme (Bluetooth) */
// Sensör yazılımı 2 ve sonrası, yeni sürümü Bluetooth ile alır (iki bölümlü OTA, CRC ve resim doğrulamalı).
const ota={on:false,st:"",size:0,sent:0,acked:0,t0:0,err:"",waiters:[],rewind:null,fail:null,abort:false,info:null,infoT:0};
const OTA_ERR={2:"eksik veri",3:"dosya doğrulanamadı (CRC)",4:"yazılım sensörde doğrulanamadı",5:"dosya sensöre sığmıyor",6:"sensör belleğine yazılamadı",7:"güncelleme başlamadı"};
let fwKey="";
function crc32(u8){ const T=crc32.T||(crc32.T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})());
  let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function fwBase(){ return HOSTED&&!APK?"":HOSTED_URL; }
async function otaInfo(force){
  if(ota.info&&!force&&now()-ota.infoT<10*60*1000) return ota.info;
  const r=await fetch(fwBase()+"firmware/ota.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("güncelleme bilgisi alınamadı");
  ota.info=await r.json(); ota.infoT=now(); return ota.info;
}
function otaWait(pred,ms,msg){ return new Promise((res,rej)=>{ const w={pred,res,rej}; w.t=setTimeout(()=>{ota.waiters=ota.waiters.filter(x=>x!==w);rej(new Error(msg));},ms); ota.waiters.push(w); if(pred()){clearTimeout(w.t);ota.waiters=ota.waiters.filter(x=>x!==w);res();} }); }
function otaKick(){ for(const w of ota.waiters.slice()) if(w.pred()){clearTimeout(w.t);ota.waiters=ota.waiters.filter(x=>x!==w);w.res();} }
function otaFailAll(e){ ota.fail=e; for(const w of ota.waiters.splice(0)){clearTimeout(w.t);w.rej(e);} }
function onOtaFrame(kind,code,val){
  ota.last={kind,code,val};
  if(kind===1) ota.ready=true;
  else if(kind===2) ota.acked=Math.max(ota.acked,val);
  else if(kind===3) ota.done=true;
  else if(kind===4&&code===1) ota.rewind=val;
  else if(kind===4) otaFailAll(new Error(OTA_ERR[code]||("sensör hatası "+code)));
  otaKick(); renderFwCard();
}
function otaSend(bytes,resp){
  const c=ble.wchr; if(!c||ble.st!=="bagli") return Promise.reject(new Error("bağlantı koptu"));
  const v=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  return resp?(c.writeValueWithResponse?c.writeValueWithResponse(v):c.writeValue(v)):(c.writeValueWithoutResponse?c.writeValueWithoutResponse(v):c.writeValue(v));
}
async function otaRun(){
  if(ota.on) return;
  if(!(source==="sensor"&&ble.st==="bagli"&&ble.kind==="hisar"&&ble.v2&&ble.fw>=2)){ toast("Önce sensöre bağlan (sensör yazılımı 2 ve sonrası)."); return; }
  if(cur.run&&cur.run.active){ toast("Önce süren oturumu bitir."); return; }
  Object.assign(ota,{on:true,st:"indir",err:"",sent:0,acked:0,size:0,rewind:null,fail:null,abort:false,ready:false,done:false,t0:now()});
  fwKey=""; renderFwCard();
  try{
    const info=await otaInfo(true);
    const r=await fetch(fwBase()+"firmware/"+info.file+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error("yazılım dosyası indirilemedi");
    const img=new Uint8Array(await r.arrayBuffer());
    if(img.length!==info.size||crc32(img)!==(info.crc32>>>0)) throw new Error("indirilen dosya bozuk, tekrar dene");
    if(img[0]!==0xE9) throw new Error("geçersiz yazılım dosyası");
    ota.size=img.length; ota.st="hazirla"; renderFwCard();
    await otaSend([0x10,...u32le(img.length),...u32le(info.crc32>>>0)],true);
    await otaWait(()=>ota.ready||!!ota.fail,30000,"sensör güncellemeye hazırlanamadı");
    if(ota.fail) throw ota.fail;
    ota.st="yukle"; ota.t0=now(); renderFwCard();
    const CH=Math.max(16,Math.min(240,(ble.mtu||23)-3-5)), WIN=6144;
    let off=0, n=0;
    while(off<img.length||ota.acked<img.length){
      if(ota.abort) throw new Error("vazgeçildi");
      if(ota.fail) throw ota.fail;
      if(ota.rewind!=null){ off=ota.rewind; ota.rewind=null; }
      if(off>=img.length){ await otaWait(()=>ota.acked>=img.length||ota.rewind!=null||!!ota.fail,15000,"sensör son parçayı onaylamadı"); continue; }
      if(off-ota.acked>=WIN){ await otaWait(()=>off-ota.acked<WIN||ota.rewind!=null||!!ota.fail,10000,"sensör yanıt vermiyor"); continue; }
      const len=Math.min(CH,img.length-off); const pkt=new Uint8Array(5+len); pkt[0]=0x11; pkt.set(u32le(off),1); pkt.set(img.subarray(off,off+len),5);
      await otaSend(pkt,false); off+=len; ota.sent=off; if(++n%16===0) renderFwCard();
    }
    ota.st="dogrula"; renderFwCard();
    await otaSend([0x12],true);
    await otaWait(()=>ota.done||!!ota.fail,30000,"sensör yazılımı doğrulayamadı");
    if(ota.fail) throw ota.fail;
    ota.st="bitti"; renderFwCard(); toast("Sensör yazılımı güncellendi; sensör yeniden başlıyor.");
    otaInfo(true).then(()=>{fwKey="";renderFwCard();}).catch(()=>{});
  }catch(e){
    ota.st="hata"; ota.err=e&&e.message||String(e);
    try{ if(ble.wchr&&ble.st==="bagli") await otaSend([0x13],true); }catch(_){}
    renderFwCard();
  }finally{ ota.on=false; ota.abort=false; fwKey=""; setTimeout(renderFwCard,50); }
}
function renderFwCard(){
  const el=$("sbFw"); if(!el) return;
  const on=source==="sensor"&&ble.st==="bagli"&&ble.kind==="hisar";
  const info=ota.info, latest=info?info.fw:null;
  if(ota.on||ota.st==="bitti"||ota.st==="hata"){
    const pct=ota.size?Math.floor(ota.sent/ota.size*100):0;
    const sp=ota.st==="yukle"&&ota.sent>4096?fx(ota.sent/1024/((now()-ota.t0)/1000),1)+" KB/sn":"";
    const msg={indir:"Yeni yazılım indiriliyor…",hazirla:"Sensör hazırlanıyor…",yukle:`Yükleniyor: %${pct}${sp?" · "+sp:""}`,dogrula:"Sensör yazılımı doğruluyor…",bitti:"Tamam. Sensör yeni yazılımla yeniden başlıyor; uygulama kendiliğinden bağlanacak.",hata:"Güncelleme yapılamadı: "+esc(ota.err)+". Sensördeki eski yazılım çalışmaya devam ediyor; tekrar deneyebilirsin."}[ota.st]||"";
    const mode=ota.on?"run":"end";
    // Düğmeler bir kez çizilir; ilerlemede yalnız yazı ve çubuk güncellenir (dokunuş kaçmasın)
    if(el.dataset.mode!==mode){ el.dataset.mode=mode; fwKey="";
      el.innerHTML=`<h2>Sensör yazılımı</h2><p id="otaMsg"></p>`+(ota.on?`<div class="meter"><span>İlerleme</span><div class="bar"><div class="fill" id="otaFill"></div></div><span class="val" id="otaVal"></span></div>
        <p class="note">Sensörü kapatma, uygulamadan çıkma. Kesilirse sensördeki eski yazılım çalışmaya devam eder.</p><button class="btn" id="otaStop">Vazgeç</button>`:`<button class="btn" id="otaOk">Tamam</button>`);
      const b1=$("otaStop"); if(b1) b1.onclick=()=>{ota.abort=true;otaKick();b1.disabled=true;b1.textContent="Vazgeçiliyor…";};
      const b2=$("otaOk"); if(b2) b2.onclick=()=>{ota.st="";fwKey="";renderFwCard();}; }
    const m=$("otaMsg"); m.innerHTML=msg; m.className=ota.st==="hata"?"badt":ota.st==="bitti"?"okt":"";
    const w=ota.st==="yukle"?pct:ota.st==="dogrula"?100:2;
    if($("otaFill")){ $("otaFill").style.width=w+"%"; $("otaVal").textContent="%"+(ota.st==="dogrula"?100:pct); }
    return;
  }
  if(el.dataset.mode!=="info"){ el.dataset.mode="info"; fwKey=""; }
  const key=["fw",on,ble.fw,ble.v2,latest].join("|"); if(key===fwKey) return; fwKey=key;
  let body;
  if(on&&ble.v2&&ble.fw>=2&&latest!=null&&latest>ble.fw)
    body=`<p>Sensörde <b style="color:var(--fg)">sürüm ${ble.fw}</b> var, <b style="color:var(--fg)">sürüm ${latest}</b> hazır.${info&&info.not?" "+esc(info.not):""}</p>
      <button class="btn primary" id="otaGo">Telefondan güncelle</button><p class="note">Yaklaşık 1 dakika sürer. Sensörün pili %30'un üstünde olsun ya da şarja tak.</p>`;
  else if(on&&ble.v2&&ble.fw>=2)
    body=`<p>Sensörde sürüm ${ble.fw} var${latest!=null?` · <span class="okt">güncel</span>`:""}. Yeni sürüm çıkınca buradan telefonla yüklenir; bilgisayar gerekmez.</p>`;
  else if(on)
    body=`<p>Sensördeki yazılım (sürüm ${ble.fw||1}) telefondan güncellemeyi desteklemiyor. Bir kez bilgisayardan yükle; sonraki güncellemeler telefondan olur.</p>`;
  else body=`<p>Sensör bağlıyken yeni sürüm varsa buradan telefonla yüklenir. İlk yükleme bir kez bilgisayardan yapılır.</p>`;
  const upToDate=on&&ble.v2&&ble.fw>=2&&!(latest!=null&&latest>ble.fw);
  el.innerHTML=`<h2>Sensör yazılımı</h2>${body}${upToDate?"":`
    <a class="btn ghost" href="${YUKLE_URL}" target="_blank" rel="noopener">Bilgisayardan yükle (USB-C)</a>`}`;
  const g=$("otaGo"); if(g) g.onclick=()=>askSheet("Sensör yazılımını güncelle",`Sensöre sürüm ${latest} yüklenecek. Yaklaşık 1 dakika sürer; bu sırada sensörü kapatma ve uygulamadan çıkma. Bir sorun olursa sensördeki eski yazılım çalışmaya devam eder.`,"Güncelle",otaRun);
}

let lvT=0;
function updateMontajLive(){
  const g=$("lvG"); if(!g) return; const t=now(); if(t-lvT<70) return; lvT=t;
  const ms=montajSrc(), live=source===ms&&sourceReady()&&proc.aSlow;
  const set=(id,txt,cls)=>{const e=$(id);if(e){e.textContent=txt;e.className="num"+(cls?" "+cls:"");}};
  if(!live){ set("lvCant","–"); set("lvPitch","–"); g.setAttribute("transform",""); }
  else{
    const m=mountFor(ms), up=norm(proc.aSlow), Bn=norm(m.B);
    let pitch=Math.asin(clamp(dot(Bn,up),-1,1))*DEG; if(m.invY) pitch=-pitch;
    const Uref=S.mount[ms].U||proc.zeroUp||(proc.aSlow?proc.snapUp(norm(proc.aSlow)):null); let cant=null;
    if(Uref){ const pr=v=>{const d=dot(v,Bn);return norm([v[0]-d*Bn[0],v[1]-d*Bn[1],v[2]-d*Bn[2]]);}; const u1=pr(Uref),u2=pr(up); const R=cross(Bn,u1);
      cant=-Math.atan2(dot(u2,R),dot(u2,u1))*DEG; if(m.invX) cant=-cant; }
    const ac=cant==null?0:Math.abs(cant);
    set("lvCant",cant==null?"–":sgn(cant,1)+"°",cant==null?"":ac<1?"okt":ac<2.5?"warnt":"badt");
    set("lvPitch",sgn(pitch,1)+"°");
    g.setAttribute("transform",`rotate(${(-(cant||0)).toFixed(2)}) translate(0 ${clamp(pitch*2,-50,50).toFixed(1)})`);
  }
  const b=proc.bias; set("clBias",b&&source===ms?b.map(v=>fx(v,2)).join(" / ")+" °/sn":"–");
  set("clLast",source===ms&&proc.lastCal>0?ago(now()-proc.lastCal):"henüz yok");
  const sd=Math.sqrt(Math.max(...proc.ev)); set("clNoise",source===ms&&sourceReady()?fx(sd,2)+" °/sn"+(sd<0.3?" · durgun":""):"–");
  set("clTemp",ms==="sensor"&&source==="sensor"&&ble.temp!=null?ble.temp+" °C":"–");
}

function updMic(){ const el=$("micNote"); if(!el) return; const t=micStatusText(); if(t!==micTxt){ micTxt=t; el.textContent=t; }
  const on=source==="sensor"&&ble.st==="bagli"&&ble.mic&&ble.snd&&now()-ble.sndT<1500, db=on&&proc.sDb!=null?proc.sDb:null;

/* --- sihirbazlar: kalibrasyon, yön testi, eşik öğrenme */
let wiz=null, learn=null;
function needData(){ if(!sourceReady()){toast(source==="sensor"?"Sensör bağlı değil. Önce sensöre bağlan.":"Veri gelmiyor. Önce bir veri kaynağı seç.");return false;} return true; }
function wizardCal(){
  if(source==="demo"||!needData()) return;
  let samples=[], t0=null, done=false;
  openSheet("Kalibrasyon",`<p>Sensörü (ya da sensör takılı silahı) masaya koy ve <b>3 saniye</b> dokunma. Jiroskobun sıfır noktası ölçülür.</p><div class="big" id="calT" style="text-align:center">3</div><p class="note" id="calMsg">Ölçülüyor…</p><button class="btn" data-close>Kapat</button>`,()=>{
    wiz={onSample(){ if(done) return; const w=proc.rawOm; if(t0==null)t0=now(); samples.push(w.slice()); const left=3-(now()-t0)/1000; if($("calT"))$("calT").textContent=Math.max(0,Math.ceil(left));
      if(left<=0){ done=true; const n=samples.length; const mean=[0,1,2].map(i=>samples.reduce((a,s)=>a+s[i],0)/n); const sd=Math.max(...[0,1,2].map(i=>Math.sqrt(samples.reduce((a,s)=>a+(s[i]-mean[i])**2,0)/n)));
        if(sd>0.6){ $("calMsg").textContent="Sensör kıpırdadı. Masaya koyup tekrar dene."; $("calMsg").style.color="var(--bad)"; return; }
        proc.bias=mean.slice(); proc.bias0=mean.slice(); S.bias[biasKey()]=mean.map(v=>+v.toFixed(3)); saveMeta();
        $("calT").textContent="✓"; $("calMsg").textContent="Tamam. Sapma: "+mean.map(v=>fx(v,2)).join(" / ")+" °/sn"; $("calMsg").style.color="var(--good)"; } }};
  },()=>{wiz=null;});
}
function wizardAxis(){
  if(source==="demo"||!needData()) return;
  const m=S.mount[source]; let phase=0, U=null, rot=[0,0,0], best=null, stillT=null, y0=0;
  const html=`<p id="axMsg"></p><div class="big" id="axBig" style="text-align:center">1/3</div><div class="meter"><span>İlerleme</span><div class="bar"><div class="fill" id="axFill"></div></div></div><button class="btn" data-close>Kapat</button>`;
  const set=(t,big,p)=>{if($("axMsg"))$("axMsg").innerHTML=t;if($("axBig"))$("axBig").textContent=big;if($("axFill"))$("axFill").style.width=(p*100)+"%";};
  openSheet("Yön testi",html,()=>{
    set("Silahı <b>nişan alır gibi düz</b> tut ve kıpırdatma.","1/3",0);
    wiz={onSample(){
      if(phase===0){ if(proc.gmag<3){ if(stillT==null)stillT=now(); set("Silahı <b>nişan alır gibi düz</b> tut ve kıpırdatma.","1/3",Math.min(1,(now()-stillT)/1200)); if(now()-stillT>1200){U=norm(proc.aSlow);rot=[0,0,0];best=null;phase=1;} } else stillT=null; }
      else if(phase===1){ const w=proc.w||[0,0,0]; const dt=0.005; // örnek başına yaklaşık
        const dtr=(proc._lt?Math.min((proc.lastT-proc._lt)/1000,0.05):0.005); proc._lt=proc.lastT;
        for(let i=0;i<3;i++) rot[i]+=w[i]*dtr; const mag=vlen(rot); if(!best||mag>vlen(best)) best=rot.slice();
        set("Şimdi namluyu yavaşça <b>yukarı kaldır</b> (10–20 derece), sonra indir.","2/3",Math.min(1,mag/10));
        if(vlen(best)>10&&mag<vlen(best)*0.5){ const R=norm(best); let B=cross(U,R); if(vlen(B)<0.3){set("Hareket anlaşılamadı. Namluyu düz yukarı kaldır; tekrar deneniyor.","2/3",0);rot=[0,0,0];best=null;return;} B=norm(B);
          m.B=B.map(v=>+v.toFixed(4)); m.U=U.map(v=>+v.toFixed(4)); m.invY=false; m.invX=false; applyCfg(); y0=proc.yaw; rot=[0,0,0]; best=null; phase=2; } }
      else if(phase===2){ const dy=proc.yaw-y0; set("Son olarak namluyu yavaşça <b>sağa çevir</b> (10–20 derece).","3/3",Math.min(1,Math.abs(dy)/8));
        if(Math.abs(dy)>8){ m.invX=dy<0; applyCfg(); saveMeta(); phase=3; set("✓ Tamam. Sensörün yönü kaydedildi. Artık sağ = sağ, yukarı = yukarı.","✓",1); setTimeout(()=>{closeSheet();renderSettings();},1400);} }
    }};
  },()=>{wiz=null;delete proc._lt;});
}
function wizardThr(){
  if(!needData()) return;
  const vals=[]; const t0=now(); let peaks=[]; let lastPeak=-1e9;
  openSheet("Eşiği öğren",`<p>10 saniye içinde silah boşken <b>3 kez kuru tetik</b> yap (gerçek atışta 3 atış). Aralarda silahı nişanda sabit tut.</p><div class="big" id="lrT" style="text-align:center">10</div><p class="note" id="lrMsg">Tetik bekleniyor… (0/3)</p><button class="btn" data-close>Kapat</button>`,()=>{
    if(source==="demo"&&sim){ [1200,2900,4600].forEach(d=>setTimeout(()=>{if(learn&&sim)sim.fire(now());},d)); }
    learn={feed(t,j){ const e=now()-t0; vals.push(j); if(j>0.15&&t-lastPeak>300){ peaks.push(j); lastPeak=t; if($("lrMsg"))$("lrMsg").textContent=`Tetik algılandı (${Math.min(3,peaks.length)}/3)`; } else if(peaks.length&&t-lastPeak<300&&j>peaks[peaks.length-1]) peaks[peaks.length-1]=j;
      if($("lrT"))$("lrT").textContent=Math.max(0,Math.ceil(10-e/1000));
      if(e>10000||peaks.length>=3&&t-lastPeak>400){ const done=learn; learn=null; finish(); } }};
    function finish(){ const sorted=vals.slice().sort((a,b)=>a-b); const noise=sorted[Math.floor(sorted.length*0.95)]||0.05; const top=peaks.slice().sort((a,b)=>b-a).slice(0,3);
      const msg=$("lrMsg"); if(!msg) return;
      if(top.length<2){msg.textContent="Yeterli tetik algılanmadı. Daha net bir kuru tetik yapıp tekrar dene.";msg.style.color="var(--bad)";return;}
      const thr=+clamp(Math.max(noise*3,0.5*Math.min(...top),0.12),0.1,15).toFixed(2); (S.thr[source]||S.thr.demo)[S.mode]=thr; applyCfg(); saveMeta();
      $("lrT").textContent="✓"; msg.textContent=`Tamam. Yeni eşik ${fx(thr,2)} g (gürültü ${fx(noise,2)} g, tetik ${top.map(v=>fx(v,2)).join(" / ")} g).`; msg.style.color="var(--good)"; }
  },()=>{learn=null;renderSettings();});
}

/* --- örnek oturum (ilk açılış) */
function makeSample(){
  const s={id:"ornek",v:2,drill:"serbest",date:Date.now()-86400000,dur:38,src:"demo",mode:"kuru",weapon:S.weapon,weaponName:"",hand:S.hand,handMode:"normal",diff:"normal",notes:"",extra:{},shots:[],sample:true};
  const p=new Proc(); const sm=new Sim(20261028); p.armed=true; let t0=0, lastT=null;
  p.onShot=m=>{const scale=scaleFor(s.weapon,s.diff);const sc=clamp(100*Math.exp(-(m.trig+0.3*m.hold)/scale),0,100);
    const q={n:s.shots.length+1,at:Math.round(m.st),sc:Math.round(sc*10)/10,tr:+m.trig.toFixed(4),ho:+m.hold.toFixed(4),hx:+m.hx.toFixed(4),hy:+m.hy.toFixed(4),dx:+m.dx.toFixed(4),dy:+m.dy.toFixed(4),h:hourOf(m.dx,m.dy),ca:+m.cant.toFixed(2),po:+m.post.toFixed(3),ri:+m.rise.toFixed(3),pg:+m.pg.toFixed(2),rc:m.rec==null?null:Math.round(m.rec),c:[],x:{},tz:encTrace(m.xy)};
    if(lastT!=null)q.x.split=Math.round(m.st-lastT); lastT=m.st; q.c=diagnose(q,s); s.shots.push(q);};

  if(pages.length){popPage();return true;}
  if(curView==="oturum"){ $("sessBack").click(); return true; }
  if(curView!=="alistirma"){showView("alistirma");return true;} return false; };
window.__hisarSaved=(ok,name)=>toast(ok?(name||"Dosya")+" kaydedildi.":"Dosya kaydedilmedi.");
window.__hisarUpdateFailed=msg=>toast("Yeni sürüm indirilemedi"+(msg?" ("+String(msg).slice(0,80)+")":"")+". İnternet bağlantısını kontrol et.");
document.addEventListener("visibilitychange",()=>{const r=cur.run;if(!document.hidden&&r&&r.active){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>{r.wake=w;}).catch(()=>{});}catch(e){}}});

/* --- açılış ekranı */
function splashOpen(){ const sp=$("splash"); return !!sp&&!sp.hidden&&!sp.classList.contains("out"); }
function hideSplash(){ const sp=$("splash"); if(!sp||sp.hidden||sp.classList.contains("out")) return; sp.classList.add("out"); setTimeout(()=>{sp.hidden=true;},450); }

/* --- adres işareti (#...) ile doğrudan sayfa açma: kısayollar ve Android testleri */
function openFromHash(){
  const h=(location.hash||"").replace(/^#/,""); if(!h) return;
  hideSplash(); closeSheet();
  const p=h.split("/");
  try{
    if(p[0]==="ayarlar") openSettings(SET_T[p[1]]?p[1]:null);
    else if(p[0]==="kaynak"&&["demo","phone","sensor"].includes(p[1])) { showView("alistirma"); selectSource(p[1],true); }
    else if(p[0]==="alistirma"&&DRM[p[1]]){ openDrill(p[1]); if(p[2]==="basla") setTimeout(()=>{ if(!(cur.run&&cur.run.active)) startRun(); },1500); }
    else if(["alistirma","oturum","gecmis","dersler","gruplar"].includes(p[0])) showView(p[0]);
  }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}
window.addEventListener("hashchange",openFromHash);

/* --- test kancası */
window.__hisar={get S(){return S;},proc,get sim(){return sim;},get cur(){return cur;},get sessions(){return sessions;},parseBle,selectSource,openDrill,openReview,startRun,stopRun,showView,setSub,returnToSensor,sensorPaired,isDemoSess,sensorTone,get source(){return source;},raw,rawCsv,openRawExport,micState,micStatusText,decSnd,
  feedPhone:(acc,rot)=>{if(phoneH)phoneH({accelerationIncludingGravity:{x:acc[0],y:acc[1],z:acc[2]},rotationRate:{alpha:rot[2],beta:rot[0],gamma:rot[1]}});},
  ble, CAUSES, DR, diagnose, verdict, scaleFor, hourOf, openSettings, renderSettings, get setPage(){return setPage;}, updateLinkUi, bleWatch,
  sensorDisconnect, connectNow, autoConnect, lossPct, startSensor, decJerk, stopSources, flash, shareSession:(id,kind)=>shareSession(sessions.find(x=>x.id===id)||cur.sess,kind), buildReport:(s)=>buildReport(s||cur.sess),
  hideSplash, splashOpen, get pages(){return pages;}, popPage, openCause, openModeList, openDrillSettings, openGroup, todayChallenge, CHALLENGES, streakInfo, setYon, manualShot, get curView(){return curView;}};

/* --- başlat */
loadAll();
if(!sessions.length) sessions.push(makeSample());
showView("alistirma");
selectSource("sensor",false);                       // MantisX gibi: açılışta sensör beklenir; Deneme ve Telefon Gelişmiş Ayarlar › Sensör'de
if(!navigator.bluetooth) setStatus(noBtText(),true);
initPlatform();
if(removedDemo) setTimeout(()=>toast(`${removedDemo} deneme oturumu geçmişten kaldırıldı; deneme oturumları artık kaydedilmiyor.`),2000);
setTimeout(openFromHash,400);
requestAnimationFrame(loop);
if(sensorPaired()&&S.autoConnect&&canAutoConnect()){
  ble.autoPending=true; setStatus(`Sensör aranıyor: <b>${esc(S.lastSensor)}</b>…`); updateSrcCard();
  setTimeout(()=>{ autoConnect(false).then(ok=>{ ble.autoPending=false; if(!ok&&source==="sensor"&&!ble.dev) setStatus(sensorIdleText()); refreshChip(); }); },400);
}
window.addEventListener("resize",()=>{if(curView==="oturum")renderSub();});
})();
</script>
