<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hisar Tetik">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Hisar Tetik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Düzen MantisX uygulamasıyla aynı: alt sekmeler (Alıştırma, Geçmiş, Gruplar, Ayarlar), bölümlü listeler,
   kırmızı seçili düğmeler, koyu gri zemin. Tek (karanlık) tema. */
:root{
  --bg:#252525; --bar:#303030; --hdr:#525252; --btn:#383838; --btn2:#414141; --line:#3a3a3a; --line2:#4a4a4a;
  --fg:#ffffff; --fg2:#e4e4e4; --muted:#a1a1a1; --dim:#7c7c7c;
  --red:#b62126; --red2:#d93a3f; --green:#2fb54a; --blue:#3b8ff0;
  --hold:#3b8ff0; --trig:#f5c518; --recoil:#d93a3f; --good:#4cc26b; --warn:#f2b33d; --bad:#e5484d;
  --panel:#2e2e2e; --panel2:#383838; --accent:#d93a3f; --accent-dim:#7a1e22;
  --logo:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red2)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view{display:flex;flex-direction:column}
.pad{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
/* alt sekmeler */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:1px solid #1c1c1c;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.nav button svg{width:27px;height:27px}
.nav button[aria-selected="true"]{color:var(--red2)}
/* sayfa başlığı */
.ph{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;min-height:52px;background:var(--bar);position:sticky;top:0;z-index:5}
.ph h1{margin:0;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .bk{background:none;border:0;color:var(--fg);height:52px;display:flex;align-items:center;justify-content:center;font-size:15px;gap:2px}
.ph .bk svg{width:22px;height:22px}
.ph .bk.t{justify-content:flex-start;padding-left:10px;width:auto}
.ph .rt{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding-right:10px}
#v-sayfa .ph{grid-template-columns:auto minmax(0,1fr) minmax(40px,auto)}
#v-sayfa .ph .bk{min-width:48px;padding:0 10px 0 12px;justify-content:flex-start;gap:6px;font-size:16px;white-space:nowrap}
#v-oturum .ph{grid-template-columns:1fr auto 1fr}
#v-oturum .ph .bk{justify-self:start;width:52px}
#v-oturum .ph .rt .bk{width:40px}
#sessConn{white-space:nowrap;font-size:12px;cursor:pointer}
@media (max-width:380px){#v-oturum .ph .logo{font-size:16px;gap:5px}#v-oturum .ph .logo svg{width:20px;height:20px}.mx-seg.mode button svg{display:none}.mx-seg.mode button{font-size:12px}}
#sessConn .dot{margin-right:5px}
.logo{display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--logo);font-weight:700;letter-spacing:.12em;font-size:19px}
.logo svg{width:24px;height:24px;color:var(--red2)}
/* bölüm başlığı ve listeler */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--hdr);color:var(--fg);padding:11px max(12px,env(safe-area-inset-left,0px));font-size:15px;text-transform:uppercase;letter-spacing:.01em;min-height:46px}
.sec .ed{background:none;border:0;color:var(--fg);padding:4px;display:grid;place-items:center}
.sec .ed svg{width:20px;height:20px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:72px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);text-align:left;font-size:17px}
.li .ln{min-width:0}
.li .ln small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.li .st{display:grid;grid-auto-flow:column;gap:12px;text-align:center;font-size:12px;color:var(--fg2)}
.li .st b{display:block;font-size:13px;font-weight:600;color:var(--fg)}
.li .st span{font-weight:600}
.li .th{width:52px;height:52px;border-radius:6px;background:#1b1b1b;display:grid;place-items:center;overflow:hidden}
.li .th svg{width:46px;height:46px}
.li .chk{width:24px;height:24px;accent-color:var(--red)}
.li .badge{font-size:11px;color:var(--muted);text-align:right}
.li .badge b{display:block;color:var(--good);font-size:13px}
.li.off{opacity:.45}
.li .sw{display:flex;align-items:center;gap:8px}
/* MantisX ayar düzeni */
.mx{display:flex;flex-direction:column;gap:6px;padding:16px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.mx-l{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--fg2);margin-top:12px;min-height:26px}
.mx-l:first-child{margin-top:0}
.mx-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.mx-seg button{background:var(--btn);border:0;border-radius:2px;color:#8f8f8f;min-height:50px;padding:6px 4px;font-size:13px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden}
.mx-seg button svg{flex:none}
.mx-seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.mx-seg.big button{min-height:52px}
.mx-seg.big button svg{width:96px;height:36px}
.mx-seg.hand button svg{width:26px;height:30px}
.mx-seg.mode button svg{width:24px;height:24px}
.mx-seg.mt button svg{width:34px;height:26px}
.mx-seg.four{gap:8px}
.mx-btn{background:var(--btn2);border:0;border-radius:2px;color:#e8e8e8;min-height:50px;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;width:100%}
.mx-btn.red{background:var(--red);color:#fff}
.i-red{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--red2);background:none;color:var(--red2);font:600 14px/1 Georgia,serif;font-style:italic;display:inline-grid;place-items:center;padding:0;flex:none}
.prof{display:grid;grid-template-columns:44px minmax(0,1fr) 48px;align-items:center;gap:12px;padding:14px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
.prof .pl{width:44px;height:44px;color:var(--red2)}
.prof .pn{font-size:16.5px}
.prof .pe{background:none;border:0;padding:0;color:var(--red2);font-size:12px;display:block}
.prof .pd{width:46px;height:42px;background:var(--btn2);border:0;border-radius:2px;color:#fff;display:grid;place-items:center}
.sl{display:flex;flex-direction:column;padding:0 max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px))}
.sl button{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line2);color:var(--fg);padding:14px 4px;font-size:16px;text-transform:uppercase;text-align:left;letter-spacing:.01em}
.sl button svg{width:22px;height:22px;flex:none}
.sl button small{margin-left:auto;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;text-align:right;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* genel öğeler (ayar sayfaları) */
.pg{display:flex;flex-direction:column;gap:12px;padding:14px max(14px,env(safe-area-inset-right,0px)) 22px max(14px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2,.sheet h2{margin:0;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.note{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-size:21px;font-weight:500}
.big{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--btn2);border-radius:2px;padding:13px 10px;font-weight:500;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;text-align:center;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--red);color:#fff}
.btn.stop{background:var(--red);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line2)}
.btn.danger{color:var(--bad);background:none;border:1px solid #5a2226}
.btn.sm{padding:8px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 140px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{background:var(--btn);border:0;border-radius:2px;padding:10px 4px;font-size:13px;color:#9a9a9a;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.meter .bar{flex:1;height:6px;border-radius:3px;background:#1d1d1d;position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--good)}
.meter .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red2)}
.meter .val{font-family:var(--mono);min-width:56px;text-align:right}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.fl{font-size:13px;color:var(--muted)}
.field input[type=range]{width:100%;accent-color:var(--red2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;padding:4px 0}
.toggle input{width:22px;height:22px;accent-color:var(--red);flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=number],input[type=text],textarea{background:#1d1d1d;border:1px solid var(--line2);border-radius:2px;padding:10px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:var(--btn);border-radius:2px;padding:8px 10px;min-width:0}
.kv .num{font-size:17px}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv3>div{background:var(--btn);border-radius:2px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.kv3 .num{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv3 .note{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.dev .dn{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--dim)}
.dot.ok{background:var(--good);box-shadow:0 0 0 3px rgba(76,194,107,.18)}
.dot.wait{background:var(--warn);animation:blink 1s steps(2,start) infinite}
.dot.bad{background:var(--bad)}
@keyframes blink{50%{opacity:.25}}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:13px;margin-right:6px;vertical-align:-1px}
.sig i{width:4px;background:var(--line2);border-radius:1px}
.sig i.on{background:var(--good)}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status b{color:var(--fg);font-weight:600}
.status.err{color:var(--bad)}
.link-row{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.lnk{background:none;border:0;color:var(--red2);font:inherit;font-size:13px;padding:2px 0;white-space:nowrap}
.banner{padding:9px 14px;font-size:13px;border-bottom:1px solid}
.banner.wait{color:var(--warn);border-color:#5a4719;background:rgba(242,179,61,.08)}
.banner.ok{color:var(--good);border-color:#1f5a3a;background:rgba(76,194,107,.08)}
details.card>summary{cursor:pointer;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";color:var(--red2)}
details.card[open]>summary::after{content:"–"}
details.sub>summary{cursor:pointer;color:var(--red2);font-size:13px;list-style:none}
details.sub>summary::-webkit-details-marker{display:none}
.level-wrap{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:center}
.level-wrap svg{width:116px;height:116px;display:block}
.okt{color:var(--good)} .warnt{color:var(--warn)} .badt{color:var(--bad)}
.info{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--red2);background:none;color:var(--red2);font:600 13px/1 Georgia,serif;font-style:italic;display:inline-grid;place-items:center;padding:0;flex:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.m{font-family:var(--mono)}
.sc-g{color:var(--good)}.sc-m{color:var(--warn)}.sc-b{color:var(--bad)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid #5a4719;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;white-space:nowrap;display:inline-block}
.tag.demo{color:var(--warn)}
.tag.rec{color:var(--bad);border-color:#5a2226}
.tag.safe{color:var(--blue);border-color:#1f3d63}
.demo-note{color:var(--warn)}
.share-prev{width:100%;border-radius:4px;border:1px solid var(--line);display:block}
/* oturum ekranı */
.s-tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#242424;border-bottom:1px solid #1c1c1c}
.s-tabs button{background:none;border:0;height:46px;display:grid;place-items:center;color:#bdbdbd;position:relative}
.s-tabs button svg{width:26px;height:26px}
.s-tabs button[aria-pressed="true"]{color:#fff}
.s-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;background:var(--blue)}
.s-body{flex:1;display:flex;flex-direction:column;padding:10px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));gap:10px}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;min-height:52px}
.shots{text-align:right;text-transform:uppercase;font-size:17px;line-height:1.15}
.shots b{display:block;font-size:26px;font-weight:400}
.pre{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-top:-30px}
.pre h2{margin:0 0 4px;font-size:21px;font-weight:400}
.pre .ins{align-self:stretch;text-align:left;font-size:15.5px;color:#f0f0f0;display:flex;flex-direction:column;gap:12px}
.pre .ins p{margin:0}
.wk{display:grid;grid-auto-flow:column;gap:16px;align-items:end;font-size:13px;color:var(--fg2);margin-top:8px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:2px}
.wk b{font-weight:600}
.wk svg{width:16px;height:16px;color:var(--red2)}
.sq{display:flex;gap:10px;justify-content:center}
.sq button{width:66px;height:62px;background:#3a3a3a;border:1px solid #4a4a4a;border-radius:3px;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;text-transform:uppercase;padding:4px 2px;overflow:hidden;white-space:nowrap}
.sq button svg{width:28px;height:28px}
.wpn{color:var(--muted);text-transform:uppercase;font-size:15px;letter-spacing:.04em}
.go{width:104px;height:104px;border-radius:50%;border:4px solid var(--green);background:#1d1d1d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;text-transform:uppercase;margin-top:4px}
.go svg{width:34px;height:34px}
.go:disabled{opacity:.5}
.ring-wrap{position:relative;width:100%;max-width:380px;margin:0 auto;aspect-ratio:1}
.ring-wrap canvas{width:100%;height:100%;display:block}
.pc-h{font-size:12.5px;text-transform:uppercase;color:var(--fg2);margin-top:4px}
.pc{display:flex;flex-direction:column;gap:4px}
.pc button{background:none;border:0;padding:2px 0;color:#fff;text-align:left;font-size:20px;text-transform:uppercase;line-height:1.25;letter-spacing:.01em}
.pc .ok{font-size:15px;color:var(--good);text-transform:uppercase}
.s-bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--bar);padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.s-bar .stopb{justify-self:center;width:min(200px,60%);height:44px;background:var(--red);border:0;border-radius:2px;color:#fff;font-size:15px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.s-bar .stopb i{width:15px;height:15px;border-radius:50%;border:2px solid #fff;display:inline-block}
.s-bar .stopb.goB{background:var(--green)}
.s-bar .nb{background:none;border:0;color:#eee;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:52px}
.s-bar .nb svg{width:24px;height:24px}
.drill-panel{background:#1d1d1d;border-left:3px solid var(--red);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.drill-panel .dp-big{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums}
.drill-panel .dp-msg{font-size:14px;color:var(--fg)}
.drill-panel .dp-sub{font-size:12px;color:var(--muted)}
.oz h2{margin:6px 0 10px;text-align:center;font-size:23px;font-weight:400}
.oz .tot{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:18px;margin-bottom:14px}
.oz .tot b{display:block;font-size:24px;font-weight:400;margin-top:2px}
.oz .xl{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:13px;color:var(--muted);margin:-6px 0 12px}
.oz .xl b{color:var(--fg);font-weight:500}
.oz table{font-size:14px}
.oz th{text-align:center;font-size:12.5px;color:var(--fg2);border-bottom:0}
.oz th:first-child,.oz td:first-child{text-align:left}

function Proc(){this.cfg={B:[0,1,0],invX:false,invY:false,U:null,yer:"alt",thr:0.6,lockout:450,mic:"kapali",weak:0.45,clickDb:15,clickMin:32,clickRise:8};this.micOn=false;this.bias0=null;this.reset();}
// atış algılama ayarları: weak = mikrofon tık sesi duyunca yeterli darbe (eşiğin katı), clickDb = gürültü tabanının üstü, clickMin = en düşük tık seviyesi
const MIC_WIN=25;
Proc.prototype.reset=function(){
  this.cand=null;this.lastClick=null;this.sT=null;this.sBg=null;this.sDb=null;this.rejectRun=0;this.strictOff=false;this.clickN=0;this.rejected=0;
  this.buf=[];this.lastT=null;this.yaw=0;this.pitch=0;this.aFast=null;this.aSlow=null;
  this.zeroUp=null;this.zeroR=null;this.bias=this.bias0?this.bias0.slice():[0,0,0];
  this.em=[0,0,0];this.ev=[1,1,1];this.stillSince=null;this.lastCal=-1e9;
  this.jerk=0;this.gmag=0;this.cant=0;this.base=[0,0];this.live=[0,0];
  this.lastShot=-1e9;this.pending=[];this.armed=false;this.samples=0;this.lastData=-1e9;this.rawOm=[0,0,0];this.up=[0,0,1];
  this.gaps=[];
};
Proc.prototype.frame=function(up){const Bv=this.cfg.B||[0,1,0];const bu=dot(Bv,up);let B=[Bv[0]-bu*up[0],Bv[1]-bu*up[1],Bv[2]-bu*up[2]];if(vlen(B)<0.2)B=[up[1],up[2],up[0]];B=norm(B);return{B,R:cross(B,up)};};
Proc.prototype.zero=function(){if(this.aSlow){this.zeroUp=norm(this.aSlow);this.zeroR=this.frame(this.zeroUp).R;}this.base=[this.yaw,this.pitch];};
// Oturum başı: kanting sıfırı yön testinden (cfg.U) ya da ilk atışta montaj yerine göre "dik" eksenden alınır (Sıfırla gerekmez)
Proc.prototype.startRef=function(){ this.base=[this.yaw,this.pitch]; this.mountWarn=false;
  if(this.cfg.U){ this.zeroUp=norm(this.cfg.U); this.zeroR=this.frame(this.zeroUp).R; } else { this.zeroUp=null; this.zeroR=null; } };
Proc.prototype.snapUp=function(up){
  const B=norm(this.cfg.B||[0,1,0]), ax=[[1,0,0],[0,1,0],[0,0,1]].filter(a=>Math.abs(dot(a,B))<0.7);
  const fam=this.cfg.yer==="sag"||this.cfg.yer==="sol"?ax.find(a=>a[2]===0)||ax[0]:ax.find(a=>a[2]===1)||ax[0];
  const d=dot(fam,up); if(Math.abs(d)>=0.7) return fam.map(v=>v*Math.sign(d));
  this.mountWarn=true; let best=ax[0],bd=0; for(const a of ax){const k=dot(a,up);if(Math.abs(k)>Math.abs(bd)){bd=k;best=a;}} return best.map(v=>v*Math.sign(bd||1)); };
Proc.prototype.feed=function(t,acc,om,devJerk,snd){
  if(this.lastT!=null&&t<=this.lastT) t=this.lastT+0.5;
  if(this.onRaw) this.onRaw(t,acc,om,devJerk,snd);
  const dt=this.lastT==null?0:Math.min((t-this.lastT)/1000,0.05); this.lastT=t; this.samples++; this.lastData=now();
  if(!this.aFast){this.aFast=acc.slice();this.aSlow=acc.slice();}

  const j=Math.hypot(acc[0]-this.aFast[0],acc[1]-this.aFast[1],acc[2]-this.aFast[2]);

  const sat=(Math.max(Math.abs(acc[0]),Math.abs(acc[1]),Math.abs(acc[2]))>=15.5?1:0)|(Math.max(Math.abs(om[0]),Math.abs(om[1]),Math.abs(om[2]))>=1950?2:0);

  if(this.onSample)this.onSample(t,wm,this.jerk,w,dt);
  this.detect(t,snd);
  while(this.pending.length&&t>=this.pending[0]+600)this.finalize(this.pending.shift());
};
// ses: gürültü tabanını izler (aşağı hızlı, yukarı ~1 sn'de). Tık = tabanın belirgin üstünde VE ani yükselen ses;
// sürekli gürültü (konuşma, müzik, rüzgâr) tık sayılmaz, taban ona uyar.
Proc.prototype.sound=function(t,snd){
  if(snd==null) return false;
  this.sT=t; this.sDb=snd;
  if(this.sBg==null){ this.sBg=snd; this.sP1=snd; this.sP2=snd; }
  const prev=Math.max(this.sP1,this.sP2);
  const click=snd>=this.sBg+this.cfg.clickDb&&snd>=this.cfg.clickMin&&snd-prev>=this.cfg.clickRise;
  this.sP2=this.sP1; this.sP1=snd;
  const d=snd-this.sBg; this.sBg+=d<0?d*0.2:d*0.006;

  return click;
};
// atış: darbe eşiği aşılırsa. Mikrofon açıksa (kuru tetik / CO2): tık sesiyle gelen zayıf darbe de atıştır (Yardımcı);
// Sıkı kipte sesi olmayan darbe atış sayılmaz (üst üste 3 kez olursa mikrofon duymuyor sayılır, Sıkı kip kapanır).
Proc.prototype.detect=function(t,snd){
  this.sound(t,snd);
  if(!this.armed&&!this.testArm){ this.cand=null; return; }
  const thr=this.cfg.thr, j=this.jerk, free=t-this.lastShot>this.cfg.lockout;
  // bu ölçümde ses yoksa (eski yazılım, mikrofon arızası, sensör bip çalıyor) yalnız darbe: bekleyen güçlü aday atıştır
  const mic=this.micOn&&snd!=null;
  if(!mic){ const c=this.cand; this.cand=null;
    if(c&&c.strong){ this.fire(c.t,c.peak,"darbe"); return; }
    if(j>thr&&free) this.fire(t,j,"darbe"); return; }
  const strict=this.cfg.mic==="siki"&&!this.strictOff;
  if(!this.cand){ if(free&&j>thr*this.cfg.weak) this.cand={t,peak:j,strong:j>thr}; }
  else if(j>this.cand.peak){ this.cand.peak=j; if(j>thr) this.cand.strong=true; }

  if(c.strong&&!strict){ this.cand=null; this.fire(c.t,c.peak,"darbe"); return; }

};
Proc.prototype.fire=function(t,peak,how){ this.lastShot=t;
  if(this.armed&&!this.zeroUp&&this.aSlow){ const up=norm(this.aSlow); this.zeroUp=this.snapUp(up); this.zeroR=this.frame(this.zeroUp).R;
    let c=-Math.atan2(dot(this.aSlow,this.zeroR),dot(this.aSlow,this.zeroUp))*DEG; if(this.cfg.invX) c=-c;
    for(const s of this.buf) if(s[0]>=t-320) s[3]=c; }

Proc.prototype.markShot=function(t){t=t==null?(this.lastT||0):t;if(t-this.lastShot>150){this.pending.push(t);this.lastShot=t;}};
Proc.prototype.gap=function(t0,t1){this.gaps.push([t0,t1]);while(this.gaps.length>30)this.gaps.shift();if(this.onGap)this.onGap(t0,t1);};
Proc.prototype.flush=function(){while(this.pending.length)this.finalize(this.pending.shift());};
Proc.prototype.idxBefore=function(t){const b=this.buf;if(!b.length)return -1;if(b[0][0]>t)return 0;let lo=0,hi=b.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(b[m][0]<=t)lo=m;else hi=m-1;}return lo;};
Proc.prototype.finalize=function(st){
  const b=this.buf; if(b.length<10) return;
  const i150=this.idxBefore(st-150), i0=this.idxBefore(st-8);
  const p150=[b[i150][1],b[i150][2]], p0=[b[i0][1],b[i0][2]];
  let ax=0,ay=0,an=0; for(const s of b){if(s[0]>=st-400&&s[0]<=st-150){ax+=s[1];ay+=s[2];an++;}}
  const aim=an?[ax/an,ay/an]:p150;
  let trig=0; for(let i=i150;i<=i0;i++){const s=b[i];trig=Math.max(trig,Math.hypot(s[1]-p150[0],s[2]-p150[1]));}
  let hx=0,hy=0,hn=0; for(const s of b){if(s[0]>=st-1000&&s[0]<st-150){hx+=(s[1]-aim[0])**2;hy+=(s[2]-aim[1])**2;hn++;}}

/* ---------------------------------------------------------------- sanal atıcı (deneme modu) */
function Sim(seed){let s=(seed||Math.floor(Math.random()*1e9))>>>0;this.rnd=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};
  this.g=()=>{let u=0;while(!u)u=this.rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*this.rnd());};
  this.x=0;this.y=0;this.vx=0;this.vy=0;this.t=null;this.px=0;this.py=0;this.ev=null;this.draw=null;
  this.bias=[0.35,-0.22,0.18];this.recoil=0.15;this.spike=2.6;this.cant=0.4;this.start=null;this.skill=0.62;}
Sim.prototype.fire=function(t){if(this.ev)return false;const good=this.rnd()<this.skill;const mag=good?0.004+this.rnd()*0.022:0.045+this.rnd()*0.3;
  const hrs=[6,6,7,8,5,4,1,12,9,3,2,11,10];const h=hrs[Math.floor(this.rnd()*hrs.length)]+this.g()*0.25;const a=h*30*RAD;
  this.ev={t0:t+160,dx:Math.sin(a)*mag,dy:Math.cos(a)*mag,post:this.rnd()<0.1?0.5+this.rnd()*0.4:0};return true;};
Sim.prototype.drawAt=function(t){this.draw={t0:t+180+this.rnd()*120};};
Sim.prototype.step=function(t){
  if(this.start==null)this.start=t;
  const dt=this.t==null?0.005:Math.max(0.001,Math.min((t-this.t)/1000,0.05)); this.t=t;
  const held=clamp((t-this.start-1600)/800,0,1);
  const th=2.2,sig=0.07*held;
  this.vx+=(-th*this.vx)*dt+sig*Math.sqrt(dt)*this.g()*6; this.vy+=(-th*this.vy)*dt+sig*Math.sqrt(dt)*this.g()*6;
  this.x+=this.vx*dt*0.5-this.x*0.8*dt; this.y+=this.vy*dt*0.5-this.y*0.8*dt;
  let ox=0,oy=0,spike=0; const e=this.ev;
  if(e){const r=t-(e.t0-150);
    if(r>=0&&r<150){const u=r/150,uu=u*u*(3-2*u);ox=e.dx*uu;oy=e.dy*uu;}
    else if(r>=150){ox=e.dx;oy=e.dy;const q=r-150;spike=q<25?this.spike*(1-q/25):0;
      oy+=q<360?this.recoil*Math.sin(Math.min(q,140)/140*Math.PI/2)*Math.exp(-Math.max(0,q-140)/90):0;
      if(e.post&&q<150){ox+=e.post*(q/150)*0.5;oy-=e.post*(q/150);}
      if(r>700){this.ev=null;this.x+=e.dx;this.y+=e.dy;ox=0;oy=0;}}}
  if(this.draw){const q=t-this.draw.t0;if(q>=0&&q<900){const u=q/900;oy+=-25*Math.sin(Math.PI*u)*(1-u);ox+=8*Math.sin(Math.PI*u);}else if(q>=900)this.draw=null;}
  const X=this.x+ox,Y=this.y+oy;
  const yr=(X-this.px)/dt,pr=(Y-this.py)/dt; this.px=X;this.py=Y;
  const c=this.cant*RAD;
  const acc=[Math.sin(c)+this.g()*0.004+spike*0.35,spike*0.9+this.g()*0.004,Math.cos(c)+this.g()*0.004+spike*0.25];
  const om=[pr+this.bias[0]+this.g()*0.05,this.bias[1]+this.g()*0.05,-yr+this.bias[2]+this.g()*0.05];
  return {acc,om,jerk:spike};
};

let actx=null;
function audioUnlock(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==="suspended")actx.resume();}catch(e){}
  try{if(window.speechSynthesis&&!audioUnlock.sp){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);audioUnlock.sp=true;}}catch(e){}}

let trVoice=null;
function speak(txt){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="tr-TR";if(!trVoice){trVoice=speechSynthesis.getVoices().find(v=>/^tr/i.test(v.lang))||null;}if(trVoice)u.voice=trVoice;u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}
function cueSound(type){
  if(type==="go"){tone(2400,220,0.1);sensorTone(2400,220);}
  else if(type==="tick"){tone(900,80,0.07);sensorTone(900,80);}
  else if(type==="par"){tone(1200,320,0.09,"sawtooth");sensorTone(1200,320);}
  else if(type==="end"){tone(600,600,0.09,"sawtooth");sensorTone(600,600);}
  else if(type==="ates"){tone(2400,110,0.1);tone(2400,110,0.1,"square",0.16);sensorTone(2400,250);}

function shotSound(q){
  if(S.sound==="kapali")return;
  // bip: geçme sınırının üstünde iki notalı tatlı ses, altında kalın vızıltı (MantisX gibi)
  if(S.sound==="bip"){ if(q.sc>=(S.sesEsik||85)){tone(1320,90,0.06,"sine");tone(1760,120,0.06,"sine",0.1);} else tone(330,220,0.05,"square"); return;}

function sigHtml(r){const lv=r==null?0:r>-60?4:r>-70?3:r>-80?2:r>-90?1:0;return `<span class="sig" aria-hidden="true">${[0,1,2,3].map(i=>`<i class="${i<lv?"on":""}" style="height:${4+i*3}px"></i>`).join("")}</span>`;}
function sigText(r){return r==null?"–":r>-60?"çok iyi":r>-70?"iyi":r>-80?"orta":"zayıf";}
function updateLinkUi(){
  const row=$("srcLink");
  if(row){ if(source==="sensor"||source==="phone"){ row.hidden=false;
      let txt="";
      if(source==="sensor"){ const lp=lossPct();
        txt=ble.st==="bagli"?`${ble.rssi!=null?sigHtml(ble.rssi)+ble.rssi+" dBm · ":""}${ble.bat!=null?"pil %"+ble.bat+(ble.chg?" ⚡":"")+" · ":""}${lp!=null?"kayıp %"+fx(lp,1):"bağlı"}`
          :ble.st==="yeniden"?"Yeniden bağlanıyor…":ble.st==="baglaniyor"?"Bağlanıyor…":ble.st==="secim"?"Sensör seçiliyor…":"Bağlı değil"; }
      $("srcLinkTxt").innerHTML=txt; $("srcSet").textContent=source==="phone"?"Montaj ve kalibrasyon ›":"Sensör ayarları ›"; }
    else row.hidden=true; }
  const b=$("linkBanner");
  if(b){ const down=source==="sensor"&&ble.dev&&!ble.manual&&ble.everConnected&&(ble.st==="yeniden"||ble.st==="baglaniyor");
    if(down){ b.hidden=false; b.className="banner wait"; b.textContent="Sensör bağlantısı koptu, yeniden bağlanılıyor…"+(ble.v2?" Ölçümler kaybolmayacak.":""); b._until=0; }
    else if(!(b._until&&now()<b._until)) b.hidden=true; }
  const md=$("md-baglanti"); if(md) md.textContent=menuDesc("baglanti");
  updateRootSensor();
  if(setPage==="baglanti") updateSensorPage();
}
function flashBanner(kind,text){const b=$("linkBanner");if(!b)return;b.className="banner "+kind;b.textContent=text;b.hidden=false;b._until=now()+3500;setTimeout(()=>{if(b._until&&now()>=b._until){b._until=0;updateLinkUi();}},3600);}

function openDrill(id){

/* --- çalışma zamanı */
function later(r,ms,fn){const id=setTimeout(()=>{r.timers.delete(id);if(cur.run===r&&r.active)fn();},ms);r.timers.add(id);return id;}
function cue(r,type){
  const t=now(); r.cueT=t; r.cueType=type; cueSound(type);
  if(raw.on&&raw.sess===r.sess) raw.cues.push([Math.round(t-raw.t0),type]);
  if(type==="ates"||type==="dur") flash(type==="ates"?"ATEŞ":"DUR",type==="ates"?"go":"no");
  else if(S.visualCue&&type==="go") flash(r.drill.id==="kilif"?"ÇEK":"ATEŞ","go",r.drill.id==="ritim"?260:520);
  else if(S.visualCue&&type==="par") flash("PAR","par",600);
  else if(S.visualCue&&type==="end") flash("BİTTİ","end",900);
  if(source==="demo"&&S.autoShot&&r.drill.demoCue) r.drill.demoCue(r,type,t);
  renderPanel();
}
function demoFire(delay){ if(source!=="demo"||!S.autoShot||!sim) return; const r=cur.run; later(r,delay,()=>sim.fire(now())); }
function demoPeriodic(r,first){ later(r,first==null?rand(1800,2600):first,function f(){ if(sim) sim.fire(now()); later(r,rand(2600,4200),f); }); }
function flash(txt,cls,ms){const f=$("flash");f.textContent=txt;f.className="flash "+cls;f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>{f.hidden=true;},ms||650);}

      if(r.st.type==="ates"){r.st.ok++;q.x.karar="dogru";q.x.react=Math.round(t-r.st.goT);r.st.reacts.push(t-r.st.goT);r.msg="✓ Doğru · "+sec(t-r.st.goT);} else {r.st.bad++;q.x.karar="hata";r.msg="✗ Hata: kırmızıda ateş ettin.";} },

    onShot(r,q,t){ if(r.st.phase===0){r.st.firstT=t;r.st.phase=1;r.msg="Şimdi şarjörü değiştir ve ateş et.";} else {const dt=t-r.st.firstT;q.x.change=Math.round(dt);r.st.changes.push(dt);r.st.phase=0;r.msg="Değiştirme süresi: "+sec(dt);} },
    panel(r){const c=r.st.changes;const b=c.length?Math.min(...c):null;return panelHtml(r.st.phase===1?"DEĞİŞTİR":"ATEŞ",r.msg||"Bir atış yap, şarjörü değiştir, tekrar ateş et.",`Değiştirme ${c.length} · En iyi ${b==null?"–":sec(b)}`);}
  }
  ,zamankiyas:{
    start(r){r.st={phase:"count",goT:null};for(let i=0;i<3;i++)later(r,i*1000,()=>{cue(r,"tick");r.msg="Hazır ol: "+(3-i);renderPanel();});
      later(r,3000,()=>{r.st.phase="go";r.st.goT=now();cue(r,"go");r.msg="ATEŞ!";if(source==="demo"&&S.autoShot)ENG.kiyas20.demoBurst(r);renderPanel();});},
    onShot(r,q,t){ if(r.st.phase!=="go"){q.x.erken=true;r.msg="Bipten önce atış (sayılmaz).";return;} q.x.react=Math.round(t-r.st.goT); r.msg="Süre "+sec(t-r.st.goT); },
    panel(r){const v=validShots(cur.sess);const n=DRM.zamankiyas.limit();const el=r.st.phase==="go"?now()-r.st.goT:0;
      return panelHtml(r.st.phase==="go"?fx(el/1000,1)+" sn":"–",r.msg||"3-2-1 sayımını bekle.",`Atış ${v.length}/${n}`);}
  },
  surpriz:{
    start(r){r.st={rounds:0,miss:0,reacts:[]};this.round(r,1500);},
    round(r,extra){const N=dsetOf("surpriz").rounds||10; if(r.st.rounds>=N){stopRun(true);return;}
      later(r,(extra||0)+rand(2000,6000),()=>{r.st.rounds++;r.st.got=false;r.st.goT=now();cue(r,"go");
        later(r,3000,()=>{if(!r.st.got){r.st.miss++;r.msg="Kaçırıldı: 3 saniyede atış yok.";}r.st.goT=null;renderPanel();this.round(r,1200);});});},
    onShot(r,q,t){ if(r.st.goT==null){q.x.erken=true;r.msg="Bipten önce atış (erken).";return;} if(r.st.got)return; r.st.got=true; const dt=t-r.st.goT; q.x.react=Math.round(dt); r.st.reacts.push(dt); r.msg="Tepki "+sec(dt)+" · skor "+fx(q.sc,1); },
    demoCue(r,type){ if(type==="go") demoFire(rand(350,900)); },
    panel(r){const N=dsetOf("surpriz").rounds||10;const a=r.st.reacts.length?r.st.reacts.reduce((x,y)=>x+y,0)/r.st.reacts.length:null;
      return panelHtml(r.st.goT!=null?"ATEŞ!":`${r.st.rounds}/${N}`,r.msg||"Nişanda bekle; bipte hemen bas.",`Ort. tepki ${a==null?"–":sec(a)} · Kaçan ${r.st.miss}`);}

  rehine:{
    lv(){return REHINE[dsetOf("rehine").zorluk]||REHINE.orta;},
    start(r){r.st={rounds:0,ok:0,late:0,low:0,miss:0,times:[]};this.round(r,1500);},

      later(r,(extra||0)+rand(2500,5000),()=>{r.st.rounds++;r.st.got=false;r.st.goT=now();cue(r,"go");const L=this.lv();
        later(r,L.t+600,()=>{if(!r.st.got){r.st.miss++;r.msg="✗ Süre doldu: atış yok.";}r.st.goT=null;renderPanel();this.round(r,1500);});});},
    onShot(r,q,t){ if(r.st.goT==null){q.x.erken=true;r.msg="Bipten önce atış (sayılmaz).";return;} if(r.st.got)return; r.st.got=true; const L=this.lv(); const dt=t-r.st.goT; q.x.react=Math.round(dt);
      const ok=dt<=L.t&&q.sc>=L.sc; q.x.rehine=ok?"kurtardi":dt>L.t?"gec":"skor"; if(ok)r.st.ok++;else if(dt>L.t)r.st.late++;else r.st.low++; r.st.times.push(dt);
      r.msg=ok?`✓ Rehine kurtarıldı · ${sec(dt)} · ${fx(q.sc,1)}`:dt>L.t?`✗ Geç: ${sec(dt)} (sınır ${sec(L.t,1)})`:`✗ Skor düşük: ${fx(q.sc,1)} (en az ${L.sc})`; },
    demoCue(r,type){ if(type==="go"&&sim){ later(r,rand(150,300),()=>sim.drawAt(now())); demoFire(rand(1500,3200)); } },
    panel(r){const N=dsetOf("rehine").rounds||10;const L=this.lv();return panelHtml(r.st.goT!=null?"ATEŞ!":`${r.st.rounds}/${N}`,r.msg||`Bipte çek ve tek atış yap: ${sec(L.t,1)} içinde, skor ${L.sc} ve üzeri.`,`Kurtarılan ${r.st.ok} · Geç ${r.st.late} · Düşük skor ${r.st.low} · Kaçan ${r.st.miss}`);}

function panelHtml(big,msg,sub){return `<div><div class="dp-msg">${esc(msg)}</div><div class="dp-sub">${esc(sub)}</div></div><div class="dp-big">${esc(big)}</div>`;}
const validShots=s=>s.shots.filter(q=>!q.x||(!q.x.erken&&q.x.karar!=="erken"));

/* --- ham kayıt: algılamayı silaha göre ayarlamak için oturumun ham sensör verisi (yalnız bellekte, dosyaya aktarılır) */
const RAW_MAX=360000, RAW_CH=8192;              // en çok 30 dk (200 ölçüm/sn)
const raw={on:false,full:false,t0:0,n:0,chunks:[],sess:null,cues:[],gaps:[],info:null};
function rawStart(r){
  Object.assign(raw,{on:true,full:false,t0:r.t0,n:0,chunks:[],sess:r.sess,cues:[],gaps:[],
    info:{src:source,sensor:source==="sensor"&&ble.dev?ble.dev.name||"":"",fw:source==="sensor"?ble.fw:null,mic:micState(),thr:proc.cfg.thr,lockout:proc.cfg.lockout,
      mount:{B:proc.cfg.B,invX:proc.cfg.invX,invY:proc.cfg.invY},bias:proc.bias?proc.bias.map(v=>+v.toFixed(3)):null,mtu:ble.mtu||null}});
}
function rawStop(){ raw.on=false; }
function rawHas(s){ return !!(s&&raw.sess===s&&raw.n>0); }
proc.onRaw=(t,acc,om,dj,snd)=>{
  if(!raw.on) return;
  if(raw.n>=RAW_MAX){ if(!raw.full){ raw.full=true; toast("Ham kayıt 30 dakikada durdu; oturum sürüyor."); } return; }
  const ci=(raw.n/RAW_CH)|0, k=raw.n%RAW_CH; let c=raw.chunks[ci];
  if(!c){ c={t:new Float64Array(RAW_CH),v:new Int16Array(RAW_CH*8)}; raw.chunks[ci]=c; }
  const q=(x,m)=>{x=Math.round(x*m);return x>32767?32767:x<-32767?-32767:x;};
  c.t[k]=t-raw.t0; const v=c.v,o=k*8;
  v[o]=q(acc[0],1000); v[o+1]=q(acc[1],1000); v[o+2]=q(acc[2],1000);
  v[o+3]=q(om[0],10); v[o+4]=q(om[1],10); v[o+5]=q(om[2],10);
  v[o+6]=q(dj||0,100); v[o+7]=snd==null?-1:q(snd,10);
  raw.n++;
};
proc.onGap=(t0,t1)=>{ if(raw.on) raw.gaps.push([Math.round(t0-raw.t0),Math.round(t1-raw.t0)]); };
function rawCsv(s,actual){
  const last=raw.n?raw.chunks[((raw.n-1)/RAW_CH)|0].t[(raw.n-1)%RAW_CH]:0;
  const meta=Object.assign({app:"hisar-tetik",ver:VER,bicim:1,tarih:new Date(s.date).toISOString(),alistirma:s.drill,atisTipi:s.mode,silah:s.weapon,silahAdi:s.weaponName||"",el:s.hand,elKipi:s.handMode,
    zorluk:s.diff,olcum:raw.n,sureMs:Math.round(last),doldu:raw.full,algilanan:s.shots.length,gercek:actual==null?null:actual,not:s.notes||""},raw.info,
    {atislar:s.shots.map(q=>({n:q.n,at:q.at,sc:q.sc,h:q.h,tr:q.tr,ho:q.ho,x:q.x})),sinyaller:raw.cues,bosluklar:raw.gaps});
  const out=["# HISAR TETIK ham kayit (bicim 1). Birimler: t ms, ivme mg, jiroskop 0,1 derece/sn, darbe 0,01 g, ses 0,1 dB (-1 = yok)",
    "# "+JSON.stringify(meta),"t_ms,ax_mg,ay_mg,az_mg,gx_01dps,gy_01dps,gz_01dps,darbe_001g,ses_01db"];
  let rows=[];
  for(let i=0;i<raw.n;i++){ const c=raw.chunks[(i/RAW_CH)|0], k=i%RAW_CH, v=c.v, o=k*8;
    rows.push((Math.round(c.t[k]*10)/10)+","+v[o]+","+v[o+1]+","+v[o+2]+","+v[o+3]+","+v[o+4]+","+v[o+5]+","+v[o+6]+","+v[o+7]);
    if(rows.length>=20000){ out.push(rows.join("\n")); rows=[]; } }
  if(rows.length) out.push(rows.join("\n"));
  return out.join("\n")+"\n";
}
function rawName(s){ const d=new Date(s.date); const p=n=>String(n).padStart(2,"0");
  return `hisar-ham-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${s.drill}.csv`; }
function openRawExport(s){
  if(!rawHas(s)){ toast("Bu oturumun ham kaydı yok."); return; }
  const n=s.shots.length, dur=raw.n*5;
  openSheet("Ham veri",`<p>Bu oturumun ham sensör verisi: <b>${raw.n.toLocaleString("tr-TR")}</b> ölçüm (${mmss(dur)})${raw.full?", 30 dakikada durdu":""}. Algılanan atış: <b>${n}</b>.</p>
    <div class="field"><label for="rawReal">Gerçekte kaç atış yaptın?</label><input type="number" id="rawReal" min="0" max="999" inputmode="numeric" value="${n}"></div>
    <p class="note">Kaçan ya da fazla sayılan atış varsa doğru sayıyı yaz; atış algılamayı silahına göre ayarlamak için dosyayı paylaş.</p>
    <div class="btn-row"><button class="btn primary" id="rawShare">Paylaş</button><button class="btn" id="rawSave">Dosyaya kaydet</button></div>`,
    body=>{
      const val=()=>{ const v=parseInt(body.querySelector("#rawReal").value,10); return isNaN(v)?null:clamp(v,0,999); };
      body.querySelector("#rawShare").onclick=async()=>{ const txt=rawCsv(s,val()); const r=await shareBlob(new Blob([txt],{type:"text/csv"}),rawName(s),"text/csv");
        if(r==="indirildi") toast("Ham veri indirildi."); else if(r==="hata") toast("Paylaşılamadı."); };
      body.querySelector("#rawSave").onclick=()=>{ download(rawName(s),rawCsv(s,val()),"text/csv"); };
    });
}

function notConnected(){
  if(source==="sensor"){
    const wait=ble.st==="baglaniyor"||ble.st==="yeniden"||ble.st==="secim";
    openSheet("Sensör bağlı değil",`<p>${wait?"Sensöre bağlanılıyor… Bağlanınca <b>Başla</b>'ya bas.":"Sensörü aç (ekranında <b>BEKLİYOR</b> yazar) ve <b>Bağlan</b>'a dokun."}</p>${navigator.bluetooth?"":`<p class="note warnt">${noBtText()}</p>`}<button class="btn primary" id="ncGo">${wait?"Yeniden dene":"Bağlan"}</button>`,
      b=>{ b.querySelector("#ncGo").onclick=()=>{ closeSheet(); returnToSensor(); }; });
  } else toast("Veri gelmiyor. Ayarlar › Gelişmiş Ayarlar › Sensör.");
}
function startRun(){
  if(cur.run&&cur.run.active) return;
  if(cur.review||(cur.sess&&cur.sess.shots.length&&!cur.run)){ const d=cur.sess.drill; cur.sess=newSession(d); cur.review=false; cur.sel=-1; }
  if(!sourceReady()){ notConnected(); return; }
  audioUnlock();
  const s=cur.sess; s.date=Date.now(); s.src=source; s.mode=S.mode; s.weapon=S.weapon; s.weaponName=S.weaponName; s.hand=S.hand; s.diff=S.diff; s.who=S.prof;
  const d=DRM[s.drill]; const eng=ENG[s.drill]||{};
  const r={drill:d,eng,sess:s,t0:now(),timers:new Set(),active:true,cueT:null,cueType:null,st:{},msg:"",shotT:[]};
  cur.run=r;
  applyCfg(); proc.startRef(); proc.armed=true; proc.pending=[]; proc.lastShot=-1e9;
  if(S.rawRec) rawStart(r);
  if(eng.start) eng.start(r);
  if(d.demo==="periodic"&&source==="demo"&&S.autoShot) demoPeriodic(r);
  r.eng.demoCue=eng.demoCue; r.drill.demoCue=eng.demoCue?((rr,type,t)=>eng.demoCue.call(eng,rr,type,t)):null;
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(w=>{r.wake=w;}).catch(()=>{}); }catch(e){}
  setSub("skor"); renderSession();
}
function stopRun(auto){
  const r=cur.run; if(!r||!r.active) return;
  r.active=false; proc.armed=false;
  r.timers.forEach(id=>clearTimeout(id)); r.timers.clear();
  try{ if(r.wake) r.wake.release(); }catch(e){}
  // son atışların ölçüm penceresi bitsin
  setTimeout(()=>{ r.accept=true; proc.flush(); r.accept=false; finishRun(r,auto); },650);
  const b=$("btnStop"); b.disabled=true; b.querySelector("span").textContent="Bitiriliyor…";
}
function finishRun(r,auto){
  const s=r.sess; s.dur=Math.round((now()-r.t0)/1000);
  if(raw.on&&raw.sess===s) rawStop();
  s.extra=summarizeExtra(r);
  if(s.shots.length&&!isDemoSess(s)){ if(!sessions.includes(s)) sessions.unshift(s); saveSession(s); }
  cur.run=null; cur.review=s.shots.length>0; $("btnStop").disabled=false;
  if(s.shots.length){ checkChallenge(s); setSub("ozet"); if(isDemoSess(s)) toast("Deneme oturumu: sanal atıcıyla yapıldı, geçmişe kaydedilmedi."); }
  else toast("Atış algılanmadı, oturum kaydedilmedi.");
  renderSession(); renderHome();
  if(pendingReload) setTimeout(doUpdate,1500);
}
function checkChallenge(s){
  const c=todayChallenge(); if(!c||s.drill!==c.drill||s.safe||isDemoSess(s)) return;
  const k=String(dayNo()), d=Array.isArray(S.chDone[k])?S.chDone[k]:[]; if(d.includes(S.prof)) return;
  try{ if(c.test(s)){ S.chDone={[k]:d.concat([S.prof])}; saveMeta(); setTimeout(()=>toast(`Günlük meydan okuma tamam: ${c.ad} ✓`),400); } }catch(e){}
}
function summarizeExtra(r){
  const st=r.st||{}; const e={};
  if(st.rounds!=null) e.rounds=st.rounds;
  for(const k of ["miss","ok","late","bad","low"]) if(st[k]!=null) e[k]=st[k];
  return e;
}
$("btnStop").onclick=()=>{ if(cur.run&&cur.run.active) stopRun(false); else startRun(); };
$("btnNote").onclick=()=>openNotes(cur.sess);
// masaüstünde deneme için: boşluk tuşu atışı elle işaretler
function manualShot(){ const r=cur.run; if(!r||!r.active) return; if(source==="demo"&&sim) sim.fire(now()); else proc.markShot(proc.lastT); }
document.addEventListener("keydown",e=>{ if(e.code==="Space"&&curView==="oturum"&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)&&$("sheet").hidden){e.preventDefault();manualShot();} });

/* --- atış geldiğinde */
proc.onSample=(t,gm,j)=>{ const r=cur.run; if(r&&r.active&&r.eng.onSample) r.eng.onSample(r,t,gm,j); if(learn) learn.feed(t,j); if(wiz&&wiz.onSample) wiz.onSample(t); if(detTest) detTest.feed(t,j); };
proc.onShot=m=>{
  const r=cur.run; if(!r||(!r.active&&!r.accept)) return;
  const s=r.sess; const scale=scaleFor(s.weapon,s.diff);
  const score=clamp(100*Math.exp(-(m.trig+holdW(s)*m.hold)/scale),0,100);
  const prevT=r.shotT[r.shotT.length-1];
  const q={n:s.shots.length+1,at:Math.round(m.st-r.t0),sc:Math.round(score*10)/10,tr:+m.trig.toFixed(4),ho:+m.hold.toFixed(4),hx:+m.hx.toFixed(4),hy:+m.hy.toFixed(4),
    dx:+m.dx.toFixed(4),dy:+m.dy.toFixed(4),h:hourOf(m.dx,m.dy),ca:+m.cant.toFixed(2),po:+m.post.toFixed(3),ri:+m.rise.toFixed(3),pg:+m.pg.toFixed(2),rc:m.rec==null?null:Math.round(m.rec),c:[],x:{},tz:encTrace(m.xy)};
  if(prevT!=null) q.x.split=Math.round(m.st-prevT);
  if(m.gap) q.x.gap=1;
  if(m.sat) q.x.sat=m.sat;
  r.shotT.push(m.st);
  q.c=diagnose(q,s);
  if(r.eng.onShot) r.eng.onShot(r,q,m.st);
  s.shots.push(q); cur.sel=s.shots.length-1;
  const [vt,vc]=verdict(q.sc); setFeedback(q.c.length&&q.sc<85?CAUSES[q.c[0]].ad:vt,vc);
  shotSound(q); lastFlash=now();
  if(s.shots.length===1&&!sessions.includes(s)&&!isDemoSess(s)) sessions.unshift(s);
  saveSession(s);
  renderSession();
  const lim=r.drill.limit?r.drill.limit():null;
  if(r.active&&lim&&validShots(s).length>=lim) stopRun(true);
};

/* ---------------------------------------------------------------- arayüz: görünümler (MantisX düzeni) */
const VIEWS=["alistirma","oturum","gecmis","gruplar","ayarlar"];
const pages=[];   // açılan sayfalar (geri tuşuyla kapanır): {title,back,render,bind,set,noNav,onPop}
function navHidden(){ return curView==="oturum"&&cur.from!=="gecmis"||(curView==="oturum"&&cur.run&&cur.run.active); }
function showView(v){
  if(v==="dersler") v="alistirma";
  if(v==="oturum"&&!cur.sess) cur.sess=newSession("serbest");
  curView=v; detTest=null;
  closePages();
  const tab=v==="oturum"?(cur.from||"alistirma"):v;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===tab)));
  for(const k of VIEWS) $("v-"+k).hidden=k!==v;

  $("main").scrollTop=0;

}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
  if(cur.run&&cur.run.active){ toast("Önce süren oturumu durdur."); return; }
  showView(b.dataset.view); });
function pushPage(pg){ pages.push(pg); showPage(); }
function showPage(){
  const pg=pages[pages.length-1];
  if(!pg){ $("v-sayfa").hidden=true; setPage=null; for(const k of VIEWS) $("v-"+k).hidden=k!==curView; $("nav").hidden=navHidden();
    if(curView==="ayarlar") renderSettings(); else if(curView==="oturum") renderSession(); else if(curView==="gecmis") renderHistory(); else if(curView==="gruplar") renderGroups(); else renderHome();
    return; }
  for(const k of VIEWS) $("v-"+k).hidden=true; $("v-sayfa").hidden=false;
  setPage=pg.set||null; detTest=null;
  $("pgBackT").textContent=pg.back||""; $("pgTitle").textContent=pg.title||""; $("pgRight").innerHTML=pg.right||"";
  $("nav").hidden=!!pg.noNav||navHidden();
  const body=$("pgBody"); body.innerHTML=pg.render(); if(pg.bind) pg.bind(body); bindInfo(body);
  $("main").scrollTop=0;
}
function refreshPage(){ const pg=pages[pages.length-1]; if(!pg) return; const st=$("main").scrollTop; const body=$("pgBody"); body.innerHTML=pg.render(); if(pg.bind) pg.bind(body); bindInfo(body); $("main").scrollTop=st; }
function popPage(){ const pg=pages.pop(); if(pg&&pg.onPop) pg.onPop(); showPage(); }
function closePages(){ while(pages.length){ const pg=pages.pop(); if(pg.onPop) pg.onPop(); } $("v-sayfa").hidden=true; setPage=null; }
$("pgBack").onclick=()=>popPage();

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
function setFeedback(){}   // MantisX'te büyük yazılı geri bildirim yok; olası nedenler listelenir

/* --- alt pencere */
let sheetClose=null;
function openSheet(title,html,onMount,onClose){$("sheetTitle").textContent=title;$("sheetBody").innerHTML=html;$("sheet").hidden=false;sheetClose=onClose||null;if(onMount)onMount($("sheetBody"));setTimeout(()=>{const c=$("sheet").querySelector(".sheet-head [data-close]");if(c)c.focus();},30);}
function closeSheet(){if($("sheet").hidden)return;$("sheet").hidden=true;const f=sheetClose;sheetClose=null;if(f)f();}
$("sheet").addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

const IC_ED=SV('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>');
const IC_24=`<svg viewBox="0 0 40 40" width="36" height="36" fill="none" stroke="#bdbdbd" stroke-width="2" aria-hidden="true"><path d="M33 20a13 13 0 1 1-4-9.4"/><path d="M30 5v6h-6"/><text x="20" y="25" fill="#bdbdbd" stroke="none" font-size="13" font-weight="700" text-anchor="middle">24</text></svg>`;

  gercek:SV('<path d="M9 21V10c0-3 1.3-6 3-7.5C13.7 4 15 7 15 10v11z"/><path d="M9 16h6"/>'),

const MODE_A={kuru:"Kuru Tetik Antremanı",gercek:"Gerçek Atış Antremanı",co2:"CO2 Antremanı"};

/* --- olası nedenler (MantisX: büyük harfle, dokununca açıklama sayfası) */
function causeButtons(ids){ ids=(ids||[]).filter(k=>CAUSES[k]); if(!ids.length) return "";
  return `<div class="pc-h">Olası nedenler:</div><div class="pc">${ids.map(k=>`<button data-cause="${k}" data-list="${ids.join(",")}">${esc(CAUSES[k].ad)}</button>`).join("")}</div>`; }
function bindCauses(el){ el.querySelectorAll("[data-cause]").forEach(b=>b.onclick=()=>openCause(b.dataset.cause,(b.dataset.list||"").split(",").filter(Boolean))); }
// hatanın tipik saat yönü (sağ elli tabancacı) ve "ayrıca bakınız"
const CAUSE_H={}, SEE={};
for(const pass of [0,1]) for(let h=1;h<=12;h++){ const p=MAP_PISTOL[h]; if(!p) continue; const k=p[pass]; if(CAUSE_H[k]==null){ CAUSE_H[k]=h; SEE[k]=p[1-pass]; } }
CAUSE_H.yanak=12; SEE.yanak="geri_tepme";
function causeArt(k,good){
  const h=CAUSE_H[k]; const a=h==null?0:(h*30-90)*RAD; const off=good||h==null?0:26;
  const cx=60+Math.cos(a)*off, cy=52+Math.sin(a)*off; const spread=k==="gezinme"&&!good?15:k==="takip"&&!good?9:5;
  let dots=""; const pts=[[0,0],[1,-.6],[-.8,.7],[.5,1],[-1,-.8],[.2,-1.1]]; pts.forEach(([x,y])=>{dots+=`<circle cx="${(cx+x*spread).toFixed(1)}" cy="${(cy+y*spread).toFixed(1)}" r="3.2" fill="#1d1d1d"/>`;});
  const tilt=k==="kanting"&&!good?`transform="rotate(14 60 52)"`:"";
  return `<svg viewBox="0 0 120 112" role="img" aria-label="${good?"Doğru":"Hatalı"}"><rect width="120" height="112" fill="#f2f2f2"/><g ${tilt}>${[44,32,20,9].map((r,i)=>`<circle cx="60" cy="52" r="${r}" fill="${i===3?"#d93a3f":"none"}" stroke="#b5b5b5" stroke-width="1.2"/>`).join("")}<path d="M60 4v96M12 52h96" stroke="#c9c9c9" stroke-width=".8"/></g>${dots}
    ${good?`<path d="M50 104l6 5 12-12" stroke="#3b8ff0" stroke-width="4" fill="none" stroke-linecap="round"/>`:`<path d="M52 98l14 12M66 98l-14 12" stroke="#d93a3f" stroke-width="4" stroke-linecap="round"/>`}</svg>`;
}
function openCause(id,list){
  const ids=(list&&list.length?list:[id]).filter(k=>CAUSES[k]); if(!ids.length) return; let i=Math.max(0,ids.indexOf(id));
  pushPage({back:"Geri",noNav:curView==="oturum",render:()=>{ const k=ids[i], c=CAUSES[k], d=DRM[c.al], see=SEE[k]&&CAUSES[SEE[k]]?SEE[k]:null;
      return `<div class="c-tabs" role="tablist">${ids.map((x,j)=>`<button data-ct="${j}" aria-pressed="${j===i}">${esc(CAUSES[x].ad)}</button>`).join("")}</div>
        <div class="c-art">${causeArt(k,true)}${causeArt(k,false)}</div>
        <div class="c-body"><h2>${esc(c.ad)}</h2><p>${esc(c.ozet)} ${esc(c.neden)}</p><h3>Nasıl düzeltilir</h3><ul>${c.duzelt.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul>
        ${see?`<p class="note">Ayrıca bakınız:</p><button class="see" data-see="${see}">${esc(CAUSES[see].ad)}</button>`:""}
        ${d?`<h3>Önerilen alıştırma</h3><button class="btn primary" id="cDrill">${esc(d.ad)}</button>`:""}
        <p class="note">Teşhis, tetik anındaki kayma yönüne göre yapılan bir tahmindir. Eğitmen gözlemiyle birlikte değerlendir.</p></div>`; },
    bind:b=>{ b.querySelectorAll("[data-ct]").forEach(x=>x.onclick=()=>{i=+x.dataset.ct;refreshPage();});
      b.querySelectorAll("[data-see]").forEach(x=>x.onclick=()=>{ const k=x.dataset.see, j=ids.indexOf(k); if(j>=0){i=j;refreshPage();} else openCause(k); });
      const d=b.querySelector("#cDrill"); if(d) d.onclick=()=>{ if(cur.run&&cur.run.active){toast("Önce süren oturumu durdur.");return;} openDrill(CAUSES[ids[i]].al); }; }});
}

/* --- ALIŞTIRMA sekmesi: ELİT, GÜNLÜK MEYDAN OKUMA, ANTREMANLAR, DERSLER */
function weekStats(drill){ const t=Date.now()-7*864e5; const v=statSess().filter(s=>s.drill===drill&&s.date>=t).flatMap(validShots); return v.length?{avg:avgOf(v),n:v.length}:null; }
function chDoneToday(){ return (S.chDone[String(dayNo())]||[]).includes(S.prof); }
function renderHome(){
  const hid=new Set(S.hiddenDrills||[]), ed=!!cur.editDrills;
  const row=d=>{ if(!ed&&hid.has(d.id)) return ""; const w=ed?null:weekStats(d.id);
    return `<button class="li${ed&&hid.has(d.id)?" off":""}" data-drill="${d.id}"><span class="ln">${esc(d.ad)}</span>${ed?`<span class="sw"><input type="checkbox" class="chk" ${hid.has(d.id)?"":"checked"} tabindex="-1" aria-hidden="true"></span>`:w?`<span class="st"><span>Skor<b>${fx(w.avg,1)}</b></span><span>ATIŞLAR<b>${w.n}</b></span></span>`:"<span></span>"}</button>`; };
  const ch=todayChallenge(), done=chDoneToday();
  let h=`<div class="sec">Elit</div>`+DR.filter(d=>d.g==="elit").map(row).join("");
  h+=`<div class="sec">Günlük Meydan Okuma</div><button class="li" id="chRow"><span class="ln">${esc(ch.ad)}<small>${esc(DRM[ch.drill].ad)} · ${esc(ch.goal)}</small></span><span class="badge">${done?"<b>✓ Tamam</b>":IC_24}</span></button>`;
  h+=`<div class="sec">Antremanlar<button class="ed" id="drEdit" aria-label="${ed?"Düzenlemeyi bitir":"Antreman listesini düzenle"}">${ed?'<span style="font-size:14px">BİTTİ</span>':IC_ED}</button></div>`+DR.filter(d=>d.g==="ant").map(row).join("");
  h+=`<div class="sec">Dersler</div>`+LESSONS.map((l,i)=>`<button class="li" data-lesson="${i}"><span class="ln">${esc(l.ad)}</span>${l.th?`<span class="th">${l.th}</span>`:"<span></span>"}</button>`).join("");
  $("drillList").innerHTML=h;
  $("drillList").querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>{ const id=b.dataset.drill;
    if(cur.editDrills){ const set=new Set(S.hiddenDrills||[]); if(set.has(id)) set.delete(id); else set.add(id); S.hiddenDrills=[...set]; saveMeta(); renderHome(); return; }
    openDrill(id); });
  $("chRow").onclick=()=>openDrill(ch.drill);
  $("drEdit").onclick=()=>{ cur.editDrills=!cur.editDrills; renderHome(); };
  $("drillList").querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson));
}
function openLesson(i){ const l=LESSONS[i]; if(!l) return;
  pushPage({back:"",title:l.ad,render:()=>`<div class="ders">${l.html}${l.causes?`<h3>Hata rehberi</h3><div class="pick">${Object.entries(CAUSES).map(([k,c])=>`<button data-cause="${k}">${esc(c.ad)}<span class="note">›</span></button>`).join("")}</div>`:""}</div>`,
    bind:b=>b.querySelectorAll("[data-cause]").forEach(x=>x.onclick=()=>openCause(x.dataset.cause))}); }

/* --- seçim düğmeleri */
function segHtml(id,opts,val){return `<div class="seg" role="group" id="${id}">`+opts.map(([v,t,svg])=>`<button data-v="${esc(v)}" aria-pressed="${String(String(v)===String(val))}">${svg||""}<span>${esc(t)}</span></button>`).join("")+`</div>`;}
function mxSeg(id,opts,val,cls){return `<div class="mx-seg${cls?" "+cls:""}" role="group" id="${id}">`+opts.map(([v,t,svg])=>`<button data-v="${esc(v)}" aria-pressed="${String(String(v)===String(val))}">${svg||""}${t?`<span>${esc(t)}</span>`:""}</button>`).join("")+`</div>`;}
function bindSeg(root,id,fn){const g=root.querySelector("#"+id);if(!g)return;g.querySelectorAll("button").forEach(b=>b.onclick=()=>{g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));fn(b.dataset.v);});}

/* --- oturum ekranı */
function setSub(sub){ if(sub==="liste") sub="ozet"; cur.sub=sub; document.querySelectorAll("#subTabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sub===sub)));
  for(const k of ["ozet","skor","grafik","iz"]) $("sv-"+k).hidden=k!==sub; renderSub(); }
document.querySelectorAll("#subTabs button").forEach(b=>b.onclick=()=>setSub(b.dataset.sub));
$("sessBack").onclick=()=>{ if(cur.run&&cur.run.active){ askSheet("Oturumu bitir","Süren oturum durdurulsun mu? Yapılan atışlar kaydedilir.","Durdur",()=>stopRun(false)); return; }

$("sessInfo").onclick=()=>{const s=cur.sess;const d=DRM[s.drill];const saved=cur.review&&!s.sample&&sessions.includes(s)&&!(cur.run&&cur.run.active);

    const b=body.querySelector("#iDel"); if(b) b.onclick=()=>{const box=body.querySelector("#infoDel");box.innerHTML=`<span style="align-self:center">Silinsin mi?</span><button class="btn danger" id="iYes">Evet, sil</button><button class="btn" id="iNo">Vazgeç</button>`;
      box.querySelector("#iYes").onclick=()=>{deleteSession(s.id);cur.sess=null;cur.review=false;closeSheet();toast("Oturum silindi.");cur.from="gecmis";showView("gecmis");};box.querySelector("#iNo").onclick=()=>closeSheet();};});};
function renderSession(){
  const s=cur.sess; if(!s) return; const d=DRM[s.drill]||DRM.serbest; const r=cur.run, run=!!(r&&r.active), finishing=!!(r&&!r.active);
  const rev=cur.review&&!run;
  $("sessHead").innerHTML=rev&&cur.from==="gecmis"?`<h1 style="text-align:center">${esc(dateShort(s.date))}${s.sample?'<span class="tag">Örnek</span>':""}</h1>`
    :`<div class="logo">${LOGO_SVG}<span>HİSAR TETİK</span></div>`;
  $("sessShots").textContent=validShots(s).length;
  $("sessShare").hidden=!(rev&&validShots(s).length&&!s.sample);
  $("sessConn").hidden=rev&&cur.from==="gecmis";
  const pre=!run&&!finishing&&!s.shots.length;
  $("preStart").hidden=!pre; $("liveBox").hidden=pre;
  if(pre) renderPre();
  $("sessBar").hidden=pre;
  const sb=$("btnStop");
  if(finishing){ sb.className="stopb"; }
  else if(run){ sb.className="stopb"; sb.querySelector("span").textContent="Dur"; }
  else { sb.className="stopb goB"; sb.querySelector("span").textContent="Yeni oturum"; }
  $("nav").hidden=navHidden();
  const tags=[]; if(isDemoSess(s)||(!rev&&source==="demo")) tags.push('<span class="tag demo">Deneme · kaydedilmez</span>'); if(s.safe) tags.push('<span class="tag safe">Safe Space · istatistiğe girmez</span>'); if(raw.on&&raw.sess===s) tags.push('<span class="tag rec">● Ham kayıt</span>');
  $("sessTags").innerHTML=tags.join(" "); $("sessTags").hidden=!tags.length;
  renderPanel(); renderSub();
}
function renderPre(){
  const s=cur.sess, d=DRM[s.drill]; const w=weekStats(d.id); const ch=todayChallenge();
  $("preStart").innerHTML=`<h2>${esc(d.ad)}</h2><div class="ins"><p>Hedef: ${esc(d.hedef)}</p><p>Talimatlar: ${esc(d.talimat)}</p>${ch.drill===d.id?`<p><b>Günlük meydan okuma (${esc(ch.ad)}):</b> ${esc(ch.goal)}.</p>`:""}</div>
    <div class="wk"><div>Bu hafta${TROPHY}</div><div>Skor<b>${w?fx(w.avg,1):"–"}</b></div><div>ATIŞLAR<b>${w?w.n:0}</b></div></div>
    <div class="sq"><button id="preDrill" aria-label="Alıştırma ayarları">${IC_GEAR}<span>Drill</span></button><button id="preMode" aria-label="Atış tipi: ${esc(MODE_T[S.mode])}">${MODE_IC[S.mode]}<span>${esc(MODE_T[S.mode])}</span></button><button id="preHand" aria-label="Atış eli">${HAND_IC(S.hand)}<span>${S.hand==="R"?"Sağ":"Sol"}</span></button></div>
    <div class="wpn">${esc(S.weaponName||(S.weapon==="pistol"?"Tabanca":"Tüfek"))}</div>
    <button class="go" id="btnStart">${IC_CROSS}<span>Başla</span></button>`;
  $("preDrill").onclick=()=>openDrillSettings(d.id);
  $("preMode").onclick=()=>openModeList();
  $("preHand").onclick=()=>{ S.hand=S.hand==="R"?"L":"R"; saveMeta(); renderPre(); };
  $("btnStart").onclick=()=>startRun();

function renderPanel(){ const p=$("drillPanel"); if(!p) return; const r=cur.run; if(r&&r.active&&r.eng.panel){p.hidden=false;p.innerHTML=r.eng.panel(r);} else p.hidden=true; }
function renderSub(){ if(curView!=="oturum"||pages.length) return; const s=cur.sess; if(!s) return;
  if(cur.sub==="skor"){ if($("liveBox").hidden) return;
    const v=validShots(s), run=cur.run&&cur.run.active, q=s.shots[s.shots.length-1], rev=!run&&s.shots.length>0;
    const ids=rev?causeCounts(v).slice(0,2).map(x=>x[0]):(q?(q.c||[]):[]);
    const el=$("skorCauses");
    el.innerHTML=ids.length?causeButtons(ids):(q?`<div class="pc"><span class="ok">${esc(rev?verdict(avgOf(v))[0].replace("ATIŞ","OTURUM"):verdict(q.sc)[0])}</span></div>`:`<p class="note" style="text-align:center">Nişan al ve tetiğe bas.</p>`);
    bindCauses(el); drawRing(); }
  else if(cur.sub==="grafik") renderGrafik(); else if(cur.sub==="iz") renderIz(); else renderOzet();
}
const avgOf=v=>v.length?v.reduce((a,q)=>a+q.sc,0)/v.length:0;

/* --- canvas yardımcıları */
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);return [x,r.width,r.height];}
let lastFlash=0;
function drawRing(){
  const c=$("ring"); if(!c||!c.offsetParent) return;
  const [x,w,h]=fitCanvas(c); const cx=w/2,cy=h/2,R=Math.min(w,h)/2-4, r2=R*0.5;
  x.clearRect(0,0,w,h);
  x.fillStyle="#6b6466"; x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.fill();
  const s=cur.sess; const v=s?validShots(s):[];
  const cnt=Array(13).fill(0); v.forEach(q=>{if(q.sc<85)cnt[q.h]++;}); const mx=Math.max(1,...cnt);
  for(let hh=1;hh<=12;hh++){ if(!cnt[hh]) continue; const a=(hh*30-90)*RAD; x.fillStyle=`rgba(182,33,38,${0.55+0.45*cnt[hh]/mx})`; x.beginPath(); x.arc(cx,cy,R-2,a-Math.PI/12,a+Math.PI/12); x.arc(cx,cy,r2,a+Math.PI/12,a-Math.PI/12,true); x.closePath(); x.fill(); }
  const last=v[v.length-1], running=cur.run&&cur.run.active;
  if(last&&last.sc<85&&running){const a=(last.h*30-90)*RAD;x.strokeStyle="#000";x.lineWidth=2.5;x.beginPath();x.arc(cx,cy,R-2,a-Math.PI/12,a+Math.PI/12);x.arc(cx,cy,r2,a+Math.PI/12,a-Math.PI/12,true);x.closePath();x.stroke();}
  x.lineWidth=3; x.strokeStyle="#f4f4f4"; x.beginPath(); x.arc(cx,cy,R,0,Math.PI*2); x.stroke();
  x.fillStyle="#1e1e1e"; x.beginPath(); x.arc(cx,cy,r2,0,Math.PI*2); x.fill(); x.lineWidth=2.5; x.strokeStyle="#f4f4f4"; x.stroke();
  const showAvg=!running&&v.length>0;
  // MantisX gibi: sayının altında beyaz nokta (oturum ortalamasında iki nokta)
  if(last){ x.fillStyle="#fff"; const dy=cy+r2*0.55; if(showAvg){ x.beginPath();x.arc(cx-6,dy,4.5,0,Math.PI*2);x.fill();x.beginPath();x.arc(cx+6,dy,4.5,0,Math.PI*2);x.fill(); } else { x.beginPath();x.arc(cx,dy,5,0,Math.PI*2);x.fill(); } }
  x.textAlign="center"; x.fillStyle="#d0d0d0"; x.font="500 "+Math.max(9,Math.round(r2*0.1))+"px "+getComputedStyle(document.body).getPropertyValue("--body");
  x.fillText(showAvg?"ORTALAMA SKOR":"SKOR",cx,cy-r2*0.36);
  const val=showAvg?avgOf(v):(last?last.sc:null);
  if(val!=null){x.fillStyle="#fff";x.font="400 "+Math.round(r2*0.4)+"px "+getComputedStyle(document.body).getPropertyValue("--body");x.fillText(fx(val,1),cx,cy+r2*0.16);}
  if(now()-lastFlash<250){x.strokeStyle="rgba(255,255,255,.7)";x.lineWidth=6;x.beginPath();x.arc(cx,cy,R-3,0,Math.PI*2);x.stroke();}
}
function loop(){
  if(curView==="oturum"&&cur.sub==="skor"&&!pages.length) drawRing();
  if(setPage==="algilama"){ settingsMeter(); updDet(); } else if(setPage==="montaj") updateMontajLive();
  if(curView==="oturum"&&cur.run&&cur.run.active&&cur.run.eng.panel&&(cur.run.drill.id==="kiyas20"||cur.run.drill.id==="zamankiyas")) renderPanel();
  requestAnimationFrame(loop);
}

/* --- grafik: atış skorları ve her atışta tetik hareketi (sarı) / nişan hattı gezinmesi (mavi) */
function renderGrafik(){
  const s=cur.sess; const sh=s.shots; const v=validShots(s);
  if(cur.sel<0||cur.sel>=sh.length) cur.sel=sh.length-1;
  const W=340,H=210,pl=34,pr=12,pt=10,pb=14;
  const X=i=>pl+(sh.length<=1?(W-pl-pr)/2:i*(W-pl-pr)/(sh.length-1)), Y=val=>pt+(1-val/100)*(H-pt-pb);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Atış skorları"><line x1="${pl}" x2="${pl}" y1="${pt}" y2="${H-pb}" stroke="#fff" stroke-width="2"/>`;
  for(const val of [0,20,40,60,80,100]) g+=`<text x="${pl-8}" y="${Y(val)+5}" fill="#fff" font-size="13" text-anchor="end">${val}</text>`;
  if(v.length){const a=avgOf(v);g+=`<line x1="${pl+6}" x2="${W-pr}" y1="${Y(a)}" y2="${Y(a)}" stroke="#fff" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    g+=`<polyline fill="none" stroke="#fff" stroke-width="1.6" points="${sh.map((q,i)=>X(i)+","+Y(q.sc)).join(" ")}"/>`;}
  sh.forEach((q,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(q.sc)}" r="${i===cur.sel?6:4}" fill="${i===cur.sel?"#fff":"#1e1e1e"}" stroke="#ff6b7a" stroke-width="2" data-i="${i}" style="cursor:pointer"/>`;});
  g+=`</svg>`; $("scoreChart").innerHTML=sh.length?g:`<p class="note">Henüz atış yok.</p>`;
  $("scoreChart").querySelectorAll("circle[data-i]").forEach(c=>c.onclick=()=>{cur.sel=+c.dataset.i;renderGrafik();});
  if(!sh.length){$("barChart").innerHTML="";$("grafikCauses").innerHTML="";return;}
  const mxv=Math.max(0.05,...sh.map(q=>Math.max(q.tr,q.ho)));
  const nice=[0.05,0.1,0.15,0.2,0.3,0.5,0.75,1,1.5,2,3,5,10]; const top=nice.find(n=>n>=mxv*1.05)||mxv;
  const BW=340,BH=230,mid=BH/2,bl=34,br=12; const bw=Math.min(36,(BW-bl-br)/sh.length*0.9); const step=(BW-bl-br)/Math.max(1,sh.length);
  const yv=val=>val/top*(mid-12);
  let b=`<svg viewBox="0 0 ${BW} ${BH}" width="100%" role="img" aria-label="Atış başına tetik ve nişan hareketi"><line x1="${bl}" x2="${bl}" y1="8" y2="${BH-8}" stroke="#fff" stroke-width="2"/>`;
  for(const f of [1/3,2/3,1]){ const t=top*f; b+=`<text x="${bl-6}" y="${mid-yv(t)+4}" fill="#fff" font-size="11" text-anchor="end">${fx(t,t<1?2:1)}</text><text x="${bl-6}" y="${mid+yv(t)+4}" fill="#fff" font-size="11" text-anchor="end">${fx(t,t<1?2:1)}</text>`; }
  sh.forEach((q,i)=>{ const x0=bl+i*step+(step-bw)/2; const ht=yv(q.tr), hh=yv(q.ho), sel=i===cur.sel;
    b+=`<g data-i="${i}" style="cursor:pointer"><rect x="${x0}" y="${mid-ht}" width="${bw}" height="${Math.max(1,ht)}" fill="#f5c518" stroke="${sel?"#fff":"#fff8"}" stroke-width="${sel?2:1}"/><rect x="${x0}" y="${mid}" width="${bw}" height="${Math.max(1,hh)}" fill="#3b8ff0" stroke="${sel?"#fff":"#fff8"}" stroke-width="${sel?2:1}"/></g>`; });
  b+=`<line x1="${bl}" x2="${BW-br}" y1="${mid}" y2="${mid}" stroke="#fff" stroke-width="1"/></svg><p class="note">Yukarı: tetik çekme hareketi · aşağı: nişan hattı gezinmesi (${esc(S.unit==="deg"?"derece":S.unit==="moa"?"MOA":"milyem")}).</p>`;
  $("barChart").innerHTML=b; $("barChart").querySelectorAll("g[data-i]").forEach(g2=>g2.onclick=()=>{cur.sel=+g2.dataset.i;renderGrafik();});
  const q=sh[cur.sel]; const el=$("grafikCauses"); el.innerHTML=q&&q.c&&q.c.length?causeButtons(q.c):`<p class="note">${q&&q.sc>=85?"Bu atışta belirgin bir hata yok.":""}</p>`; bindCauses(el);
}

  if(x.sat&1) out.push("Tepme ivmesi sensörün ±16 g ölçüm sınırını aştı; tepme değeri en az bu kadardır.");

function drawTrace(q,prog){
  const c=$("trace"); if(!c.offsetParent) return; const [x,w,h]=fitCanvas(c); const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6;
  x.clearRect(0,0,w,h); x.fillStyle="#2a2a2a"; x.fillRect(0,0,w,h);
  const xy=q?decTrace(q.tz):null;
  let ext=0.06; if(xy){for(let g=0;g<TRN;g++){if(TR0+g*TRS<=0){ext=Math.max(ext,Math.abs(xy[g*2]),Math.abs(xy[g*2+1]));}}}
  const nice=[0.01,0.02,0.025,0.05,0.1,0.2,0.25,0.5,1,2];
  const ring=nice.find(v=>v*5>=ext*1.15)||2; const sc=R/(ring*6); drawTrace.ring=ring;
  x.strokeStyle="rgba(217,58,63,.45)"; x.lineWidth=1; for(let i=1;i<=6;i++){x.beginPath();x.arc(cx,cy,ring*i*sc,0,Math.PI*2);x.stroke();}
  x.strokeStyle="rgba(255,255,255,.35)"; x.beginPath(); x.moveTo(0,cy); x.lineTo(w,cy); x.moveTo(cx,0); x.lineTo(cx,h); x.stroke();
  if(!q) return;
  if(!xy){x.fillStyle="#bbb";x.textAlign="center";x.font="13px "+getComputedStyle(document.body).getPropertyValue("--body");x.fillText("Bu atışın izi kayıtlı değil.",cx,cy-10);return;}
  const ang0=Math.atan2(q.dx,q.dy); if(q.sc<85){x.fillStyle="rgba(217,58,63,.32)";x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,R,ang0-Math.PI/2-0.32,ang0-Math.PI/2+0.32);x.closePath();x.fill();}
  const lim=Math.floor((TRN-1)*prog);
  x.lineWidth=3; x.lineCap="round"; x.lineJoin="round";
  for(let g=1;g<=lim;g++){const t=TR0+g*TRS; x.strokeStyle=t<-150?"#3b8ff0":t<=0?"#f5c518":"#d93a3f"; x.beginPath(); x.moveTo(cx+xy[(g-1)*2]*sc,cy-xy[(g-1)*2+1]*sc); x.lineTo(cx+xy[g*2]*sc,cy-xy[g*2+1]*sc); x.stroke();}
  const gs=-TR0/TRS; if(lim>=gs){const px=cx+xy[gs*2]*sc,py=cy-xy[gs*2+1]*sc;x.strokeStyle="#fff";x.lineWidth=2.5;x.beginPath();x.moveTo(px-6,py-6);x.lineTo(px+6,py+6);x.moveTo(px+6,py-6);x.lineTo(px-6,py+6);x.stroke();}
}

      <p class="note">Kanting: silahın atış anında yana yatıklığı. Sapma: o atışın ortalamadan farkı. ±2,5°'nin üstü uyarı verir.${proc.mountWarn?" Montaj yeri ayarı sensörün duruşuyla uyuşmuyor; Ayarlar'dan kontrol et.":""}</p>

/* --- özet (oturumun atış tablosu) */
function extraCols(s){const d=s.drill;
  if(d==="zamanlayici"||d==="kilif"||d==="surpriz") return [["Tepki",q=>q.x.react!=null?sec(q.x.react):"–"]].concat(d==="kilif"?[["Hareket",q=>q.x.move!=null?sec(q.x.move):"–"]]:[]);
  if(d==="par") return [["Par",q=>q.x.parOk==null?"–":(q.x.parOk?"✓ ":"✗ ")+sec(q.x.react)]];
  if(d==="ritim") return [["Ritim",q=>q.x.offset!=null?(q.x.offset>=0?"+":"")+sec(q.x.offset):"–"]];
  if(d==="karar") return [["Karar",q=>({dogru:"✓ doğru",hata:"✗ hata",erken:"✗ komutsuz"})[q.x.karar]||"–"]];
  if(d==="sarjor") return [["Değiştirme",q=>q.x.change!=null?sec(q.x.change):"–"]];
  if(d==="rehine") return [["Rehine",q=>({kurtardi:"✓ kurtarıldı",gec:"✗ geç",skor:"✗ skor düşük"})[q.x.rehine]||"–"],["Süre",q=>q.x.react!=null?sec(q.x.react):"–"]];
  if(d==="zamankiyas") return [["Süre",q=>q.x.react!=null?sec(q.x.react):"–"]];
  if(d==="geritepme"||s.mode!=="kuru") return [["Tepme",q=>q.pg!=null?(q.x&&q.x.sat&1?"≥":"")+fx(q.pg,1)+" g":"–"],["Kalkış",q=>q.ri!=null?ang(q.ri):"–"],["Toparlanma",q=>q.rc!=null?sec(q.rc):">0,6 sn"]];
  return [];}
const TROPHY_S=`<svg viewBox="0 0 24 24" fill="#d93a3f" aria-label="en iyi atış"><path d="M7 3h10v3h3v2a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.4 12H8a4 4 0 0 1-4-4V6h3z"/></svg>`;
function renderOzet(){
  const s=cur.sess, v=validShots(s), d=DRM[s.drill]||DRM.serbest, run=cur.run&&cur.run.active;
  const dur=run?(now()-cur.run.t0)/1000:s.dur;
  const best=v.length?Math.max(...v.map(q=>q.sc)):null;
  const lines=s.shots.length&&!run?summaryLines(s).filter(([k])=>!/^(ortalama skor|atış)$/i.test(String(k).trim())):[];
  const ex=extraCols(s); const mx=Math.max(0.0001,...s.shots.map(q=>q.tr+q.ho));
  $("sv-ozet").innerHTML=`<h2>${esc(d.ad)}</h2><div class="tot"><div>Ortalama Skor<b>${v.length?fx(avgOf(v),1):"–"}</b></div><div>Toplam Süre<b>${fx(dur||0,2)}s</b></div></div>
    ${lines.length?`<div class="xl">${lines.map(([k,val])=>`<span>${esc(k)}: <b>${esc(val)}</b></span>`).join("")}</div>`:""}
    <table><thead><tr><th>Alıştırmalar</th><th>Skor</th><th>Zaman</th></tr></thead><tbody id="listBody">${s.shots.length?s.shots.map((q,i)=>{ const tw=q.tr/mx*100, hw=q.ho/mx*100;
      const extra=ex.map(e=>e[0]+" "+e[1](q)).join(" · ")+(q.x&&q.x.erken?" · sayılmadı (erken)":"");
      return `<tr class="${i===cur.sel?"sel":""}" data-i="${i}"><td>Atış #${q.n}${extra?`<div class="note">${esc(extra.replace(/^ · /,""))}</div>`:""}</td><td class="sc-${scCls(q.sc)}">${fx(q.sc,1)}${q.sc===best&&!(q.x&&q.x.erken)?TROPHY_S:""}</td><td>${q.x&&q.x.split!=null?fx(q.x.split/1000,2):"0,0"}</td></tr><tr data-i="${i}" class="${i===cur.sel?"sel":""}"><td colspan="3" style="padding:0 0 4px"><div class="hb"><i style="width:${hw.toFixed(1)}%;background:var(--hold)"></i><i style="width:${tw.toFixed(1)}%;background:var(--trig)"></i></div></td></tr>`;}).join(""):`<tr><td colspan="3" class="note" style="text-align:center">Henüz atış yok.</td></tr>`}</tbody></table>
    ${s.notes?`<p class="note" style="margin-top:12px">📝 ${esc(s.notes)}</p>`:""}

  $("listBody").querySelectorAll("tr[data-i]").forEach(tr=>tr.onclick=()=>{cur.sel=+tr.dataset.i;setSub("iz");});

/* --- not ve özet satırları */
function openNotes(s){ if(!s){toast("Önce bir alıştırma aç.");return;}
  openSheet("Oturum notu",`<textarea id="noteTa" placeholder="Örn. hava, mesafe, kullandığın şarjör, nasıl hissettin…">${esc(s.notes||"")}</textarea><button class="btn primary" data-close>Kaydet</button>`,
    body=>{const ta=body.querySelector("#noteTa");ta.oninput=()=>{s.notes=ta.value;if(s.shots.length)saveSession(s);};setTimeout(()=>ta.focus(),50);},()=>{ if(curView==="oturum"&&cur.sub==="ozet") renderOzet(); }); }
function summaryLines(s){
  const v=validShots(s); const d=s.drill; const out=[]; const avg=avgOf(v);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  if(d==="degerlendirme"){const lv=avg>=90?"Usta":avg>=80?"Uzman":avg>=70?"Nişancı":avg>=55?"Gelişen":"Başlangıç";out.push(["Seviye",lv],["Ortalama skor",fx(avg,1)]);}
  else if(d==="dayaniklilik"){ if(v.length>=20){const f=mean(v.slice(0,10).map(q=>q.sc)),l=mean(v.slice(-10).map(q=>q.sc));out.push(["Yorgunluk etkisi",(l-f>=0?"+":"")+fx(l-f,1)+" puan"],["İlk 10 / son 10",fx(f,1)+" / "+fx(l,1)]);}
    else out.push(["Ortalama skor",v.length?fx(avg,1):"–"],["Yorgunluk etkisi","en az 20 atış gerekir"]);}
  else if(d==="zamanlayici"){const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Ort. ilk atış",r.length?sec(mean(r)):"–"],["En iyi",r.length?sec(Math.min(...r)):"–"],["Kaçan tur",String(s.extra.miss||0)]);}
  else if(d==="par"){const n=v.filter(q=>q.x.parOk!=null);const ok=n.filter(q=>q.x.parOk).length;out.push(["Par içinde",n.length?`${ok}/${n.length} (%${Math.round(ok/n.length*100)})`:"–"],["Par süresi",fx(S.par,1)+" sn"]);}
  else if(d==="kiyas20"){const eff=v.filter(q=>q.sc>=70).length;out.push(["Etkili atış",String(eff)],["Toplam atış",String(v.length)],["Ortalama skor",fx(avg,1)]);}
  else if(d==="zamankiyas"){const r=v.map(q=>q.x.react).filter(x=>x!=null);const tot=r.length?Math.max(...r):null;out.push(["Toplam süre",tot==null?"–":sec(tot)],["Atış başına",tot==null||!v.length?"–":sec(tot/v.length)],["Ortalama skor",fx(avg,1)]);}
  else if(d==="surpriz"){const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Ort. tepki",r.length?sec(mean(r)):"–"],["Ortalama skor",fx(avg,1)],["Kaçan tur",String(s.extra.miss||0)]);}
  else if(d==="rehine"){const ok=v.filter(q=>q.x.rehine==="kurtardi").length;const r=v.map(q=>q.x.react).filter(x=>x!=null);out.push(["Kurtarılan",`${ok}/${s.extra.rounds||v.length}`],["Ort. süre",r.length?sec(mean(r)):"–"],["Kaçan tur",String(s.extra.miss||0)]);}
  else if(d==="ritim"){const o=v.map(q=>q.x.offset).filter(x=>x!=null);out.push(["Ort. ritim sapması",o.length?sec(mean(o.map(Math.abs))):"–"]);}
  else if(d==="kilif"){const r=v.map(q=>q.x.react).filter(x=>x!=null),m=v.map(q=>q.x.move).filter(x=>x!=null);out.push(["Ort. ilk atış",r.length?sec(mean(r)):"–"],["Ort. hareket başlama",m.length?sec(mean(m)):"–"]);}
