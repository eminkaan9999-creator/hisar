# HİSAR TETİK iPhone uygulaması: XcodeGen proje tanımı. Xcode projesi depoda tutulmaz, CI'da üretilir:
#   bash tetik/ios/hazirla.sh      (sayfa dosyaları → build/www)
#   cd tetik/ios && xcodegen generate
name: HisarTetik
options:
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "100"
targets:
  HisarTetik:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    scheme: {}
    sources:
      - path: HisarTetik
      - path: Kopru
        buildPhase: resources
      - path: build/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: HisarTetik
        PRODUCT_BUNDLE_IDENTIFIER: com.hisar.tetik
        INFOPLIST_FILE: HisarTetik/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # İmzasız: IPA'yı Sideloadly kullanıcının Apple kimliğiyle imzalar. Simülatör için yerel (ad-hoc) imza.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
