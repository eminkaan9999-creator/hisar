<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10150f">
<title>HİSAR SİMÜLATÖR · Yaşam</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c100a;color:#e4eedc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;text-shadow:0 1px 2px #000}
#zone{left:12px;top:10px}
#hint{right:12px;top:12px;font-size:12px;opacity:.8;text-align:right}
.pill{display:inline-block;background:rgba(10,14,9,.55);border:1px solid rgba(180,210,160,.25);border-radius:8px;padding:5px 9px;margin-bottom:6px;font-size:13px}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:rgba(235,255,225,.9)}
#cross:before{left:6px;top:0;width:2px;height:14px}
#cross:after{left:0;top:6px;width:14px;height:2px}
#prompt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(10,14,9,.74);border:1px solid #9ccc78;border-radius:10px;padding:8px 14px;font-size:15px;display:none;white-space:nowrap;pointer-events:none}
#prompt b{color:#c8f0a4}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(10,14,9,.82);border-radius:10px;padding:9px 16px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#ring{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(200,230,180,.35);pointer-events:none;display:none}
.btn{position:fixed;display:none;align-items:center;justify-content:center;text-align:center;border-radius:50%;width:74px;height:74px;background:rgba(255,255,255,.08);border:2px solid rgba(200,230,180,.32);color:#e8f2de;font:700 12px/1.15 system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body.touch .btn{display:flex}
.btn.on{background:rgba(170,220,130,.38)}
#bAct{right:18px;bottom:112px}
#bRun{right:108px;bottom:24px}
#bFire{right:20px;bottom:22px;width:88px;height:88px;background:rgba(220,110,80,.18);border-color:rgba(255,190,160,.42)}
#bAim{right:108px;bottom:112px}
#wpnTxt{left:12px;bottom:12px;font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none}
#rmenu{position:fixed;inset:0;background:rgba(5,8,4,.74);display:none;align-items:center;justify-content:center;z-index:20}
#rmenu .panel{background:#141b12;border:1px solid rgba(180,210,160,.3);border-radius:14px;padding:14px;width:min(460px,92vw);max-height:88vh;display:flex;flex-direction:column;gap:8px}
#rmenu h2{margin:2px 0 6px;font-size:17px;color:#d7ecc4}
#rlist{overflow:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.ritem{background:rgba(255,255,255,.06);border:1px solid rgba(180,210,160,.22);border-radius:10px;color:#e8f2de;text-align:left;padding:9px 11px;font:14px system-ui,sans-serif;display:flex;flex-direction:column;gap:2px}
.ritem b{font-size:15px}
.ritem span{font-size:12px;opacity:.75}
.ritem:active{background:rgba(170,220,130,.25)}
#rclose{align-self:flex-end;background:transparent;border:1px solid rgba(180,210,160,.4);color:#e8f2de;border-radius:8px;padding:7px 14px;font:14px system-ui,sans-serif}
/* Uçangöz kumandası: yalnız body.drone iken görünür */
#dkui{display:none;position:fixed;inset:0;pointer-events:none;z-index:8;font-family:system-ui,-apple-system,sans-serif}
body.drone #dkui{display:block}
body.drone #hint,body.drone .btn,body.drone #ring{display:none!important}
.dstat{position:absolute;font:600 13px/1.5 ui-monospace,Menlo,monospace;color:#d8f7dc;text-shadow:0 1px 3px #000;background:rgba(8,12,8,.5);border:1px solid rgba(180,210,160,.25);border-radius:8px;padding:6px 9px}
#dL{left:12px;top:84px}
#dR{right:12px;top:12px;text-align:right}
#dCross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,90,70,.95);border-radius:50%}
#dCross:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#ff5a46}
#dLockBox{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:2px solid #ffb13b;display:none;box-shadow:0 0 10px rgba(255,177,59,.6)}
.kstick{position:absolute;bottom:18px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(29,47,34,.85),rgba(11,19,13,.85));border:2px solid rgba(120,160,130,.6);pointer-events:auto;touch-action:none}
#dls{left:18px}
#drs{right:18px}
.kknob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c9f2cf,#4c7a57);box-shadow:0 3px 10px #000;pointer-events:none}
#dtilt{position:absolute;right:22px;top:100px;height:34%;width:44px;border-radius:22px;background:#0f1810;border:2px solid rgba(120,160,130,.6);pointer-events:auto;touch-action:none}
#dtiltk{position:absolute;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe2b5,#a8723a);box-shadow:0 2px 8px #000;pointer-events:none}
.tlab{position:absolute;left:0;right:0;text-align:center;font:700 13px system-ui,sans-serif;color:#7fa389;pointer-events:none}
.kbtns{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:18px;align-items:flex-end;pointer-events:auto}
.kbtn{border:2px solid rgba(255,255,255,.4);border-radius:50%;width:64px;height:64px;background:rgba(20,28,20,.6);color:#f4fff0;font:700 11px/1.1 system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;pointer-events:auto}
.kbtn.mark{width:auto;height:48px;border-radius:14px;padding:0 14px;white-space:nowrap}
.kbtn.bomb{width:84px;height:84px;background:rgba(139,45,31,.85);border-color:rgba(255,160,130,.7);font-size:14px}
#dLand{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:auto;height:34px;border-radius:10px;padding:0 12px;white-space:nowrap;pointer-events:auto}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="zone" class="hud"><span class="pill" id="zoneTxt">ÜS</span><br><span class="pill" id="modeTxt">YAYA</span></div>
<div id="hint" class="hud"></div>
<div id="cross"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="ring"></div>
<div id="bRun" class="btn" data-b="run">KOŞ</div>
<div id="bAct" class="btn" data-b="act">ETKİLEŞİM</div>
<div id="bFire" class="btn" data-b="fire">ATEŞ</div>
<div id="bAim" class="btn" data-b="aim">NİŞAN</div>
<div id="wpnTxt" class="hud"></div>
<div id="rmenu">
  <div class="panel">
    <h2>Tüfek rafı · silah seç</h2>
    <div id="rlist"></div>
    <button id="rclose">Kapat (Esc)</button>
  </div>
</div>
<div id="dkui" class="kui">
  <div class="dstat" id="dL"><div id="dAlt">İRTİFA 0 m</div><div id="dSpd">HIZ 0 km/sa</div><div id="dBat">PİL %100</div><div id="dLockInfo"></div></div>
  <div class="dstat" id="dR"><div id="dBombs">BOMBA</div><div id="dScore">İMHA 0/0</div></div>
  <div id="dCross"></div>
  <div id="dLockBox"></div>
  <button class="kbtn" id="dLand">İNİŞ · L</button>
  <div class="kstick" id="dls"><div class="kknob"></div></div>
  <div class="kstick" id="drs"><div class="kknob"></div></div>
  <div id="dtilt"><span class="tlab" style="top:6px">▲</span><div id="dtiltk"></div><span class="tlab" style="bottom:6px">▼</span></div>
  <div class="kbtns">
    <button class="kbtn mark" id="dMark">İŞARETLE</button>
    <button class="kbtn bomb" id="dBomb">BOMBA</button>
  </div>
</div>
<script src="../three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/tank-model.js"></script>
<script src="js/tank.js"></script>
<script src="js/rifle-data.js"></script>
<script src="js/rifle.js"></script>
<script src="js/drone.js"></script>
<script src="js/santiye-models.js"></script>
<script src="js/machines.js"></script>
<script src="js/main.js"></script>
</body>
</html>
